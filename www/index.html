],["p","در این روز در سال 133ه مروان بن محمد بن مروان بن حکم معروف به مروان حمار آخرین خلیفه بنى امیه کشته شد، و دولت هزار ماهه بنى امیه منقرض شد. ⟦884⟧"],["p","بعد از قیام بنى عباس به ریاست سفاح، عبد االله بن على عموى خویش را براى جنگ با مروان فرستاد. مروان به بوصیر که نواحى فیوم در مصر بود گریخته بود، در طول مسیر هر کس از بنى امیه را که مى دیدند مى کشتند. در کنار نهر اردن جماعت بسیارى را کشتند و روى آنها سفره انداختند و غذا خوردند. عبد االله عموى سفاح گفت: «هر چه انجام دهیم تلافى روز شهادت حسین بن على  نمى شود»."],["p","از آنجا عده اى را همراه با عمر بن اسماعیل براى دفع شر مروان فرستاد. در بوصیر مروان را در کلیسایى سر بریدند و زبان او را قطع کردند و زبانش را گربه اى خورد. جالب اینکه روز قبل مروان زبان غلامى را قطع نموده بود و همان گربه خورده بود. سپس زن و بچه او را اسیر کرده نزد سفاح فرستادند. بعضى این واقعه را در 21این ماه ذکر کرده اند. ⟦885⟧"],["t",2,"واقعه حره"],["p","در این روز واقعه حره در چهارشنبه سال 63ه به وقوع پیوست، که تعبیر روایت سه روز به آخر ذى الحجه مانده 27یا 28است. ⟦886⟧"],["p","در این روز بود که به امر یزید ملعون قتل و غارت اهل مدینه صورت گرفت و پس از کشتن بیش از 4000نفر، مسرف (مسلم) بن عقبه اموال و زنان اهل مدینه را تا سه روز بر لشکر خود مباح کرد. این واقعه مشهور به واقعه حره است و دو ماه و نیم قبل از مرگ یزید ملعون اتفاق افتاده است."],["t",3,"وفات على بن جعفر "],["p","در این روز در سال 210ه على بن جعفر  وفات کرد. ⟦887⟧ امامزاده جلیل القدر جناب على بن جعفر الصادق  سیدى بزرگوار، شدید الورع، کثیر الفضل و عالمى عامل و یکى از بزرگترین روات موثق شمرده شده است. او امام صادق و حضرت موسى بن جعفر و امام رضا و حضرت جواد  را درك نموده است."],["p","جناب على بن جعفر  از سایر برادران خود کوچکتر بود، و پس از فوت پدر بزرگوارش همواره ملازمت برادر خود حضرت موسى بن جعفر  را اختیار کرده بود. معالم دین و احادیث بسیارى از آن حضرت اخذ نموده و روایت مى کرد که از جمله آنها کتاب «مسائل على بن جعفر»است. همچنین «مسائل الحلال و الحرام»و «المناسک»منسوب به آن بزرگوار است. ⟦888⟧"],["h","احترام على بن جعفر به مقام امامت"],["p","محمد بن حسن عمار مى گوید ⟦889⟧: مدت 10سال در مدینه طیبه محضر على بن جعفر  را درك کرده احادیثى را که از برادر خود حضرت موسى بن جعفر  اخذ نموده بود شنیده و مى نوشتم. روزى خدمتش بودم که حضرت جواد  وارد مسجد پیامبر  شد. على بن جعفر  تا آن حضرت را دید از جاى برخاست و بدون کفش و ردأ به خدمتش شتافت و دست او را بوسید و او را تعظیم و تکریم نمود. آن حضرت فرمودند: عمو بنشین، خداوند تو را رحمت کند. على بن جعفر  فرمود: آقاى من، چگونه بنشینم با اینکه شما ایستاده اید."],["p","هنگامى که آن حضرت به او اجازه فرمودند، به جاى خود بازگشت و در مجلس نشست. اصحابش او را سرزنش کردند که تو عموى پدر او هستى! چگونه با وى این سان معامله مى کنى؟ على بن جعفر  فرمود: ساکت شوید! پس دست را بالا برد و محاسن خود را گرفت و فرمود: حق تعالى مرا با این محاسن اهلیت امامت نداده، ولى این جوان را اهلیت بخشیده و امامت را به او تفویض فرموده، با این حال چگونه فضل او را انکار کنم و چگونه به او احترام نگذارم. با اینکه من بنده او هستم؟"],["p","از این روایت پیداست که آن جناب تا چه حدى نسبت به امام زمان خود معرفت داشته و از جمله رواتى است که تمامى علمأ رجال ایشان را ستایش بلیغ نموده اند."],["h","مسافرتهاى على بن جعفر"],["p","مسکن آن جناب در قریه عریض در چهار میلى مدینه طیبه بوده است، و از این جهت به آن حضرت عریضى مدنى گویند، و فرزندان او را عریضیون مى خوانند. نسل آن حضرت از چهار پسرش محمد و احمد و حسن و جعفر است. على بن جعفر  در عریض یا مدینه بود که اهل کوفه از ایشان در خواست کردند در کوفه نزول اجلال فرمایند. آن حضرت قبول فرموده و چندى در کوفه به نشر معالم دین و احادیث سید المرسلین و ائمه هدى  پرداخت. بعد از چندى مردم قم از ایشان خواستند به قم تشریف فرما شوند. آن بزرگوار از کوفه به قم مهاجرت فرمود و در قم ماند تا به حرمت الهى پیوست و در خارج قم نزدیک دروازه جنوبى دفن شد. ⟦890⟧"],["p","در دو مکان دیگر قبرى منسوب به ایشان وجود دارد: یکى در عریض یک فرسخى مدینه و دیگرى در خارج شهر سمنان. ⟦891⟧"],["p","مسعودى روز وفات آن حضرت را 27ذى الحجه و سال وفات را 233ه و عمر آن حضرت را 72سال مى داند"],["p","⟦892⟧"]]},{"k":"tail","key":"آخر ذى الحجه","label":null,"items":[["t",1,"مرگ پدر ابوبکر"],["p","در آخر سال 13ه ابو قحافه عثمان بن عامر، پدر ابوبکر در سن 97یا 99یا 104سالگى از دنیا رفت. ابو قحافه در روز فتح مکه اسلام آورد، و در زمان عمر، بعد از شش ماه و چند روز از مرگ ابوبکر مرد. ⟦893⟧"],["t",2,"مرگ هند جگر خوار"],["p","در سال 13ه در روز مرگ ابوقحافه، هند جگر خوار همسر ابوسفیان و مادر معاویه بدرکات جحیم شتافت. ⟦894⟧"],["p","هند به ظاهر همسر ابوسفیان و مادر معاویه و عتبه و یزید بود، ⟦895⟧ اما از صاحبان پرچم بود که مردها به او مراجعه مى کردند، و میل زیادى به غلامان سیاه داشت، ولى هر گاه بچه سیاهى مى زایید او را مى کشت."],["p","معاویه را به چهار کس نسبت مى دهند: مسافر بن ابى عمرو، عماره بن ولید بن مغیره، عباس و صباح که این ملعون مغنى عماره بن ولید و جوانى خوش سیما بود و کارگرى ابوسفیان مى نمود. هند با او الفتى خاص داشت و لذا علماى انساب عتبه بن ابى سفیان را هم از صباح مى دانند. ⟦896⟧"],["p","هنگامى که هند به معاویه بارور شد مایل نبود او را در خانه بزاید. لذا کنار کوه اجیاد آمد و آنجا وضع حمل کرد و به این دلیل است که حسان مى گوید: لمن الصبى بجانب البطحأ"],["p","فى التراب ملقى غیر ذى مهد"],["p","⟦897⟧"],["p","فرزندى که در کنار بیابان مکه بدون گهواره روى زمین رها شده از آن کیست؟!!"],["h","سوابق سوء خاندان معاویه با اسلام"],["p","از این زن و شوهر و فرزندش معاویه و نوه اش یزید، اذیتها و جسارتها به پیامبر  و امیر المؤمنین و امام حسن و امام حسین  رسید که در کتب تاریخ و روایات به تفصیل ذکر شده است."],["p","از آن جمله در مسیر حرکت کفار قریش به طرف احدى براى جنگ با پیامبر ، هند قصد داشت قبر مادر آن حضرت جناب آمنه بنت وهب  را نبش کند و جسارت کند، چه اینکه پدر و مادر و عموى هند در بدر کشته شده بودند. ولى کفار قریش مانع شدند و گفتند «این رسم مى شود و مردگان ما را هم این چنین مى کنند». هند گفت: باید محمد یا على یا حمزه را بکشم؟ این بود که وحشى را بر این کار گماشت و وعده هایى به او داد. وحشى گفت: «قادر به کشتن پیامبر و على نیستم ولى براى حمزه کمین مى کنم، »با این مقدمه بود که آن بزرگوار را حسب دستور هند ملعونه به شهادت رساند."],["p","به دستور هند وحشى سینه مبارك حضرت حمزه  را شکافت، و جگر آن بزرگوار را خارج کرد و مانند سگ به دندان گرفت، ولى جگر مانند سنگ نقره اى رنگ شد و دندانش کارگر نشد، و آن را روى زمین انداخت و از آن روز ملقب به «آکله الاکباد»شد. بعد خودش با خنجر گوش، بینى و... حضرت حمزه را برید و به گرد آویخت. با این جنایت، دل مبارك پیامبر  را آزرد و آن حضرت و امیرالمؤمنین  و فاطمه الزهرا  و صفیه عمه پیامبر  و خواهر حمزه و دیگران گریستند. با این همه جنایت، پیامبر  اسلام هند و همسرش را که با اکراه مسلمان شده بودند پذیرفت."],["p","ابن ابى الحدید مى گوید: هند با عده اى از زنها قریش خدمت پیامبر  آمدند در حالى که نقاب زده بود و خود را پوشانده بود به خاطر کارهایى که بر ضد پیامبر  انجام داده بود، مخصوصا شهادت جناب حمزه  و مى ترسید که آن حضرت او را مؤ اخذه فرماید."],["p","حضرت عهد و پیمان از آنها گرفت که به خداوند متعال شرك نورزند و مطالبى دیگر را نیز شرط فرمود و آنها قبول کردند. هند کلامى گفت که معلوم شد همسر ابوسفیان است. حضرت فرمودند: آیا تو هندى؟ گفت: بله و به ظاهر شهادتین را بر زبانش جارى نمود و تقاضاى بخشش نمود. پیامبر  فرمودند: دیگر نباید زنا کنى. هند گفت: مگر زن حره زنا مى کند؟! پیامبر  فرمودند: و نباید بچه را بکشى! هند گفت: به جان خودم سوگند من بچه ها را بزرگ کردم و شما آنها را در بدر کشتید."]]},{"k":"tail","key":"تتمه ذى الحجه","label":null,"items":[["t",1,"نامه پیامبر  به پادشاهان بزرگ"],["p","در این ماه در سال 6ه پیامبر  نامه هایى به عنوان دعوت به اسلام و یکتاپرستى به پادشاهان کشورهاى مختلف نوشته، همراه با نمایندگى براى آنها فرستادند. ⟦898⟧"],["t",2,"رحلت حضرت ابوذر"],["p","در این ماه در سال 32ه جناب ابوذر در ربذه رحلت نمود. ⟦899⟧ او سوم یا چهارم یا به قولى پنجمین کسى بود که اسلام آورد و سپس به قبیله خود مراجعت نمود. لذا در بدر و احد و خندق حاضر نبود. بعد از این سه جنگ به خدمت پیامبر  رسید و در کنار آن حضرت بود تا زمانى که رسول خدا  به شهادت رسید."],["p","مکان و منزلت ابوذر نزد رسول خدا  زیاده از آن است که ذکر شود. پیامبر  ابوذر را صدیق امت و شبیه عیسى بن مریم  در زهد مى دانست. آنچه از اخبار خاصه و عامه استفاده مى شود آن است که بعد از رتبه معصومین  در میان صحابه کسى به جلالت قدر و رفعت شأن سلمان فارسى و ابوذر غفارى و مقداد نبوده است."],["p","امام کاظم  مى فرماید: در روز قیامت منادى از جانب رب العزه ندا مى کند: «کجایند حواریان و مخلصان محمد بن عبداالله ، که بر طریقه آن حضرت مستقیم بودند و پیمان او را نشکستند»؟ سلمان و ابوذر و مقداد بر مى خیزند."],["p","هنگامى که عثمان خلافت را غصب کرد ابوذر در شام بود. او دنیاپرستى و ظلم معاویه را مى دید و نمى توانست ساکت باشد. لذا زبان به توبیخ و سرزنش معاویه گشود و مردم را به ولایت خلیفه بر حق پیامبر  حضرت امیرالمؤمنین  فراخواند و مناقب آن حضرت را براى اهل شام بیان کرد، به نحوى که بسیارى از ایشان را به تشیع مایل گردانید."],["p","معاویه احوال ابوذر را به عثمان گزارش داد. عثمان در پاسخ او نوشت که ابوذر را بر مرکبى تندرو همراه با راهنمایى تندخو با شتاب به سوى مدینه روانه کن. معاویه ابوذر را که پیرمردى لاغر و بلند قد بود به ترتیبى که عثمان گفته بود روانه مدینه کرد."],["p","هنگامى که ابوذر به مدینه رسید از شدت راه و بى جهازى شتر رانهایش خونى شده بود و با بدنى کبود بر عثمان وارد شد و عثمان به او جسارتها کرد و به کسى که رسول خدا  او را رستگو خطاب نموده بود نسبت کذب داد. سرانجام دستور تبعید او را به ربذه صادر کرد. در ضمن گفت: ابوذر حق ندارد احکام دین را براى مردم بیان کند، و هنگام خروج از مدینه کسى حق ندارد او را همراهى یا با او تکلم کند."],["p","ابن خبر به امیر المؤمنین  که رسید آنقدر گریست که محاسن شریفش از اشک چشم مبارك خیس شد و فرمود: «ایا با صحابى رسول خدا  چنین مى کنند؟ انا الله و انا الیه راجعون»!"],["p","سپس حضرت همراه دو نور دیده خود امام حسن و امام حسین  و عقیل و عمار یاسر به مشایعت ابوذر رفتند و هر یک با کلماتى ابوذر را دلدارى مى دادند، اگر چه مروان مى خواست مانع شود ولى امیر المؤمنین  او را دور کردند."],["p","به این صورت ابوذر به همراه خانواده خود به ربذه رفت، و در آنجا فرزندش و همسرش که دختر عموى پیامبر  بود وفات کرده و به دخترش خبر از وفات خود داد که رسول خدا  در بازگشت از تبوك به او فرموده بود."],["p","بعد از رحلت ابوذر، کاروانى از عراق آمد و عبداالله بن مسعود بر او نماز خواند، و به دست مالک اشتر کفن و دفن شد. ⟦900⟧"],["t",3,"مرگ ابوموسى اشعرى"],["p","در ماه ذى الحجه سال 44ه )و به قولى سال 42و یا (52عبداالله بن قیس مشهور به ابوموسى اشعرى به درك واصل شد. او بعد از هجرت در سالهاى آخر عمر رسول خدا  به ظاهر اسلام آورد، و آن قدر در نفاق و همدلى با عمر مشهور بود که او را جزء حزب عمر شمرده اند."],["p","ابوموسى در لیله المبیت در شب هجرت و در لیله العقبه در جنگ تبوك و نیز در بازگشت از غدیر در عقبه هرشى، جزء کسانى بود که قصد قتل پیامبر  را داشتند و اقدام کردند، ولى خدا پیامبرش را حفظ کرد."],["p","او اولین کسى بود که به عمر «امیر المؤمنین»خطاب کرد. عمر هم به خاطر اعتمادى که به ابوموسى داشت او را چهار سال والى بصره قرار داد، با اینکه بیش از یک سال کسى را در رأس کارى قرار نمى داد. ابوبکر به او مسئولیتى نداد و عثمان او را از حکومت بصره عزل کرد."],["p","او در واقعه جمل مانع از رفتن مردم براى یارى امیرالمؤمنین عليهالس لا م مى شد تا آنکه امام حسن  آمده مردم را به یارى حضرت دعوت کردند و مردم هم اجابت نمودند."],["p","سرانجام در ماجراى حکمین در دومه الجندل با عمروعاص تبانى کرده امیر المؤمنین  را از خلافت خلع کرد. بعد از آن از ترس اصحابامیر المؤمنین  به مکه گریخت و در آنجا به درك واصل شد. ⟦901⟧"],["t",4,"وفات زراره"],["p","در این ماه در سال 148ه دو ماه بعد از شهادت آقا و مولایمان حضرت صادق  جناب زرارة بن اعین وفات کرد. ⟦902⟧ او در روز شهادت امام صادق  در بستر بیمارى بود. ⟦903⟧ بعضى وفات زراره را در سال 150ه گفته اند. ⟦904⟧ او از اصحاب امام باقر و امام صادق و امام کاظم  بود، و نزد آن بزرگوران داراى منزلت و مقام خاصى بود."],["p","مردى فقیه، متکلم، شاعر و ادیب بود، و مشهور است که آن بزرگوار از اولین فقهاى اصحاب ائمه  بود."],["p","اسم آن بزرگوار عبدربه، و لقب او زراره، و کنیه اش ابوالحسن و گاهى نیز ابوعلى خوانده مى شود. پدرش اعین بن سنسن نام دارد. اولاد زراره حسن، حسین، رومى، عبید، عبداالله و یحیى هستند."],["p","او مردى خوش سیما و جسیم بود، که آثار عبادت از پیشانى او ظاهر بود و هیبتى خاص و نیکو داشت. مردم براى دیدن او جمع مى شدند و انتظار مى کشیدند، و گاهى چنان ازدحام بود که زراره به خانه باز مى گشت. ⟦905⟧"],["p","ابن ابى عمیر که از بزرگان شیعه است، مى گوید: زمانى که از محضر جمیل بن دراج (رحمه االله) استفاده مى کردم به او گفتم: «چه نیکوست محضر تو و چه زینت دارد افاده از مجلس تو»! جمیل گفت: «اما به خدا قسم ما نزد زراره به منزله اطفال مکتبى هستیم، که نزد معلم خود باشند». ⟦906⟧"]]}]}],"notes":{"1":"بحار الانوار: ج 68ص 24ح 43.","2":"بحار الانوار: ج 98ص 103، از اما
