شدند. ⟦406⟧"],["h","سه روز در کعبه"],["p","فاطمه بنت اسد  بعد از سه روز که مهمان الهى بود فرزند مبارك و محترم خود را در آغوش گرفته آماده خروج از کعبه شد که هاتفى غیبى چنین ندا داد: «اى فاطمه، نام این مولود را على بگذار، چرا که من خداى على اعلى هستم. من نام او را از نام خود گرفته ام، و او را ادب آموخته ام و امر خود را به او سپرده ام، و او را بر غوامض علم خود آگاهى داده ام، او در خانه من بدنیا آمده است. او اول کسى است که بر فراز خانه من اذن مى گوید، و بتها را مى شکند، و آنها را زا بالاى کعبه به صورت مى اندازد. خوشا بحال کسى که او را دوست مى دارد و از او اطاعت مى کند و او را یارى مى نماید. واى بر کسى که بغض او را دارد و از او سرپیچى مى کند و او را خوار مى نماید و حق او را انکار مى نماید.» ⟦407⟧"],["p","در این سه روز در هر محفلى سخن از ولادت این مولود مبارك و استثنایى بود، بخصوص باز نشدن قفل در کعبه، شکافته شدن دیوار کعبه در روز و دیدن آن توسط کفار، این مطلب را به صورت یک مسئله عمومى در آورده بود."],["h","طلوع نور على  در آغوش پیامبر "],["p","صبح روز چهارم در مقابل دیدگان به انتظار نشسته، ناگهان دیوار کعبه از مکان قبلى شکاف برداشت به حدى که فاطمه بنت اسد  با فرزند عزیزش از آنجا خارج شدند. مردم همه نگاه مى کردند و قبل از سؤ ال کسى، فاطمه بنت اسد  از بعضى وقایع داخل خانه خبر داد و از عظمت آن مولود و غذاهاى بهشتى و اینکه نام این حضرت به نداى آسمانى على  است."],["p","ابو طالب  و پیامبر  پیش آمدند، و فاطمه بنت اسد  با مولود پیش آمد. حضرت مولى الموالى على  فرمودند: السلام علیک یا ابه و رحمه االله و برکاته. ابوطالب  فرمود: و علیک السلام یا بنى و رحمه االله و برکاته، و آن حضرت را در آغوش گرفت. ⟦408⟧ امیر المؤمنین  چشمان مبارك به صورت پیامبر  باز کرد و تبسم فرمود و خود را حرکتى داد و فرمود: السلام علیک و رحمه االله و برکاته، مرا در آغوش بگیر."],["p","پیامبر  پاسخ سلامش را داد و آن حضرت را در آغوش گرفت، و بوسید و دست در دست او گذاشت. آنگاه امیر المؤمنین  دست راست بر گوش نهاد و اذان و اقامه فرمود و به یگانگى خداوند عزوجل و نبوت پیامبر  شهادت داد. ⟦409⟧ سپس از پیامبر  براى قرائت کتب آسمانى اجازه خواست. بعد از آنکه پیامبر  اجازه فرمود، سینه را صاف کرد و آنچه در صحف حضرت آدم و نوح و ابراهیم و موسى و عیسى  بود قرائت فرمود. سپس شروع به قرائت قرآن نمود که هنوز نازل نشده بود. آن حضرت سوره مبارکه مؤمنون را آغاز کرد: قد افلح المؤمنون.... سپس در حالتى که آن حضرت در آغوش رسول االله  بود به خانه ابوطالب  بازگشتند. ⟦410⟧ فاطمه بنت اسد  مى فرماید: هنگامى که از کعبه خارج شدم و فرزند را نزد پیامبر  گذاشتم، آن حضرت با زبان مبارك دهان على  را باز کرد و او را با آب دهان مبارك تحنیک کرد و اذان در گوش راست و اقامه در گوش چپ آن حضرت گفت و فرمود: «این مولودى است که بر فطرت بدنیا آمده است.» ⟦411⟧"],["p","در روز سوم ولادت حضرت یا روز سوم خروج از کعبه و در بعضى اقوال دهم ذى الحجه، حضرت ابوطالب و قبلا هفت بار کعبه را طواف کنید و بعد بر فرزندم على  سلام کنید.» ⟦412⟧"],["h","کودکى على  با پیامبر "],["p","امیر المؤمنین  درباره دوران کودکى خود و همراه بودن با پیامبر  چنین مى فرمایند: به هنگام کودکى، پیامبر  مرا به دامان مى گرفت، و به سینه مى چسباند. غذا را مى جوید و به دهانم مى گذارد. از بوى خوش خویش به مشام جانم مى بویانید. او در گفتارم دروغ و در کردارم اشتباه و نادانى نیافت. خداوند پیامبر  را از هنگام شیر خوارگى با بزرگترین فرشتگان همراه کرد، تا شبانه روز او را در راه بزرگواریها و نیکیهاى جهان رهنمون باشد. من نیز از پیامبر  پیروى مى کردم تا چنانکه کودك شیر خوارى از مادر فرمان مى برد و از کردارهاى او پیروى مى کند. هر سال به کوه حرا مى رفت، و در این هنگام هیچ کس جز من او را نمى دید. ⟦413⟧"]]},{"k":"day","key":14,"label":"","items":[["t",1,"مرگ معتمد عباسى"],["p","در این روز در سال 279ه المعتمد على االله احمد بن متوکل ملقب به معتمد به جهنم واصل شد. علت مرگ او این بود که در کنار نهرى در حال عیش و نوش بود و در اثر نوشیدن زیاد شراب یا زهرى که توسط پسر برادرش در شراق او ریخته بودند، شکمش ترکید ⟦414⟧ به قول دیگر او در 18رجب به درك واصل شد. ⟦415⟧"],["p","معتمد در 23سال خلافتش لذت و ملاهى را اختیار کرده بود و امورات مملکت به دست برادرش احمد موفق بود. بعد از او پسرش احمد معتضد کارهاى پدر را انجام مى داد تا عمویش معتمد را از سر راه برداشت و خود به خلافت رسید."],["p","از کبائر جرائم اعمال معتمد، مسموم کردن آقا و مولایمان حضرت امام حسین عسکرى  است. صدوق (رحمه االله) مى فرماید: معتمد چندین بار امام عسکرى  را حبس کرد."]]},{"k":"day","key":15,"label":"","items":[["t",1,"زیارت امام حسین "],["p","در شب 15رجب و روز آن زیارت امام حسین  ⟦416⟧ و همچنین زیارت مشاهد مشرفه معصومین  ⟦417⟧ مستحب است."],["t",2,"وفات حضرت زینب "],["p","وفات مظلومانه و غریبانه ام المصائب حضرت فاطمه صغرى عقیله بنى هاشم زینب کبرى  در شب یکشنبه 15رجب سال 62ه به وقوع پیوسته است. ⟦418⟧"],["p","در مدت یک سال بعد از واقعه کربلا، زندگانى آن حضرت همراه با اشک و آه و خاطرات اسارت و کربلا سپرى گشت. در عظمت آن مخدره همین بس که به فرموده صدوق (رحمه االله)، از جانب امام حسین  نیابت خاصه داشته است، و تا هنگامى که بیمارى امام زین العابدین  تمام نشده بود، این نیابت ادامه داشت"],["p","⟦419⟧"],["h","نام گذارى حضرت"],["p","هنگام ولادت جبرئیل از جانب خداوند متعال بر پیامبر  نازل شد و عرض کرد: «یا رسول االله، اسم این دختر را زینب بگذار». آنگاه جبرئیل گریست. پیامبر  پرسید: سبب این گریه چیست؟ عرض کرد: همانا این دختر از آغاز زندگانى تا پایان روزگار در این سراى ناپایدار با رنج و درد و بلا خواهد زیست. گاهى به درد مصیبت شما یا رسول االله مبتلا مى شود، و گاهى در ماتم مادرش و گاهى در مصیبت پدر و گاهى به درد فراق برادرش حسن مجتبى  دچار خواهد شد. از همه بالاتر به مصائب کربلا و نوائب دشت نینوا گرفتار مى شود چنانکه مویش سفید و قامتش خمیده خواهد گردید."],["p","این خبر را اهل بیت  شنیدند و اندوهناك و گریان شدند. پیامبر  صورت بر صورت حضرت زینب  نهاد و گریست. حضرت صدیقه طاهره  فرمود: یا ابتا، این گریه براى چیست؟ خداوند دیده هاى تو را نگریاند. فرمود: اى فاطمه، بعد از من و تو این دختر دچار بلاها و مصائبى مى شود. حضرت صدیقه  فرمود: چه ثواب دارد آن کسى که بر دخترم زینب  گریه کند؟ آن حضرت فرمود: «اى پاره تنم واى نور چشمم، ثواب کسى که بر او و مصائب او گریه کند مانند ثواب کسى است که بر برادرش حسین گریه کند». سپس نام آن حضرت را «زینب»نهاد. ⟦420⟧"],["p","آن حضرت یک سال و چند ماه بعد از واقعه کربلا با قلبى پر از اندوه از مصائب کربلا در خانه خود رحلت فرمودند و در همان خانه دفن شدند. در وفات آن مخدره مظلومه روزهاى 14رجب و دهم ماه رمضان را هم گفته اند. ⟦421⟧"],["t",3,"تغییر قبله"],["p","در روز 15رجب سال 2ه قبله از بیت المقدس به سوى کعبه تغییر پیدا کرد. این برنامه در نماز ظهر در مسجد بنى سالم مدینه اتفاق افتاد و این مسجد بعد از آن به مسجد ذى القبلتین نامیده شد. ⟦422⟧"],["t",4,"خروج از شعب ابى طالب "],["p","در این روز حضرت ختمى مرتبت  از شعب ابى طالب  خارج شدند. ⟦423⟧"],["t",5,"شهادت امام صادق "],["p","شهادت امام صادق  به روایتى در سال 148ه در چنین روزى بوده است. ⟦424⟧"]]},{"k":"day","key":16,"label":"","items":[["t",1,"خروج فاطمه بنت اسد  از کعبه"],["p","در ابتداى این روز حضرت فاطمه بنت اسد  با فرزندش امیر المؤمنین  از کعبه خارج شد"],["p","⟦425⟧"]]},{"k":"day","key":17,"label":"","items":[["h","مرگ مأمون"],["p","روز پنچ شنبه 17رجب سال 218ه، ⟦426⟧ یا به قولى 8رجب ⟦427⟧ یا 9رجب ⟦428⟧ یا 18رجب ⟦429⟧ مأمون لعنت االله علیه در سن 48سالگى به اجدادش پیوست. مدت خلافت او 21سال بود. ⟦430⟧"]]},{"k":"day","key":18,"label":"","items":[["t",1,"وفات ابراهیم فرزند پیامبر "],["p","در سال 10ه ابراهیم فرزند پیامبر  از دنیا رفت. ⟦431⟧ مادر این بزرگوار ماریه قبطیه بود. ⟦432⟧ سن ابراهیم هنگام وفات به قولى 18ماه و چند روز، و به قولى یک سال و ده ماه و هشت روز بود. ⟦433⟧"],["t",2,"شهادت حضرت زهرا "],["p","شهادت حضرت صدیقه طاهره  به نقل ابن عیاش در این روز است. ⟦434⟧"],["t",3,"اول خلافت شوم یزید"],["p","در این روز یزید ملعون خلافت غصب شده را در دست گرفت. سه روز بعد از مرگ معاویه و دفن او در 15رجب، یزید به دمشق آمد و کنار قبر او رفت و گریست. بعد از آن به کاخ رفت و تا سه روز بیرون نیامد. سپس در روز 21 رجب به مسجد آمد و به منبر رفت و خطبه خواند. ⟦435⟧"]]},{"k":"day","key":22,"label":"","items":[["t",1,"فرار ابوبکر در جنگ خیبر"],["p","در این روز در ایام جنگ خیبر علم به ابوبکر داده شد و او با دیدن دشمن گریخت و گروه خود را نیز به فرار تشویق کرد. ⟦436⟧"]]},{"k":"day","key":23,"label":"","items":[["t",1,"حمله به امام مجتبى  در مدائن"],["p","در این روز جراح بن سنان اسدى ملعون در ساباط مدائن با استفاده از تاریکى شب خنجر یا تیغى مسموم را به ران مبارك امام حسن مجتبى (علیه السلام ) زد که تا استخوان شکافت. آن حضرت از شدت درد دست در گردن او افکند و هر دو به زمین افتادند. دوستان حضرت آن ملعون را کشتند و امام  را به خانه والى مدائن، سعد بن مسعود (عموى مختار) بردند. سعد جراحى آورد و جراحت آن حضرت را مداوا نمود. ⟦437⟧"],["p","در این روز زیارت آن حضرت و لعن بر ظالمان و قاتلان آن حضرت مناسب است. ⟦438⟧"],["t",2,"مسموم شدن موسى بن جعفر "],["p","در این روز در سال 183ه آقا و مولایمان حضرت موسى بن جعفر  را به دستور هارون ملعون در زندان بغداد زهر داده و مسموم کردند. ⟦439⟧"],["t",3,"فرار عمر در جنگ خیبر"],["p","در این روز در جنگ خیبر پرچم را به دست عمر دادند و او با دیدن دشمن گریخت و گروه خود را نیز به فرار تشویق کرد. ⟦440⟧"]]},{"k":"day","key":24,"label":"","items":[["t",1,"فتح خیبر به دست امیر المؤمنین "],["p","در این روز در سال 7ه در جنگ خیبر مرحب به دست امیر المؤمنین  کشته شد و قلعه خیبر به دست آن حضرت فتح گردید. ⟦441⟧ و در بحار الانوار 27رجب روز فتح خیبر ذکر شده است. ⟦442⟧"],["p","چون پیامبر  به جنگ خیبریان رفت و قلعه قموص را محاصره کرد، ابتدا پرچم را براى مبارزه با آنان به ابوبکر دادند. ابوبکر بالشکرى رفت، ولى چون نظر به پهلوانان آنان نمود فرار کرد و لشکریان هم در پى او بازگشتند. روز بعد پیامبر  پرچم را به عمر داد و او هم از ترس کشته شدن به میدان جنگ نرسیده بازگشت."],["h","انتخاب على  براى فتح خیبر"],["p","پیامبر  فرمودند: «فردا پرچم را به مردى مى دهم که حمله هایش را تکرار کند، نه اینکه فرار کند. کسى که خدا و پیامبرش را دوست دارد و خدا و پیامبرش هم او را دوست دارند، و خداوند خیبر را به دست او فتح مى کند». همه اصحاب آرزو کردند که این مقام و منزلت به آنان واگذار شود."],["p","فرداى آن روز، پیامبر  فرمود: على بن ابى طالب  کجاست؟ گفتند: چشم دردى دارد که حرکت براى آن حضرت مشکل است. خاتم الانبیأ  فرمود: او را حاضر کنید. سلمه بن اکوع رفت و آن حضرت را آورد. پیامبر  سر آن حضرت را در بر گرفت و از آب دهان مبارك به چشمان نورانى حضرت خاتم الاوصیأ على مرتضى  مالید و فرمود: «بارالها، زحمت گرما و سرما را از او بردار». پس از آن روز بر امیر المؤمنین  درد چشم عارض نشد و از گرما و سرما آزرده نگشت."],["p","پیامبر  زره خود را بر او پوشانید و ذوالفقار را بر کمر او بست و پرچم به آن حضرت سپرد و سوار بر مرکبش نموده فرمود: «جبرئیل از سمت راست، میکائیل از سمت چپ، عزرائیل از پیش رو و اسرافیل از پشت سر، و نصرت خدا بالاى سر، و دعاى من نیز از پشت سر تو است». فرمود: یا على، مسلماتى را بر ایشان عرضه کن"],["h","میدان جنگ خیبر"],["p","آن حضرت رفت، و پس از موعظه و نصیحت عده اى براى جنگ با او آمدند. آنان دو نفر از مسلمانان را شهید کردند. امیر المؤمنین  بر آنها تاخته و آنها را کشتند. آنگاه برادر مرحب با عده اى آمدند. حضرت آنها را هم به درك فرستاد."],["p","مرحب که شجاع بود به خونخواهى آمد. امیر المؤمنین  چنان با ذوالفقار بر سرش فرود آورد که شمشیر از حلقش گذشت و او را دو نیم ساخت و به خاك انداخت. صداى تکبیر مسلمانان بلند شد. عده اى از یهود به دفاع آمدند و با مسلمانان به جنگ پرداختند. امیر المؤمنین  به مبارزه ادامه داد تا عده اى کشته شدند و عده اى به قلعه گریختند."],["p","آن حضرت با دست قدرتمند حیدرى در قلعه را کند و براى مسلمانان معبر قرار داد تا از خند عبور کنند. حضرت چندین بار مسلمانان را از روى خندق به وسیله آن در عبور داد، با اینکه از سه روز قبل، آن حضرت گرسنه بود. ⟦443⟧"],["t",2,"بازگشت جعفر طیار از حبشه"],["p","آمدن جناب جعفر بن ابى طالب  برادر امیر المؤمنین  از حبشه در روز فتح خیبر اتفاق افتاده است. ⟦444⟧"]]},{"k":"day","key":25,"label":"","items":[["t",1,"شهادت موسى بن جعفر "],["p","در این روز در سال 183ه بنابر مشهور امام موسى بن جعفر ، در حبس سندى بن شاهک به شهادت رسیدند ⟦445⟧ به روایت مرحوم کلینى روز شهادت حضرت موسى بن جعفر  ششم رجب است. ⟦446⟧ هارون ملعون به ظاهر براى زیارت و در حقیقت براى دستگیر نمودن حضرت موسى بن جعفر  و فرستادن آن حضرت از مدینه به بغداد به مسجد النبى  آمد. ⟦447⟧"],["h","خلفاى ظالم در دوران امامت حضرت"],["p","آن حضرت 20سال داشتند که امامت به ایشان منتقل شد و مدت 35سال امامت فرمودند. در این مدت بعد از شهادت امام صادق  مقدارى همزمان با ابوجعفر منصور بودند که او متعرض آن حضرت نشد."],["p","بعد از منصور قریب به ده سال ایام خلافت مهدى بود. او حضرت را به عراق طلبید و حبس کرد. شبى امیر المؤمنین  را در خواب دید که به او فرمود: فهل عسیتم ان تولیتم أن تفسدوا فى الارض و تقطعوا أرحامکم ⟦448⟧ وقتى بیدار شد مراد حضرت را دانست و موسى بن جعفر  را از زندان آزاد کرد."],["p","پس از مهدى، پسرش هادى خواست آن حضرت را محبوس کند ولى اجل او را مهلت نداد، چه اینکه کمتر از یک سال بیشتر خلافت نکرد. خلافت به هارون که رسید امام  را از زندانى به زندان دیگر فرستاد، تا در سال چهاردهم خلافتش آن حضرت را در سن 55سالگى به زهر جفا شهید کرد. ⟦449⟧"],["h","غسل و تدفین حضرت"],["p","پس از شهادت بدن شریف حضرت را طبق دستور هارون با جامه هاى کهنه، جهت اهانت به آن بزرگوار، روى نردبانى گذاردند و چهار حمال بر دوش گرفتند، و کسى جلوى جنازه صدا مى زد: «این امام رافضیان است»."],["p","امام رضا  قبلا متوجه غسل و کفن و نماز آن حضرت شده بودند. سپس شیعیان آمدند و گل آوردند و احترام کردند و در محل فعلى حرم مطهر، بدن آن حضرت را دفن کردند. ⟦450⟧"],["p","تعداد فرزندان آن حضرت 37نفرند ⟦451⟧ و مدت امامت آن حضرت 35سال، و عمر شریف امام  هنگام شهادت 55سال بود. ⟦452⟧ شهادت آن حضرت در 5یا 6رجب نیز ذکر شده است. ⟦453⟧"]]},{"k":"day","key":26,"label":"","items":[["t",1,"وفات حضرت ابوطالب "],["p","سید بطحأ حضرت ابوطالب  ⟦454⟧ سه سال قبل از هجرت و در سال 10 بعثت از دنیا رفت. بنا نقلى سن آن حضرت به هنگام رحلت 81سال بوده است. ⟦455⟧ اقوال دیگر در رحلت حضرت ابوطالب  عبارت است از 27: جمادى الاولى 26، و 29رجب 7، و 18ماه رمضان 15، و 17شوال، اول و دهم ذى القعده، اول ذى الحجه. ⟦456⟧"],["h","نسب حضرت ابوطالب "],["p","نام مبارك آن حضرت عمران است، و پدرشان جناب عبد المطلب، و مادرشان فاطمه بنت عمر و بن عائذ است. ابوطالب  با عبد االله پدر پیامبر  و زبیر بن عبد المطلب برادر ابوینى بودند، یعنى از طرف پدر و مادر یکى بودند و سایر اولاد جناب عبد المطلب با این سه بزرگوار فقط از پدر یکى بودند."],["h","ایمان حضرت ابوطالب "],["p","مجلسى (رحمه االله) مى فرماید: امامیه اتفاق دارند بر اسلام و ایمان جناب ابوطالب  به پیامبر  و اینکه هیچ گاه عبادت بتى نکرده است. بلکه ابوطالب  یکى از اوصیأ حضرت ابراهیم  است و امر اسلام و ایمان او در شیعه مشهور است و علماى شیعه کتابها در ایمان آن بزرگوار تألیف کرده اند. صدوق  مى فرماید: در حدیث آمده که جناب عبد المطلب  حجت الهى و جناب ابوطالب  وصى ایشان بوده است. طبق روایت و دایع انبیأ، عصاى حضرت موسى  و انگشتر حضرت سلیمان  و... توسط عبد المطلب (علیه السلام ) به ابوطالب سپرده شد که ایشان آنها را به خاتم الانبیأ  سپردند."],["p","ابن اثیر جزرى شافعى مى گوید: اهل بیت  بر ایمان ابو طالب  اجماع دارند اجماع اهل بیت  حجت است. ⟦457⟧"],["p","کتب زیادى در ایمان حضرت ابوطالب  تألیف شده که اولین آنها در سال 630ه نوشته شده است. از آن زمان تاکنون کتبى به زبانهاى مختلف در ایمان، عظمت و بزرگى آن بزرگوار تألیف و چاپ شدهاست که بر اهل تحقیق پوشیده نیست. ⟦458⟧"],["p","حضرت رضا  مى فرمایند: «کسى که معتقد باشد ابوطالب  با حالت کفر از دنیا رفته، کافر است»."],["p","اشعار حضرت ابوطالب  در حمایت از پیامبر ، اشعار منسوب به امیر المؤمنین  هنگام رحلت ابوطالب  و کلمات آن بزرگوار به قریش در مسجد الحرام هنگام قصد سوء قریش نسبت به پیامبر ، و کلمات آن حضرت هنگام رحلت، کلمات آن حضرت در طلب باران همه دلالت دارد بر اینکه داراى ایمانى منحصر بفرد بوده است که در روایات تشبیه به ایمان اصحاب کهف شده است. بعضى از ابیات امیر المؤمنین  در مرثیه آن بزرگوار نیز دلالت بر افضیلت آن بزرگوار بر حمزه دارد."],["p","اصبغ بن نباته مى گوید: امیرالمومنین  فرمود: «بخدا قسم هرگز پدرم و جدم عبدالمطلب و هاشم و عبد مناف عبادت بت نکرده اند». گفتند: پس چه را عبادت مى کردند؟ فرمودند: به سوى کعبه نماز مى خواندند و بر دین ابراهیم و به آن متمسک بودند."],["p","ابن ابى الحدید در ضمن اشعارى مى گوید: اگر ابوطالب و پسرش نبودند، از دین اثرى نبود که اینچنین استوار شود. ابواطالب در مکه از پیامبر صلى االله علیه و آله( حمایت کرد و پسرش در مدینه بى دریغ از پیامبر  حمایت و دفاع مى نمود."],["p","⟦459⟧"],["h","پیامبر  در وفات ابوطالب "],["p","هنگامى که حضرت امیرالمومنین  خبر وفات ابوطالب  را به پیامبر  داد، آن حضرت به شدت ملول و محزون شدند و فرمودند: «یا على برو و او را غسل و حنوط و کفن کن و چون بر روى سریر نهادى به من خبر بده». هنگامى که آن حضرت دستورات پیامبر  را انجام داد و پدر بزرگوار را بر روى سریر گذاشت، پیامبر  خودشان تشریف آوردند و چون نظر مبارکشان بر نعش عموى بزرگوار شان افتاد، رقت و حزن به آن حضرت دست داد و فرمودند: «اى عمو، صله رحم و مهربانى کردى و جزاى خیر دیدى. اى عمو، در کوچکى مرا کفالت کردى و در بزرگى مرا نصرت و حمایت نمودى»."],["p","بعد به مردم رو کردند و فرمودند: «سوگند به خدا که اذن شفاعت مى دهم در روز قیامت به عمویم که جن و انس از آن شفاعت تعجب کنند». با رحلت ابوطالب  جبرئیل نازل شده به پیامبر  عرض کرد: «یاور تو از دنیا رفت، هجرت کن.» ⟦460⟧"],["p","امیرالمومنین  در زمان حیات خود نائب مى گرفت که براى عبداالله و آمنه و ابوطالب  حج انجام دهند، و هنگام شهادت به اولاد خود وصیت فرمودند مکه نایب براى حج از طرف آن بزرگواران بگیرند."],["p","⟦461⟧"]]},{"k":"day","key":27,"label":"","items":[["t",1,"بعثت پیامبر "],["p","مبعث مبارك پیامبر  در سن 40سالگى و آغاز نزول قرآن بر پیامبر  در این روز بوده است."],["p","⟦462⟧"],["p","این روز یکى از اعیاد بزرگ است، و روزى است که حضرت رسول  به رسالت مبعوث گردید و جبرئیل  بر پیامبرى آن حضرت نازل شد. ⟦463⟧ غیر شیعه مبعث را در 17یا 18یا 24ماه رمضان و بعضى در 12ربیع الاول مى دانند."],["p","در این روز صلوات بر پیامبر  و اهل بیت آن حضرت و نیز زیارت آن حضرت و امیرالمومنین  وارد شده است."],["p","⟦464⟧"],["p","سالیان سال بود که از بعثت انبیا  مى گذشت، و هر قوم و قبیله اى با عقیده هاى مختلف خود زندگى مى کردند و در حجاز و مکه آن روز بیار بت مى پرستیدند: بت سنگى، فلزى، چوبى، و گاهى از جنس خرما. دختران را زنده به گور مى کردند. اکثر قبایل در حال جنگ و خونریزى بودند. دنیا غرق در گمراهى و ضلالت بود. تا اینکه چهل سال از ولادت با سعادت اشرف مخلوقات و سرور کائنات حضرت محمد بن عبداالله  گذشت. خداوند آن حضرت را به پیامبرى مبعوص فرمود، و جبرئیل بر آن حضرت نازل شد و وحى هاى الهى را با آداب و مراسمى مخصوص به آن حضرت رسانید که در کتب روایى با سندهاى مختلف ذکر شده است."],["p","طبق بعضى روایات ⟦465⟧ هنگامى که آن حضرت از کوه حرا بر مى گشتند انوار جال و عظمت ایشان را فرا گرفته بود، بحدى بود که هیچکس را یاراى آن نبود که به آن حضرت نظر کند. از کنار هر درخت و گیاه و سنگ که مى گذشت در برابر آن حضرت خم مى شدند و به زبان فصیح مى گفتند: «السلام علیک یا نبى االله، السلام علیک یا رسول االله»."],["p","هنگامى که آن حضرت داخل خانه حضرت خدیجه  شدند، از شعاع انوار جمال آن حضرت خانه منور شد. خدیجه  عرض کرد: اى محمد، این چه نور است که از شما مشاهده مى کنم؟ آن حضرت فرمودند: این نور پیامبرى است. سپس خطاب به حضرت خدیجه  فرمودند: بگو: لا اله الا االله محمد رسول االله». خدیجه  عرض کرد: سالهاست من پیامبرى شما را مى دانم. سپس به وحدانیت خداوند متعال و رسالت پیامبر  شهادت داد."],["p","در این هنگام آن حضرت فرمودند: «اى خدیجه، احساس سرما مى کنم. جامه اى بر من بپوشان». حضرت جامعه بر خود کشید و خوابید. از جانب حقتعالى ندا رسید: «یا ایها المدثر، قم فانذر و ربک فکبر: « ⟦466⟧... اى جامه به خود پیچیده، بر خیز و بترسان مردم را از عذاب پروردگار خود، و تکبیر بگو و پروردگارت را به بزرگى یاد کن»آن حضرت برخاست و انگشت مبارك در گوش خود گذاشت و فرمود: «االله اکبر، االله اکبر»پس صداى آن حضرت به همه موجودات رسید، و همه با او موافقت کردند."],["p","144"],["p","⟦467⟧"],["p","پیامبر  سه سال پنهانى مردم را به خداى یکتا دعوت مى فرمود، و پس از سه سال جبرئیل آمد و عرض کرد: «خداوند متعال امر فرموده که دعوت خویش را آشکار فرمایى». سپس آن حضرت از کوه صفا بالا رفتند و مردم را انذار فرمودند و دعوت خود را علنى نمودند."],["p","⟦468⟧"]]},{"k":"day","key":28,"label":"","items":[["t",1,"خروج امام حسین  از مدینه به سوى مکه"],["p","در این روز در سال 60ه امام حسین  از مدینه منوره متوجه مکه شدند. ⟦469⟧ بنابر قولى شب 29رجب آن حضرت از مدینه خارج شدند ⟦470⟧. در این سفر همراه ایشان عقیله بنى هاشم زینب کبرى، برادرشان حضرت ابوالفضل العباس، ام کلثوم، على اکبر و دیگر اهل بیت  بودند. خواهران حضرت سید الشهدا،  با عقیله بنى هاشم وام کلثوم  13نفر بودند."],["p","بانوان دیگر از منسوبین حضرت، علیا مخدره ام کلثوم صغرى دختر زینب کبرى  که با شوهرش به کربلا آمد و دیگرى خواهد امیرالمومنین  جمانه دختر ابوطالب . همچنین 9کنیز با حضرت از مدینه خارج شدند و 10نفر غلام با حضرت بودند. چند نفر از همسران امام مجتبى  و 16نفر از اولاد دختر و پسر امام مجتبى  و خانواده مسلم بن عقیل  و دیگر اصحاب و بستگان حضرت نیز همراه بودند."],["p","لوازم و سوارى هایى که همراه داشتند عبارت بود از 250اسب 250، ناقه. از این تعداد 70، ناقه براى حمله خیمه ها 40، ناقه براى حمل دیگ و ظروف و ادوات ارزاق 30، ناقه براى حمل مشکهاى آب 12، ناقه براى جامه ها و دراهم و دنانیر 50، ناقه براى حمل 50هودج تعبیه شده براى حمل مخدرات و علویات و اطفال و ذرارى و خدمتگزاران و کنیزان، و بقیه شتران براى حمل وسایل مختلف که مورد لزوم بود."],["p","⟦471⟧"],["t",2,"اولین اقامه نماز در اسلام"],["p","در این روز اولین کسى که بعد از بعثت با پیامبر  نماز خواند، امیرالمومنین  بود. روز دوشنبه 27رجب پیامبر  مبعوث شدند و در 28 رجب حضرت امیرالمومنین عليهالس لا م با آن حضرت نماز اقامه فرمودند."],["p","⟦472⟧"]]},{"k":"tail","key":"آخر رجب","label":null,"items":[["t",1,"مرگ ابوحنیفه"],["p","در این روز ⟦473⟧ در سال 150ه ⟦474⟧ نعمان بن ثابت مشهور به ابو حنیفه رئیس حنفى ها در بغداد مرد و در همان شهر دفن شد."],["t",2,"مرگ شافعى"],["p","در روز جمعه آخر ماه رجب سال 204ه محمد بن ادریس شافعى در مصر مرد. ⟦475⟧"],["p","او مدت 4سال در شکم مادر بود و در روز وفات ابو حنیفه به دنیا آمد. جاى تعجب است که پدر شافعى چهار سال قبل از ولادت او مرده بود و او در ولادت به احترام حیات ابو حنیفه تأخیر کرد."],["p","⟦476⟧"]]},{"k":"tail","key":"تتمه رجب","label":null,"items":[["t",1,"هجرت مسلمانان به حبشه"],["p","در این ماه بعد از بعثت به امر پیامبر  مسلمانان به سرپرستى جعفر بن ابى طالب  به حبشه هجرت نمودند."],["p","⟦477⟧"],["t",2,"غزوه نخله"],["p","در آخر این ماه در سال دوم غزوه نخله به وقوع پیوست."],["p","⟦478⟧"],["t",3,"وفات نجاشى پادشاه حبشه"],["p","در این ماه در سال 9ه نجاشى پادشاه حبشه رحلت نمود ⟦479⟧. در آن روز پیامبر  فرمود: «امروز مردى صالح از جهان رحلت نمود. برخیزید تا بر او نماز بگذاریم». در این هنگام جنازه نجاشى بر پیامبر  ظاهر شد و آن حضرت با اصحاب بر او نماز گذاردند."],["p","⟦480⟧"]]}]},{"name":"شعبان المعظم","groups":[{"k":"intro","key":0,"label":null,"items":[["p","ماه شعبان ماه سرور شیعه به قدوم امامان معصوم  است. روزهاى،3،2 4، 5، 9، 10، 11، 14، 15، 18، 19این ماه روزهاى مهمى از تاریخ اسلام است."],["p","ولادت امام حسین ، امام زین العابدین ، حضرت بقیه االله الاعظم، حضرت عباس  و حضرت على اکبر  مهم ترین اخبار سراسر سرور در این ماه هستند. مرگ حفصه و مغیره بن شعبه نیز دو خبر مسرورر کننده در این ماه اند."],["p","از سوى دیگر شهادت سعید بن جبیر، وفات على بن محمد سمرى و حسین بن روح نوبختى دو نایب امام زمان  روزهاى حزن این ماه اند."],["p","جنگ بنى سعد جنگ رخ داده در این ماه است. آغاز و جوب روزه یک روز تاریخى در زمینه احکام اسلامى است. ورود امام حسین  به مکه، آخرین توقیع امام زمان  و شناساندن امام زمان  به شیعیان نیز سر آغاز تحولات عظیمى در تاریخ اسلام اند."]]},{"k":"day","key":2,"label":"","items":[["t",1,"آغاز وجوب روزه"],["p","در این روز در سال دوم هجرى روزه ماه مبارك رمضان واجب شد. ⟦481⟧"],["t",2,"مرگ معتز عباسى"],["p","در این روز در سال 255ه معتز باالله به درك واصل شد. نام او زبیر یا محمد بود که بعد از پسر عمویش مستعین به خلافت رسید. از بزرگترین جرائم او این بود که امام هادى  را به شهادت رساند؛ و چون ترس آن داشت که مؤ ید بر ضد او قیام کند او را در لحاف مسموم پیچید و دو طرف آن را بست تا در 23 رجب مرد."],["p","او پیوسته سرکردگان اتراك را مى کشت تا در روز مبعث سال 255ه عده اى به سرکردگى صالح بن وصیف دور معتز را گرفتند و توبیخ و سرزنش کردند و از او مطلبه اموال کردن و او را از حجره بیرون کشیدند و در آفتاب گرم بپاى داشتند که از شدت گرما تکیه بر یک پا مى کرد و او را پیوسته مى زدند تا اینکه در 27رجب خود را از خلافت خلع کرد. سپس سه روز به او آب و غذا ندادند تا مرد؛ و به قولى دیگر او را با آب جوش تنقیه کردند. بعضى گفته اند: او را پنج روز در گرمابه بدون آب و غذا حبس کردند و روز آخر آب نمک یا آب برفى به او دادند و به این سبب کشته شد. ⟦482⟧"]]},{"k":"day","key":3,"label":"","items":[["t",1,"ولادت امام حسین "],["p","در این روز در سال 4ه آقاى شهیدان و سرور و سالار شیعیان و دلباختگان، اشک هر مؤمن، امام زاهد عباد، شهید غریب، عطشان نینوا حضرت ابا عبداالله الحسین الشهید  عالم را به نور خود منور فرمود. ⟦483⟧ اقوال دیگر در ولادت آن حضرت پنجم شعبان ⟦484⟧ و سى ام ربیع الاول ⟦485⟧ و دوازدهم رجب است. ⟦486⟧"],["h","القاب امام حسین "],["p","نام مبارك آن حضرت در تورات شبیر و در انجیل طاب است. ⟦487⟧ پدرشان مولانا و مقتدانا امیر المؤمنین على بن ابى طالب  و مادرشان حضرت ولیه االله و حبیبته خاتون دو سرا صدیقه کبرى فاطمه زهرا  است."],["p","کنیه آن حضرت ابوعبداالله و کنیه خاص آن حضرت ابو على است. ⟦488⟧ القاب حضرت الشهید، السعید، السبط الثانى، الامام الثالث، الرشید، الطیب، الوفى، السید، الزکى، المبارك، تابع لمرضات االله است. ⟦489⟧"],["h","پیامبر  در ولادت امام حسین "],["p","هنگامى که خبر ولادت آن حضرت به پیامبر گرامى  رسید، به خانه امیر المؤمنین  آمدند و به اسمأ فرمودند تا مولود را بیاورد. اسمأ حضرت را در پارچه اى سفید پیچید و خدمت رسول اکرم  آورد. پیامبر  در گوش راست آن حضرت اذان و در گوش چپ اقامه فرمودند. ⟦490⟧"],["p","روز اول یا هفتم ولادت امین وحى الهى جبرئیل فرود آمد و عرض کرد: «سلام خداوند بر تو باد اى پیامبر، این نوزاد را را به نام پسر کوچک هارون شبیر نام بگذار، که به عربى حسین گفته مى شود. چون على  براى شما بسان هارون براى موسى بن عمران است، جز آنکه شما خاتم پیامبرانى.» ⟦491⟧ به این ترتیب نام پر عظمت «حسین»از جانب پروردگار براى دومین فرزند فاطمه  انتخاب شد. در این رز ملائکه آسمانها براى عرض تهنیت به مناسب این ولادت خدمت پیامبر صلىا الله عليه وآله رسیدند و از خاك قبر آن بزرگوار براى پیامبر (صلى االله علیه و آله ) آوردند و به آن حضرت تعزیت نیز گفتند. یکى از معجزات روز ولادت آن حضرت این بود که فطرس ملک یا دردائیل پناه به آن امام مظلوم برد و خداوند او را بخشید و او را به مقام قبلى اش بازگردانید. ⟦492⟧"],["h","دوران زندگى امام حسین "],["p","آن حضرت شش سال و چند ماه با جد گرامى خود رسول اکرم  بود. مدت سى سال با پدر بزرگوار خود مولاى متقیان امیر المؤمنان  زندگى کرد، و در جمل، صفین و نهروان شرکت داشت. ⟦493⟧"],["p","در دوران زمامدارى غاصبانه عمر، امام حسین  در سن ده سالگى وارد مسجد شد و خلیفه دم را به منبر پیامبر  مشاهده کرد که سخن مى گفت. از منبر بالا رفت و فریاد زد: «از منبر پدرم فرود آى!» ⟦494⟧"],["p","بعد از شهادت امیر المؤمنین  همراه و شریک رنجهاى امام حسین  بود، و شاهد بود که معاویه و دیگر منافقین و کافران چگونه دهان آلوده خود را به بدگویى پدر بزرگوارش امیر المؤمنین و برادرش امام حسن  مى گشایند. پس از آنکه امام مجتبى  را مظلومانه شهید کردند؛ امامت به آن وجود سراپا جود رسید، و بعد از مصائب و اذیتها و زخم زبانها، در روز عاشورا آن حضرت را به شهادت رسانیدند. ⟦495⟧"],["p","در این روز توقیع مبارك از ناحیه امام زمان  در رابطه با ولادت امام حسین  به قاسم بن علأ همدانى صادر شد. ⟦496⟧"],["t",2,"ورود امام حسین  به مکه"],["p","در شب جمعه سوم شعبان سال 60ه امام حسین  وارد مکه شدند و تا ذى الحجه در آنجا اقامت داشتند. ⟦497⟧"]]},{"k":"day","key":4,"label":"","items":[["t",1,"ولادت حضرت عباس "],["p","در این روز در سال 26ه علمدار کربلا سقاى نینوا حضرت قمر منیر بنى هاشم ابوالفضل العباس  به دنیا آمد. ⟦498⟧"],["p","نام مشهور آن حضرت عباس  است. به آن حضرت ابوالفضل، ابو القربه، قمر بنى هاشم، باب الحوائج، عبد صالح و سقا مى گویند. ⟦499⟧ پدرشان حرت امیر المؤمنین على بن ابى طالب ، و مادرشان حضرت ام البنین فاطمه  دختر حزام کلابیه است."],["p","آن حضرت خوش سیما و زیبارو بود و به همین جهت به ماه بنى هاشم ملقب شد. قامتى بلند و بازوهایى قوى داشت و بر اسب که مى نشست و پا در رکاب مى نمود زانوى آن حضرت تاگردن اسب مى رسید. مظهر جلال و جبروت حضرت کردگار بود، و در شجاعت و صفات بعد از امام حسن و امام حسین  سرآمد اولاد امیر المؤمنین  بود. آن حضرت سپهسالار و علمدار مظلوم کربلا بود. ⟦500⟧"]]},{"k":"day","key":5,"label":"","items":[["t",1,"ولادت امام زین العابدین "],["p","در این روز در سال 38ه در زمان امیر المؤمنین  آقا و مولایمان حضرت سید الساجدین زین العابدین )ع( بن الحسین  به دنیا آمدند. ⟦501⟧ نام آن حضرت «على»است، و مشهور ترین لقب مبارکش زین العابدین و سجاد است. ⟦502⟧ پدرشان سرور شهیدان حضرت اباعبد االله الحسین ، و مادرشان حضرت شهربانو است."],["p","امام سجاد  دو سال از عمر بابرکتش را به جدش امیر المؤمنین  بود، و بقیه عمر شریفش همراه عموى مکرم و مظلومش امام مجتبى  و پدر والامقامش امام حسین  سپرى شد. در واقعه جانسوز کربلا شاهد شهادت پدر، برادر، عمو و بستگان و اصحاب  بود، همراه با عمه اش زینب کبرى  و دیگر اسرا به کوفه و شام رفتند. در کوفه و شام جسارتها به آن حضرت و اهل بیت  نمودند، ولى با خطبه هایى نورانى از مامت و عصمت اهل بیت  دفاع فرمود. در کاخ یزید در حالیکه با چند تن دیگر از خاندان امامت به یک ریسمان بسته شده بودند، رو به یزید کرده فرمودند: ما ظنک برسول االله لو رانا موثقین فى الحبال«:... اى یزید، چه گمان به پیامبر مى برى اگر آن حضرت ما را این چنین در بند ببیند » ⟦503⟧؟"],["p","در ولادت آن حضرت اقوال دیگرى به این ترتیب وجود دارد 8: ربیع الاول، 15جمادى الاولى 15، ⟦504⟧ جمادى الاخر 5، رجب 11، رجب 7، شعبان9، شعبان 15، ⟦505⟧ شعبان 5، رمضان ⟦506⟧ در روز ولادت هم اختلاف است که یکشنبه بوده یا سه شنبه یا پنجشنبه یا جمعه ⟦507⟧؟ در سال ولادت هم اختلاف است که 36یا 37یا 38ه بوده است. ⟦508⟧"]]},{"k":"day","key":9,"label":"","items":[["t",1,"عقیقه براى امام حسین "],["p","در این روز که هفتمین روز ولادت امام حسین  است، حضرت رسول  گوسفندى را براى فرزندش به عنوان عقیقه قربانى کرد. سپس سر آن حضرت را تراشید و هم وزن موى سر او نقره صدقه داد. ⟦509⟧"]]},{"k":"day","key":10,"label":"","items":[["t",1,"توقیع امام زمان  براى شیعیان"],["p","در این روز ابوجعفر سمرى شش روز قبل از رحلتش، توقیعى از ناحیه مقدسه حضرت صاحب الامر  براى شیعیان آورد. ⟦510⟧"]]},{"k":"day","key":11,"label":"","items":[["t",1,"ولادت حضرت على اکبر "],["p","در سال 33ه شبیه ترین مردم به خاتم الانبیأ  حضرت على اکبر  به دنیا آمد. نام آن حضرت «على، »پدرشان حضرت سید الشهدأ ، مادرشان لیلى بنت مره ثقفى است. ⟦511⟧ کنیه آن حضرت طبق فرمایش حضرت صادق  «اباالحسن»است. ⟦512⟧"],["p","روایت بزنطى هم دلالت دارد که آن حضرت ازدواج کرده بودند ⟦513⟧ در زیارت وارده از حضرت صادق  هم مى خوانیم: صلى االله علیک و على عترتک و اهل بیتک و ابائک و أبنائک و امهاتک الأخیار الذین أذهب االله عنهم الرجس و طهر هم تطهیراو لفظ أبنأ در زیارت دلالت بر این دارد که آن حضرت حتى بیشتر از دو فرزند داشته است. ⟦514⟧ در واقعه کربلا نزدیک 27سال از عمر مبارك آن حضرت گذشته بود. ⟦515⟧"]]},{"k":"day","key":15,"label":"","items":[["t",1,"ولادت حضرت بقیه االله الاعظم صلوات االله علیه"],["p","در سال 255ه شب جمعه! ولادت خاتم الاوصیأ منتقم آل محمد ، آخرین امام بر حق و ولى مطلق خداوند حضرت بقیه االله حجه بن الحسن عجل االله تعالى فرجه الشریف واقع شده است. ⟦516⟧"],["p","در این شب آب زمزم زیاد مى شود به گونه اى که همه مى توانند رؤ یت کنند، ⟦517⟧ ولى اکنون روى آن پوشیده است. در این شب برات آزادى از آتش براى افراد زیادى نوشته مى شود، و آن را «شب برات»و «شب مبارك»و «شب رحمت» گویند."],["p","از امام باقر و امام صادق  راویت شده که فرمودند: وقتى شب نیمه شعبان شود، منادى از افق اعلى ندا مى کند: «اى زائرین قبر حسین بن على برگردید در حالى که گناهان شما آمرزیده شده و اجرا شما با خداى شما و محمد باشد». ولى کسى که استطاعت زیارت قبر امام حسین  را ندارد قبور مطهر ائمه دیگر را زیارت کند؛ و اگر این هم ممکن نیست با اشاره به طرف قبرشان سلام دهد. ⟦518⟧"],["p","نام پدرشان حضرت ابو محمد حسن بن على ، و نام مادرشان حضرت نرجس  است. ⟦519⟧"],["h","ماجراى شب ولادت"],["p","امام حسن عسکرى  در شب ولادت براى عمه بزرگوار خود جناب حکیمه خاتون  پیغام فرستاده فرمودند: امشب نزد ما افطار کن که شب نیمه شعبان است و خداوند حجت خود را آشکار مى سازد. ⟦520⟧"],["p","ولادت امام زمان  در شهر سامرا به هنگام طلوع فجر نیمه شعبان 255ه بوده است. بر شانه راست آن حضرت نوشته شده بود: جأ الحق و زهق الباطل ان الباطل کان زهوقا."],["p","پس از تولد آن بزرگوار را نزد پدر بردند و شروع به سخن فرمود: أشهد أن لا اله الا االله و اشهد ان محمدا رسول االله و أن علیا أمیر المؤمنین ولى اللهو ائمه معصومین  را یکى بعد از دیگرى نام برد تا به وجود شریف خود رسید و براى فرج محبین خود دعا فرمود."],["h","امام زمان  در آغوش پدر"],["p","آنگاه حسب الامر امام عسکرى ، حکیمه خاتون او را نزد مادرش نرجس خاتون برد. حکیمه خاتون مى فرماید: روز هفتم به خدمت امام حسن  رفتم. حضرت فرمود: «پسر مرا بیاورید». آن وجود سراپا جود را نزد آن امام بردیم. حضرت زبان در دهان وى گذاشتند و فرمودند: «پسرم، سخن بگو». دیدم آنچه در روز اول از او شنیده بودم از اقرار به وحدانیت و ثنابر جد خود پیامبر  و امیر المؤمنین  و سایر ائمه  تا پدر بزرگوارش دوباره بیان کرد و این آیه را تلاوت فرمود: بسم االله الرحمن الرحیم و نرید أن نمن على الذین استضعفوا فى الارض و نجعلهم ائمه و نجعلهم الوارثین و نمکن لهم فى الارض و نرى فرعون و هامان و جنودهما منهم ما کانوا یحذرون. ⟦521⟧"],["p","سپس پدر بزرگوار شان فرمودند: بخوان آنچه را که خدا بر پیامران خود نازل فرمود. حضرت خواند صحف آدم را به لغت سریانى آغاز نمود، و بعد کتاب ادریس و نوح و صالح و صحف ابراهیم و تورات موسى و انجیل عیسى وزبور داود و فرقان محمد  را قرائت نمود. بعد از آن بیان قصص انبیأ و مرسلین را شروع نمود."],["p","حکیمه خاتون مى گوید: پس از چهل روز دیگر، دوباره خدمت فرزند برادرم امام عسکرى  رفتم و حضرت صاحب الزمان  را دیدم که راه مى رود. امام عسکرى  فرمود: اى عمه، مولود عزیز نزد خدا این است. گفتم: اى سید و مولاى من، نشو و نماى او را در چهل روز زیادتر از دیگران مى بینم. حضرت فرمودند: اى عمه، ما اوصیأ در یک روز نشو و نماى یک هفته دیگران را، و در یک جمعه نشو و نماى یک سال دیگران را مى نماییم. من برخاستم و سر آن طفل را بوسیده و به منزل مراجعه کردم. ⟦522⟧"],["h","القاب امام زمان "],["p","از القاب آن نور الهى « ⟦523⟧ حجه االله»، »حجه آل محمد»، »صاحب الزمان»یعنى فرمانرواى عصر خود، «مالک رقاب خلایق »یعنى امر امر او و نهى نهى او و حکم حکم او و فرمان فرمان اوست، «مهدى»که خلق به وسیله او هدایت مى یابند و به وجود مقدس او از جاده ضلالت به شاهراه هدایت رسیده رستگار مى شوند، «قائم»که حضرت صادق  فرمودند: «از این جهت که به حق قیام مى نماید او را قائم گویند»؛ «منتظر»که براى او غیبت طولانى است، و مخلصین او انتظار خروجش را مى کشند و شکاکین او را انکار مى کنند."],["h","اوصاف امام زمان "],["p","اوصاف ظاهرى آن حضرت ⟦524⟧ شباهتهاى زیادى به رسول گرامى اسلام  دارد. خطى از موى سبز رنگ مانند زمرد از گردن تا ناف مبارك او کشیده است. صورت مبارکش مانند ستاره اى درخشنده نورانى است. امیر المؤمنین  مى فرماید: «او جوانى است خوش روى و خوش موى و نور صورت مبارکش بر سیاهى محاسن انور و او غالب است». امام باقر  مى فرماید: «رنگ مبارکش مایل به سرخى است مانند گل سرخ شکفته و چشمانش گشاده و میان ابروهایش مرتفع و ما بین شانه هاى او باز است. گشاده جبین است و بینى او بلند و نازك و شکم مبارکش بر آمدگى دارد، و بیخ دندانهاى ثنایایش گشاده است."],["h","مادر امام زمان "],["p","والده حضرت صاحب الامر  حضرت نرجس خاتون است که نامها و القاب دیگر حضرت ملیکه، ریحانه، صیقل، سوسن است. در زیارت آن حضرت که تمامى عبارات آن دلالت واضحى بر علو منزلت آن بانو دارد توصیف به راضیه، مرضیه، صدیقه، تقیه، نقیه، زکیه شده است."],["p","بنابر نقلى جناب نرگس در سال 261ه -در سامرأ از دنیا رحلت کرد و در جوار امامین حضرت هادى و امام عسکرى  دفن شد. ⟦525⟧ بنابر نقلى دیگر در سال 260هه قبل از شهادت امام عسکرى  رحلت نمود، ⟦526⟧ زیرا هنگامى که امام  از وقایع بعد از شهادت خود نسبت به فرزند و عیالش خبر داد حضرت نرجس خاتون  از آن حضرت خواستند که دعا بفرمایند قبل از ایشان دنیا بروند. ⟦527⟧"],["p","حضرت حکیمه خاتون دختر حضرت جواد الائمه  است که توفیق رؤ یت و درك چهار امام معصوم  را داشته است. ⟦528⟧ ایشان در سال 274ه در سامرأ رحلت فرمودند. ⟦529⟧"],["p","ایشان محرم اسرار اهل بیت  بوده و کسى است که در ولادت حضرت صاحب الزمان  حاضر بوده و چندین بار خدمت آن حضرت مشرف شده است. بعد از وفات امام حسن عسکرى  یکى از سفرا بوده که به واسطه او مردم به حوائج خود نایل مى شدند. ⟦530⟧"],["h","ایام پس از ولادت امام زمان "],["p","پس از گذشت یک شب از ولادت امام عصر ، نسیم خادم خدمت آن حضرت رسید و عطسه کرد. امام  فرمود: یرحمک االله. سپس فرمود: «عطسه تا سه روز امان از مرگ است.» ⟦531⟧ این ماجرا در روز 25شعبان هم نقل شده است. ⟦532⟧"],["p","سه روز بعد از ولادت امام عصر ، حضرت امام حسن عسکرى  فرزند خود را به اصحاب خاص نمایاند و امامت او را تصدیق فرمودند. ⟦533⟧"],["h","غیبت صغرى"],["p","در غیبت صغرى چهار تن از بزرگان شیعه به ترتیب وکیل و سفیر و نایب خاص امام زمان  بودند، که خدمت آن حضرت مى رسیدند و وکالتشان مورد تأیید آن حضرت بود، و پاسخهاى امام  در حاشیه نامه ها توسط نواب به دست مردم مى رسید."],["p","البته غیر از این چهار نفر وکلاى دیگرى هم از طرف امام  در بلاد مختلف بودند که به وسیله همین چهار بزرگوار امور مردم را به عرض امام زمان  مى رساندند و از سوى امام  در امور آنها توقیع هایى صادر شده بود. ⟦534⟧ سفارت این چهار بزرگوار سفارت مطلق و تام بوده، ولى دیگران در موارد خاصى سفارت داشتند، مانند ابوالحسین محمد بن جعفر اسدى، احم بن اسحاق اشعرى، ابراهیم بن محمد همدانى، احمد بن حمزه بن الیسع. ⟦535⟧"],["p","نواب اربعه عبارتند از ابو عمرو عثمان بن سعید عمرى، ابوجعفر محمد بن عثمان بن سعید عمرى، ابوالقاسم حسین بن روح نوبختى، ابوالحسن على بن محمد سمرى."],["p","نائب اول عثمان بن سعید مورد اعتماد مردم و جلیل القدر و وکیل حضرت هادى و امام عسکرى  نیز بود. ⟦536⟧ او به امر امام  متصدى کفن و دفن امام عسکرى  گردید. ⟦537⟧"],["p","چون امام عسکرى  در محله عسکر سکونت داشتند و تماس با آن حضرت براى شیعیان مشکل بود. عثمان بن سعید چون روغن فروش بود، اموال را در ظرفهاى روغن مى ریخت و به خدمت امام  مى برد"],["p","⟦538⟧"],["p","احمد بن اسحاق قمى هنگامى که از امام هادى  پرسید: آقاى من، گاهى غایب و گاهى حاضرم. وقتى هم که حضور دارم همیشه نمى توانم خدمتتان برسم. سخن چه کسى را بپذیریم و فرمان چه شخصى را اطاعت کنم؟ حضرت فرمود: این ابو عمرو عثمان بن سعید عمرى مورد اطمینان و امین است، آنچه به شما بگوید از من مى گوید و آنچه به شما برساند از من مى رساند."],["p","احمد بن اسحاق مى گوید: پس از رحلت امام هادى  نزد امام عسکرى  رفته همان گفته را تکرار کردم. آن حضرت مانند پدر بزگروارشان فرمودند: ابو عمرو امین و مورد اطمینان امام گذشته و مورد اطمینان من در زندگى و پس از مرگ من است. آنچه به شما بگوید و آنچه به شما برساند از من مى رساند. ⟦539⟧"],["p","جناب عثمان بن سعید پس از امام عسکرى  به فرمان حضرت مهدى  به وکالت و نیابت ادامه داد، و شیعیان مسائل خود را نزد او مى بردند و پاسخ امام  توسط او به مردم مى رسید. ⟦540⟧"],["p","نائب دوم ابوجعفر محمد بن عثمان بود و او نیز همچون پدر از بزرگان شیعه و در تقوى و عدالت و بزرگوارى مورد اعتماد و احترام شیعیان بود، عثمان بن سعید پیش از وفات به فرمان امام عصر  فرزند خود ابوجعفر محمد بن عثمان را به جانشینى خود و نیابت امام (علیه السلام ) معرفى کرد. این در حالى بود که امام عسکرى  نسبت به او و پدرش اظهار اعتماد و اطمینان فرموده بود و شیعه بر عدالت و تقوى و اطاعت او اتفاق داشتند. ⟦541⟧"],["p","پس از درگذشت نائب اول جناب عثمان بن سعید، توقیعى از جانب امام زمان  در مورد وفات او و نیابت فرزندش محمد صادر شد که ترجمه قسمتى از آن چنین است: «انا الله و انا الیه راجعون، در برابر فرمان خدا تسلیم و به قضاى او راضى هستیم. پدرت سعادتمند زیست و پسندیده در گذشت. خداوند او را رحمت کند و به پیشوایان و سرورانش  ملحق سازد. از کمال سعادت پدرت بود که خداوند فرزندى چون تو را به او عنایت کرد که پس از او جانشینش گردى، و در امورش قائم مقام او باشى و برایش طلب رحمت و آمرزش نمایى.» ⟦542⟧"],["p","از محمد بن عثمان پرسیدند: صاحب الامر  را دیده اى؟ گفت: آرى و آخرین ملاقاتم با او کنار بیت االله الحرام بود که مى فرمود: اللهم أنجز لى ما و عدتنىو نیز او را در مستجار نزدیک رکن یمانى کعبه دیدم که مى گفت: اللهم انتقم لى من أعدائى. ⟦543⟧"],["p","این بزرگوار کتابهایى در فقه تألیف کرده که مشتمل است بر آنچه از امام عسکرى  و از پدر خود شنیده بود. ⟦544⟧"],["p","محمد بن عثمان براى خود قبرى ترتیب داده بود و آن را با ساج پوشانده بود و روى آن آیاتى از قرآن کریم و اسامى ائمه طهار  را نوشته بودم هر روز داخل آن مى شد و یک جزء قرآن قرائت مى کرد و بیرون مى آمد. ⟦545⟧ او پیش از مرگ از روز وفات خود خبر داد و در همان روز که خبر داده بود در گذشت. ⟦546⟧ همچنین پیش از رحلت به شیعیان خبر داد که امام  جناب ابوالقاسم حسین بن روح نوبختى را براى سفارت و ارتباط با خود انتخاب فرموده اند و او قائم مقام من است و به او مراجعه کنید. ⟦547⟧ او در سال 305ه رحلت فرمود. ⟦548⟧"],["p","نائب سم جناب ابوالقاسم حسین بن روح نوبختى است که نزد موافق و مخالف عظمت و بزرگى ویژه اى داشت، و به عقل و بینش و تقوى و فضیلت نزد عموم فرقه هاى مختلف مذهبى مشهور بود و در زمان نائب دوم از جانب او متصدى پاره اى از امور بود."],["p","با اینکه میان یاران نائب دوم، جعفر بن احمد بن متیل از همه به او نزدیکتر بود، و حتى در اواخر زندگى جناب محمد بن عثمان، غذاى منزل او را در منزل جعفر بن احمد بن متیل تهیه مى کردند، و در میان اصحاب احتمال نیابت و جانشینى جعفر بن احمد بیشتر بود، اما در آخرین ساعات زندگى جناب محمد بن عثمان که جعفر بن احمد بالاى سر او و حسین بن روح پایین پایش نشسته بود، به جعفر بن احمد رو کرد و فرمودن «مأمور شده ام که امور را به ابوالقاسم حسین بن روح واگذار نمایم». جعفر بن احمد از جا برخاست و دست حسین بن روح را گرفت و او را بالاى سر محمد بن عثمان نشاند و خود در پایین پاى او نشست. ⟦549⟧"],["p","در 6شوال سال 305ه اولین توقیع از ناحیه مقدسه امام عصر  براى او صادر شد که متن آن چنین بود: «ما او را مى شناسیم، خداوند تمامى خیر و رضاى خویش را به او بشناساند و به توفیق خود او را یارى نماید. از مکتوب او مطلع شدیم و نسبت به او وثوق و اطمینان داریم. او را نزد ما مکان و منزلتى است که خشنودش مى سازد. خداوند احسان خویش را به او بیفزاید که خدا ولى و توانا بر همه چیز است، و سپاس خداى را که شریکى ندارد و درود و سلام فراوان خداوند بر فرستاده او محمد و بر خاندان او صلوات االله علیه». از ابو سهل نوبختى صاحب تألیفات که از متکلمین بزرگ بغداد بود پرسیدند: براى چه جناب ابوالقاسم حسین بن روح به مقام نیابت نایل شده و شما نایل نشدید؟ گفت: ائمه  داناترند و آنچه برگزینند شایسته تر و مناسب تر است، ولى من فردى هستم که با خصم برخورد و مناظره مى کنم و اگر نائب امام  بود و مکان امام زمان  را مى دانستم چنانکه ابوالقاسم حسین بن روح به جهت نیابت مى داند و در گیر و دار بحث پیرامون مام  با مخالفان در تنگنا قرار مى گرفتم ممکن بود نتوانم خود را کنترل کنم و جاى آن حضرت را افشا نمایم؛ ولى ابوالقاسم اگر امام  در زیرا دامان او مخفى باشد و او را با آلات برنده تکه تکه نمایند دامان خود را از او بر نمى دارد و او را به دشمن نشان نخواهد داد. ⟦550⟧"],["p","جناب ابوالقاسم حسین بن روح حدود 21سال مقام نیابت داشت. او قبل از وفات امور نیابت را به امر امام  به ابو الحسن على بن محمد سمرى واگذاشت، و در ماه شعبان سال 326هجرى در گذشت. آرامگاه او در بغداد است. ⟦551⟧ نائب چهارم ابوالحسن سمرى است که حسب الامر حضرت صاحب الزمان  به جناب حسین بن روح، امر نیابت بعد از او به ابو الحسن سمرى واگذار شد. به فرموده بزرگان رجال، عظمت و جلالت قدر او محتاج به توصیف نیست. ابوالحسن سمرى روزى به جمعى از مشایخ که نزد او بودند فرمود: «خداوند به شما در مصیبت على بن بابویه قمى اجر عنایت فرماید. در این ساعت او از دنیا رفت». آنان ساعت و روز و ماه را یادداشت کردند، و 17یا 18روز بعد خبر رسید که در همان ساعت على بن بابویه قمى در گذشته است. ⟦552⟧"],["h","پایان غیبت صغرى"],["p","پیش از وفات على بن محمد سمرى گروهى از شیعیان نزد او گرد آمدند و پرسیدند: «پس از شما چه کسى جانشین شما خواهد بود»؟ پاسخ داد: من مأمور نشده ام که در این مورد به کسى وصیت کنم. ⟦553⟧ سپس توقیعى را که از سوى امام غایب  در این باره صادر شده بود به شیعیان نشان داد. آنان از روى توقیع استنساخ کردند که مضمون آن چنین بود: «بسم االله الرحمن الرحیم، اى على بن محمد سمرى، خداوند در مصیبت تو فراهم آور و به هیچکس وصیت مکن که پس از تو جانشین تو شود. غیبت کبرى واقع شد و ظهورى نخواهد بود تا آنگاه که خداى متعال فرمان دهد، که پس از مدت طولانى و قساوت دلها و پر شدن زمین از ستم است. به زودى افرادى نزد شیعیان نم مدهى مشاهده من مى شوند. آگاه باشید که هر کس پیش از خروج سفیانى و پیش از صیحه ⟦554⟧ چنین ادعایى نماید )یعنى ادعاى رؤ یت به عنوان سفارت و نیابت نماید( دروغگو و افترا زننده است و لا حول و لا قوه الا باالله العلى العظیم «. ⟦555⟧"],["p","روز ششم که مصادف با نیمه شعبان سال 329ه بود جناب ابو الحسن سمرى در گذشت، و در خیابان خلنجى کنار نهر ابو عتاب در بغداد دفن گردید. ⟦556⟧ مجلسى (رحمه االله) از احتجاج مرحوم شیخ طبرسى نقل مى فرماید: هیچیک از نائبان خاص امام عصر  جز با فرمان صریحى از جانب آن حضرت و تعیین و نصب و معرفى نایب قبلى به نیابت قیام نکرد. شیعه نیز گفتار هیچیک را نپذیرفت مگر بعد از بروز نشانه و معجزه اى به دست هر یک از آنان از طرف امام عصر  که بر راستى گفتار و درستى نیابتشان دلالت مى کرد. ⟦557⟧"],["h","وظایف زمان غیبت کبرى"],["p","شیعیان و دوستان آن حضرت در زمان غیبت وظایفى دارند از جمله:"],["p",".1قرائت دعاى ندبه در روزهاى جمعه، عید فطر، عید قربان، عید غدیر."],["p",".2زیارت آن حضرت در روز جمعه."],["p",".3براى ثبات و محکم ماندن اعتقادات خواندن این دعاى شریف: یا االله، یارحمن، یا رحیم، یا مقلب القلوب القلب، ثبت قلبى على دینک. ⟦558⟧"],["p",".4از جا برخاستن به احترام نام «قائم»آن بزرگوار."],["p",".5توسل به آن حضرت در مشکلات و گرفتارى ها."],["p",".6صدقه براى سلامتى و فرج وجود شریفش."],["p",".7قرائت این دعا که از خداوند مى خواهیم آن حضرت را به ما بشناساند: اللهم عرفنى نفسک فانک ان لم تعرفنى نفسک لم اعرف نبیک، اللهم عرفنى رسولک فانک ان لم تعرفنى رسولک لم اعرف حجتک، اللهم عرفنى حجتک فانک ان لم تعرفنى حجتک ظلت عن دینى. ⟦559⟧"],["p",".9شرکت در مجالس منسوب به آن حضرت، مخصوصا مجالس عزادارى جد بزرگوارش حضرت سید الشهدا ."],["p",".10هدیه اعمال صالحه براى آن حضرت، مانند زیارت قبور مطهر پدران بزرگوارش، قرائت قرآن و حج و عمره و طواف."],["p",".11توبه حقیقى از گناهان."],["p",".12متوجه کردن مردم به آن حضرت."],["t",2,"وفات على بن محمد سمرى نایب امام زمان "],["p","وفات شیخ جلیل نایب خاص امام عصر  على بن محمد سمرى در این روز بوده است که به معناى اتمام غیبت صغرى و شروع غیبت کبرى است، ⟦560⟧ چه اینکه حضرت صاحب الامر  به او امر فرموده بودند که وصى و جانشینى براى خود قرار مده که غیبت کبرى شروع شده است."]]},{"k":"day","key":18,"label":"","items":[["t",1,"وفات حسین بن روح نوبختى نایب امام زمان "],["p","در این روز به سال 326ه نایب سوم حضرت صاحب الامر عجل االله تعالى فرجه، جناب حسین بن روح نوبختى در بغداد به عالم بقا رحلت کرد و در همانجا دفن شد. ⟦561⟧"]]},{"k":"day","key":19,"label":"","items":[["t",1,"جنگ بنى المصطلق"],["p","در این روز در سال 6هه غزوه بنى المصطلق اتفاق افتاد. ⟦562⟧"],["p","حرکت براى این جنگ در دوم شعبان همین سال بود. تعداد مسلمانان 1000 نفر بودند که 30اسب داشتند، ولى کفار 700نفر بودند. یک نفر از مسلمانان در این جنگ شهید شد و از کفار 10نفر به قتل رسیدند. ⟦563⟧"],["p","در این جنگ غلبه و نصرت از آن مسلمین بود. مصطلق منزلى بن مکه و مدینه است که منسوب به مصطلق است. او اول کسى است که دین اسماعیل  را تغییر داد و قبیله خود را به پرستیدن هبل فرمان داد و آن را در کعبه نصب کرد."]]},{"k":"tail","key":"تتمه شعبان","label":null,"items":[["t",1,"مرگ حفصه"],["p","⟦564⟧"],["p","در ماه شعبان سال 45ه حفصه از دنیا رفت و مروان بر جنازه او نماز خواند. ⟦565⟧ حفصه دختر عمر بن خطاب ابتدا زوجه خنیس بن عبد االله بود. بعد از آنکه خنیس وفات کرد عمر او را به عقد پیامبر  در آورد. او با اخلاق و رفتار خود پیامبر  و اهل بیت  را مى آزرد، به حدى که پیامبر  او را طلاق داد و با اصرار بعضى رجوع فرمود. ⟦566⟧"],["p","در جنگ جمل خواست با عایشه حرکت کند. ولى برادرش عبد االله بن عمر مانع گردید. اما هنگامى که لشکر امیر المؤمنین  به منزل ذى قار رسیدند عایشه نامه اى به این مضمون براى حفصه نوشت: «خبر زیادى لشکر ما به على بن ابى طالب  رسیده است و او از ترس در ذى قار اقامت کرده است و از این جنگ جان سالم به در نخواهد برد. »..."],["p","چون نامه به دست حفصه رسید کنیزان و مغنیه ها را جمع کرد و آنان دایره ها مى نواختند و اشعارى مى خواندند که در آنها امیر المؤمنین (علیه السلام ) را به بدى ذکر مى کردند و زنهاى بنى امیه جمع شدند و شادى مى کردند."],["p","خبر به ام کلثوم  که رسید با عده اى زا بانوان به صورت ناشناس وارد مجلس شدند و ناگهان صورتها را باز کردند. حفصه خجالت کشید. ام کلثوم  آیه اى که مربوط به زنهاى حضرت نوح و لوط  بود که نافرمانى آن دو پیامبر را نمودند و درباره حفصه و عایشه نازل شده بود بر حفصه قرائت کرد ⟦567⟧ و فرمود: اگر تو و عایشه امروز براى خوارى پدر من امیر المؤمنین  به یکدیگر کمک مى کنید، این کار شما تازگى ندارد چرا که همین معامله را با جدم پیامبر  کردید."],["p","حفصه چون دید رسوا شده است نامه عایشه را پاره کرد و از ام کلثوم  خواست بیشتر از این او را رسوا نکند. ⟦568⟧"],["t",2,"جنگ پیامبر  با بنى سعد"],["p","در شعبان سال ششم هجرت پیامبر  حضرت امیر المؤمنین  را به همراه 100نفر براى مقابله با طائفه بنى سعد در اطراف مدینه فرستاد. بنى سعد با خبر شده فرار کردند و مسلمانان صد شتر و هزار گوسفند به غنیمت گرفتند. امیر المؤمنین  چند شتر براى پیامبر  جدا کرد و سایر غنایم را بین مسلمانان تقسیم فرمود و به مدینه بازگشتند. ⟦569⟧"],["t",3,"شهادت سعید بن جبیر"],["p","در این ماه در سال 95ه جناب سعید بن جبیر کوفى به دست حجاج بن یوسف ثقفى به شهادت رسید. ⟦570⟧"],["p","سعید مردى فقیه، زاهد و عابد بود که توفیق کسب علم از محضر مبارك حضرت زین العابدین  را یافته بود. او به خاطر اعتقاد خالص و محبت کاملى که به اهل بیت معصومین  داشت، نزد امام زین العابدین  از احترام خاصى برخوردار بود."],["p","هنگامى که حجاج خواست آن بزرگوار را شهید کند، دعا کرد که حجاج بعد از شهادت او قادر به قتل هیچکس نشود. خداوند دعاى او را مستجاب کرد و حجا 15تا 20روز بعد از شهادت سعید زنده بود و کسى را نکشت تا به مرض آکله به درك واصل شد."],["p","بعد از آنکه حجاج سر آن بزرگوار را جدا کرد، دو پاى مبارك او را نیز از ساق جدا کردند، در حالى که از سن مبارکش 57یا 79سال مى گذشت در شهر الحى در واسط عراق مدفون شد. قبر آن بزرگوار یکى از زیارتگاههاى محبین اهل بیت  است که داراى گنبد و صحنى بزرگ مشتمل بر چهار در است. ⟦571⟧"],["p","بعضى مرگ حجاج را 15روز ⟦572⟧ و بعضى 20روز و عده اى 40روز"],["p","⟦573⟧"],["p","بعد از شهادت جناب سعید بن جبیر نقل کرده اند، که اگر مرگ حجاج رد 13 ماه رمضان باشد، شهادت سعید به ترتیب در روزهاى 27یا 28یا 22یا 23و 2یا 3شعبان محتمل است، ولى قدر مسلم این است که شهادت سعید در شعبان بوده است."],["t",4,"مرگ مغیره بن شعبه"],["p","در ماه شعبان سال 50ه ⟦574⟧ مغیره بن شعبه در حالیکه از طرف معاویه حاکم کوفه بود، در سن 70سالگى به درك واصل شد ⟦575⟧ و زیاد بن ابیه به جاى او منصوب شد. مغیره بن شعبه در کوفه سب به امیر المؤمنین  مى نمود و خطبا را امر مى کرد که آن حضرت را لعن کنند و تا زمان فرا رسیدن مرگش این عمل را ترك نکرد. ⟦576⟧"],["p","مغیره از اصحاب صحیفه ملعونه و لیله عقبه بود که مى خواستند پیامبر  را به قتل برسانند، و همچنین از اصحاب سقیفه است. ⟦577⟧"],["p","او از کسانى بود که در آتش زدن در منزل امیر المؤمنین ، شکستن در، کتک زدن به مادر سادات حضرت صدیقه شهیده فاطمه الزهرا  و سقط جنین شریک بود. ⟦578⟧"],["p","زناى مغیره با ام جمیل در بصره شهرت خاص دارد و در کتب شیعه و سنى با مدارك مختلف ذکر شده است. ابن ابى الحدید مى گوید: مغیره زناکارترین مردم در جاهلیت و اسلام بود. ⟦579⟧ مغیره از کسانى بود که به دستور معاویه همراه با عمرو عاص و عروه بن زبیر روایاتى دروغین ساختند که مقتضاى آنها وجوب لعن و برائت از امیر المؤمنین  بود و براى این کار معاویه جوائز فوق العاده اى براى آنان مقرر کرد. ⟦580⟧"],["p","او در محضر امام حسن  جسارتها به پدر بزرگوارش نمود. ⟦581⟧ اما آن حضرت جوابهاى مناسبى به او دادند و در آخر فرمودند: «تو آن کسى هستى که در شهادت مادرم و برادرم محسن  شریک بودى. »..."]]}]},{"name":"رمضان المبارك","groups":[{"k":"intro","key":0,"label":null,"items":[["p","ماه مبارك رمضان ماه پر خاطره اى است. روزهاى 1، 3، 4، 6، 10، 12، 13، 14، 15، 16، 17، 19، 20، 21، 23، 24یاد آور لحظاتى حساس از تاریخ اسلام است. هم یادمانهاى خوش و هم روزهاى حزن انگیز در این ماه به چشم مى خورد."],["p","ولادت امام حسن مجتبى  و معراج پیامبر  دو خبر سرور آفرین در این ماه است. مرگ ابولهب، ابن ملجم، عایشه مروان، زیاد بن ابیه، حجاج ثقفى نیز روزهاى نابودى دشمنان اهل بیت  است. از سوى دیگر شهادت حضرت زهرا  بنابر قولى، ضربت خوردن و شهادت امیر المؤمنین ، وفات حضرت خدیجه  و حضرت نفسیه  و شهادت مختار روزهاى حزن آل محمد  است."],["p","جنگ بدر، طائف، تبوك و فتح مکه روزهاى تاریخ ساز اسلام است. عروج حضرت عیسى  به آسمان، نزول قرآن، مراسم عقد اخوت، دعاى باران توسط پیامبر  نیز وقایع مهم تاریخى هستند."],["p","بدعت نماز تراویح توسط عمر، ورود محمد بن ابى بکر به مصر، بیعت با امام مجتبى ، آمدن نامه هاى اهل کوفه براى امام حسین ، حرکت حضرت مسلم به سمت کوفه، ولایتعهدى امام رضا  و ضرب سکه به نام آن حضرت، هر یک یاد آور فرازهایى از برگهاى اسلام اند."]]},{"k":"day","key":1,"label":"","items":[["p","در شب اول ماه مبارك رمضان غسل و زیارت امام حسین  وارد شده است. ⟦582⟧"],["t",1,"ولایتعهدى امام رضا "],["p","در 7رجب سال 200مأمون عباسى نامه اى به امام رضا  نوشت، و آن بزرگوار را براى ولایت عهدى خویش به مرو فراخواند ⟦583⟧ در روز اول ماه رمضان سال 201ه مردم با حضرت رضا  به ولایتعهدى بیعت کردند، ⟦584⟧ و بعضى ششم این ماه نقل کرده اند."],["t",2,"مرگ مروان"],["p","در این روز در سال 65ه مروان بن حکم در سن 81سالگى در دمشق به درکات جحیم شتافت، و مدت خلافت او 9ماه بود. ⟦585⟧"],["p","مروان پسر حکم بن ابى العاص بود و به «وزغ بن وزغ»ملقب گردیده بود. او و پدرش مورد لعن پیامبر  واقع شدند، حتى عایشه به مروان گفت: شهادت مى دهم که پیامبر  پدرت را لعن کرد در حالیک تو در صلب او بودى."],["p","مروان در عداوت با خدا و پیامبر  و اهل بیت  خصوصا امیر المؤمنین  از زمان عثمان تا آخر ایام خود بسیار کوشید. بعد از آنکه عثمان او و پدرش حکم را از طائف بر خلاف امر پیامبر  به مدینه بازگردانید، خمس افریقیه را به مروان داد و فدك را هم به او واگذار کرد و او را وزیر و کاتب خود قرار داد."],["p","او در ایام خلافت عثمان فتنه ها بپا کرد. در جنگ جمل تیرى زد و طلحه را کشت و بعد از فتح هنگامى که اسیر شد حسنین  را شفیع قرار داد و امیر المؤمنین  او را رها کرد. به حضرت عرض کردند: از او بیعت بگیر. فرمود: همانا دست او دست یهودى است، چه اینکه یهود به مکر و حیله معروفند."],["p","بعد از آن که مروان به معاویه پیوست هرگاه حکومت شهرى به او داده مى شد، در ترویج سب امیر المؤمنین  مجد و مصر بود. او در مدینه هر جمعه بر منبر پیامبر  بالا مى رفت و در حضور مهاجرین و انصار امیر المؤمنین  را سب مى کرد. مروان بعد از هلاك شدن یزید به جاى وى نشست، و همسر او را به عقد خود در آورد و نه ماه خلافت کرد. همسر یزید زهرى در غذاى او ریخت که لال شد و آخر الآمر متکابر دهان او گذاشت، و باکنیزان روى او نشستند تا اینکه در اول ماه رمضان به درك واصل شد. ⟦586⟧"],["t",3,"جنگ تبوك"],["p","در اول ماه رمضان سال 9ه جنگ تبوك به وقوع پیوست ⟦587⟧ این جنگ را فاضحه نیز مى گویند، زیرا منافقین مدینه و کسانى که قصد کشتن پیامبر  را در عقبه داشتند رسوا و مفتضح شدند."],["p","به لشکرى که در این جنگ شرکت «جیش العسره»مى گویند، زیرا در سختى و زحمت فراوان، با اینکه ایام جمع آورى محصول بود به جنگ رفتند. حرکت لشکر در ماه رجب بود که 30هزار نفر حرکت کردند و فقط هزار نفر سواره بودند. پیامبر (صلى االله علیه و آله ) فرمودند: «کفش فراوان با خود بیاورید، »و در مسیر هر دو نفر به یک خرما سد جوع مى کردند و آب هم کمیاب بود. در این جنگ عده اى از زنها نیز همراه حضرت حرکت کردند."],["p","از سوى دیگر 82نفر از منافقین مدینه با عذر تراشى به جنگ نرفتند و در مدینه ماندند تا در غیاب آن حضرت خانه آن حضرت را غارت کنند و خانواده ایشان را از مدینه بیرون نمایند. پیامبر  امیر المؤمنین  را به جاى خود در مدینه خلیفه قرار داد و منافقین کلماتى گفتند که خاطر مبارك امیر المؤمنین  را آزردند. پیامبر  به آن حضرت فرمود: أما ترضى أن تکون منى بمنزله هارون من موسى الا أنه لا نبى بعدى...؟"],["p","در بازگشت از تبوك چهل نفر از منافقین که همراه حضرت بودند، تصمیم گرفتند وقتى شتر حضرت بالاى گردنه مى رسد کدوها را پر از ریگ نمایند و به زیر دست و پاى شتر حضرت رها کنند تا شتر رم کند و پیامبر  از شتر افتاده و به قتل برسد. هنگام اجراى توطئه شتر حضرت قدم از قدم برنداشت و مکر منافقین شکست خورد و خداوند وجود مقدس پیامبر  را حفظ کرد. ⟦588⟧"],["p","از سوى دیگر منافقینى که در مدینه مانده بودند قصد جان امیر المؤمنین  را نمودند و حفره اى طولانى در مسیر راه مدینه حفر کردند و روى آن را با حصیر پوشاندند تا هنگامى که امیر المؤمنین  به استقبال پیامبر  مى آید هنگام مراجعت میان آن حفره بیفتد و آنان بر سرش بریزند و او را به قتل برسانند. ولى هنگام مراجعت اسب آن حضرت از روى حصیر و گودال عبور ننمود و بار دیگر حیله منافقین باطل گردید. ⟦589⟧"],["p","در تبوك جنگى صورت نگرفت و آن حضرت بالشکر به مدینه بازگشتند. ⟦590⟧ وقوع این جنگ در ماه رجب هم نقل شده است. ⟦591⟧"],["t",4,"وفات حضرت نفیسه "],["p","در این روز در سال 208ه زاهده عابده حضرت نفیسه خاتون  دختر حسن بن زید بن حسن بن على بن ابى طالب  در مصر وفات کرد. ⟦592⟧ شوهر آن حضرت اسحاق مؤ تمن پسر حضرت صادق  بوده، و از طرف مادر منتسب به آقا قمر بنى هاشم  است. ⟦593⟧"],["p","حضرت نفیسه  براى خود قبرى کنده بود و پیوسته در آن قبر نماز مى خواند و ختم قرآن مى نمود."],["p","آن حضرت در اول ماه رجب بیمار شد، و نامه اى به شوهرش که در مدینه بود نوشت و او را از احوال خود با خبر کرد. در شب اول ماه رمضان بیمارى شدت پیدا کرد و فرداى آن روز در حالتى که روزه بود طبیب آوردند و او امر به افطار کرد. آن حضرت فرمود: «واعجبا! سى سال است از خداوند مسئلت دارم با حالت روزه از دنیا بروم، و اکنون که روزه هستم افطار کنم»؟ پس خواندن سوره انعام را شروع کرد، و چون به آیه مبارکه لهم دار السلام عند ربهمرسید وفات کرد."],["p","شوهر آن حضرت زمانى رسید که ایشان وفات کرده بود. او مى خواست آن حضرت را به مدینه ببرد و در بقیع نزد اجداد طاهرینش دفن کند، ولى مردم مصر با التماس و در خواست او را نگه داشتند. اسحاق مؤ تمن پیامبر صلىا الله عليه وآله را در خواب دید که فرمودند: «با اهل مصر در این ماجرا مخافت نکنى، که به خاطر نفسیه خداوند رحمت و برکاتش را نازل مى کند». جناب اسحاق بدن آن حضرت را در محل فعلى دفن کردند و معروف است که دعا کنار قبر آن حضرت مستجاب است. ⟦594⟧"]]},{"k":"day","key":3,"label":"","items":[["t",1,"شهادت حضرت زهرا "],["p","به قولى شهادت حضرت صدیقه طاهره زهراى مرضیه  در این روز است. ⟦595⟧"]]},{"k":"day","key":4,"label":"","items":[["t",1,"مرگ زیاد بن ابیه"],["p","زیاد بن ابیه در سال 53ه در کوفه به هلاکت رسید. ⟦596⟧ او مشهور به زیاد بن ابیه، زیاد بن امه، زیاد بن عبید، و زیاد بن سمیه است؛ و چون پدر زیاد از کثرت معلوم نبود به او زیاد بن ابیه مى گفتند."],["p","هنگامى که به معاویه پیوست به او زیاد بن ابى سفیان و برادر معاویه شد و زناى مادر خود را قبول کرد. سمیه کنیز حارث بن کلده طبیب بود. حارث او را به چراندن گوسفندان وادار کرده بود ولى طبع زشت و شهوانى سمیه آنقدر در صحرا ننگ به بار آورد که حارث او را از خود راند. از آن پس سمیه اسما خود را به عبید چوپان ثقفى چسباند و رسما جزء فواحش طائف در آمد و حیثیت خاندان عبید را هم لکه دار کرد."],["p","برادرى او با معاویه یکى از راههایى بود که معاویه براى جلب زیاد به طرف خود به کار گرفت. او مجلسى ترتیب داد و از عده اى به عنوان شاهد در آنجا استفاده کرد که از جمله ابو مریم مشروب فروش طائف بود. او برخاست و به زیاد گفت: شبى ابوسفیان به طائف آمد و از من فاحشه اى خواست. در آن شب کسى جز سمیه نبود. صبر کردیم تا رفت و آمدها کم شد. سمیه را براى او فرستادم. زیاد زناى مادر خود را قبول کرد و برادر معاویه شد! معاویه هم براى باوراندن این نسبت به و خواهرش را به خانه او فرستاد و دستور داد چادر از سر بر دارد چرا که محرم اوست. ⟦597⟧"],["p","زیاد بعد از برادرى با معاویه برائت از حضرت امیر المؤمنین  و قتل شیعیان على بن ابى طالب  و غارت اموال آنان را شروع کرد. دست بریدن، شکم پاره کردن، با دار آویختن، زنده به گور کردن، میل سرخ شده به چشمان شیعیان کشیدن، فرزندان را سر بریدن، خانه خراب کردن و آتش زدن از جمله کارهاى او بود. عبد الرحمن بن حسان را به جرم محبت على بن ابى طالب  زنده در گور کرد. ⟦598⟧"],["p","در بصره و کوفه سیزده هزار نفر را به جرم شیعه بودن یا به احتمال شیعه بودن کشت، و بعد به معاویه نوشت: من تا به این حد خواسته تو را انجام دادم و این کارها با دست چپم بود. اگر حکومت حجاز به من واگذار شود با دست راستم که بیکار است همین عمل را انجم مى دهم، و تصمیم دارم از مردم عراق در مسجد بخواهم که برائت از على  و مدح خاندان امیه را علنى نمایند. هر کس قبول نکند او را بکشم و خانه او را خراب کنم، چون این خبر منتشر شد، امام حسن  و شیعیان نفرین کردند و بعضى امیر المؤمنین  را در خواب دیدند که او را نفرین کرد، و آن ملعون قبل از عملى کردن تصمیمش به مرض طاعون مبتلا شد و به درکات جحیم واصل گردید. ⟦599⟧"]]},{"k":"day","key":6,"label":"","items":[["t",1,"ضرب سکه به نام امام رضا "],["p","در این روز در سال 201ه سکه طلا به نام مبارك حضرت رضا  زدند. بنابر قولى این روز روز ولایت عهدى اجبارى آن حضرت بوده است، ⟦600⟧ و مردم با آن حضرت به ولایت عهدى بیعت نمودند. ⟦601⟧"]]},{"k":"day","key":10,"label":"","items":[["t",1,"آمدن نامه هاى اهل کوفه براى امام حسین "],["p","در سال 60ه جمعى از کوفیان نامه هاى مردم کوفه را براى امام حسین  آوردند. ⟦602⟧ که از جمله نام سلیمان بن صرد و مسیب بن نجبه و رفاعه بن شداد بجلى و حبیب بن مظاهر و جمعى از شیعیان آن حضرت در آنها بود، که توسط عبد االله بن مسمع همدانى و عبد االله بن وال خدمت امام  آورده شد."],["t",2,"وفات حضرت خدیجه "],["p","در این رز حضرت خدیجه کبرى  از دنیا رحلت فرمودند. ⟦603⟧ این قول بنابر نقل 45روز بعد از رحلت جناب ابوطالب  است. ⟦604⟧ اقوال دیگر در رحلت آن حضرت چنین است 23: رجب 27، رجب، آخر رجب، اول ماه رمضان 12، ماه رمضان. آن حضرت بعد از حضرت ابوطالب  به سه روز فاصله و به قولى یک ماه و به قولى 45روز و به قولى 50روز وفات کرده است. ⟦605⟧"],["p","آن حضرت نخستین همسر پیامبر  بود، و تا خدیجه  زنده بود نبى گرامى اسلام  همسرى اختیار نفرمود. سبقت به اسلام و خدمات او به پیامبر  زیاده از آن است که ذکر شود. در فضیلت آن حضرت همین بس که والده مکرمه حضرت صدیقه طاهره  است، و همه ذرارى پیامبر  به ایشان منتهى مى شوند. ⟦606⟧"],["p","آن حضرت هنگام رحلت چند وصیت به پیامبر  نمودند، و با آن همه فداکارى و انفاق مال، به پیامبر  عرض کردند: «یا رسول االله، مرا ببخشید که در حق شما کوتاهى کردم». پیامبر : «حاشا و کلا! من از شما تقصیرى ندیدم، بلکه منتهاى سعى و کوشش خود را در حق من نمودى. شما در خانه من زحمات زیادى را متحمل شدى. اموالت را در راه خدا بذل و بخشش نمودى». آنگاه خدیجه  عرض کرد: یا رسول االله، شما را وصیت مى کنم به این دختر و به حضرت فاطمه  اشاره نمود این دختر بعد از من یتیم و غریب است. کسى از زنهاى قریش او را اذیت نکند. کسى به صورت او لطمه اى نزند، به روى او داد نزند و مکروهى نبیند. ⟦607⟧"],["p","آن حضرت اولین زنى است که پیامبر  را تصدیق نمود، و اول زنى است که در مکه با رسول خدا  نماز جماعت خواند، و اول زنى است که ایمان خود را در مکه در میان مشرکین اظهار نمود، و اول زنى است که در مقابل دشمن از رسول خدا  دفاع نمود و تمام اموال خود را به پیامبر  بخشید، و اول زنى است که ایمانش با قبول ولایت امیر المؤمنین  به درجه کمال رسید."],["p","روزى پیامبر  خدیجه  را خواست و در کنار خود نشانید و فرمود: این جبرئیل است و مى گوید: براى اسلام شروطى است که عبارتند از: اقرار به یگانگى خداوند متعال، اقرار به رسالت رسولان، اقرار به معاد و اصول این شریعت و احکام آن، اطاعت از اولى الامر و ائمه طاهرین از فرزندان او یکى بعد از دیگرى با برائت از دشمنان ایشان."],["p","خدیجه  به هه آنها اقرار نمود و ائمه طاهرین به خصوص امیر المؤمنین  را تصدیق کرد. پیامبر  فرمود: هو مولاك و مولى المؤمنین و امامهم بعدى: یعنى «على مولاى تو و مولاى مؤمنان بعد از من و امام ایشان است». آنگاه از خدیجه  در قبول ولایت امیر المومنین  عهد مؤ کد گرفت. سپس رسول خدا  یک یک از اصول و فروع دین حتى آداب وضو و نماز و روزه و حج و جهاد و صله رحم و واجبات و محرمات را بیان فرمود."],["p","سپس پیامبر  دست خود را بالاى امیر المؤمنین نهاد و خدیجه  دست خود را بالاى دست رسول خدا  و به این ترتیب با امیر المؤمنین  بیعت نمود. ⟦608⟧"]]},{"k":"day","key":12,"label":"","items":[["t",1,"مراسم عقد اخوت"],["p","در این روز در سال اول هجرت رسول گرامى اسلام  بین اصحاب خود عقد اخوت بست و امیر المؤمنین  را برادر خود گردانید. ⟦609⟧"]]},{"k":"day","key":13,"label":"","items":[["t",1,"مرگ حجاج ثقفى"],["p","در سال 95ه در چنین روزى ظالم سفاك پلید حجاج بن یوسف ثقفى به هلاکت رسید. او در زمان ولید بن عبد الملک در شهر واسط که خودش بنا کرده بود با مرض آکله در شکمش به درك واصل شد. ⟦610⟧ اقوال دیگر در روز مرگ او 21، 23، 25، 27ماه رمضان است."],["p","مادر او قارحه نامى بود که قبل از همسرى با یوسف بن عقیل پدر ظاهرى حجاج، در منزل حارث بن کلده طبیب بود. هنگامى که حجاج به دنیا آمد سوراخ مقصد نداشت، طبیب براى او سوراخ قرار داد. همچنین او شیر نمى خورد تا اینکه بز سیاهى کشتند و از خونش بر پستان مادر و به صورت حجاج مالیدند و او از روز چهارم پستان قبول کرد. به این سبب حجاج خونخوار شد و مى گفت: بیشترین لذت من در ریختن خون است. این صفت از کسى که مدت حمل او دو سال و نیم بوده و بیش از دو سال و نیم پس از مرگ پدرش به دنیا آمده، بعید نیست!! ⟦611⟧"],["p","تعداد کشته شدگان به دست او را بجز جنگها، یکصد و بیست هزار نفر نوشته اند. هنگامى که هلاك شد، در زندان او پنجاه هزار مرد و سى هزار زن بود که 16هزار از آنها برهنه و عریان بودند، و قاعده آن ملعون این بود که زن و مرد و اطفال را با هم زندانى مى کرد، زنان او سقف نداشت."],["p","عده زیادى از دوستان و شیعیان امیر المؤمنین  را شهید کرد، از جمله کمیل بن زیاد نخعى، ⟦612⟧ قنبر غلام امیر المؤمنن ، ⟦613⟧ عبد الحرمن بن ابى لیلى انصارى، که آن قدر او را تازیانه زد که امیر المؤمنین  را سب کند و او مناقب آن حضرت را مى گفت، تا حجاج دستور داد او را شهید کردند. دست و پاى یکى از حواریین امام زنى العابدین  به نام یحیى بن ام طویل را برید تا شهید شد. همچنین سعید بن جبیر را به شهادت رسانید که 15روز بعد از قتل او حجاج به درك واصل شد."],["p","حجاج به مرض آکله مبتلا شد، و طبیب تکه گوشتى را به نخى بست تا آن ملعون بلعید. طبیب آخر نخ را نگه داشت، و بعد از لحظه اى نخ را کشید و دید چیزى نمانده است، و معلوم شد که به زودى جا با مالک جهنم خواهد سپرد. ⟦614⟧ قبر او را در شهر واسط مخفى کردند و آب روى آن رها کردن ولى در زمان سفاح قبر او را پیدا کردند، آنچه مانده بود سوزانده و بر باد دادند. ⟦615⟧ او بیست سال در عراق حکومت کرد، و عمر نحسش 53سال بود. ⟦616⟧"]]},{"k":"day","key":14,"label":"","items":[["t",1,"شهادت مختار"],["p","در سال 67هه در چنین روزى مختار بن ابى عبیده ثقفى به شهادت رسید، و مزار او کنار مرقد حضرت مسلم  در انتها مسجد کوفه است. ⟦617⟧"],["p","مصعب بعد از به شهادت رساندن مختار، دستور داد همسر او را دستگیر کنند. او زنى مؤمنه به نام عمره دختر نعمان بن بشیر انصارى بود. مصعب گفت: برائت بجوى از شوهرت. او گفت: چگونه برائت بجویم از کسى که روزهاى روزه و شبها به نماز مشغول بود، و خون خود را براى خدا و پیامبر  نثار کرد و خونخواهى فرزند پیامبر  نمود؟ مصعب در حالتى که شمشیرش را از غلاف بیرون کشیده بود، گفت: پس تو را به شوهرت ملحق مى کنم. همسر مختار جواب داد: پس از این مرگ بهشت است و به خدا قسم هیچ چیزى را بر محبتم به على بن ابى طالب  ترجیح نمى دهم."],["p","در گرماى هوا در صحرایى بین حیره و کوفه دست و پاى او را بستند و بعد گردن او را زدند و سر از بدنش جدا کردند. این زن مؤمنه اولین زن شهیدى است که در محبت امیر المؤمنین  با شکنجه کشته شد. ⟦618⟧"]]},{"k":"day","key":15,"label":"","items":[["t",1,"ولادت امام حسن مجتبى "],["p","شب نیمه ماه رمضان سال سوم ه دومنین امام شیعیان حضرت ابو محمد حسن بن على بن ابى طالب  در شهر مدینه به دنیا آمد. ⟦619⟧"],["p","القاب آن حضرت: سید، سبط، امنى، حجت، بر، نقى، زکى، مجتبى، زاهد."],["p","رنگ مبارکش سرخ و سفید، دیدگان مبارکش گشاده و چشمانش مشکى بود. گونه مبارکش هموار و محاسنش انبوه و موى سرش مجعد بود. گردن مبارك در نور و سفا ماننده نقره صیقل زده، میانه بالا و شانه هایى گشاده داشت و از همه مردم خوشروتر بود. خضاب بسیار مى کرد و بدن شریفش در نهایت لطافت بود. ⟦620⟧"],["p","در روز هفتم ولادت آن حضرت، مادرش فاطمه زهرا  آن مولود مبارك را در پارچه حریرى که جبرئیل  آن را براى پیامبر  از بهشت آورده بود، پیچید و خدمت رسول گرامى اسلام  آورد، و آن حضرت نام مبارکش را حسن نهاد و گوسفندى براى حضرتش عقیقه نمود. ⟦621⟧"],["t",2,"حرکت حضرت مسلم  به سمت کوفه"],["p","در این روز در سال 60ه حضرت ابا عبد االله  جناب مسلم بن عقیل  را به کوفه روانه کرد. همراه او پاسخ نامه هاى کوفیان را داده بود که مضمون آن چنین بود: «به سوى شما برادر و پسر عمویم، موثق اهل بیت خویش، مسلم بن عقیل را فرستادم. اگر او بنویسد براى من که رأى دانایان و بزرگان شما متفق شده بر آنچه در نامه ها درج کرده اید، به زودى به سوى شما خواهم آمد، انشأ االله.» ⟦622⟧"]]},{"k":"day","key":16,"label":"","items":[["t",1,"ورود محمد بن ابى بکر به مصر"],["p","در این روز در سال 38 37ه جناب محمد بن ابى بکر به عنوان استاندار از طرف امیر المؤمنین  وارد مصر شد. ⟦623⟧"]]},{"k":"day","key":17,"label":"","items":[["t",1,"معراج پیامبر"],["p","معرج پیامبر (صلى االله وعلیه و آله) پنج سال بعد از بعثت در چنین روزى واقع شده، ⟦624⟧ و آیه سبحان الذى اسرى بعبده لیلا من المسجد الحرام الى المسجد القصى، ⟦625⟧... در این باره نازل شده است. معراج پیامبر  در 21ماه رمضان نیز نقل شده است. ⟦626⟧"],["p","معراج از جمله ضروریات اسلام است، ⟦627⟧ و از آیات کریمه و احادیث متواتره ثابت شده است که خداوند متعال حضرت رسول  را در یک شب از مکه معظمه تا مسجد الاقصى و از آنجا به آسمانها تا سدره المنتهى و عرض اعلى برد، و عجایب آفرینش آسمانها را به آن حضرت نمایاند و رازهاى نهانى و معارف نامتناهى را به آن حضرت القا فرمود و آن حضرت در بیت المعمور تحت عرش به عبادت حق تعالى قیام فرمود و با انبیأ  ملاقات نمود و داخل بهشت شد و منازل اهل بهشت و احوال کسانى که در عذاب بودند را مشاهده فرمود."],["p","احادیث متواتر دلالت دارد که عروج آن حضرت به بدن بوده نه به روح، و در بیدارى بوده نه در خواب. ⟦628⟧"],["p","اقوال دیگر در تعیین روز معراج چنین است 17: ماه رمضان سال 12قبل از هجرت 17، ربیع الاول قبل از هجرت 17، رجب قبل از هجرت 17ماه رمضان 5سال قبل از بعثت 27، ماه رمضان 21، ماه رمضان"],["p","درباره مکانى که آغاز حرکت پیامبر  به سوى معراج بوده نیز چند قول است: از منزل خدیجه ، از منزل ام هانى خواهر امیر المؤمنین ، از شعب ابى طالب . ⟦629⟧"],["p","امام صادق  فرمودند: حقتعالى حضرت رسول  را صد و بیست و چهار مرتبه به آسمان برد، و در هر مرتبه به آن حضرت درباره ولایت و امامت امیر المؤمنین (علیه السلام ) و دیگر ائمه طاهرین  زیاده از سایر فرایض تأکید و توصیه نمود. ⟦630⟧"],["t",2,"جنگ بدر"],["p","در روز جمعه در سال دوم هجرت جنگ بدر کبرى به وقوع پیوست 18 ⟦631⟧ یا 19این ماه هم ذکر شده است."],["p","تعداد مسلمانان 313نفر و تعداد شهداى آنان 9تا 14نفر، و تعداد کفار 950 نفر بود. مقتولین کفار 70نفر بودند و 70نفر را هم مسلمانان اسیر گرفتند35. نفر از 70نفر کشته هاى کفار به دست امیر المؤمنین  به قتل رسیدند. ⟦632⟧ در این جنگ ابوجهل نیز کشته شد. ⟦633⟧ ابوجهل هشام بن مغیره مخزومى از دشمنان سر سخت پیامبر  بود. او با اینکه نامش هشام بود ولى از فرط بدجنسى و زشت سیرتى به أبى جهل مکنى شد. ابوجهل کسى بود که در مکه آزار و اذیت بسیار به رسول اکرم  نمود. بچه دان شتر بر سر مبارك حضرت ریخت. خاکستر و خاك بر سر مبارك حضرت ریخت. سنگ به دندان مبارکش زد، نسبت کذب و جنون به آنان حضرت داد. مادر عمار یاسر جناب سمیه را بعد از شکنجه بسیار با نیزه اى که به ران او زد شهید کرد."],["p","در جنگ بدر دو برادر انصارى (معاذ و معوذ) به خاطر سابقه اى که از او در اذیت پیامبر  شنیده بودند تصمیم به کشتن او گرفتند. به هر صورت او را ضربه هایى زدند و یکى از دو برادر دستش قطع شد و به پوست آویزان گردید، ولى چون دید دستش مزاحم جنگ با ابوجهل و هواداران اوست، زیر پایش گذاشت و دفعتا آن را از بدنش جداکرد، و سپس ابوجهل را نقش زمین کردند. بعد از جنگ، پیامبر  فرمود: کسى خبر از ابوجهل بیاورد. عبد االله بن مسعود رفت و پا روى سینه او گذاشت. ابوجهل به هوش آمد و گفت: بر جاى بلندى پاى گذاشته اى، کاش قاتل من دهقان نبود (که کنایه اى به انصار بود). عبد االله بن مسعود سر او را از بدن جداکرد و نزد پیامبر  آورد و جلوى پاى آن حضرت انداخت. پیامبر  شکر الهى بجا آورد، ⟦634⟧ و خداوند نصرت خود را بر پیامبر  نازل نمود، و آن حضرت فرمود: امروز روز عید است و باید شکر خدا را بر نعمتى که به اهل ایمان عطا فرموده به جاى آورد. ⟦635⟧"],["t",3,"قتل عایشه"],["p","در شب 17ماه رمضان در سال 58ه در مدینه، عایشه دختر ابوبکر به دست معاویه کشته شد، و به سزاى اعمالش رسید. ⟦636⟧ دو قول دیگر در این باره 29 رجب و آخر ذى الحجه است."],["p","پیامبر  دوست داشت تا زنده است مرگ و دفن عایشه را ببیند. ⟦637⟧ ابن ابى الحدید مى گوید: اگر خلیفه دوم به جاى على  بود هر آینه عایشه را قطعه قطعه مى کرد. ⟦638⟧"],["p","معاویه چون خواست براى پسرش یزید از مردم بیعت بگیرد، عایشه انکار آن کرد و معاویه را تهدید کرد و گفت: برادرم محمد را کشتى، و براى یزید بیعت مى گیرى؟ معاویه ترسید که مبادا او ایجاد فتنه کند. لذا در خانه خود چاهى کند و آن را پر از آهک کرد و فرش قیمتى بر روى آن پهن نمود و عایشه را وقت نماز عشا به خانه خود خواندم وقتى عایشه وارد شد، معاویه او را به نشستن بر آن تخت تعارف کرد. همین که روى آنشست، فرو رفت و به چاه افتاد و هلاك شد. معاویه در چاه چندین نیزه مسموم تعبیه کرده بود و هنگامى که عایشه در چاه افتاد فورا کار او ساخته شد."],["p","عایشه در زمان حیات پیامبر  با آن حضرت رفتار نامناسبى داشت؟ با امیر المؤمنین  و حضرت صدیقه  و همسران پیامبر  رفتارهاى زشت و کینه توزانه اى روا داشت؟ واقعه جمل و کشته شدن حدود بیست هزار نفر از مسلمین به خاطر فتنه او از کارهاى معروف اوست. ⟦639⟧"],["p","وقتى حضرت زهرا  به شهادت رسید، همسران رسول خدا  براى سر سلامتى امیر المؤمنین آمدند جز عایشه که اظهار مریضى کرد و سخنى گفت که دلالت بر خوشحالى او داشت. ⟦640⟧"],["p","از مشخص ترین نشانه هاى بغض و کینه او نسبت به امیر المؤمنین  این بود که غلامش را «عبد الرحمن»نام نهاد و گفت: این نام گذارى را به خاطر محبتم به قاتل على بن ابى طالب یعنى عبد الرحمن بن ملجم انجامد دادم. ⟦641⟧"]]},{"k":"day","key":19,"label":"","items":[["t",1,"ضرب خوردن امیر المؤمنین "],["p","در 19ماه رمضان سال 40ه در نماز صبح در مسجد کوفه با شمشیرى مسموم به دست ناپاك ابن ملجم منافق بر فرق مبارك امیر المؤمنین  ضربت وارد شد."],["p","در 13ماه رمضان سال 40ه حضرت مولى الموحدین على بن ابى طالب امیر المؤمنین  بعد از فارق شدن از جنگ نهروان از شهادت خود خبر دادند. ⟦642⟧ در آن روز حضرت بر فراز منبر بعد از بیان کلماتى درربار در حقایق اسلام، در آخر بیانات شریف خود، به فرزندشان امام حسن مجتبى  فرمودند: تا امروز چند روز از ماه مبارك رمضان مى گذرد؟ امام مجتبى  فرمود 13: روز گذشته است. از امام حسین  پرسیدند: چند روز باقى مانده است؟ امام حسین  فرمود 17: روز باقى مانده است. در این هنگام امیر المؤمنین  دست به محاسن مبارك گرفتند و فرمودند: نزدیک است این موى من به خون سرم خضاب شود."],["p","در شب 16ماه رمضان سال 40ه امیر المؤمنین  در خواب پیامبر  را دیدند، و آن حضرت به نزدیک شدن ملاقاتشان در بهشت به امیر المؤمنین  بشارت دادند، امیر المؤمنین  به دخترشان ام کلثوم  خبر دادند. ⟦643⟧ در شب نوزدهم در شب نوزدهم امیر المؤمنین  روزه را در منزل ام کلثوم  افطار نمودند. ⟦644⟧"],["p","در شب 19ماه رمضان سال 40ه وردان و شبیب که با ابن ملجم در شهادت امیر المؤمنین  همراه بودند، در حین درگیرى کشته شدند. ⟦645⟧"],["p","در سال چهلم گروهى از خوارج در مکه جمع شدند و بر کشتگان نهروان گریستند. سه نفر از آنان با هم پیمان بستند که در یک شب امیر المؤمنین  و عمرو عاص و معاویه را بکشند."],["p","ابن ملجم کشتن امیر المؤمنین  را بر عهده گرفت و وارد کوفه شد و با کمک قطام بنت اخضر که ابن ملجم قصد ازدواج با او را داشت، و با همدستى شبیب بن بجره و وردان بن مجاله تصمیم خود را عملى کرد."],["p","در صبح روز نوزدهم بعد از اذان صبح، امیر المؤمنین  وارد مسجد شد و صداى نازنین ایشان به یا ایها الناس، الصلاة بلند شد."],["p","سپس آن حضرت مشغول نماز شد. هنگامى که در رکعت اول سر از سجده برداشت شبیب بر آن حضرت حمله ور شد، ولى شمشیرش خطا کرد. بلافاصله ابن ملجم لعنه االله حمله کرد و شمشیر او فرق مبارك آن حضرت را شکافت و محاسن شریفش له خون فرق مبارکش خضاب شد، و صداى مبارکش بلند شد: بسم االله و باالله و على مله رسول االله، فزت و رب الکعبه."],["p","صداى جبرئیل بلند شد: تهدمت واالله ارکان الهدى و انطمست اعلام التقى و انفصمت العروه الوثقى، قتل ابن عم المصطفى، قتل الوصى المجتبى، قتل على المرتضى، قتل اشقى الاشقیأ."]]},{"k":"day","key":20,"label":"","items":[["t",1,"فتح مکه"],["p","در سال 8ه فتح مکه واقع شد. در این فتح بزرگ تعداد مسلمانان 12هزار نفر، و شهدا 2نفر بودند. علت شهادت آن دو این بود که همراه لشکر نبودند و از آخر مکه وارد شده بودند، و لذا مورد هجوم قرار گرفته شهید شدند. ⟦646⟧"],["p","در این روز امیر المؤمنین  به امر مبارك خاتم الانبیأ ، براى شکستن بتهایى که در کعبه بود، پاى مبارك خود را بر کتف شریفش اشرف مخلوقات نهاد. ⟦647⟧"],["p","مجلسى (رحمه االله) از تاریخ طبرى نقل مى فرماید: هنگامى که پیامبر  نظر مبارکش بر این قرار گرفت که به طرف مکه حرکت کندت عمر را طلبید و به او فرمود: به مکه برو و اشراف قریش را از حال ما با خبر کن. عمر گفت: من بر جانم از اشراف قیش مى ترسم! ⟦648⟧"],["p","هنگامى که مسلمانان وارد مکه شدند شعار مى دادند: الیوم یوم الملحمه: «امروز روز در هم کوبیدن است». پیامبر  فرمودند: شعار را عوض کنید و بگویید: الیوم یوم المرحمه: »امروز روز رحمت است»."],["p","بعد فرمود: ابوسفیان و خانه اش در امانند، و هر کس داخل خانه او رفت در امان است. همچنین فرمودند: همه در امانند جز یک نفر به نام «هبار بن اسود»و بعضى معاویه را هم ذکر کرده اند. ⟦649⟧ حضرت فرمود: «اگر هبار چسبیده به پرده کعبه هم بود او را بکشید»؟!"],["p","علت این بر خورد شدید با هبار آن بود که در یکى از جنگهاى مسلمین با کفار قریش عده اى اسیر از کفار گرفتند و داخل اسرا داماد بزرگ پیامبر  شوهر زینب دخترشان بود. حضرت فرمودند: هر کس فدیه بفرستد اسیر او را آزاد مى کنیم. بین آنچه از مکه به عنوان فدیه فرستاده بودند گردنبند حضرت خدیجه  به چشم مى خورد که به دخترش زینب داده بود. هنگامى که پیامبر  آن گردنبند را دیدند به یاد جناب خدیجه  افتادند و گریستند. آنگاه از مسلمین خواستند آن فدیه را که یادگار خدیجه  است، به آن حضرت ببخشند، و آنان قبول کردند. سپس قرار شد اسرا را آزاد کنند، در مقابل این که هر یک از زنان مسلمان که در مکه اسلام را پذیرفته، اگر خواست بیاید آزاد باشد."],["p","قرار بر این شد که امیر المؤمنین  بروند و هودج فواطم را بیاورند. آن حضرت به تنهایى رفتند و زینب دختر پیامبر  و دیگر هاشمیات را آوردند، همینکه مقدارى از مکه بیرون آمدند ابوسفیان لعنت االله علیه گفت: پسر عمویش محمد (صلى االله علیه و آله ) جوانهاى شما را گمراه کرد و مسلمان شدند. حال این جوان یعنى على  در روز روشن آمده و بستگانش را مى برد. جلو او را بگیرید."],["p","آنها آمدند تا مانع آن حضرت شوند. امیر المؤمنین  دفاع فرمودند. بعضى زخمى و بعضى به درك واصل شدند، در این اثنا هبار بن اسود به هودج هاشمیات حمله کرد و نیزه اى حواله هودج زینب دختر پیامبر  نمود."],["p","امیر المؤمنین  حمله به هبار کردند و او را فرارى دادند. زینب در این حمله ترسید و چون ششماهه حامله بود، هنگامى که وارد مدینه شدند بعد از زمانى بچه سقط شده و از دنیا رحلت کرد."],["p","پیامبر  فرمود: «خون هبار بن اسود مهدور است، »و هر کس هر جا او را دید بکشد."],["p","ابن ابى الحدید به استادش مى گوید: پیامبر  به خاطر ترساندن زینب و سقط جنین او، ریختن خون هبار را جایز دانست. اگر پیامبر  زنده بود، آیا ریختن خون آن کس را که فاطمه  را ترسانید، جایز نمى دانست ⟦650⟧؟"]]},{"k":"day","key":21,"label":"","items":[["t",1,"شهادت امیر المؤمنین "],["p","امام المتقین امیر المؤمنین  در شب بیست و یکم ماه رمضان مقارن طلوع فجر به شهادت رسید، در حالى که از سن مبارك حضرتش 63سال گذشته بود. ⟦651⟧ در بیستم ماه رمضان اثرات سم در پاهاى مبارك امیر المؤمنین  ظاهر شد و پاهاى مبارك ورم کرد. ⟦652⟧ در شب بیست و یکم اثر زهر بر بدن مبارك امیر المؤمنین  بسیار شد. حضرت فرزندان و اهل بیت خود را جمع کرد و با آنها وداع نمود و وصیت هاى خود را فرمود. در آن شب هر چه خوردنى و آشامیدنى آوردند تناول نفرمود، ولبهاى مبارکش به ذکر خدا حرکت مى کرد، و مانند مروارید عرق از پیشانى نازنینش مى ریخت و با دست مبارك خود آن را بر طرف مى کرد."],["p","به امام مجتبى  فرمود: تو را به برادرت حسین  وصیت مى کنم. به فرزندان دیگر که از فاطمه زهرا (علیها السلام ) نبودند، فرمود: شما را وصیت مى کنم به اطاعت از حسن و حسین. سپس فرمودند: «خداوند شما را صبر نیکو کرامت فرماید. امشب از میان شما مى روم و به حبیب خود محمد مصطفى  ملحق مى شوم چنانچه مرا وعده داده است». صداى گریه از اهل بیت بلند شد. آنگاه دستوراتى در مورد غسل، کفن، نماز و محل دفن به امام مجتبى  فرمودند و با امام حسین  و حضرت زینب  کلماتى از کربلأ فرمودند."],["p","بعد از وداع با همگان دست و پاى مبارك را به طرف قبله کشیدند و فرمودند: اشهد ان لا اله الا االله وحده لا شریک له و اشهد ان محمدا عبده و رسوله، و چشمان مبارك را بستند و بهشت را به قدوم خویش مبارك فرمودند. صداى شیون و گریه از خانه آن حضرت بلند شد. اهل کوفه که باخبر شدند، صداى شیون و ناله از تمامى شهر برخواست، مانند روزى که پیامبر  از دنیا رفتند. در آن شب آفاق آسمان متغیر گشت و زمین لرزید و صداى تسبیح و تقدیس فرشتگان از هوا شنیده شد."],["p","سپس مشغول غسل آن حضرت شدند. بعد از غسل و کفن، امام حسن و امام حسین  پشت سر تابوت را همانطور که حضرت فرموده بودند برداشته، جلو تابوت خودش حرکت مى کرد، تا در مکانى فرود آمد."],["p","بعد از نماز بر آن حضرت توسط امام مجتبى ، مقدارى از زیر تابوت را کندند و قبرى آماده یافتند که داخل آن لوحى مسى یا سفالى بود و بر آن نوشته شده بود: «بسم االله الرحمن الرحیم، این قبرى است که نوح پیامبر براى بنده صالح خدا على بن ابى طالب حفر نمود است». بدن مطهر آن حضرت را دفن نمودند و حسب وصیت آن حضرت، قبر مطهرش را مخفى نمودند تا در زمان هارون بر همگان معلوم شد."],["p","فرزندان آن حضرت از همسران مختلف 28دختر و پسرند 5 ⟦653⟧ نفر آنها اولاد حضرت صدیقه طاهره فاطمه زهرا  هستند که عبارتند از امام حسن و امام حسین و زینب کبرى وام کلثوم و حضرت محسن  که در دوران حمل در شش ماهگى توسط منافقین در ماجراى هجوم به خانه امیر المؤمنین  به شهادت رسید. حضرت عباس  و جعفر و عثمان و عبد االله در کربلا به شهادت رسیدند، که مادرشان ام البنین است. بقیه اولاد حضرت از همسران دیگر هستند."],["p","وقتى خبر شهادت امیر المؤمنى  به عایشه رسید چنان خوشحال شد که بى اختیار شعرى خواند و سپس گفت: چه کسى على را کشت؟ جواب دادند: ابن ملجم. گفت: خاك بر دهانش مباد (کنایه از اینکه خوب کارى کرد). ⟦654⟧ در شب 21ماه رمضان حضرت عیسى بن مریم  به آسمان برده شد ⟦655⟧؛ و در همین شب حضرت موسى بن عمران و یوشع بن نون  رحلت نمودند. ⟦656⟧"],["t",2,"بیعت با امام مجتبى "],["p","در این روز مردم پس از شهادت امیر المؤمنى  با امام حسن  بیعت کردند. ⟦657⟧"],["t",3,"قتل ابن ملجم"],["p","در این روز ابن ملجم با یک ضربت شمشیر به جهنم فرستاده شد. بعد از کشته شدن ابن ملجم مردم به سوى قطام ملعونه فاسقه هجوم آوردند و او را با شمشیر به درك فرستادند و جثه اش را بیرون کوفه سوزانیدند. ⟦658⟧"],["p","ابن بطوطه متوفى سال 779ه گفته است: هنگامى که به کوفه مسافرت کردم، در غربى جبانه کوفه در زمینى سفید، زمینى بسیار سیاه دیدم و علت را پرسیدم. گفتند: اینجا قبر ابن ملجم است. عادت اهل کوفه این است که هر سال هیزم زیادى مى آوردند و 7روز در این مکان مى سوزانند. ⟦659⟧"]]},{"k":"day","key":23,"label":"","items":[["t",1,"نزول قرآن"],["p","شب نزول قرآن است ⟦660⟧ و به قولى در شب 24ماه رمضان بوده است. ⟦661⟧"]]},{"k":"day","key":24,"label":"","items":[["t",1,"مرگ ابولهب"],["p","در این روز و به قولى در 25ماه رمضان ابولهب به درك واصل شد. ⟦662⟧"]]},{"k":"tail","key":"تتمه ماه رمضان","label":null,"items":[["t",1,"بدعت نماز تراویح توسط عمر"],["p","در این ماه در سال 14ه نماز نافله به جماعت خواندن را بدعت گذارد سپس مردى را براى مردها و مردى را براى زنها به عنوان امام جماعت قرار داد. ⟦663⟧"],["t",2,"دعاى باران توسط پیامبر "],["p","در ماه رمضان سال ششم هجرى قحطى شدیدى در مدینه رخ داد، که پیامبر  طلب باران کردند و باران آمد. ⟦664⟧"]]}]},{"name":"شوال المکرم","groups":[{"k":"intro","key":0,"label":null,"items":[["p","ماه شوال شامل رحلت بزرگاى و وقوع جنگهایى است کما اینکه چند نفر از بزرگترین دشمنان اهل بیت  نیز در آن به درك واصل شده اند روزهاى،1 3، 4، 5، 6، 8، 14، 15، 17، 25را که شامل این وقایع هستند مرور خواهیم کرد."],["p","عید فطر اولین روز این ماه و روز جشن روزه دارى است."],["p","شهادت امام صادق ، حضرت حمزه ، وفات اباصلت هروى و حضرت عبد العظیم  روزهاى غم در این ماه اند؛ که ویرانى قبور ائمه بقیع  نیز بر این مصیبتها افزوده است."],["p","مرگ عمرو بن عاص، قتل متوکل و مرگ عبد الملک بن مروان شیرین ترین روزهاى این ماه اند که دشمنان اهل بیت  در آن به درك واصل شده اند. از وقایع جنگى این ماه جنگ خندق، حنین، قرقره الکدر، حمرأ الاسد، بنى قینقاع و حرکت به سوى جنگ صفین را مى توان نام برد، و ورود حضرت مسلم  به کوفه نیز از همین قبیل به شمار مى آید."],["p","رد الشمس براى امیر المؤمنین  و توقیع امام زمان  براى حسین بن روح وقایع مهم دیگرى هستند که در این ماه رخ داده اند."]]},{"k":"day","key":1,"label":"","items":[["t",1,"عید فطر"],["p","اول ماه شوال روز عید فطر است. قبل از نماز عید خوردن مقدارى از تربت سید الشهدا  و نیز زیارت آن حضرت مستحب است. ⟦665⟧"],["t",2,"مرگ عمروبن عاص"],["p","در سال 41ه عمرو بن عاص خبیث در سن 90سالگى به درك واصل شد. ⟦666⟧ مادر او نابغه کنیزى بود که عبد االله بن جذعان او را خرید و آزادش کرد. او به کار خلاف روى آورد، و چون قیمتش نسبت به سایر زنان خلافکار ارزانتر بود مراجعه کنند بسیار داشت. لذا آبروى عبد االله بن جذعان را برده بود. از جمله در طهر واحد، ابولهب و امیه بن خلف و هشام بن مغیره و ابوسفیان و عاص بن وائل با او زنا کردند و عمروعاص به وجود آمد."],["p","هنگامى که وضع حمل کرد هر یک از آنان مدعى او شدند. آخر الامر قضاوت را بر عهده خود نابغه گذاشتند، و او هم عاص را انتخاب کرد. به او گفتند: چرا عاص را انتخاب کردى با اینکه بچه به ابوسفیان شبیه تر است؟ گفت: ابو سفیان بخیل است و عاص بهتر نفقه مى دهد! این عاص ملعون کسى بود که پیامبر  را «ابتر» خطاب کرد و خاطر شریف حضرت مکدر نمود، تا آنکه سوره مبارکه کوثر نازل شد. ⟦667⟧"],["p","با این نسب و نژاد تعجبى ندارد
