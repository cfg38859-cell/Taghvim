عظیم الش أن است و روز سرور شیعه و عید بزرگ آنهاست. حضرت رسول  این روز را عید قرار داده و امر کرده است که مردم نیز عید قرار دهند و اعمال آن را به جا آورند. ⟦188⟧"],["p","کسى که در این روز انفاق کند، خداوند او را مى آمرزد. در این روز اطعام برادران دینى و خوشبو کردن آنان و توسعه بر اهل و عیال و پوشیدن لباس جدید و شکر گزارى به درگاه خداوند متعال و عبادت نمودن مستحب است. ⟦189⟧ فضیلتها و اسمهایى براى این روز ذکر شده که از جمله آنهاست: عید االله الاکبر، غدیر ثانى، عید فطر دوم، روز فرح شیعه، عید اهل بیت ، روز قتل منافق، روز قبولى اعمال، روز پیروزى مظلوم، روز دوستى مؤمنین، روز پرهیز از کبائر، روز نابودى ضلالت و گمراهى، روز شکر گزارى."],["h","ماجراى قتل عمر"],["p","عمر بن خطاب به دست ابولؤ لؤ که نامش فیروز و غلام مغیره بن شعبه بود، چند ضربه خنجر خورده که منجر به مرگ او شد ⟦190⟧ م"],["p","بنابر مشهور ⟦191⟧ هنگامى که ابولؤ لؤ ضربه ها را بر عمر زد و خواست فرار کند، عده اى مانع شدند، و 12نفر را مجروح کرد که شش نفر از آنها مردند. ⟦192⟧ ماجرا از این قرار بود که قبل از تکبیر نماز ابولؤ لؤ جلو آمد، و ضربه بر کتف و ضربه اى دیگر بر خاصره عمر زد. عمر افتاد، و عده اى جمع شدند و او را به خانه اش بردند. نزدیک بود خورشید طلوع کند که نماز را عبد الرحمن بن عوف با مردم خواند."],["h","عمر در بستر مرگ"],["p","هنگامى که عمر را به خانه بردند مقدارى نبیذ آوردند و او خورد ولى از قسمتهاى ضربت خورده خارج شد و معلوم نشد از کجا خارج شده زیر با خون هم رنگ بود. لذا عده اى گفتند: خلیفه شیر بخورد زیرا سفید است و معلوم مى شود. شیر را خورد و از محل ضربه ها خارج شد. حاضرین براى دل گرمى گفتند: «مانعى ندارد، ضررى نمى زند»! اما ضربه هاى جناب ابولؤ لؤ کارگر شد و به خلیفه سابق ملحق شد. در روز سوم در جنب ابوبکر دفن شد. ⟦193⟧"],["p","عمر مدت ده سال و شش ماه و چهار شب خلافت کرد. او اولین کسى بود که نام خود را امیر المؤمنین گذاشت، و ابوموسى اشعرى اولین نفرى بود که او را در منبر به این نام خطاب کرد. ⟦194⟧"],["h","بدعت عمر براى آینده خلافت"],["p","عمر به ابن عباس گفت: این خلافت را به چه کسى واگذار کنم؟ او على بن ابى طالب  را پیشنهاد کرد و گفت: شجاعت و فضیلت و قرابت و سبقت در اسلامش معلوم است. عمر گفت: در طبع او مزاح است! ابن عباس گفت: درباره عثمان چه مى گویى؟ عمر گفت: اگر او خلیفه شود بنى امیه را بر گرده مردم مسلط مى نماید."],["p","ابن عباس گفت: در باره طلحه چه مى گویى؟ عمر گفت: مردى متکبر است پیامبر را با کلامى که روز نزول آیه حجاب گفت آزرده است. او هنگام نزول آیه حجاب گفته بود: «وقتى از دنیا برود ما زنانش را به عقد خود در مى آوریم»."],["p","ابن عباس گفت: درباره زبیر بن عوام چه مى گویى؟ گفت: او مرد شجاعى است، ولى بسیار بخیل است. مردى بدخو و مفسد است، که گاهى انسان و گاهى کافر است. در مورد سعد و قاص گفت: مردى متکبر و متعصب است و به کار خلافت نمى آید. ابن عباس گفت: در مورد عبد الرحمن نظرت چیست؟ عمر گفت: او مرد ضعیف القلبى است. ⟦195⟧"],["p","عمر هنگام مرگ امر خلافت را به شورى واگذار کرد و ابوطلحه انصارى را طلبید و به او گفت: بعد از مرگ من با پنجاه نفر از انصار با شمشیرهاى کشیده شش نفر را در خانه عایشه حاضر کنید: على بن ابى طالب ، عثمان، طلحه، زبیر، سعد بن ابى و قاص، عبد الرحمن بن عوف. آنگاه سه روز آنها را مهلت دهید، و بعد از آن اگر چهار یا پنج نفر بر نظرى متفق شدند و دو یا یک نفر مخالفان آنان بودند، مخالفین را به قتل برسانید، و اگر سه نفر نظرى داشتد و سه نفر نظر دیگرى داشتند، آن طرف که عبد الرحمن بن عوف در اوست مقدم بدارید و سه نفر دیگر را گردن بزنید، و اگر بعد از سه روز بر امرى اتفاق نکردند، هر شش نفر را گردن بزنید."],["h","شورى بعد از مرگ عمر"],["p","بعد از مرگ عمر شورى در خانه عایشه تشکیل شد، و زبیر بن عوام پسر عفیه حق خود را به پسردایى خود امیر المؤمنین  بخشید! طلحه بن عبیداالله هم حق خود را به عثمان بخشید!! سعد بن ابى و قاص هم حق خود را به عبد الرحمن بن عوف بخشید."],["p","عبد الرحمن به مسجد آمد و در جمع اصحاب به امیر المؤمنین  عرض کرد: من بیعت مى کنم با شما به این شرط که عمل کنى به کتاب خدا و سنت پیامبر  و روش ابوبکر و عمر! امیر المؤمنین  فرمودند: بلکه طبق کتاب خدا و سنت پیامبر  و اجتهاد رأى خود عمل مى کنم."],["p","عبد الرحمن این کلمات را سه بار به عثمان گفت، و عثمان قبول کرد. بار سوم عبد الرحمن با عثمان بیعت کرد و دیگران هم بیعت کردند، غیر از بنى هاشم و جمعى از بزرگان صحابه مثل عمار بن یاسر و مقداد بن اسود که بیعت نکردند."],["h","اینکه جا دارد چند سؤ ال مطرح شود:"],["p","عمر در دوران جوانى به چه کارى مشغول بوده و در سفرهاى تجارتى چه شغلى داشته است؟"],["p","در جنگ حدیبیه و جاهاى دیگر چه کسى به پیامبر  اعتراض کرد؟"],["p","چه کسى نسبت هذیان به پیامبر  داد؟"],["p","چه کسى در خانه امیر المؤمنین  را آتش زد و گفت: «قصد دارم خانه را با اهلش بسوزانم، اگر چه فاطمه در آن باشد»؟"],["p","چه کسى محسن بن على  را کشت؟"],["p","چه کسى به قنفذ دستور داد تا به دختر پیامبر  تازیانه بزند؟"],["p","چه کسى ابوبکر را به غصب فدك ترغیب کرد و شهادت امیر المؤمنین  و ام ایمن و حسنین  را رد کرد؟"],["p","چه کسى قباله فدك را از حضرت صدیقه  گرفت و جسارت به صورت مبارك آن حضرت کرد؟"],["p","اولین کسى که دست روى دست گذاشتن را در نماز احداث کرد که بود؟"],["p","اولین کسى که خلافت را شورى حواله نمود چه کسى بود؟"],["p","اولین کسى که با همراهى ابوبکر سهم ذوى القربى را نداد چه کسى بود؟"],["p","اولین کسى که روز عید غدیر با على بن ابى طالب  بیعت کرد و گفت: بخ بخ یابن ابى طالب، اصبحت مولاى و مولى کل مؤمن و مؤمنهچه کسى بود؟ اولین کسى که از کوزه نصارى وضو گرفت و آنها را پاك مى دانست چه کسى بود؟"],["p","اولین کسى که شهادت مملوك را از درجه اعتبار ساقط کرد چه کسى بود؟ اولین کسى که متعه حج و متعه نسأ را حرام کرد چه کسى بود؟"],["p","اولین کسى که دستور داد نافله هاى ماه رمضان به جماعت خواند شود چه کسى بود؟"],["p","اولین کسى که گفت عجمها از یکدیگر ارث نمى برند چه کسى بود؟"],["p","چرا هنگامى که شخصى از کوزه خلیفه خورد مست شد؟!"],["p","چه کسى بود که وقتى پس از مرگش یک هستم مال او را به چهار زن او قسمت کردند به هر زنى 83000دینار رسید؟"],["p","چه کسى گفت: همه مردم از من باسوادترند حتى پیرزنها؟!"],["p","از چى کسى هر گاه سؤ ال مى کردند و در جواب فرو مى ماند، مى گفت: اشتغال به دلالى و خرید و فروش، مرا مانع از یادگرفتن مسائل شد؟"],["p","اینکه در کتب تاریخ با عبارتهاى مختلف ذکر شده که عمر بن خطاب حسب وصیت ابوبکر به خلافت مسلمین نصب شده جاى چند سؤ ال دارد:"],["p",".1آیا وصیت ابوبکر نافذ است و وصیت اشرف مخلوقات خاتم الانبیأ  در غدیر و غیر غدیر نافذ نیست؟"],["p",".2آیا پیامبر  در هنگام رحلت نفرمود کاغذ و قلم بیاورید تا بگویم و نوشته شود مطلبى که بعد از من اختلاف نکنید؟ چرا نسبت هذیان به آن حضرت دادند و کاغذ و قلم نیاوردند و حال آنکه خداوند در قرآن مى فرماید: «هر چه آن حضرت مى فرمایند وحى است نه از نزد خود. ⟦196⟧ چطور براى ابوبکر کاغذ و قلم آوردند و کسى اعتراض نکرد. جالب اینکه او بیهوش مى شد و به هوش مى آمد و بعد از بسم االله عثمان از طرف خودش نوشت خلیفه بعد از ابوبکر عمر است و ابوبکر مخالفتى نکرد؟"],["t",3,"قتل عمر بن سعد"],["p","عمر بن سعد فرمانده ظالم لشکر یزید در این روز به دست مختار ثقفى (رحمه االله) به درك واصل شد. ⟦197⟧"]]},{"k":"day","key":10,"label":"","items":[["t",1,"ازدواج پیامبر  با حضرت خدیجه "],["p","پیامبر  15سال قبل از هجرت با حضرت خدیجه کبرى  ازدواج نمودند. ⟦198⟧ از احادیث شیعه و اخبار عامه معلوم مى شود که حضرت خدیجه بنت خویلد بن اسد، در علم و اطلاع به کتب آن زمان معروف بوده است. او از زنان قریش، علاوه بر کثرت اموال و املاك و تجاراتى که داشت، به عقل و کیاست نیز مزیت داشت و در آن زمان او را طاهره، مبارکه، سیده نسوان و ملکه بطحأ مى گفتند. او از کسانى بو که انتظار قدوم پیامبر  را مى کشید و همیشه از علما علائم نبوت آن حضرت را جویا مى شد."],["p","هنگامى که خدمت پیامبر  شرفیاب شد، اول از مهر نبوت سؤ ال کرد و آن را زیارت کرد و اشعار فصیح او در مدح رسول گرامى اسلام  و کمال محبتش به آل عبد المطلب مشهور است که کاشف از علم و ادب و محبت اوست. در همان روزى که آن حضرت مبعوث به رسالت شد جناب خدیجه  ایمان آورد."],["p","حضرت خدیجه  از مال خویش و میراثى که به او رسیده بود به صورت مضاربه تارت مى نمود. چندى نگذشت که از بزرگان تجار شد به گونه اى که هشتاد هزار شتر زیر بار تجارت او بودند و هر روز امول او زیادتر مى شد. بر بام خانه او قبه اى از حریر سبز با طنابهاى ابریشم با تمثالى چند بود که این علامت جلالت آن مخدره بود."],["p","افراد زیادى مانند عقبه بن ابى معیط و ابن ابى شهاب که هر کى چهار صد کنیز و غلام و خدمتکار داشتند، و ابوجهل و ابوسفیان و دیگر بزرگان عرب آن روز خواستگارى آن حضرت آمدند؛ ولى آن حضرت قبول نفرمودند. سرانجام خود حضرت خدیجه ، پیشنهاد ازدواج به پیامبر  دادند و این ازدواج با آداب و مراسم خاصى انجام شد."],["p","خداوند دو پسر به نامهاى قاسم و عبد االله که به آنها طیب و طاهر هم مى گفتند، و چهار دختر به نامهاى ام کلثوم و زینب و رقیه و فاطمه  و جده حضرات معصومین  است."],["p","حضرت خدیجه  بیست و چهار سال و یک ماه با پیامبر  زندگى کرد، و تا آن حضرت زنده بود پیامبر  همسر دیگرى اختیار نفرمود. همچنین حضرت خدیجه  جمیع اموال خود را به پیامبر  واگذار کرد. عایشه مى گوید: کمتر اتفاق مى افتاد که پیامبر  از خانه بیرون رود و خدیجه را به خبر یاد نکند، چندانکه یک روز آتش حسد من مشتعل شد و گفتم: یا رسول االله، تاکى خدیجه را یاد مى کنى؟ او پیرزنى بیش نبوده! خداوند بهتر از او را (منظور خودش بوده) به تو مرحمت کرد! پیامبر  از سخن من در غضب شد و فرمود: نه به خدا قسم! بهتر از خدیجه  نصیب من نشده. به من ایمان آورد هنگامى که مردم کافر بودند، و تصدیق نبوت من نمود در وقتى که مردم مرا تکذیب مى کردند، و اموال خود را در اختیار من گذارد در وقتى که مردم مرا از خود دور مى کردند. خداوند متعال از خدیجه به من فرزندانى روزى کرد و رحم تو را عقیم قرار داد. ⟦199⟧"],["t",2,"مرگ داود بن على حاکم ظالم مدینه"],["p","داود بن على عموى سفاح در مدینه در دهم ربیع الاول به دعاى امام صادق  هلاك شد، چه اینکه داود بن على فرمان داد معلى بن خنیس را که از اصحاب امام صادق  بود شهید کردند. ⟦200⟧"],["t",3,"مرگ مالک بن انس"],["p","در این روز در سال 179ه مالک بن انس اصبحى، رئیس فرقه مالکى از مذاهب اربعه اهل سنت از دنیا رفت و در بقیع دفن شد. از خصوصیات او اینکه مدت سه سال بعد از مرگ پدرش در شکم مادر بود و بعد از سه سال به دنیا آمد!!؟"],["p","⟦201⟧"],["t",4,"اولین روز خلافت غاصبانه معاویه"],["p","در این روز معاویه بن ابى سفیان در سال 41ه خود را به خلافت نشاند، و از مردم بیعت گرفت و او اولین خلیفه بنى امیه بعد از عثمان بود. ⟦202⟧"]]},{"k":"day","key":12,"label":"","items":[["t",1,"آغاز وجوب نماز"],["p","در سال اول هجرت در این روز نماز در حضر و سفر واجب شد. ⟦203⟧"],["t",2,"ورود پیامبر  به مدینه"],["p","در غروب این روز پیامبر  بعد از هجرت از مکه وارد مدینه طیبه شدند، و در قبا نزول اجلال فرمود و منظر ماند تا امیر المؤمنین  به ایشان ملحق شد، و سپس وارد مدینه شدند. ⟦204⟧ این در حالى بود که در 4ربیع الاول پیامبر  در مسیر هجرت از غار ثور بیرون آمده به طرف مدینه حرکت فرمود. ⟦205⟧"],["t",3,"مرگ معتصم عباسى"],["p","در پنجشنبه دوازدهم ربیع الاول سال 227ه دو ساعت از شب گذشته، معتصم عباسى در سامرا به هلاکت رسید. سبب مرگش آن شد که حجامت کرد و سپس تب کرد و به همان تب به جهنم شتافت."],["p","از بزرگترین جرائم او به شهادت رساند امام جواد  است."],["p","مدت خلافت او 8سال و 8ماه و 8روز بود، و هشتم از خلفاى بنى عباس بود. او 8پسر و 8دختر داشت و 8قصر بناکرد. معتصم مردى ظالم بود و از علم و ادب و نوشتن بهره اى نداشت. او به سادات خصوصا بزرگان آنها اذیت هاى بسیار روا داشت، و در دوران حکومتش علاقه زیادى به ساخت بنا داشت. ⟦206⟧"],["t",4,"مرگ احمد بن حنبل"],["p","در این روز در سال 241ه احمد بن حنبل رئیس فرقه حنبلى ها در بغداد از دنیا رفت، و در همان شهر دفن شد. ⟦207⟧ جد او ذوالثدیه رئیس خوارج نهروان است، ⟦208⟧ که به دست امیر المؤمنین  به درك فرستاده شد. ⟦209⟧ بنابر قولى مرگ او در ربیع الثانى است. ⟦210⟧"]]},{"k":"day","key":14,"label":"","items":[["t",1,"مرگ یزید بن معاویه"],["p","در سال 64ه در شب چهاردهم ربیع الاول یزید بن معاویه بن ابى سفیان در سن 39سالگى یا 37سالگى به درکات جحیم شتافت. ⟦211⟧ اقوال دیگر در مرگ یزید دوازدهم و پانزدهم این ماه است. ⟦212⟧"],["p","مادر یزید میسون دختر بجدل کلبى است. او کسى است که غلام پدر خود را به خود متمکن ساخت و به یزید ملعون بارور شد. از همینجاست که طبق فرمایش ائمه  قاتل امام حسین  ولد الزناست، که این کلام شامل شمر، عمر سعد، ابن زیاد و غیر آنها نیز مى شود."],["p","او شارب الخمر، قمار باز، میمون باز، ناکح با محارم، صاحب اشعار کفرآمیز و تارك الصلوه بود. او بود که واقعه جانسوز کربلا را به وجود آورد و امام حسین  و اهل بیت و اصحاب آن حضرت را به شهادت رساند و امام زین العابدین  و عمه سادات زینب کبرى  و دیگر علویات و فاطمیات را با آن وضع در کوچه و بازار به اسارت برد."],["p","او بود که خانه خدا را خراب کرد و پرده کعبه را سوزانید. همچنین او بود که در واقعه حره در مدینه کشف ستر زنان مهاجر و انصار کرد، و سه روز مال و جان و ناموس مردم را بر سربازان خود حلال کرد. ⟦213⟧ بعد از این ماجرا فرزندانى به هم رسیدند که پدر معینى نداشتند. بعد از آن قتل و غارتى در مدینه شد و حرمت حرم شریف نبوى هتک گردید، و مردم را داخل حرم مطهر کشتند. در علت مرگ او چند قول است: یکى اینکه به بلاى ناگهانى هلاك شده است. شیخ صدوق (رحمه االله) مى فرماید: یزید شب با حال مستى خوابید و صبح او را مرده یافتند در حالیکه بدن او تغییر کرده، مثل آنکه قیر مالیده شده باشد. بدن نحسش را در باب الصغیر دمشق دفن کردند."],["p","احمد بن حنبل و جماعتى از اهل سنت لعن یزید را تجویز کرده اند و عده اى از آنان معتقد به کفر یزید هستند، و ابن جوزى کتابى بر رد یزید نوشته است. ⟦214⟧"],["p","در این روز زیارت امام حسین  مناسب است. ⟦215⟧"],["t",2,"مرگ موسى خلیفه عباسى"],["p","در این روز و به قولى در 15و 18ربیع الاول موسى العادى، فرزند مهدى عباسى به درکات جحیم شتافت. ⟦216⟧ در همان شب هارون خلیفه شد و مأمون نیز به دنیا آمد. ⟦217⟧ خلافت موسى الهادى یک سال و سه ماه طول کشید و 25 یا 26سال عمر کرد. او به قساوت و قلب و قلت رحم و خشونت طبع و شرارت نفس مشهور بود. ⟦218⟧"],["p","سید بن طاوس (رحمه االله) در مهج الدعوات روایت مى کند که موسى الهدى لشکر فرستاد حسین بن على بن حسن مثنى بن امام حسن مجتبى  صاحب فخ را با اصحابش شهید کرد، و سر او را با اسیران به نزد او آوردند، چون نظرش بر آن سر افتاد اشعارى خواند."],["p","پس اسیران را یکى پس از دیگرى مى آوردند، و او بعد از سرزنش و توبیخ امر به قتل آنها مى کرد. در یک روز جماعتى از اولاد امیر المؤمنین  را به قتل رسانید و طالبیین را دشنام مى داد تا رسید به نام مبارك موسى بن جعفر ، نسبت به آن حضرت بد گفت و فریاد کشید که حسین صاحب فخ خروج نکرد مگر به امر موسى بن جعفر ، چون او صاحب وصیت در این خانواده است. بخدا قسم او را به قتل مى رسانم. خدا بکشد مرا اگر او را زنده بگذارم و خدا بکشد مرا اگر او را عفو کنم و اگر نبود که سفاح و پدر مهدى فضایل بسیار در حق جعفر بن محمد از کثرت علم و دین و فضلش برایم نقل کرده اند، هر آینه قبر او را مى شکافتم و بدن او را به آتش مى سوزانیدم."],["p","على بن یقطین نامه اى از بغداد براى حضرت کاظم  فرستاد و صورت حال را شرح داد. چون نامه به حضرت رسید، اهل بیت و شیعیان خود را خبر کرد و فرمود: رأى شما در این باب چیست؟"],["p","عرض کردند: صلاح این است که شما خود را از این جبار ظالم پنهان دارى. حضرت فرمود: اول نامه اى که از عراق بیاید متضمن خبر مرگ موسى الهادى است و چنان شد که آن حضرت خبر دادند. ⟦219⟧"]]},{"k":"day","key":16,"label":"","items":[["t",1,"ورود اهل بیت امام حسین  به شام"],["p","بنابر نقلى پس از گذشت 66روز از روز عاشورا، اهل بیت امام حسین  وارد شام شدند. ⟦220⟧"]]},{"k":"day","key":17,"label":"","items":[["t",1,"ولادت پیامبر "],["p","به اتفاق علماى شیعه، در این روز هنگام فجر روز جمعه در مکه معظمه ولادت با سعادت حضرت سید الانبیأ محمد مصطفى  واقع شده است. ولادت آن حضرت با سلطنت انوشیروان عادل مقارن بود و در آن سال اصحاب فیل هلاك شدند. ⟦221⟧"],["p","نام آن حضرت محمد  و کنیه ایشان ابوالقاسم است. نام پدر آن حضرت عبد االله و نام مادر آن حضرت آمنه بنت وهب است. ⟦222⟧"],["p","هنگام ولادت، نور از پیشانى آن حضرت لامع بود و بوى مشک از ایشان ساطع مى گشت. نورى در آن شب از طرف حجاز ساطع شد و در تمام عالم منتشر گردید. تخت پادشاهان سرنگون شد، و همه آنان در آن روز لال بودند و نمى توانستند سخن بگویند."],["p","ملائکه مقرب و ارواح اصفیأ پیامبران در هنگام ولادت آن حضرت حضور یافتند، و رضوان خازن بهشت با حوریان نازل شدند، و ابریقها و تشت ها از طلا و نقره و زمرد بهشت حاضر کردند و براى حضرت آمنه شربتها از بهشت آوردند که او آشامید. آن حضرت را بعد از ولادت به آبهاى بهشت غسل دادند و به عطرهاى فردوس معطر کردند. ⟦223⟧"],["h","معجزات ولادت حضرت"],["p","در روز ولادت آن حضرت هر بتى که در هر جاى عالم بود به رو در افتاد و چهارده کنگره از ایوان کسرى فرو ریخت. دریاچه ساوه که آن را مى پرستیدند خشک و بدل به نمکزار شد. در وادى ساوه که سالها بود کسى آب در ندیده بود آب جارى شد. آتشکده فارس که هزار سال خاموش نشده بود در شب ولادت آن حضرت خاموش شد. علم کاهنان و سحر ساحران باطل گردید، و طاق کسرى از میان به دو نیم شد که تا امروز نمایان است. ⟦224⟧"],["p","هنگام ولادت آن حضرت این ندا از آسمان شنیده شد: «جأ الحق و زهق الباطل، ان الباطل کان زهوقا.» ⟦225⟧"],["h","خصوصیات حضرت"],["p","هرگز مگس بر بدن مبارك آن حضرت نمى نشست. هرگاه چشم مبارکش خواب بود دلش بیدار بود، و مى دید و مى شنید چنانکه در بیدارى مى دید و مى شنید. حضرت از قفاى خود چنان مى دید که از پیش روى مى دید."],["p","بر هر حیوانى که سوار مى شد هرگز پیر و لاغر نمى شد. ⟦226⟧ آن حضرت حمارى به نام یعفور داشتند. هر زمان که فرمان مى داد فلان مرد را حاضر کن، به در خانه اش مى رفت و سر بر در مى کوفت و به اشاره او را حاضر مى ساخت. ⟦227⟧"],["p","از خصوصیات ولادت پیامبر  آن بود که ختنه کرده و ناف بریده و پاك از آلایش خون و غیره متولد شد. همچنین در وقت ولادت از پا به زیر آمد نه از سر. هنگام ولادت رو به کعبه به سجده افتاد، و چون سر از سجده برداشت دست به سوى آسمان بلند کرد و به وحدانیت خدا و رسالت خود اقرار نمود، و سپس نورى از او ساطع گردید که مشرق و مغرب عالم را روشن نمود"],["p","⟦228⟧"],["h","معجزات حضرت"],["p","پیامبر  معجزات بسیارى داشت که از جمله آنها نمونه هاى زیر است: ⟦229⟧"],["p",".1مستجاب شدن دعاى آن حضرت در زنده شدن مردگان و بینا شدن کوران و شفا یافتن بیماران."],["p",".2سخن گفتن آن حضرت با حیوانات."],["p",".3آگاهى بى همه لغتها و قدرت بر سخن گفتن به همه آنها."],["p",".4مهر نبوت بر پشت مبارکش جاگرفته بود و نور آن بر نور آفتاب زیادتى مى کرد."],["p",".5آب از میان انگشتان مبارکش جارى شد، به قدرى که جمع بسیارى سیراب شدند."],["p",".6سنگریزه در دست مبارکش تسبیح مى گفت و مردم مى شنیدند."],["p",".7وجود مقدسش در آفتاب سایه اى نداشت."],["p",".8هر گاه آب دهان مبارك به چاهى مى افکند در آن چاه برکت به هم مى رسید و پر از آب مى شد. آب دهان مبارك را به هر صاحب دردى مى مالید شفا مى یافت."],["p",".9دست مبارك آن حضرت به هر طعامى که مى رسید با برکت مى شد و از طعام کم جماعت کثیر را سیر مى کرد."],["p",".10هرگاه بر زمین نرم راه مى رفت جاى پایش نمى ماند، و هنگامى که بر سنگ سخت راه مى رفت اثر پاى مبارکش مى ماند."],["p","روز ولادت حضرت روز شریف و بابرکتى است که از قدیم الایام صالحین از آل محمد  حرمت آن را نگه داشته اند، و حق این روز را ادا کرده و روزه گرفته اند. کسى که 17ربیع الاول را روز بگیرد خداوند متعال ثواب یک سال روزه را به او مى دهد. در این روز صدقه دادن و زیارت مشاهد مشرفه و انجام خیرات و مسرور کردن اهل ایمان مستحب است. ⟦230⟧"],["t",2,"ولادت امام صادق "],["p","در 17ربیع الاول سال 83ه ولادت با سعادت امام جعفر صادق  در مدینه منوره اتفاق افتاده است. ⟦231⟧"],["p","نام مبارك آن حضرت جعفر و کنیه شریفش ابوعبداالله و لقب نورانى حضرت صادق است. پدر بزرگوارش امام محمد باقر ، و مادر گرامى آن حضرت جناب ام فروه است، که امام صادق  درباره ایشان مى فرمایند: «مادرم از بانوان پرهیزکار و با ایمان و نیکوکار بود.» ⟦232⟧"],["p","امم صادق  هفت پسر و سه دختر داشتند که عبارتند از امام موسى کاظم ، اسماعیل، عبد االله، محمد دیباج، اسحاق، على عریضى، عباس، ام فروه، اسمأ، فاطمه. ⟦233⟧"],["p","در شمایل آن حضرت گفته اند: آن حضرت میانه قد و افروخته رو و سفید بدن و کشیده بینى و موهاى ایشان سیاه و مجعد و بر گونه شان خال سیاهى بود. ⟦234⟧"]]},{"k":"day","key":22,"label":"","items":[["t",1,"جنگ بنى النضیر"],["p","در سال سوم هجرت غزوه بنى النضیر واقع شد و یهودیان از مدینه بیرون رانده شدند. ⟦235⟧"]]},{"k":"day","key":23,"label":"","items":[["t",1,"ورود حضرت معصومه  به قم"],["p","در این روز در سال 201ه کریمه اهل بیت حضرت فاطمه معصومه  به قم تشریف فرما شدند که 17روز قبل از رحلت آن حضرت است. ⟦236⟧"],["p","آن حضرت با قدوم مبارك خود این شهر را متبرك گردانیدند، و به درخواست جناب موسى بن خزرج پسر سعد اشعرى که از بزرگان قم بود، منزل او را منور نموده در آنجا نزول اجلال فرمودند. در همان مکان تشریف داشتند و زنهاى قم مخصوصا علویات به خدمت آن حضرت مى رسیدند و از وجود آن حضرت استفاده مى کردند تا بعد از 17روز از دنیا رحلت فرمودند. عبادتگاه حضرت معروف به «ستیه»در میدان میر قم معروف است. ⟦237⟧"]]},{"k":"day","key":25,"label":"","items":[["t",1,"جنگ دومه الجندل"],["p","در این روز در سال پنجم هجرى در زمان پیامبر  غزوه دومه الجندل اتفاق افتاد. ⟦238⟧ در اراضى «دومه الجندل»گروهى از اشرار همدست شده و به کاروانها حمله مى کردند. پیامبر صلى االله علیه و آله( سباع بن عرفطه غفارى را روز 25ربیع الاول در مدینه به جاى خود قرار داد، و با هزار رزمجو بیرون آمدند تا به آن نواحى رسیدند. راهزنان چون متوجه آمدن آن حضرت شدند، فرار کردند. مسلمانان اموال آنان را برداشتند و در بیستم ربیع الثانى وارد مدینه شدند. ⟦239⟧"],["p","عبد الرحمن بن ابى لیلى مى گوید: من با ابوموسى اشعرى از دومه الجندل عبور مى کردیم. ابوموسى به من گفت: زمانى که با پیامبر  به دومه الجندل رسیدیم آن حضرت به من فرمود: «در این مکان دو تن از بنى اسرائیل حکم به جور کردند، و به زودى در میان امت من دو تن در این مکان به جور حکم مى نمایند»."],["p","راوى مى گوید: ابوموسى و عمرو عاص براى حکمیت در صفین به دمه الجندل رفتند و میان على بن ابى طالب  و معاویه ملعون حکم کردند. بعد از ماجراى حکمین ابوموسى را ملاقات کردم و به او گفتم: «مگر تو نبودى که از پیامبر  چنین حدیثى را نقل کردى»؟! گفت: و االله المستعان!! ⟦240⟧"],["t",2,"صلح امام حسن "],["p","قرار داد امام حسن مجتبى  با معاویه ملعون در 25ربیع الاول بوده، ⟦241⟧ و بعضى در 26این ماه نقل کرده اند، ⟦242⟧ که شامل موارد زیر بود: ⟦243⟧"],["p",".1به على  دشنام ندهند."],["p",".2خون شیعیان محترم و محفوظ بماند، و حقوقشان پایمال نگردد."],["p",".3معاویه یک میلیون درهم بین یتیمان جنگ جمل و صفین تقسیم کند."],["p",".4امام  معاویه را امیر المؤمنین نخواند."],["p",".5معاویه باید بر اساس کتاب خدا و سنت پیامبر  عمل کند."],["p",".6معاویه پس از مرگ، خلافت را به دیگرى واگذار نکند."],["p","معاویه این شرایط و شرایط دیگر مربوط به حفظ اسلام به ویژه شیعیان را پذیرفت و جنگ پایان یافت، امام آن ملعون به هیچیک از شروط این قرار داد عمل ننمود، بلکه خلاف تمام آنها عمل کرد."]]}]},{"name":"ربیع الثانى","groups":[{"k":"intro","key":0,"label":null,"items":[["p","روزهاى 1، 3، 6، 8، 10، 12، 13، 22، 25، 29، 30از ماه ربیع الثانى حامل وقایعى بیاد ماندنى از تاریخ تشیع است."],["p","شهادت حضرت زهرا  و امام باقر  بنا بر قولى، وفات حضرت معصومه  و وفات موسى مبرقع وقایع ناگوار این ماه اند. ولادت امام حسن عسکرى ، سفر آن حضرت به جرجان، قیام مختار و توابین، مرگ خالد بن ولید و انقراض بنى امیه وقایع مسرور کننده اى است که این ماه شاهد آن بوده است."]]},{"k":"day","key":1,"label":"","items":[["t",1,"قیام توابین"],["p","در این روز در سال 65ه سلیمان بن صرد با گروهى از توابین -که نام شانزده هزار نفر آن در دفتر سلیمان ثبت شده بود -براى خونخواهى امام حسین  قیام کردند. ⟦244⟧"],["p","در روز دوم ربیع الثانى، از «نخیله»کوفه براى جنگ با ابن زیاد ملعون حرکت کردند. در شب جمعه 5ربیع الثانى از کوفه خارج شدند و روز بعد کنار قبر حضرت اباعبداالله  رفتند. یک یا سه شبانه روز در کربلا ماندند و گریستند و استغفار نمودند و ضجه و ناله کردند، به طورى که مثل آن روز و به آن اندازه صداى ضجه در آن وادى شنیده نشده بود."],["p","هنگام وداع، کنار قبر حضرت مانند ازدحام کنار کعبه شلوغ بود. هر کس با حالتى شعر مى خواند و ناله مى کرد و با آن حضرت وداع مى کرد و خود را براى جنگ با ابن زیاد آماده مى نمود. ⟦245⟧"],["p","سلیمان از شیعیان على بن ابى طالب و امام حسن و امام حسین  بود و در جمیع جنگها در رکاب امیر المؤمنین  حضور داشت. آخر الامر بالشکر ابن زیاد رو به رو شدند؛ و بعد از کشتن عده زیادى از آنان و مبارزات و جانفشانى هاى فراوان، سلیمان در سن 93سالگى در عین الورد به شهادت رسید. ⟦246⟧ از اصحاب سلیمان هم فقط 27نفر که مجروح و خسته و تشنه بودند جان سالم به در بردند، و بقیه همه به شهادت رسیدند. ⟦247⟧"],["p","حصین بن نمیر ملعون -که در کربلا دلهاى اهل بیت  را سوزاند -در عین الورد به دست ابراهیم پسر مالک اشتر کشته شد و به جهنم واصل گردید. ⟦248⟧"],["t",2,"شهادت امام باقر "],["p","در این روز به روایتى، شهادت امام باقر  است. ⟦249⟧"]]},{"k":"day","key":3,"label":"","items":[["t",1,"سفر امام عسکرى  به جرجان"],["p","در این روز امام حسن عسکرى  براى وفا به وعده اى که فرموده بودند و آشکار شدند معجزاتى از آن بزرگوار بى طى الارض از سامرأ به جرجان تشریف فرما شدند. ⟦250⟧"],["p","جعفر بن شریف مى گوید: سالى قصد حج کردم، و قبل از حج به زیارت امام حسن عسکرى  در سامرأ رفتم. اموالى از شیعیان همراهم بود که باید به آن حضرت مى رساندم. خواستم از آن حضرت بپرسم اموال را به چه کسى بدهم، ولى پیش از آنکه من صحبت کنم حضرت فرمودند: «به مبارك خادم بده». عرض کردم: همین کار را کرده ام، »و سپس بیرون آمدم و گفتم: «شیعیان شما در جرجان به شما سلام مى رسانند». امام  فرمود: مگر بعد از مراسم حج به جرجان بر نمى گردى؟ عرض کردم: بر مى گردم."],["p","فرمودند170: روز دیگر اول روز جمعه سورم ربیع الثانى به جرجان وارد مى شوى. آن وقت به مردم اعلام کن که من در آخر همان روز به جرجان مى آیم. برو به سلامت."],["p","خداوند متعال تو را و آنچه باتوست به سلامت به اهل و اولادت خواهد رسانید. پسرى بقراى پسرت متولد شده است. نام او را «صلت»بگذار، که خداوند به زودى او را به حد کمال مى رساند و او از اولیأ ما خواهد بود."],["p","من گفتم یابن رسول االله، ابراهیم بن اسماعیل جرجانى از شیعیان شماست و به دوستان شما هر سال بیش از صد هزار درهم احسان مى کند، و در جرجان از اشخاصى است که متنعم به نعمت هاى الهى است. امام  فرمودند: «خداوند به ابو اسحاق ابراهیم بن اسماعیل در مقابل احسانى که به شیعیان ما مى کند جزاى خیر بدهد و گناهان او را بیامرزد و او را پسرى صحیح الاعضأ روزى فرماید که قائل به حق باشد. به ابراهیم بگو: حسن بن على مى گوید: نام پسر خود را احمد بگذار»."],["p","راوى مى گوید: از خدمت حضرت مرخص شدم و حج رفتم و بازگشتم، و در روزى که حضرت معین فرموده بودند به سلامت وارد جرجان شدم. هنگام که اصحاب ما براى تهنیت آمدند، به ایشان گفتم: امام  مرا وعد داده که در آخر امروز به اینجا تشریف مى آورند. پس مهیا شوید و مسائل و حوائج خود را آماده کنید."],["p","شیعیان چون نماز ظهر و عصر را به جا آوردند، در خانه من جمع شدند. ناگاه امام عسکرى  در همان ساعتى که فرموده بودند وارد شدند. هنگام ورود بر ما سلام کردند و ما به استقبال شتافتیم و دست آن حضرت را بوسیدیم. آنگاه حضرت فرمودند: من به جعفر بن شریف وعده کرده بودم که در آخر این روز نزد شما بیایم. من نماز ظهر و عصر را در سامرأ به جا آوردم و نزد شما آمدم تا با شما تجدید عهد نمایم. اکنون شما حوائج و مسائل خود را بیاورید. اول کسى که ابتدا به سؤ ال کرد نضر بن جابر بود. او گفت: یابن رسول االله، پسر من از هر دو چشم نابیناست، دعا فرمایید تا خداوند دیده هایش را به او برگرداند. حضرت فرمودند او را حاضر کن. او را حاضر کرد و حضرت دست مبارك بر چشمان او کشید و چشمانش روشن شد."],["p","پس از او یک یک آمدند و حاجت خود را بیان کردند و حضرت حاجتهاى آنان را بر آورده مى نمودند، تا اینکه حوائج همه را بر آوردند و مسائل آنها را جواب فرمودند و همان روز به سامرأ مراجعت نمودند."]]},{"k":"day","key":6,"label":"","items":[["t",1,"مرگ هشام بن عبد الملک"],["p","روز چهارشنبه ششم ربیع الثانى سال 125ه در رصافه هشام بن عبد الملک از دنیا رفت و به جهنم واصل شد. ⟦251⟧"],["p","او مردى احول و غلیظ و بدخو و بخیل بوده و حریص بود بر جمع مال، دستور کشتن زید بن على بن الحسین  را صادر کرد و امام باقر و حضرت صادق  را به شام احضار کرد و جسارتهاى فراوانى به آن حضرات نمود و آخر الامر امام باقر  را به شهادت رساند 19. سال و 9ماه و ده روز خلافت کرد و در 53سالگى به جهنم شتافت."],["p","در زمان سفاح که قتل بنى امیه آغاز شده بود و قبرهاى آنها را هم نبش مى کردند و آنچه مى یافتند مى سوزاندند، وقتى نوبت به قبر ولید رسید اثرى در آن باقى نمانده بود و از عبد الملک قسمتى از جمجمه اش مانده بود. هنگامى که قبر هشام را شکافتند بدن او هنوز متلاشى نشده بود، ولذا هشتاد تازیانه بر بدن او زدند و او را سوزانیدند و خاکسترش را به باد دادند."],["p","بعضى گفته اند ظاهرا زدن هشتاد تازیانه به هشام به جهت حد قذف بوده که جسارت به مادر جناب زید بن على بن الحسین  نمود. ⟦252⟧"]]},{"k":"day","key":8,"label":"","items":[["t",1,"ولادت امام حسن عسکرى "],["p","در این روز حضرت امام حسن عسکرى  در سال 232ه جهان را به قدوم خود منور فرمودند. ⟦253⟧ و به روایت مصباح، تقویم المحسنین، اختیارات و دروس شهید ولادت حضرت در چهارم این ماه بوده است. ⟦254⟧ اقوال دیگرى نیز در ولادت آن حضرت وجود دارد که عبارتند از 27ذى الحجه 10، ⟦255⟧ ربیع الثانى. ⟦256⟧"],["p","پدر آن حضرت امام هادى  و مادر محترمه اش بانویى است که نامش حدیث یا حدیثه یا سوسن یا سلیل است. ⟦257⟧ محل ولادت حضرت مدینه و مشهورترین القاب ایشان زکى، نقى، و کنیه حضرتش ابومحمد است."],["p","آن حضرت را براى زیر نظر داشتن و کنترل رفت و آمدها، در محل سکونت سپاهیان ترك تبار درباره عباسى مسکن داده بودند؛ و از همین جاست که به آن حضرت «عسکرى»مى گویند. ⟦258⟧"],["t",2,"شهادت حضرت صدیقه طاهره "],["p","⟦259⟧"],["p","بنابر روایتى که چهل روز پس از رحلت پیامبر  را روز شهادت حضرت زهرا  دانسته، روز هشتم ربیع الثانى روز شهادت حضرت به حساب مى آید."]]},{"k":"day","key":10,"label":"","items":[["t",1,"وفات حضرت معصومه "],["p","در این روز در سال 201ه بنابر مشهور سالروز رحلت شهادت گونه حضرت ولیه االله خاتون خلق جهان، عابده زاهده کامله مستوره حضرت فاطمه معصومه  دختر امام موسى کاظم  است. ⟦260⟧"],["p","آن حضرت 17روز پس از ورود به شهر قم، با دلى شکسته و غصه دار از داغ پدر و فراق برادر، رحلت فرمودند. در عزاى آن حضرت شهر قم را یکپارچه غم و ماتم فرا گرفت. بدن مطهر آن حضرت را غسل داده کفن کردند، و به طرف باغ موسى بن خزرج -مکان فعلى حرم مطهر -آوردند. دو سوار نقابدار از بیرون شهر آمدند و بر بدن آن حضرت نماز خواندند. آنگاه داخل سرداب شده بدن مطهر را دفن کردند و رفتند، و کسى آنان را نشناخت."],["p","موسى بن خزرج آن باغ را وقف حضرت معصومه  نمود، و از بوریا و حصیر سقفى بر روى قبر مطهر آن حضرت قرار داد. این بنا بود تا آنکه زینب دختر امام جواد  بر روى قبر شریف قبه اى بنا نهاد. سپس جماعتى از دختران ائمه  در آن مکان دفن شدند. هنگامى که ام محمد دختر موسى بن محمد بن على الرضا  فوت کرد، در کنار آن حضرت دفن شد. بعد از آن میمونه خواهر ام محمد از دنیا رفت، و آن بزرگوار هم در جنب ام محمد دفن شد. روى این دو قبر یک گنبد دیگر بنا کردند، به گونه اى که دو گنبد چسبیده به هم بر روى قبر حضرت فاطمه معصومه  و ام محمد و میمونه بوده است. به جز دختران حضرات معصومین ، دو کنیز هم دفن شده اند که در هنگام مرمت کف حرم مطهر در زمان ناصر الدین شاه، روزنه اى به سردابى پیدا مى شود و چند زن صالحه، وارد سرداب مى شوند. پیکر پاك میمونه و دو تن از کنیزان را پس از هزار سال تر و تازه مشاهده مى کنند. این سرداب جنب سرداب حضرت فاطمه معصومه  قرار دارد. ⟦261⟧"],["p","مرحوم نمازى وفات حضرت معصومه  را در 12ربیع الثانى سال 201ه نقل کرده ⟦262⟧ و قول منسوب به شیخ حر عاملى (رحمه االله) هشتم شعبان سال 201ه است. ⟦263⟧"],["p","امام صادق  مى فرماید: «قم کوفه صفیر است، و بهشت داراى هشت در است که سه در آن از قم است. در آن شهر زنى از اولاد من رحلت مى کند که اسمش فاطمه است، و او دختر موسى بن جعفر  است که به شفاعت او تمامى شیعیانم داخل بهشت مى شوند.» ⟦264⟧"]]},{"k":"day","key":12,"label":"","items":[["t",1,"انقراض بنى امیه"],["p","در این روز با سفاح اولین خلیفه عباسى بیعت شد، ⟦265⟧ و با انقراض دولت بنى مروان، دولت بنى امیه به کلى منقرض شد. البته مروان در 27ذى الحجه کشته شد، ولى در این روز با تأسیس دولت بنى عباس رسما نام بنى امیه از صفحه خلافت برچیده شد."]]},{"k":"day","key":13,"label":"","items":[["t",1,"شهادت حضرت زهرا "],["p","به روایت مرحوم ابن شهر آشوب در مناقب و قرمانى در اخبار الدول شهادت ام ابیها فاطمه الزهرأ  در این روز بوده است. ⟦266⟧"]]},{"k":"day","key":14,"label":"","items":[["t",1,"قیام مختار"],["p","⟦267⟧"],["p","در این روز مختار شاد کننده دلهاى شکسته اهل بیت  با نداى «یا لثارات الحسین»در کوفه قیام کرد. مختار در سال اول هجرت در طائف به دنیا آمد و در سال 67ه در کوفه به دست مصعب بن زبیر به شهادت رید. کنیه او ابواسحاق است. ابوعبیده، پدرش از صحابه بزرگ بود که در جنگ با فارس شهید شد. بعد از پدر، دو برادرش حکم و جبیر شهید شدند."],["p","مختار در هیجده ماه حکومتش، هیجده هزار نفر از قاتلین سید الشهدأ  را به جهنم فرستاد. این به غیر از کسانى است که به دست اصحاب و یاران او و ابراهیم بن مالک اشتر در بیرون کوفه و در کنار نهر خازر کشته شدند."],["p","سعد عموى مختار از طرف امیر المؤمنین و امام حسن  والى مداین بود، و هر گاه جایى مى رفت مختار را به جاى خود مى گذاشت."],["p","امیر المؤمنین  به او خبر از فتح و ظفر دادند، و میثم تمار در زندان کوفه او را بشارت داد."],["p","در روز عید قربان ابو محمد حکم بن مختار خدمت امام باقر  آمد. بعد از اینکه خود را معرفى کرد، امام باقر  را نزد خود خواند و او عرض کرد: آقاى من، مردم درباره پدر من بسیار سخن مى گویند. به خدا قسم سخن درست کلام شماست و هر چه شما بفرمایید آن را قبول دارم. امام  فرمود: سبحان االله. پدرم خبر داد که مهریه مادر من از پولى بود که مختار آن را براى پدرم فرستاد. مختار خانه هاى خراب ما را آباد کرد، و دشمنان ما را به قتل رسانید، و هر خونى که از ما ریخته شد طلب نمود. آنگاه سه مرتبه فرمود: رحم االله اباك."],["p","در کودکى، امیر المؤمنین  او را روى زانوى خویش مى نشاند و به او لطف و مرحمت مى فرمود. امام باقر  مى فرماید: بخدا قسم پدرم مرا خبر داد که مختار نزد فاطمه بنت امیر المؤمنین  مى آمد، و آن مخدره براى او فرش پهن نموده پشتى برایش مى گذاشت. سپس فرمود: «هر حقى که ما نزد کسى داشتیم او مطالبه نمود»."],["p","در روایت دیگر مى فرماید: «هنگامى که مختار سر نحس عبید االله را براى امام زین العابدین  فرستاد، آن حضرت سر سفره بود و خوشحال شد و دعا فرمود.» ⟦268⟧"],["p","بنا بر قول دیگرى قیام مختار در شب 14ربیع الاول سال 66ه ⟦269⟧؛ و بنابر قولى 16ربیع الثانى بوده است. ⟦270⟧"]]},{"k":"day","key":22,"label":"","items":[["t",1,"وفات موسى مبرقع"],["p","جناب موسى مبرقع  پسر حضر جواد  در سال 296ه در شهر قم ⟦271⟧ وفات یافت. به نقلى وفات آن جناب در 8ربیع الثانى بوده است. ⟦272⟧"],["p","بنابر قولى دیگر در 14ربیع الثانى وفات موسى مبرقع واقع شده است. قبر آن بزرگوار در چهل اختران قم خیابان آذر مشهور است. ⟦273⟧"],["p","نام: موسى، کنیه: ابوجعفر، لقب: مبرقع که از فرط زیبایى بر جمال مبارك نقاب مى زد. نام پدر: جواد الائمه  و مادر آن حضرت کنیز بود."],["p","ایشان از اولین سادات رضوى بود که در سال 256ه وارد قم گردید. او دائما بر صورت خود برقعى داشت، ولى مردم عرب ساکن قم او را از قم بیرون کردند، و او به کاشان رفت و در آنجا مورد احترام قرار گرفت."],["p","بعد از آمدن ابوالصدیم حسین بن على بن آدم و مرد دیگرى از رؤ ساى قم، عربهاى قم متوجه شدند موسى چه کسى بوده است، و آن بزرگوار را به قم بازگرداندند و خانه اى براى او آماده کردند. همچنین در روستاهاى متعدد زمین و باغ براى او خریدند و خواهرانش زینب و ام محمد و میمونه، دختران حضرت جواد  به قم آمدند، و بر او وارد شدند."],["p","هنگامى که جناب موسى مبرقع در قم از دنیا رفت، امیر قم عباس بن عمرو غنوى بر او نماز خواند، و در محل کنونى که در قم معروف است و قبلا خانه محمد بن حسن بن ابى خالد اشعرى ملقب به شنبوله بود، دفن شد."],["p","کلینى (رحمه االله) در کافى به سند معتبر نقل کرده که جناب موسى مبرقع تولیت اوقاف را از جانب امام  داشته اند. ⟦274⟧"]]},{"k":"day","key":25,"label":"","items":[["t",1,"خلع معاویه بن یزید خود را از خلافت"],["p","هنگامى که یزید بن معاویه در 14ربیع الاول سال 64ه به درکات جحیم شتافت، فرزندش معاویه به جاى وى نشست. او پس از چهل روز در 25ربیع الثانى بر فراز منبر رفت و خطبه خواند و اعمال پدران خود را یاد کرد، و بر جد و پدر خود لعنت کرد و از افعال ایشان تبرى جست و گریه شدیدى نمود، و آنگاه خود را زا خلافت خلع نمود."],["p","مروان بن حکم لعنت االله علیه از پاى منبر برخاست و گفت: الحال که طالب خلافت نیستى پس امر خلافت را به سویى بیفکن. معاویه بن یزید گفت: من حلاوت خلافت را نچشیدم، چگونه راضى شوم که اوزار آن را بچشم. به هر صورت در خانه نشست و مشغول گریه شد و 25یا 40روز بعد از این واقعه فوت کرد و به قوللى او را مسموم کردند. پس از او خلافت اولاد ابوسفیان تمام شد و به مروان و آل او منتقل شد"],["p","⟦275⟧"]]},{"k":"tail","key":"آخرى ربیع الثانى","label":null,"items":[["t",1,"مرگ خالد بن ولید"],["p","در روز آخر ربیع الثانى خالد بن ولید بن مغیره مخزومى به اسفل السافلین جهنم شتافت. ⟦276⟧ او 20سال بعد از بعثت پیامبر  در اواخر زندگانى آن حضرت، به همراه عمرو عاص به ظاهر اسلام را قبول کرد. ابوبکر او را حاکم شام کرد، و عمر او را عزل کرد. پس از مدتى در شهر حمص مردم و در همانجا مدفون شد. ⟦277⟧"],["p","در مواردى پیامبر  از کارهاى خالد بیزارى جستند. او بدون اجازه پیامبر  بنى جذیمه را به قتل رساند و عده اى را اسیر کرد و گفت: «هر کس اسیرى در دست دارد او را بکشد». مهاجر و انصار اسرار را نزد پیامبر  فرستادند و آن حضرت دستان مبارك را بلند کرد و دوبار فرمود: «خدایا من بیزارى مى جویم به سوى تو از کارى که خالد کرده است.» ⟦278⟧ خالد به عمار ناسزا گفت. پیامبر  فرمودند: «هر کس عمار را سب کند خداوند او را سب مى کند.» ⟦279⟧"],["p","او به دستور ابوبکر خواست امیر المؤمنین  را به شهادت برساند، ولى قبل از هر اقدامى آن حضرت متوجه شدند، و با دو انگشت گلوى خالد را آن چنان فشار دادند که خالد نعره کشید و مردم فرار کردند و خالد لباسش را نجس کرد. آنگاه گفت: ابوبکر و عمر مرا به این کار امر کرده اند. هر کس واسطه شد، آن حضرت او را رها نکرد تا آنکه ابوبکر عمر را فرستاد و ابن عباس را آورد. ابن عباس حضرت را به قبر مطهر پیامبر  و فرزندانش و حضرت صدیقه  قسم داد و حضرت او را رها کرد. ابوبکر به عمر گفت: «این هم نتیجه مشورت با تو»! چه اینکه عمر، خالد را براى این کار انتخاب کرده بود. ⟦280⟧"],["p","همچنین خالد بن ولید مالک بن نویره (رحمه االله) را با عده زیادى از قبیله او به جرم بیعت نکردن با ابوبکر کشت و در همان شب با همسر مالک مرتکب خلاف شد. وقتى عمر این قضیه را شنید، گفت: «تو را سنگسار مى کنم»ولى این کار را انجام نداد ⟦281⟧؟!"],["p","در مورد دیگرى هنگامى که ابوبکر او را به سوى قبیله بنى سلیم فرستاد، عده از مردان قبیله را در محلى جمع کرد و آنان را به آتش سوزانید. ⟦282⟧"]]}]},{"name":"جمادى الاولى","groups":[{"k":"intro","key":0,"label":null,"items":[["p","در این ماه تنها روزهاى 5، 6، 10، 13، 15، 25، 27، 29مقارن وقایع مهمى از تاریخ است."],["p","ولادت حضرت زینب  خبر خوش این ماه است. جنگ موته، جنگ جمل دو اتفاق مهم این ماه است."],["p","شهادت حضرت زهرا  و تحویل پیراهن امام حسین  به حضرت زینب  دو واقعه جانسوز این ماه است. وفات جناب عبدالمطلب ، وفات محمد بن عثمان عمرى نیز از حوادث این ماه است، و مرگ معاویه پسر یزید پایان دهنده حکومت بنى امیه است."]]},{"k":"day","key":5,"label":"","items":[["t",1,"ولادت حضرت زینب "],["p","ولادت با سعادت حضرت زینب  در مدینه طیبه در سال پنجم یا ششم هجرى در این روز واقع شده است. ⟦283⟧ اقوال دیگر در ولادت آن حضرت ⟦284⟧"],["p","عبارت است از 5جمادى الاولى سال 6ه اوایل شعبان سال 6ه، ماه رمضان سال 6ه دهه آخر ربیع الثانى در سال 5یا 6یا 7ه."],["p","پدر بزرگوار آن حضرت امیر المؤمنین ، و مادر گرامى اش حضرت صدیقه طاهره  است. همسر آن حضرت جناب عبد االله بن جعفر بن ابى طالب ، و فرزندان آن حضرت، على، عون، عباس، محمد و ام کلثوم هستند که عون و محمد در کربلا شهید شدند."],["p","کنیه آن مخدره ام کلثوم، ام عبداالله و ام الحسن است، ولى کنیه هاى خاص حضرت ام المصائب، ام الرزایا و ام النوائب است."],["p","القاب آن مخدره بسیار است، و از آن جمله: عقیله بنى هشام، عقلیه الطالبیین، صدقه صغرى )اشاره به مادرش که صدیقه کبرى است و پدرش که صدیقه اکبر است(، عصمت صغرى، ولیه االله، الراضیه بالقدر و القضأ، صابره البلوى من غیر جزع و لا شکوى، امینه االله، عالمه غیر معلمه، فهمه غیر مفهمه، محبوبه المصطفى ، ثانیه الزهرا ، الشریفه. ⟦285⟧"],["p","از نسل على فرزند حضرت زینب  که معروف به زینبى است فرزندان زیادى به دنیا آمده اند، که سیوطى رساله زینبیه را در باره تألیف کرده است. ⟦286⟧"],["h","ماجراى ولادت حضرت"],["p","هنگام ولادت آن حضرت، پیامبر  در سفر بودند. امیر المؤمنین  براى نامگذارى این مولود فرمودند: «بر پیامبر  در سفر بودند. امیر المؤمنین  براى نامگذاى این مولود فرمودند: «بر پیامبر  سبقت نمى گیرم». تا آنکه حضرت آمدند و منتظر وحى شدند. جبرئیل نازل شد و عرض کرد: خداوند سلام مى رساند و مى فرماید: «این دختر را زینب نام بگذار، چه اینکه نام را در لوح محفوظ نوشته ایم»."],["p","پیامبر  حضرت زینب  را طلب کرده بوسیدند و فرمودند: «وصیت مى کنم به حاضرین و غایبین که این دختر را به خاطر من پاس بدارید، که همانا وى به خدیجه کبرى  مانند است». سکینه و وقار آن حضرت را به خدیجه کبرى  و عصمت و حیائش را به فاطمه زهرا  و فصاحت و بلاغتش را به على مرتضى  و حلم و بردباریش را به حسن مجتبى  و شجاعت و قوت قلبش را به حضرت سید الشهدأ  همانند نموده اند."],["p","ابن حجر در اصابه و ابن اثیر در اسد الغابه در حالات آن حضرت نوشته اند: در مجلس یزید لعنت االله علیه حضرت زینب  کلماتى فرمودند که دلالت بر قوت قلب آن حضرت دارد. آن حضرت در کرم و بصیرت و حلم مشهور خاندان بنى هاشم و عرب بوده، و بین جمال و جلال، سیرت و صورت و اخلاق و فضیلت جمع کرد. شبها در عبادت بود و روزها روزه، و او به اهل تقوى معروف بود. ⟦287⟧"]]},{"k":"day","key":6,"label":"","items":[["t",1,"جنگ موته"],["p","در سال هفتم هجرت در چنین رزى جنگ موته به وقوع پیوست. تعداد مسلمین در این جنگ سه هزار نفر و تعداد کفار صد هزار نفر بود."],["p","این جنگ از آنجا آغاز شد که حارث بن امیر ازدى که حامل نامه اى از پیامبر  به قیصر روم بود، در زمینهاى موته به دستور شرحبیل بن عمرو سردار لشکر روم دستگیر شد و دستهاى او را بستند و گردنش را زدند. پیامبر  از شنیدن این خبر بسیار ناراحت شدند و لشکرى به موته روانه فرمودند. در این جنگ پیامبر  و امیر المؤمنین  حضور نداشتند و آن حضرت سه امیر به تربیت بر لشکر قرار دادند و فرمودند: «هر یک شهید شدند دیگرى امیر لشکر باشد. جعفر بن ابى طالب، زید بن حارثه، عبد االله بن رواحه»."],["h","شهادت سه فرمانده"],["p","هر سه این بزرگواران شهید شدند. اول جناب جعفر به میدان آمد و بعد از مبارزه دلیرانه اى دو دست آن حضرت را قطع کردند، و با اینکه جراحتهاى زیادى بر بدن جناب جعفر وارد شده بود، اما بواسطه هیبت و شجاعهاى آن حضرت در میدان، کسى جرأت جدا کردن سر آن حضرت را نمى کرد. لذا دشمن دفعه حمله کرد و بدن آن حضرت را با نیزه از زمین بلند کردند. در همان لحظه پیامبر  در مدینه بر فراز منبر تشریف داشتند و ماجرا را براى مردم بیان مى فرمودند. ناگهان صورت مبارك را به طرف آسمان بلند کردند و در حق جعفر دعا فرمودند. خداوند دو بال به آن بزرگوار عنایت فرمود که با ملائکه در بهشت پرواز مى کند."],["p","پس از شهادت هر سه امیر تعیین شده از طرف پیامبر ، را در یک قبر دفن کردند. از خبر شهادت جناب جعفر، پیامبر  بسیار گریستند و دستور دادند تا سه روز غذا به منزل جعفر ببرند."],["h","سوابق جعفر"],["p","اولین مردى که بعد از على  به امر جناب ابو طالب  پشت سر پیامبر  نماز خواند، جناب جعفر بود. او از برادرش امیر المؤمنین عليهالس لا م ده سال بزرگتر بود."],["p","در حبشه هنگامى که عمرو عاص و دیگران قصد داشتند نجاشى را راضى کنند که جعفر و همراهانش را تحویل دهد، او آیاتى از کتاب الهى تلاوت نمود که نجاشى و اطرافیانش گریستند. عمرو عاص چندین بار خواست جعفر و مسلمانان را نزد نجاشى افرادى نادرست جلوه دهد ولى نتیجه بر عکس شد و احترام آنها نیز نزد نجاشى بیشتر شد، مخصوصا زمانى که آیات در رابطه با حضرت عیسى  قرائت شد."],["p","آخر الامر عمرو عاص غذایى مسموم تهیه کرد و براى جعفر فرستاد که آن حضرت را شهید کند، ولى گربه اى آمد و از آن غذا مختصرى خورد و بقیه غذا ریخت و آن گربه هم مرد، و توطئه عمرو عاص فاش شد."],["p","در روز فتح خیبر، جعفر به همراه همسرش و دیگر مسلمانان به مدینه آمدند، و پیامبر  از آمدن آنان بسیار خوشحال شدند و فرمودند: «نمى دانم به کدام خوشحال تر باشم: به فتح خیبر یا به آمدن جعفر » ⟦288⟧؟!"]]},{"k":"day","key":10,"label":"","items":[["t",1,"جنگ جمل"],["p","در سال 36ه در چنین روزى، جنگ جمل اتفاق افتاد ⟦289⟧ و بصره فتح شد و نزول نصر از خداوند کریم بر امیر المؤمنین  واقع شد. ⟦290⟧ کفعمى (رحمه االله) 15این ماه را روز جنگ جمل مى داند. ⟦291⟧"],["p","ابتداى این واقعه از آنجا شروع شد که بعد از بیعت مردم با امیر المؤمنین ، طلحه و زبیر به بهانه عمره از مدینه خارج شدند و به عایشه پیوستند. عبد االله بن عامر که قبلا عامل عثمان در بصره بود و از طرف امیر المؤمنین  عزل شده بود، به مکه آمد و شترى که دویست دینار خریده بود براى عایشه آورد و به طرف بصره حرکت کردند تا به این شهر رسیدند. پس از ورود، به خانه عثمان بن حنیف عامل امیر المؤمنین  ریختند و او را اسیر کردند و بسیار کتک زدند."],["p","امیر المؤمنین  براى مقابله با آنها به طرف بصره حرکت فرمودند. در این جنگ همراه امیر المؤمنین ، امام حسن و امام حسین ، و همچنین محمد حنفیه و عبد االله بن جعفر و اولاد عقیل و عده اى از جوانان بنى هاشم همراه با عمار و ابوایوب انصارى و عده اى از مهاجر و انصار بودند 80. نفر از اصحاب بدر 250، نفر از کسانى که با پیامبر  در بیعت شجره شرکت کرده بودند و 1500نفر از سایر اصحاب پیامبر  شرکت کردند. ⟦292⟧"],["p","مسلم مجاشعى را همراه با قرآنى فرستادند که بصریان را به حکم قرآن بخواند، ولى آنها مسلم را هدف تیر ساختند و شهید کردند. بعد از موعظه هاى عمار و فرمایشات امیر المؤمنین ، در دهم جمادى الاولى جنگى را که عایشه شروع کرده بود ادامه دادند و امیر المؤمنین ، در دهم جمادى الاولى جنگى را که عایشه شروع کرده بود ادامه دادند و امیر المؤمنین  در مقام مقابله با آنها بر آمدند. در این جنگ از لشکر امیر المؤمنین که 20هزار مرد جنگى بودند پنج هزار نفر شهید شدند، و از لشکر عایشه که 30هزار نفر بودند 13000نفر کشته شدند. ⟦293⟧"],["p","آخر الامر که پیروزى نصیب لشکر امیر المؤمنین  شد، حضرت کنار هودج عایشه آمدند و فرمودند: «اى حمیرا، پیامبر تو را امر کرده بود که به جنگ من بیرون آیى؟ آیا تو را امر نفرمود که در خانه خود بنشینى و بیرون نیایى؟ بخدا سوگند، انصاف ندادند آنانکه زنهاى خود را پشت پنهان داشتند و تو را بیرون آوردند». محمد بن ابى بکر خواهرش را از هودج بیرون کشید. امیر المؤمنین دستور داد او را به خانه صفیه دختر حارث بن ابى طلحه ببرند و بعد او را به مکه از مکه به مدینه فرستاد. در این جنگ زید بن صوحان که از بزرگان لشکر و شیعیان امیر المؤمنین  بود شهید شد و آن حضرت بالاى سرش آمده فرمودند: «اى زید، خدا رحمتت کند که تعلقات دنیوى تو اندك بود، و امداد تو در دین بسیار بود»."],["t",2,"تحویل پیراهن امام حسین  به حضرت زینب "],["p","در این روز حضرت زهرا  پیراهن ابراهیم خلیل الرحمن  را به زینب کبرى  دادند و فرمودند: «هنگامى که برادرت حسین  این پیراهن را از تو خواست، بدانکه ساعتى بیشتر مهمان تو نیست، و سپس به بدترین حالات به دست اولاد زنا کشته مى شود»."],["p","این برنامه سه روز قبل از شهادت حضرت زهرا  بود. ⟦294⟧"]]},{"k":"day","key":13,"label":"","items":[["t",1,"شهادت حضرت زهرا "],["p","شهادت مظلومانه و جانگداز حضرت امام الائمه النجبأ صدیقه کبرى فاطمه زهرا  در مدینه 75روز پس از رحلت پیامبر  واقع شده است. ⟦295⟧ اقوال دیگر درباره شهادت حضرت در سوم جمادى الثانیه خواهد آمد."],["p","در شب چهاردهم، امیر المؤمنین  به همراه جمعى قلیل از گلهاى سر سبد اصحاب، بدن مطهر صدیقه کبرى  را به خاك سپردند."],["p","به سند صحیح از حضرت صادق  روایت شده است که حضرت فاطمه  75، روز بعد از پیامبر (صلى االله علیه و آله ) زنده بود. بنابر مشهور که وفات آن حضرت در 28صفر باشد، شهادت حضرت صدیقه  در 13یا 14 یا 15جمادى الاولى مى شود در این سه روز زیارت آن حضرت مناسب است. ⟦296⟧"]]},{"k":"day","key":27,"label":"","items":[["t",1,"وفات جناب عبد المطلب "],["p","⟦297⟧"],["p","در هشتمین سال ولادت پیامبر  حضرت عبد المطلب از دنیا رفت. ⟦298⟧ لازم به ذکر است که بنابر فرمایش علامه مجلسى در مرآه العقول 8، سال و 2 ماه و 10روز از سن مبارك رسول االله  گذشته بود که عبد المطلب  از دنیا رفت، اگر سال قمرى باشد روز رحلت 27جمادى الاولى است و اگر مراد سال شمسى باشد تقریبا 27شعبان مى شود. ⟦299⟧ قول دیگر در وفات آن حضرت روز دهم ربیع الاول است."]]},{"k":"day","key":29,"label":"","items":[["t",1,"وفات محمد بن عثمان عمرى"],["p","وفات دومین نائب خاص امام عصر صلوات االله علیه، جناب ابوجعفر محمد بن عثمان بن سعید عمرى (رحمه االله) در چنین روزى واقع شده است. ⟦300⟧"]]}]},{"name":"جمادى الثانى","groups":[{"k":"intro","key":0,"label":null,"items":[["p","ماه جمادى الثانیه روزهاى حزن و سرور را بهم در خود جاى داده است. در روزهاى 3، 4، 12، 13، 19، 20، 21، 22، 27، 28، 29ایامى است که این خبرها را مى توان در آنها جستجو کرد."],["p","شهادت حضرت زهرا ، وفات حضرت ام کلثوم ، وفات حضرت ام البنین ، شهادت سلطان على بن محمد الباقر ، وفات حضرت سید محمد بن على الهادى ، و شهادت ابراهیم بن مالک اشتر حوادث حزن انگیز این ماه هستند."],["p","روز از دواج والدین پیامبر  حضرت عبد االله و آمنه ، سپردن پیامبر  به حلیمه سعدیه، ولادت حضرت زهرا ، مرگ ابوبکر، مرگ هارون الرشید وقایع سرور آفرین این ماه اند."]]},{"k":"day","key":3,"label":"","items":[["t",1,"شهادت حضرت زهرا "],["p","⟦301⟧"],["p","امام رضا  مى فرماید: ان فاطمه صدیقه شهیده «: همانا فاطمه راستگو و شهیده است.» ⟦302⟧"],["p","در این روز در سال 11ه بنابر قول 95روز، در روز سه شنبه شهادت حضرت بتول عذرأ مظلومه مضروبه حضرت سید النسأ فاطمه زهرا  به وقوع پیوسته است. ⟦303⟧"],["p","بعد از شهادت و دفن پیامبر  سه بار به منزل امیر المؤمنین و فاطمه زهرا  هجوم آورده، و در هر بار به طریقى جسارت به اهل بیت  کردند. در یکى از این دفعات، که در منزل آن حضرت را آتش زدند و به زور وارد منزل شدند، حضرت صدیقه  پشت در بودند."],["p","با اینکه مى دانسته آن حضرت پشت در است، بالگد و فشار در را باز کردند، و میخ در سینه آن مخدره را آزرد و محسن  سقط شد و پهلوى آن حضرت بیهوش روى زمین قرار گرفت، و حضرت مولى الموحدین  را با سر و پاى برهنه و دست بسته به طرف مسجد بردند."],["p","وقتى حضرت زهرا  به هوش آمدند به دنبال امیر المؤمنین  رفتند، و از بردن آن حضرت به مسجد مانع شدند. داخل کوچه جلو چشم همسرش اسد االله الغالب امیر المؤمنین على بن ابى طالب ، با تازیانه و غلاف شمشیر بر بدن حضرت صدیقه شهیده  زدند که طبق بعضى روایات از بازورى آن حضرت خون جارى شد و باز بیهوش روى زمین قرار گرفتند."],["h","روزهاى حزن فاطمه "],["p","بعد از این وقایع و فجایع آن حضرت بعضى روزها با دلى شکسته و محزون کنار قبور شهداى احد مى رفت و مى گریست، و مرگ خود را از خداوند طلب مى کرد، تا اینکه آهسته آهسته درد و جراحتهاى بدن بیشتر شد، و از آن به بعد نزدیک مدینه زیر درختى مى نشست و گریه و ناله مى کرد. منافقین آن درخت را هم بریدند. بعد از آن امیر المؤمنین  در آنجا سایبانى ساختند که مشهور به «بیت الاحزان» شد."],["p","روز به روز بر شدت بیمارى بى بى افزوده مى شد. سینه شکسته و مجروح، بازوى ورم کرده، صورت نیلى، محسن سقط شده، غم پیامبر ،، مظلومیت امیر المؤمنین ، کا را به جایى رساند که آن حضرت در بستر بیمارى افتاد، و وصیت هاى خویش را به امیر المؤمنین  فرمود: «شبانه مرا از زیر پیراهن غسل بده و کفن کن و دفن نما. قبرم مخفى باشد و ابوبکر و عمر در تشییع و نماز من حاضر نشوند.» ⟦304⟧"],["h","مدینه در شهادت فاطمه "],["p","روز شهادت آن حضرت، مدینه مثل روز شهادت خاتم الانبیأ  شده بود. کوچک و بزرگ از زن و مرد، نالان و گریان بودند. بدن مطهر آن حضرت شبانه غسل داده شد و هنگام غسل، امیر المؤمنین و حسنین و زینبین  و فضه خادمه و امأ بنت عمیس حاضر بودند. سپس عده اى از گلهاى سر سبد اصحاب امیر المؤمنین : سلمان، ابوذر، مقداد، عمار و... حاضر شدند و بدن را دفن کردند."],["p","در بقیع، چهل صورت قبر ترتیب دادند و بر آنها مقدارى آب ریختند. ⟦305⟧ فرداى آن روز منافقین قصد نبش قبر را نمودند، ولى امیر المؤمنین  اجازه نفرمودند."],["p","احتمالات در محل دفن آن حضرت متعدد است، ولى زیارت آن حضرت در مسجد النبى ، حجره خود آن حضرت -که در زمان ما جزء صحن مسجد است -بین محراب و منبر، و در بقیع وارد شده است."],["p","مدت عمر آن مخدره مظلومه 18سال و 60روز یا 90روز است. سال شهادت یازدهم هجرى استم"],["h","اقوال در شهادت حضرت زهرا "],["p","اقوال در شهادت حضرت زهرا  چنین است:"],["p",".1چهل روز بعد از شهادت پیامبر  (ربیع الثانى). ⟦306⟧"],["p",".2چهل و پنج روز (سیزدهم ربیع الثانى). ⟦307⟧"],["p",".3شصت روز بعد از شهادت پیامبر . ⟦308⟧"],["p",".4هفتاد و دو روز بعد از شهادت پیامبر . ⟦309⟧" اینکه آن حضرت شهیده شدند و به مرگ طبیعى از دنیا نرفتند، فرمایش امام رضا  کافى است که مى فرمایند: «انها صدیقه شهیده»..."],["p","«همانا فاطمه  راستگو و شهیده است». ⟦320⟧ به مدارك زیر نیز مراجعه کنید:"],["p","مزار شیخ مفید: ص.156مقنعه شیخ مفید: ص.459بلد الامین: ص 198.278بحار الانوار: ج 25ص،373ج 27ص 261، 268، 270، ج 29ص،192ج 43ص 170، 197، 200، ج 53ص،23ج 97ص.197مصباح الزائر: ص.26 - 25مصباح المتهجد: ص.654من لایحضره الفقیه: ج 2ص"],["p",".574تهذیب الاحکام طوسى: ج 6ص.10الوافى: ج 14ص - 1370.1371جامع احادیث الشیعه: ج 12ص.264القاب الرسول و عترته : ص.43 - 39"],["p","پس در این روز شیعیان باید به عزادارى آن حضرت قیام نمایند و آن مظلومه را زیارت کنند و ظالمان و غاصبان حق او را نفرین نمایند."]]},{"k":"day","key":4,"label":"","items":[["t",1,"مرگ هارون الرشید"],["p","در شب چهارم سال 193ه شقى پلید هارون الرشید در سن 45سالگى به درك واصل شد. او 23سال خلافتکرد و قبرش پشت سر امام رضا  قرار دارد، ⟦321⟧ و جا دارد زائرین هارون را لعنت کنند."]]},{"k":"day","key":12,"label":"","items":[["t",1,"حرکت به سوى خبیر"],["p","در این روز در سال هفتم هجرى پیامبر  با 400نفر به سوى خیبر حرکت فرمودند. ⟦322⟧"]]},{"k":"day","key":13,"label":"","items":[["t",1,"وفات حضرت ام البنین "],["p","در این روز در سال 64ه حضرت ام البنین  همسر امیر المؤمنین  و مادر قمر بنى هاشم  از دنیا رحلت فرمودند. ⟦323⟧"],["p","نام مبارك آن حضرت فاطمه، و کنیه شریفش ام البنین است، و آن حضرت به هیمن کنیه معروفند. پدر آن حضرت حزام بن خالد، و مادرشان لیلى دختر شهید بن ابى عامر است."],["p","امیر المؤمنین آن حضرت را به همسرى برگزید و خداوند چهار پسر به آن حضرت عنایت فرمود: حضرت قمر بنى هاشم عباس ، عبد االله، جعفر و عثمان ، که هر چهار پسر در کربلا شهید شدند."],["p","بانوانى که از کربلا به مدینه مراجعت کردند، در خانه ام البنین  عزادارى مى کردند. آن حضرت اگر چه در کربلا نبود ولى از ناله و گریه قرار نداشت و همه روزه به بقیع مى رفت و آنقدر جانسوز مرثیه مى خواند که مروان با آن قساوت قلب گریه مى کرد. هنگامى که زنها او را ام البنین خطاب مى کردند و تسلیت مى دادند، مى فرمود: «دیگر مرا ام البنین نخوانید. »..."],["p","این گریه و زارى حضرت دامه داشت تا بدرود حیا گفت. ⟦324⟧"]]},{"k":"day","key":19,"label":"","items":[["t",1,"ازدواج حضرت عبد االله و آمنه "],["p","روز ازدواج حضرت عبد االله و آمنه  و باردار شدن آن حضرت به رسول اکرم  است. ⟦325⟧ سزاوار است مؤمنین آن شب را تعظیم و احترام نمایند و به عبادت احیأ کنند. ⟦326⟧"]]},{"k":"day","key":20,"label":"","items":[["t",1,"ولادت حضرت زهرا "],["p","در چین روزى حضرت حورأ انسیه عذرأ بتول ام ابیها حضرت فاطمه زهرا  در سال پنجم بعثت در مکه مکرمه به دنیا آمد. ⟦327⟧ بنابر قولى ولادت حضرت در دهم جمادى الآخر است. ⟦328⟧"],["h","انعقاد نطفه فاطمه "],["p","⟦329⟧"],["p","داستان انعقاد نطفه حضرت فاطمه زهرا  مراحلى دارد که ذیلا خلاصه آن آورده مى شود:"],["p",".1در شب معراج خداوند سیبى به پیامبر  هدیه داد که از عظمت خلقت و بوى و رنگ و زیبایى آن ملائکه تعجب کردند. خداوند امر فرمود تا پیامبر  آن را میل کند. هنگامى که آن سیب را شکافت، نورى ا آن درخشید. جبرئیل گفت: بخور یارسول االله، که این نور منصوره فاطمه، دخترى است که از صلب تو خارج مى شود. ⟦330⟧ در بعضى روایات است که از رطب بهشتى هم خاتم الانبیأ  میل فرمودند. ⟦331⟧"],["p",".2در 10شعبان سال چهارم جبرئیل  بر پیامبر  در ابطح نازل شد و فرمان کناره گیرى از حضرت خدیجه  را به مدت 40روز -به عنوان مقدمه حمل حضرت زهرا  -ابلاغ فرمود. ⟦332⟧"],["p","با اینکه آن حضرت علاقه و افرى به خدیجه  داشت و این کار براى آن حضرت پر مشقت بود، ولى براى خدیجه  پیغام داد که مدتى به منزل نمى آیم و به منزل فاطمه بنت اسد  مى روم. شبها در را ببند و در بستر آسایش کن."],["p","پیامبر  شبها به منزل فاطمه بنت اسد  مى آمد. هر شب هنگام افطار، خرما و انگور و غذاى بهشتى مى آوردند. با آب بهشتى و حوله دست آن حضرت را شسته و تمیز مى کردند. امیر المؤمنین  حسب دستور پیامبر  جلو در مى نشس که کسى نیاید و در آن غذا با پیامبر صلىا الله عليهوآل ه شریک شود. در شب چهلم دستور رسید به خانه خدیجه (علیها السلام ) برو که خداوند به خود سوگند خورده که امشب از صلب تو ذریه پاك و طیبه اى بیافریند. حضرت از جابر خاسته و به منزل خدیجه  آمدند."],["p","حضرت خدیجه  مى فرماید: سوگند به آن کسى که آسمان را برافراشته و آب را از زمین جوشانیده، حضرت از من دور نشده بود که سنگینى وجود فاطمه  را در خود احساس کردم. ⟦333⟧"],["h","دوران باردارى خدیجه "],["p","هنگامى که حضرت خدیجه  دوران آبستنى خود را مى گذراند، حضرت فاطمه  از داخل شکم با مادر صحبت مى فرمود، و او را دلدارى مى داد و به صبر و پایدارى دعوت مى فرمود."],["p","پیامبر  به خدیجه : «جبرئیل به من بشارت داد که این مولود دختر است، و او موجودى پاکو با برکت است، خداوند متعال نسل و ذریه مرا از او قرار مى دهد، و از نسل او امامانى در امت قرار خواهد داد که بعد از پایان یافتن وحى او، جانشینانش در روى زمین باشند»."],["p","هنگام ظاهر شدن آثار وضع حمل، سراغ زنان قریش فرستادند، ولى کسى براى کمک نیامد، چه اینکه آنها راضى به ازدواج حضرت خدیجه  با پیامبر  نبودند، و خدیجه  از این بر خورد آنها غمناك شد."],["p","در همین حال چهار زن بلند بالا که شبیه زنان بنى هاشم بودند بر او وارد شدند. یکى از آنان به او گفت: اى خدیجه، غمگین مباش که ما فرستادگان پروردگان تو هستیم. ما خواهران توایم، من ساره هستم، و این آسیه دختر مزاحم و همنشین تو در بهشت و این مریم دختر عمران و این صفورأ دختر شعیب است. خداوند ما را نزد تو فرستاده تا در کارهاى مربوط به زنان به تو کمک کنیم.» ⟦334⟧ یکى از آنان در سمت راست او، و دیگرى در سمت چپش، و سومى پیش روى آن حضرت، و چهارمى پشت سر او نشستند."],["h","فاطمه  به دنیا آمد"],["p","علیا مخدره خدیجه ، حضرت فاطمه زهرا  را پاك و پاکیزه بر زمین نهاد. در این هنگام نورى از وجودش درخشید که تمام خانه هاى مکه را روشن کرد، و این نور در شرق و غرب درخشش نمود. بانویى که پیش روى خدیجه  بود، حضرت فاطمه  را برداشت و با آب کوثر شستشو داد، و پارچه سفیدى که از شیر سفیدتر و از مشک و عنبر خوشبوتر بود بیرون آورد. یکى را بر بدن او پیچیده و دیگرى را بر سرش انداخت و سپس از او خواست که سخن بگوید."],["p","حضرت فاطمه  لب به سخن گشود، و فرمود: اشهد ان لا اله الا االله، و ان أبى رسول االله سید الانبیأ و ان بعلى سید الاوصیأ و ان ولدى سید الأسباط: «گواهى مى دهم که جز االله خدایى نیست، و پدرم فرستاده خدا و سرور پیامبران است، و شوهرم سرور جانشینان و فرزندانم آقاى نودگان و اسباط هستند». بعد بر یکایک آنان سلام کرده و هر کى را به اسم صدا زد. آنان بر چهره او تبسم کردند، و حور العین و بهشتیان یکدیگر را به ولادت حضرت فاطمه  بشارت دادند. در آسمان نورى درخشان پدید آمد که ملائکه تا آن روز چنان نورى را ندیده بودند، و لذا نام حضرت را «زهرا»گذاشتند. بانویى که پیش روى خدیجه  نشسته بود، به خدیجه  گفت: «او را پاك و پاکیزه و آراسته و با برکت در برگیر، که در نسل و ذریه اش برکت قرار داده شده است»."],["p","خدیجه ، حضرت را با شادى و خشنودى از دست او گرفته، و سینه در دهانش گذارده و دهان او را پر از شهیر کرد، و این گونه بود که فاطمه  رشد جسمى خود را آغاز کرد"],["p","⟦335⟧"]]},{"k":"day","key":21,"label":"","items":[["t",1,"وفات حضرت ام کلثوم "],["p","جناب ام کلثوم ، چهار ماه پس از بازگشت از کربلا به مدینه از دنیا رفتند. ⟦336⟧ پدرشان مولى الموحدین امیر المؤمنین  و مادرشان حضرت زهراى مرضیه  است. ⟦337⟧"],["p","صاحب ریاحین الشریعه به نقل از اعیان الشیعه مى فرماید: امیر المؤمنین  آن مخدره را به عون بن جعفر طیار تزویج نمودند. ⟦338⟧"],["p","آنچه در مورد از دواج ام کلثوم  با غیر عون بن جعفر نقل شده از بافته هاى مخالفین است. آن حضرت در واقعه جانسوز کربلا حضور داشتند و بعد از شهادت امام حسین  و اهل بیت و اصحابشان در کنار خواهرشان حضر زینب  از بانوان و یتیمان محافظت مى نمود، و اشعار آن حضرت در فراق برادر در کربلا مشهور و جانسوز است."],["p","پس از عاشورا که بانوان به اسارت کوفه و شام رفتند. خطبه آن حضرت در شهر کوفه و مجلس ابن زیاد، اشعار آن حضرت در قادسیه و قنسرین، اثر دعاى آن حضرت در سیبور و بعلبک، کلمات آن جناب با شمر هنگام ورود به دروازه شام، مرثیه هاى حضرت در اربعین و مراجعت به مدینه، دلالت بر عظمت و شجاعت و صبر آن مخدره دارد."],["p","سرانجام بعد از چهار ماه از ورود به مدینه با دلى پر از غم و اندوه در مصائب کربلا بالأخص شهادت سید الشهدأ  رحلت نمود و در مدینه منوره دفن شد. به قولى رحلت آن حضرت در آخر ماه جمادى الثانى بوده است. ⟦339⟧"]]},{"k":"day","key":22,"label":"","items":[["t",1,"مرگ ابوبکر"],["p","در شب سه شنبه 22جمادى الثانى در سال 13ه عبد االله بن عثمان معروف به ابوبکر بن ابى قحافه در سن 67سالگى، از این جهان به سوى سزاى اعمالش رخت بربست. ⟦340⟧ به قولى مرگ ابوبکر رد 27جمادى الثانى بوده است. ⟦341⟧ او مدت دو سال و سه ماه و بیست و دو روز غاصب خلافت بود، و اولین کسى بود که بعد از شهادت پیامبر  به انتخاب اعضاى سقیفه بنى ساعده خلیفه شد. انتخاب ابوبکر بن گونه اى بى حساب بود که عمر با آنکه خود گرداننده برنامه سقیفه بود مى گوید: «بیعت با ابوبکر امرى بدون تدبیر و مشورت و دقت بود، مثل زمان جاهلیت، که خداوند مسلمانان را از شر آن محفوظ داشت. هر کس چنین کارى را تکرار کند او را بکشید.» ⟦342⟧"],["p","اهل سنت در علت مرگ او نوشته اند: ابوبکر در روز دوشنبه 7جمادى الآخر غسل کرده بود، و آن روز هوا سرد بود. به این دلیل سرما خورد و تب کرد 15، روز این تب ادامه داشت، و به نماز نمى رفت، تا در شب سه شنبه 22 جمادى الآخر بعد از آنکه خلافت را به عمر واگذار کرد، مرد. ⟦343⟧"],["p","قبل از وفات عثمان را براى نوشستن وصیت نامه اى درباره خلافت طلب کرد که امر خلافت بعد از ابوبکر با عمر بن خطاب باشد. او کلمه اى گفت و بیهوش شد، و بقیه را عثمان از پیش خود نوشت که امر خلافت با عمر است. ابوبکر به هوش آمد و عثمان را دعا کرد که آنچه او مى خواسته نوشته است. ⟦344⟧"],["p","باید پرسید: چرا هنگامى که پیامبر  در روزهاى آخر عمر کاغذ و قلم خواست تا وصى بعد از خود را به امر خداوند معین کند نسبت هذیان به آن مقام معظم دادند؟"],["p","ابوبکر هنگام مرگ کلماتى گفت. از جمله اینکه: «کاش تفتیش خانه فاطمه و على  نمى کردم.» ⟦345⟧ همان تفتیشى که شهادت پاره تن پیامبر  را به همراه داشت؟"]]},{"k":"day","key":27,"label":"","items":[["t",1,"شهادت سلطان على بن محمد الباقر "],["p","در این روز در سال 116ه جناب ابوالحسن سلطان على فرزند امام باقر  در اردهال کاشان به شهادت رسید. ⟦346⟧"],["p","عده اى از دوستان اهل بیت  از اهالى چهل حصرانو فین کاشان نامه اى خدمت امام باقر  نوشتند، که چون ما از محضر شما دور هستیم یکى از آقازادگان خود را براى راهنمایى و تربیت ماه و تعلیم احکام به جانب ما بفرستید."],["p","آن حضرت فرزند بزرگوار خود، جناب على بن محمد  را با رسوالان فرستاده، روانه کاشان کردند؛ و اسباب سفر آن حضرت را برادرش امام صادق  فراهم نمودند."],["p","هنگام ورود آن حضرت، در فین حدود شش هزار نفر براى استقبال آمدند. حضرت مدتى در جاسب و خاوه مشغول هدایت مردم بودند، و بیشتر در مسجد جامع کاشانى -که فعلا در کوى میدان کهنه واقع است -مشغول عبادت بودند و شیعیان براى اداى نماز جمعه خدمتش مشرف مى شدند، و کرامات زیادى مشاهده مى نمودند."],["p","آن حضرت نامه هایى براى پدر بزرگوارش به مدینه مى فرستاد و حالات خود و شیعیان را بیان مى فرمود، تا در سال 144ه خبر شهادت پدر بزرگوارش به آن حضرت رسید و بعد از سه سال از شهادت پدر بزرگوارش در سال 116 ه، مخالفین آن حضرت را به عده اى از دوستان و موالیان و منسوبین به آن حضرت شهید کردند."],["p","از آنجا که 27جمادى الاثنى در سال شهادت آنحضرت مصادف با 17مهر ماه شمسى بوده، هر سال به مناسبت سالگرد آن حضرت در جمعه دوم مهرماه مراسم قالى شویان همراه با عزادارى با شکوهى کنار قبر مطهرش برگزار مى شود. ⟦347⟧"],["p","هم اکنون درسرداب زیر ضریح مقدس آن حضرت، بدن مبارك حدود صد نفر از آن شهداى بزرگوار تازه و سالم هست، که مرحوم آیه االله سید شهاب الدین مرعشى نجفى مشاهده فرموده اند. ⟦348⟧"]]},{"k":"day","key":28,"label":"","items":[["t",1,"سپردن پیامبر  به حلیمه سعدیه"],["p","در این روز جناب عبد المطلب  نور چشم خود پیامبر را در اطراف کعبه طواف داد و آن حضرت را براى شیر دادن به حلیمه سعدیه سپرد. ⟦349⟧"]]},{"k":"day","key":29,"label":"","items":[["t",1,"وفات حضرت سید محمد فرزند امام هادى "],["p","⟦350⟧"],["p","حضرت سید محمد فرزند امام هادى  در سال 252ه در سامرأ از دنیا رفت. ⟦351⟧"],["p","آن حضرت را ابوجعفر و ابوعیل و سید محمد بعاج نیز مى گفتند."],["p","جلالت قدر و منزلت او به حدى بود که عده اى از شیعیان گمان مى کردند بعد از امام هادى  آن بزرگوار امام خواهد بود، ولى با رحلت ایشان در زمان پدر بزرگوارش بر همه معلوم شد که امام حسن عسکرى  امام پس از ایشان است."],["p","امام عسکرى  به جناب سید محمد  علاقه وافرى داشت، به حدى که هنگام رحلت او گریبان چاك کرد. بعد از رحلت، آن حضرت را در آبادى به نام بلد، در شش فرسخى سامرأ دفن نمودند، که هم اکنون قبر او در آنجا معروف است."],["p","کرامات زیادى از آن حضرت مشاهده شده، و هم اکنون داراى گنبد و صحن و غرفه هاى متعدد است، و دوستان اهل بیت  به زیارت آن بزرگوار مشرف مى شوند. نسب سادات آل بعاج در عراق و خوزستان به على و احمد فرزندان سید محمد بعاج منتهى مى شود."]]},{"k":"tail","key":"تتمه این ماه","label":null,"items":[["t",1,"شهادت ابراهیم بن مالک اشتر"],["p","در این ماه در سال 71ه ابراهیم پسر مالک اشتر نخعى (رحمه االله) به شهادت رسید. ⟦352⟧"]]}]},{"name":"رجب المرجب","groups":[{"k":"intro","key":0,"label":null,"items":[["p","ماه رجب بسیار پر خاطره و بیاد ماندنى است. ایام ولادت امامان  و بعثت پیامبر  از یک سو، و مرگ چند تن از دشمنان معروف اهل بیت  از سوى دیگر، خبرهاى خوشى است که این ماه را قرین سرور ساخته است. شهادت معصومین  و چند نفر از یاران باوفاى ایشان نیز روزهاى حزن آل محمد  در این ماه است."],["p","در روزهاى 1، 2، 3، 10، 12، 13، 14، 15، 16، 17، 18، 22، 21، 24، 25، 26، 27، 28، 29ماه رجب خاطره هایى تازه مى شود که ذیلا به مرور آنها مى پردازیم."],["p","ولادت امیر المؤمنین ، امام باقر ، امام جواد ، امام على النقى ، و حضرت على اصغر  برکات متواصلى است که در این ماه نازل شده است. بعثت پیامبر ، خروج از شعب ابى طالب ، و اعطاى فدك به حضرت زهرا  خبرهایى هستند که از بعد اعتقادى اهمیت ویژه اى دارند. مرگ معاویه و مأمون و معتمد عباسى نیز ایام شادى براى دوستان اهل بیتند. شهادت حضرت زهرا  به قولى، و نیز شهادت امام صادق  و امام موسى بن جعفر  و امام هادى  روزهاى اشک و حزن در این ماه اند. وفات حضرت زینب ، حضرت ابوطالب ، حضرت خدیجه ، ابراهیم فرزند پیامبر ، و نجاشى پادشاه حبشه خبرهاى حزن آور این ماه به شمار مى آیند."],["p","همچنین حمله به امام مجتبى  در مدائن و خروج امام حسین  از مدینه به سوى مکه دو خبر مهم این ماه است."],["p","اولین اقامه نماز در اسلام، هجرت مسلمانان به حبشه و بازگشت آنان، تغییر قبله، فتح خیبر به دست امیر المؤمنین ، غزوه نخله، ورود امیر المؤمنین  به کوفه، اولین خطبه امیر المؤمنین  در مسجد کوفه، اول خلافت شوم یزید، فرار ابوبکر و عمر در جنگ خیبر صفحات دیگرى از تاریخ اسلام اند که در ماه رجب رخ داده است."]]},{"k":"day","key":1,"label":"","items":[["t",1,"زیارت امام حسین "],["p","در شب و روز اول این ماه زیارت مولانا الشهید ابى عبداالله الحسین  مستحب است. ⟦353⟧ از حضرت صادق  روایت شده که فرمودند: «کسى که امام حسین  را در روز اول رجب زیارت کند، خداوند متعال گناهان او را مى بخشد». اگر براى کسى زیارت آن حضرت در این روز ممکن نباشد، مشاهد مشرفه دیگر معصومین  را زیارت کند و اگر این هم برایش ممکن نبود با سلام از راه دور به طرف آن قبور شریف اظهار ارادت نماید. ⟦354⟧"],["t",2,"ولادت امام باقر "],["p","حضرت امام محمد بن على باقر العلوم  در روز جمعه اول رجب سال 57ه در مدینه تولد شدند. ⟦355⟧ ولادت آن حضرت روزهاى سوم و ششم صفر و پنجم و بیست و دوم رجب هم ذکر شده است."],["p","نام مبارك آن حضرت محمد، کنیه ایشان ابو جعفر و القاب آن حضرت باقر العلوم، الشاکر الله، هادى، امین و شبیه است. و لقب اخیر به خاطر شباهت آن حضرت به پیامبر  است. ⟦356⟧"],["p","پدر بزرگوارش حضرت امام زین العابدین على بن الحسین  و مادر آن حضرت ام عبد االله فاطمه دختر امام حسن مجتبى  است. ⟦357⟧ امام باقر  اولین علوى است که از پدر و مادر نسب شریفش به پیامبر  و امیر المؤمنین و حضرت زهرا  مى رسد."],["p","امام صادق  درباره ام عبد االله مى فرمایند: «از زنهاى با ایمان و پرهیزکار و نیکوکار بود.» ⟦358⟧ در روایت دیگر امام صادق  مى فرمایند: «در میان فرزندان امام حسن  مثل او نبود». در عظمت و شرافت این بانو همین بس که با حضرت سید الساجدین على بن الحسین و باقر العلوم  در واقعه کربلا حضور داشت و همراه آن بزرگواران و زینب کبرى و دیگر اهل بیت  به اسارت رفت و وقایع کوفه و شام را دید."]]},{"k":"day","key":2,"label":"","items":[["t",1,"ولادت امام على النقى "],["p","در این روز بنابر قولى ولادت امام هادى  واقع شده است. ⟦359⟧ اقوال دیگر در ولادت آن حضرت 15ذى الحجه 5، رجب 27، جمادى الاخر و 3 رجب است؛ که تفصیل آن در 15ذى الحجه ذکر شده است."]]},{"k":"day","key":3,"label":"","items":[["t",1,"شهادت امام هادى "],["p","شهادت اما على النقى  در سال 254ه بنابر مشهور در سن 41سالگى بوده است. ⟦360⟧ مرحوم کلینى شهادت آن حضرت را در 26جمادى الاخر نقل فرموده است. ⟦361⟧ مشهور این است که آن حضرت 6یا 8سال و 5ماه داشت که پدر بزرگوار ایشان جواد الائمه  به شهادت رسیدند، و مدت امام آن وجود شریف 33سال بود. ⟦362⟧"],["p","ایام حیات امام هادى  مصادف بود با خلافت بناحق مأمون، معتصم، واثق، متوکل، منتصر، مستعین، معتز لعنه االله علیهم؛ و آخر الأمر معتز آن حضرت را با زهر شهید کرد."],["p","مدت عمر مبارك آن حضرت 41سال و چند ماه بود 13 ⟦363⟧ سال در مدینه اقامت فرمودند و بقیه ایام امامت خویش را به اجبار متوکل در سامرا بودند. حاکم مدینه به متوکل نوشت که اگر تو را به مکه و مدینه حاجتى است على بن محمد  را از این دیار بیرون ببر که همه را مطیع خود ساخته است. در مدینه اسباب اذیت و اضرار به آن حضرت را به دستور متوکل زیاد کردند، تا زمانى که آن حضرت را به سامرا بردند و جسارتها کردند، تا اینکه معتز آن حضرت را شهید کرد."],["p","امام عسکرى  غسل و کفن و نماز بر آن حضرت را انجام داد، و بعدا در ظاهر این امورات توسط دیگران انجام شد و ایشان را در منزل خود در مکان فعلى حرم مطهر دفن نمودند."]]},{"k":"day","key":10,"label":"","items":[["t",1,"ولادت امام جواد "],["p","حضرت جواد الائمه  بنابر مشهور در دهم ماه رجب سال 195ه به دنیا آمده اند. ⟦364⟧ اقوال دیگر در ولادت آن حضرت چنین است 17: ماه رمضان، 15ماه رمضان، ⟦365⟧ آخر ذى القعده، به قولى هم در 13رجب ولادت آن حضرت واقع شده است. ⟦366⟧"],["p","پدر بزرگوار آن حضرت امام رضا ، و مادر آن حضرت جناب سبیکه یا دره است که حضرت رضا  نام ایشان را «خیزران»نهادند. ⟦367⟧"],["p","نام آن حضرت محمد، و کنیه ایشان ابوجعفر و مشهورترین القاب آن حضرت تقى و جواد است. حضرت رضا  آن حضرت را به کنیه یاد مى کردند، و مى فرمودند: «ابو جعفر به من نامه نوشته است، »و نامه هایى که از آن حضرت مى رسید در نهایت جلالت و زیبایى بود، و هنگامى که امام  مى خواستند نام براى امام جواد  بنویسند آن حضرت را به بزرگى و احترام مورد خطاب قرار مى دادند. ⟦368⟧"],["p","یک روز در ایام کودکى حضرت جواد  آن حضرت را نزد پدر بزرگوارش امام رضا  آوردند. آن حضرت فرمودند: «این مولودى است که براى شیعه مبارکتر از او بدنیا نیامده است،» ⟦369⟧ چرا که چهل سال و چند ماه از سن مبارك امام رضا  گذشته بود و آن حضرت هنوز اولادى نداشتند، و بعضى از شیعیان در امر امامت نگران بودند، هنگامى که خداوند جواد الائمه  را به مولایمان حضرت رضا  داد، نگرانى و شک و تردید مردم بر طرف شد."],["p","آن حضرت شش فرزند داشت: ابوالحسن حضرت هادى ، ابوطالب جناب زید، ابو جعفر جناب موسى مبرقع، حکیمه خاتون، خدیجه خاتون، ام کلثوم. ⟦370⟧"],["t",2,"ولادت حضرت على اصغر "],["p","ولادت با سعادت حضرت باب الحوائج على اصغر  در این روز واقع شده است. ⟦371⟧ با در نظر گرفتن اینکه آن حضرت در شش ماهگى در روز عاشورا در کربلا به شهادت رسید، ولادت حضرت مطابق این روز مى شود. بعضى هم ولادت آن حضر را در روز 8یا 9ثبت کرده اند."],["p","نام شریف آن حضرت عبد االله مشهور به على اصغر است. لقب شریفش باب الحوائج، رضیع، مذبوح من الاذن الى الاذن است. پدر بزرگوارش امام حسین ، و مادر والامقامش حضرت رباب دختر امرء القیس کلبى است."],["p","قاتل آن حضرت، حرمله بن کاهل اسدى ملعون است که قلب امام حسین  و اهل بیت و شیعیان، بلکه هر شنونده این مصیبت را سوزاند."]]},{"k":"day","key":12,"label":"","items":[["t",1,"مرگ معاویه"],["p","در این روز سال 60ه معاویه بن ابى سفیان لعنه االله علیه در سن 78سالگى در شام به درکات جهنم شتافت. روز شادى اهل ایمان و حزن و اندوه اهل کفر و طغیان است. و روزه این روز به جهت شکر الهى بر هلاکت معاویه مستحب است. ⟦372⟧"],["h","نسب معاویه"],["p","کلبى نسابه و ابن روزبهان که از ثقات نزد علماى اهل سنت هستند، نقل کرده اند که معاویه فرزند چهار نفر بوده: عماره، مسافر، ابوسفیان و مردى که اسم او را نمى برند. راغب اصفهانى در محاضرات و ابن ابى الحدید از ربیع الابرار زمخشرى نقل مى کنند که معاویه را به چهار کس نسبت مى دادند: مسافر بن ابى عمرو، عمار بن ولید بن مغیره، عباس و صباح که مغنى عماره بن ولید بود. مادر معاویه هند با صباح -که جوان خوش رویى بود و کارگر ابوسفیان بود - الفتى تمام داشت! اما به ظاهر بو را معاویه بن ابى سفیان بن حرب مى گویند. ⟦373⟧"],["p","ابوسفیان مردى زشت و کوتاه قد بود، و یک چشم او در طائف و چشم دیگرش در یرموك کور شده بود. ⟦374⟧ باطنش کورتر از چشمش بود و نهایت عداوت و دشمنى با پیامبر صلىا الله عليه وآله به وجود مى آمد دخالت داشت و در سال فتح مکه از ترس اسلام آورد و با نفاق زندگى کرد تا در سن 82 سالگى در سال 30ه به درك رفت."],["p","مخفى نمایند که حمامه یکى از جدات معاویه است که در بازار المجاز صاحب پرچم و مشهور بود! و از این جانسب ابوسفیان هم معلوم مى شود. مادر معاویه هند است که از ذوات الاعلام است و میل فراوانى به غلامان سیاه داشت و از توضیح حال پدر معاویه وضع مادر او هند روشن مى شود. ⟦375⟧"],["p","محدث قمى (رحمه االله) مى فرماید: چون پیامبر  در فتح مکه ریختن خون معاویه را مباح شمردند، به اصرار و شفاعت عباس، پنج ماه قبل از شهادت پیامبر  اسلام آورد. ⟦376⟧"],["h","حکومت معاویه در شام"],["p","یزید بن ابى سفیان از طرف ابوبکر با لشکر مسلمین به طرف شام رفت، معاویه هم همراه آنها بود یزید در شام مرد و ابابکر ولایت شامات را به معاویه واگذار کرد و به این حال بود تا زمان خلافت امیر المؤمنین  که طغیان معاویه علیه آن حضرت شروع شد. پس اساس ظلمهاى معاویه را هم ابوبکر بنا نهاد."],["p","معاویه در سال 45ه براى پسرش یزید بیعت گرفت. او اول کسى بود که دشنام بر امیر المؤمنین  را ترویج کرد و در آخر خطبه نماز جمعه لعن و جسارت بر امیر المؤمنین  مى کرد. او دستور داد در تمام شهرها این لعن انجام شود و تا زمان عمر بن عبد العزیز ادامه داشت تا اینکه او لعن بر آن حضرت را منع کرد. ⟦377⟧"],["h","دشمنى معاویه با امیر المؤمنین "],["p","معاویه به صحابه و تابعین دستور داد تا حدیث در مذمت امیر المؤمنین  جعل کنند، و عده زیادى از محبین و ارادتمندان آن حضرت را شهید کرد مانند جناب مالک اشتر نخعى که در قلزم مصر به سم شهید شد. ⟦378⟧ امام مجتبى  را به دست جعده عیال آن حضرت مسموما شهید کرد."],["p","معاویه مردى خوش گذران و پرخور بود، به حدى که از کثرت خوردن مى گفت: «خسته شدم ولى سیر نشدم، »و این به خاطر نفرین حضرت رسول  درباره او بود. او در نفاق و عوام فریبى تجربه به سزایى داشت. محدث قمى (رحمه االله) نقل مى کند که دویست خبر از طرق معتمده اهل سنت در مذمت معاویه نقل شده است."],["h","ماجراى مرگ معاویه"],["p","آخر الأمر معاویه در مسیر مکه به شام بیمار شد، به حدى که مى لرزید و دهان او بسته نمى شد، تا وارد شام شد و در آنجا جان به مالک دوزخ داد و رهین اعمال خویش گردید. هنگام مرگ سن او را 75یا 82یا 92سال نقل کرده اند."],["p","جنایات او زیاده از آن است که در این مختصر بگنجد ولى در هنگام مرگ به یکى از خواص خود گفت: چند گناه بزرگ کرده ام: حق على بن ابى طالب را غصب کردم، حسن بن على را به فریب دادن جعده به شهادت رساندم، و یزید را به جانشینى خود انتخاب کردم، و حجر بن عدى و اصحاب او را به قتل رساندم. ⟦379⟧"],["p","در مرگ معاویه بعضى فقط ماه را ذکر کرده اند ⟦380⟧ و بعضى 4رجب ⟦381⟧ و برخى 22رجب ذکر نموده اند 12. ⟦382⟧ رجب 14، رجب 15، رجب هم نقل شده است که این 3قول به یکدیگر نزدیک ترند. ⟦383⟧"],["t",2,"ورود امیر المؤمنین  به کوفه"],["p","در این روز در سال 36ه امیر المؤمنین  بعد از واقعه جمل وارد کوفه شدند و آن شهر را به عنوان مقر حکومت انتخاب نمودند، و اولین خطبه را در شهر کوفه در این روز ایراد فرمودند. ⟦384⟧"]]},{"k":"day","key":13,"label":"","items":[["t",1,"ولادت امیر المؤمنین "],["p","⟦385⟧"],["p","اولین امام مؤمنین و خلیفه االله بلافصل بعد از رسول االله خاتم النبیین ، برادر، پسر عمو، وزیر و داماد او سید الوصیین امیر المؤمنین على بن ابى طالب  در روز جمعه 13رجب در بیت االله الحرام، داخل کعبه معظمه به دنیا آمد، که قبل از او و بعد از او مولودى در آنجا بدنیا نیامده و نخواهد آمد. ⟦386⟧ اسم شریفش على  است. صاحب کتاب الانوار مى گوید: على بن ابى طالب  در کتاب خدا 300اسم دارد. ⟦387⟧ مشهور ترین القاب آن حضرت امیر المؤمنین است و ابن شهر آشوب بیش از 850لقب براى آن حضرت ذکر نموده است. ⟦388⟧"],["h","القاب امیر المؤمنین "],["p","مشهور ترین کنیه هاى آن حضرت ابوالحسن  است. اضافه بر اسامى و القابى که آن حضرت در کتابهاى مختلف آسمانى به زبانهاى مختلف دارند... چه اینکه آن حضرت نزد اهل آشمان معروف به شمساطیل است. در زمین جمحائیل، در لوح قنسوم، در قلم منصوم، در عرش معین، نزد رضوان امین است، زند حور العین اصب است، در صحف ابراهیم  حزبیل است، در عبرانیه بلقیاطیس، در سریانیه شروحیل، در تورات ایلیا، در زبور اریا، در انجیل بریا، در صحف حجر عین، در قرآن على است. ⟦389⟧"],["h","والدین امیر المؤمنین "],["p","پدر والا مقام آن حضرت، سید بطحأ حضرت ابوطالب ، ⟦390⟧ و مادر آن حضرت فاطمه بنت اسد بن هاشم بن عبد مناف، بانوى حرم حضرت ابوطالب  است که انوار امامت و ولایت اولا از آن خزانه عصمت و گنجینه حیأ و عفت به ظهور آمده و اولین هاشمیه اى است که چنین اختر فروزنده اى آورد. آن حضرت نه تنها مادر امیر المؤمنین  بود، بلکه بعد از وفات عبد المطلب  -که شش یا هشت سال از سن مبارك پیامبر  گذشته بود و آن حضرت به ابوطالب  سپرده شده بود -فاطمه بنت اسد  در حق پیامبر  مادرى مى کرد و همیشه او را بر فرزندان خود مقدم مى داشت و همه روزه از آن حضرت علامات نبوت را مشاهده مى نمود و و پیامبر خدا  آن حضرت را مادر خطاب مى کرد. ⟦391⟧"],["p","همچنین بعد از رحلت حضرت خدیجه کبرى ، پیامبر  فاطمه الزهرا  را به فاطمه بنت اسد  سپردند. ایشان براى آن حضرت مادرى مى کرد و در دامان عزت خود آن مستوره دو جهان را با جان و دل سرپرستى مى کرد تا زمانى که از دنیا رفت. ⟦392⟧"],["p","آن حضرت در سال چهارم هجرى در مدینه طیبه از دنیا رفت، و در بقیع مدفون شد. هنگامى که امیر المؤمنین  خبر فوت والده اش را به پیامبر  دادند آن حضرت فرمودند: «او مادر من بود». بعد عمامه و لباسش را داد که فاطمه  را به آنها کفن کنند و خود حضرت بر جنازه نماز خواند و چهل تکبیر گفتم». بعد در قبر خوابید و هنگام دفن او را تلقین فرمود و درباره او دعا کرد. ⟦393⟧"],["h","نور امیر المؤمنین  در اصلاب پدران"],["p","حدیث ولادت امیر المؤمنین  هم دلالتى بر صلابت ایمان فاطمه بنت اسد  مادر آن حضرت دارد. ⟦394⟧ نورى که از عرض پروردگار آمده بود، در انبیأ و اوصیأ یکى بعد از دیگرى منتقل شده تا به عبد المطلب  رسید و بعد آن نور دو قسم شد. نورى در پیشانى مبارك عبد االله  پدر بزرگوار پیامبر  که آن نور بعدا به پیشانى آمنه  و سپس در صورت مبارك خاتم الانبیأ  منتقل شد. نصف دیگر نور در پیشانى مبارك ابوطالب  قرار گرفت."],["p","خداوند به ابوطالب  چند فرزند عطا فرمود: عقیل، طالب، جعفر، فاخته یا ام هانى، جمانه و على امیر المؤمنین . هنگامى که خداوند على  را به ابوطالب و فاطمه بنت اسد  داد، آن نور در صورت فاطمه بنت اسد  درخشندگى مى کرد."],["h","محل ولادت امیر المؤمنین "],["p","مکان ولادت امیر المؤمنین  اشرف بقاع یعنى حرم است. اشرف اماکن حرم مسجد است، و اشرف بقاع مسجد کعبه است. مولودى جز آن حضرت در آن مکان بدنیا نیامده است، آن هم در سید ایام روز جمعه، در ماه حرام و در بیت الحرام!! ⟦395⟧"],["p","امیر المؤمنین  سه روز چشم مبار را باز نکرد، او را خدمت پیامبر  آوردند. آنجا بود که چشم باز کرد. آن حضرت فرمود: «او مرا مخصوص به نظر خود قرار داد و من او را مخصوص به علم خویش قرار دادم.» ⟦396⟧ سپس آن حضرت را در آغوش کشید به منزل ابوطالب  آورد. ⟦397⟧"],["h","پیشگویى از ولادت امیر المؤمنین "],["p","⟦398⟧"],["p","جابر بن عبد االله انصارى مى گوید: راهبى بود به نام «مثرم بن رعیب»که 190سال عبادت کرد بود، ولى حاجتى از خدانخواسته بود. روز از خداوند خواست یکى از اولیائش را به او بنمایاند. خداوند متعال جناب ابوطالب  را نزد او فرستاد و بعد از آن که راهب دانست این آقا چه کسى است، به آن حضرت بشارت داد که اى ابوطالب، خداوند به تو پسرى عنایت مى فرماید که او ولى خداست و اسم شریف او على است. هنگامى که او را درك کردى سلام مرا به او برسان و به او بگو که مثرم راهب، اقرار مى کند به وحدانیت خدا و به ولایت تو یا امیر المؤمنین  شهادت مى دهد."],["p","هنگام رفتن جناب ابوطالب  خرما و انگور و انار بهشتى میل فرمودند و به منزل آمدند. فاطمه بنت اسد  بانوى حرم جناب ابوطالب  هم خرمایى که پیامبر  به آن حضرت داده بودند میل فرمود. پیامبر  فرموده بودند: این خرما را کسى مى خورد که مقر به توحید و نبوت من باشد."],["p","بعد از آنکه پدر و مادر آن حضرت، میوه هاى بهشتى را میل فرمودند وجود حضرت مولى الموحدین على بن ابى طالب  به وجود آمد. هنگامى که فاطمه بنت اسد  حامل آن وجود شریف شد، به زیبایى و نورانیتش افزوده شد."],["h","انعقاد نطفه امیر المؤمنین "],["p","⟦399⟧"],["p","هنگامى که وجود شریف آن حضرت در بطن فاطمه بنت اسد  قرار گرفت در مک زلزله شد، و قریش بتها را به کوه ابوقبیس آوردند، ولى زلزله بیشتر شد و بتهابه رو افتادند. آنان به ابوطالب  پناه بردند، و آن حضرت بالاى کوه آمد و فرمود: «مردم در این شب اتفاق مهمى افتاده است. خداوند خلقى را آفریده که اگر از او اطاعت نکنید اقرار به ولایت او ننمایید و شهادت به امامت او ندهید این زلزله ساکن نمى شود. پس به اطاعت و ولایت و امامت او اقرار کنید». سپس در حالى که اشک مى ریخت دستان مبارك را بلند نمود و فرمود: «پروردگار من و آقاى من، تو را مى خوانم به محمدیت پسندیده و علویت بلند مرتبه و به فاطمیت درخشنده و نورانى که بر سرزمین تهامه به رحمت و مهربانى خویش لطف بفرمایى». دیگران آمین گفتند. دعا که تمام شد زلزله پایان یافت. عربها در زمان جاهلیت تاگرفتار مى شدند این دعا را مى خواندند و گرفتارى برطرف مى شد."],["p","جعفر بن ابى طالب  صداى آن حضرت را از شکم مادر شنید و بیهوش شد. همچنین فاطمه بنت اسد  به قصد طواف گرد خانه خدا مى رفت، ولى ناگهان آن حضرت از داخل شکم دو پاى خود را به شدت فشار مى داد و نمى گذاشت مادرش به محلى که بتها نصب شده اند نزدیک شود، و حال آنکه مادرش براى عبادت خانه خدا را طواف مى کرد. زمانى دیگر، بتها در مقابل آن فرزند بدنیا نیامده به صورت به زمین مى افتادند. شیر درنده طائف در برابر ابوطالب  تعظیم کرد. هنگامى که آن حضرت على را جویا شد شیر گفت: شما پدر اسد االله و کمک محمد پیامبر خدا  و مربى شیر خدا هستى."],["h","مادر امیر المؤمنین  در کعبه"],["p","شب جمعه سیزدهم رجب بانوى بزرگوار ابوطالب  احساس درد کرد، ولى با قرائت نامى مخصوص آرامش پیدا کرد. هنگامى که جناب ابوطالب  خواست زنانى از قریش را براى کمک فاطمه بنت اسد  بیاورد، از گوشه خانه ندایى رسید: «اى ابوطالب، صبر کن چرا که دست نجس نباید ولى خدا را لمس کند»."],["p","صبح هنگام فاطمه بنت اسد  ندایى شنید: «اى فاطمه به خانه ما بیا». ابوطالب  و پیامبر  آن حضرت را به مسجد الحرام آوردند. عباس بن عبد المطلب که به همراه جماعى در مسجد نشسته بودند، دیدند که فاطمه  وارد مسجد الحرام شد و در مقابل کعبه ایستاد و نگاهى به سوى آسمان نمود و چنین فرمود: «پروردگارا، من به تو و به پیامبران و کتابهایى که از جانب تو آمده اند ایمان دارم. من کلام جدم ابراهیم خلیل را تصدیق مى کنم و او بوده که این خانه را بنا کرد، و به حق فرزندى که در شکم من است و با من سخن مى گوید و با گفتارش با من انس مى گیرد، و من یقین دارم که یکى از آیات و نشانه هاى توست، که این ولادت را بر من آسان فرمایى.» ⟦400⟧"],["p","ناگهان حاضرین در مسجد الحرام دیدند که دیوار پشت آن سمتى که در کعبه است شکافته شد و فاطمه بنت اسد  داخل شد. هر چه کردند قفل در کعبه را باز کنند ممکن نشد، و دانستند که حکمت خداوند در کار است. ⟦401⟧"],["p","فاطمه بنت اسد  مى فرماید: هنگامى که داخل کعبه شدم دیدم حوا، ساره، آسیه مادر موسى بن عمران و مریم مادر عیسى آمدند. آنان به من سلام کردند: السلام علیک یا ولیه اللهو در مقابلم نشستند."],["p","آنچه در ولادت خاتم الانبیأ  انجام دادند در ولادت على بن ابى طالب  نیز انجام دادند، چه اینکه فاطمه بنت اسد  در هنگام ولادت پیامبر  حضور داشت و به ابوطالب  ماجرا را خبر داد. حضرت ابو طالب  قبلا به او فرموده بود 30: «سال صبر کن تا خدا مولودى به تو عنایت کند مثل خاتم الانبیأ  مگر در نبوت که وصى و وزیر او خواهد شد.» ⟦402⟧"],["h","روز ولادت امیر المؤمنین "],["p","روز جمعه على بن ابى طالب  مانند خورشید بر روى سنگ سرخ در گوشه راست کعبه طلوع فرمود. همین که قدم بر زمین کعبه نهاد، به سجده افتاد و دستها را سوى آسمان بلند نمود و فرمود: اشهد ان لا اله الا االله، و أن محمدا رسول االله و اشهد ان علیا ولى محمد رسول االله، بمحمد یختم االله النبوه و بى یختم الوصیه و انا امیر المؤمنین «: شهادت مى دهم که خدایى جز االله نیست و محمد  پیامبر خداوند است و على وصى محمد رسول االله  است. به محمد نبوت ختم مى شود و به من وصایت کامل و تمام مى شود و منم امیر المؤمنین.» ⟦403⟧ سپس فرمود: جأ الحق و زهق الباطل «: حق آمد و باطل رفت». در این هنگام که وجود سرپا جودش پاى بر این عرصه خاکى نهاده بود، بتهایى که در کعبه بود به صورت به زمین افتادند و آسمانها نورانى شد. شیطان فریاد برآورد:"],["p","«واى بر بتها و بت پرستان از این فرزند»!"],["h","سخنان امیر المؤمنین  پس از ولادت"],["p","آنگاه سلام بر زنان بهشتى نمود و حال آنان را پرسید. بانوان بهشتى او را در آغوش گرفتند و حضرت با آنان تکلم فرمودند. هنگامى که حضرت حوا  او را در آغوش گرفت، آن حضرت فرمود: «سلام بر تواى مادر، حوا»! حوا  پاسخ داد: سلام بر تو پسرم! على بن ابى اطالب  از حال حضرت آدم پرسید. حوا  پاسخ داد: غرق در نعمتهاى خداوند است و در جوار پروردگار متنعم است. در این هنگام که آن حضرت داخل کعبه بود ابوطالب  در کوچه و بازار صدا مى زد: بشارت باد شما را که ولى خدا ظاهر شده است، همان کسى که وصایت به او تمام و کمال مى شود. ⟦404⟧"],["p","بعد از رفتن زنان بهشتى، پیامبران الهى حضرت آدم، حضرت نوح، حضرت ابراهیم، حضرت موسى، حضرت عیسى  آمدند. امیر المؤمنین  با دیدن آنان حرکتى نمود و تبسم فرمود و آن بزرگواران بر حضرتش سلام کردند: «سلام بر تواى ولى خدا و خلیفه پیامبر خدا»."],["p","حضرت در جواب فرمود: «علیکم السلام و رحمه االله و برکاته». و جداگانه بر هر یک سلام نمودند. آن بزرگواران یکى بعد از دیگرى او را در آغوش گرفتند و بوسیدند و زبان به مدح او گشودند و رفتند. سپس ملائکه آمدند و او را به آسمانها بردند، و باز آوردند و بردند و هر بار کلماتى مخصوص در فضایل و مناقب حضرت مى فرمودند. ⟦405⟧"],["p","فاطمه بنت اسد  مى فرماید: با دوم در حالتى آن حضرت را آوردند که او را در حریر سفید بهشتى پیچیده بودند و به من گفتند: «او را از چشم بینندگان حفظ کن که ولى رب العالمین است. بدانکه وارد بهشت نمى شود مگر کسى که ولایت او را بپذیرد و امامت و ولایت او را تصدیق کند. خوشا به حال آن که تابع اوست و واى بر کسى که از او رویگردان شود. مثل او چون کشتى نوح است. هر که به آن پیوست نجات مى یابد و هر که از آن باز ماند غرق مى شود و سقوط مى کند». سپس در گوش او مطلبى گفتند که من نفهمیدم. بعد او را بوسیدند و برخاستند و بیرون رفتند و من ندانستم از کجا خارج
