 که او دشمن پیامبر و على بن ابى طالب  باشد، و عمرى با معاویه خون به دل امیر المؤمنین  کنند. واقعه صفین و قرآن بر سر نیزه کردن و شهادت مالک اشتر و واقعه حکمین و کارهاى دیگر آن ملعون روشن است."],["p","او در وقت مرگ مى گفت: چنان است که کوه رضوى را بر گردن من نهاده اند و درون پر از خار است و مرا از سوراخ سوزنى بیرون مى کنند!"],["t",3,"جنگ قرقره الکدر"],["p","در این روز در سال 2هه جنگ قرقره الکدر به وقع پیوست. ⟦668⟧ این نام مربوط به آبى متعلق به بنى سلیم در سه منزلى مدینه است. سبب این جنگ آن شد که به سمع مبارك پیامبر  رسانده بودند که جمعى از بنى سلیم و بنى غطفان در قرقره الکدر اجتماع کرده اند تا به مدینه شبیخون بزنند. لذا آن حضرت پرچم اسلام را به دست امیر المؤمنین  دادند و حضرت را با دویست نفر به آنجا فرستادند. هنگامى که امیر المؤمنین  به آنجا رسیدند دیدند که آن جماعت از آنجا گریخته اند و تا آن حضرت آنجا بودند کسى برنگشت"],["p","⟦669⟧"]]},{"k":"day","key":3,"label":"","items":[["t",1,"قتل متوکل"],["p","در سال 247ه در شب چهارشنبه متوکل عباسى ملعون، به دستور فرزندش به قتل رسید. مدت خلافت او 14سال و ده ماه و عمر نحسش 41سال بود. ⟦670⟧"],["p","متوکل بعد از واثق، در سال 232ه به خلافت نشست. در ایام او لهو و لعب و طرب، مخصوصا در مجلس او بسیار بود. او مردى خبیث السیره بود و چنانچه امیر المؤمنین  فرموده بود، کافرترین آل عباس بود. عمرو بن فرج را والى مدینه و مکه کرد، و او به مردم دستور داده بود که کسى به آل ابى طالب احسان نکند، و اگر کسى کوچکترین احسانى کند سخت عقوبت خواهد شد، به حدى کار بر علویین تنگ شده بود که لباسهاى زنان علویه کهنه و پاره شده بود و پیراهن سالمى را براى نماز به نوبت مى پوشیدند، و نخ ریسى مى کردند، تا متوکل به درك واصل شد."],["p","از اعمال زشت و پست متوکل این بود که همیشه و در همه جا امیر المؤمنین  را به بدى یاد مى کرد، و به آن حضرت جسارت مى کرد. او 17بار قبر مبارك حضرت سید الشهدأ  را خراب کرد، ولى دوباره بنا شد. متوکل در راه زیارت آن حضرت دست قطع مى کرد و زوار را مى کشت."],["p","به خاطر جسارتهایى که متوکل در مجلسى به امیر المؤمنین  کرد، منتصر پسرش در شب چهارشنبه سوم یا چهارم ماه شوال چند نفر از غلامهاى خاص پدر را مأمور کشتن وى کرد، و آنها در حالى که متوکل مشغول شرب خمر بود، خویش را ریختند و به درکات جحیم شتافت."],["p","در همان روزى که متوکل به دستور پسرش منتصر کشته شد مردم با او در قصر معروف جعفرى بیعت کردند. منتصر مردى به ظاهر رئوف و مهربان بر اهل بیت پیامبر  بود، و بر عکس پدر خود به آل ابى طالب احسان مى کرد و به هیچ وجه متعرض ایشان نمى گشت."],["p","او زیارت امام حسین  را آزاد کرد و مانع احدى نشد، و دستور داد فدك را به اولاد امام حسن و امام حسین  رد کنند، و اوقاف آل ابى طالب  را آزاد کرد و دستور داد کسى متعرض شیعیان على  نشود. همچنین براى علویین و علویات مدینه اموالى فرستاد تا در میانشان تقسیم شود. او در روز 25ربیع الاول سال 248بیمار شد و در پنجم ربیع الثانى عصر در گذشت و مدت خلافتش 6ماه بود. گفته شده که او مسموم شد به زهرى که در شاخ حجامت ریخت بودند. ⟦671⟧"]]},{"k":"day","key":4,"label":"","items":[["t",1,"جنگ حنین"],["p","در این روز در سال 8ه بعد از 15روز از فتح مکه، غزوه حنین به وقوع پیوست. ⟦672⟧"],["p","تعداد لشکر اسلام 12هزار نفر از مکه و ده هزار نفر از مدینه بودند. در این جنگ چهار نفر شهید شدند، و تعداد مقتولین از کفار را بیشتر از 300نفر نوشته اند. ⟦673⟧ یکى از موارد فرار ابوبکر و عمر در همین جنگ بوده است ⟦674⟧ تاریخ این جنگ را ماه رمضان، و 3و 10و 11شوال هم نقل کرده اند. ⟦675⟧"]]},{"k":"day","key":5,"label":"","items":[["t",1,"حرکت به سوى جنگ صفین"],["p","در سال 36ه در چنین روزى امیر المؤمنین  براى رفتن به صفین آماده شدند؛ و ابو مسعود عقبه بن عامر انصارى را در کوفه جانشین خویش قرار دادند. ⟦676⟧"],["t",2,"ورود حضرت مسلم  به کوفه"],["p","در سال 60ه در چنین روزى حضرت مسلم  وارد کوفه شدند. ⟦677⟧ مردم کوفه به خدمتش شتافتند، و نامه امام حسین  را استماع کردند و هیجده هزار نفر با آن حضرت بیعت کردند. جناب مسلم  نامه اى به امام حسین  نوشت و بیعت کوفیان را اطلاع داد، و تشریف فرمایى آن جناب را به کوفه خواستار شد."]]},{"k":"day","key":6,"label":"","items":[["t",1,"توقیع براى حسین بن روح"],["p","روز یکشنبه سال 305ه اولین توقیع امام عصر  در دوران غیبت صغرى، براى جناب حسین بن روح (رحمه االله) صادر شد. ⟦678⟧"]]},{"k":"day","key":8,"label":"","items":[["t",1,"ویرانى قبور ائمه بقیع "],["p","در این روز در سال 1344ه قبور ائمه بقیع  و نیز قبر حضرت حمزه در احد به دست و هابیون تخریب شد. ⟦679⟧"],["p","علت و انگیزه تخریب این قبور مطهر در کتب مختلفى که بر رد عقائد ضاله و هابیت تألیف شده، بیان گردیده است."],["p","آنان اضافى بر قبور مطهر ائمه معصومین ، دیگر قبور را هم تخریب نمودند که عبارتند از: قبر منسوب به فاطمه زهرا  قبر مطهر فاطمه بنت اسد  مادر امیر المؤمنین ، قبر مطهر حضرت ام البنین ، قبر ابراهیم پسر پیامبر ، قبر اسماعیل فرزند حضرت صادق ، قبر دختران پیامبر ، قبر حلیمه سعدیه مرضعه پیامبر ، و قبور شهداى زمان پیامبر ."],["p","وهابیان در سال 1343در مکه گنبدهاى قبر حضرت عبد المطلب، ابى طالب، خدیجه، و زادگاه پیامبر  و فاطمه زهرا  را با خاك یکسان کردند. در جده نیز قبر حوا و دیگر قبور را تخریب کردند."],["p","در مدینه منور نبوى را به توپ بستند، ولى از ترس مسلمانان قبر شریف را تخریب نکردند. در شوال 1343با تخریب قبور مطهر ائمه بقیع  اشیأ نفیس و با ارزش آن قبور مطهر را به یغما بردند."],["p","قبر حضرت حمزه  و شهداى احد را با خاك یکسان کردند، و گنبد و مرقد حضرت عبد االله و آمنه پدر و مادر پیامبر ، قبر اسماعیل پسر حضرت صادق  و دیگر قبور را هم خراب کردند."],["p","در همان سال به کربلاى معلى حمله کردند، و ضریح مطهر را کندند و جواهرات و اشیأ نفیس حرم مطهر را که اکثرا از هدایاى سلاطین و بسیار ارزشمند و گرانبها بود، غارت کردند و قریب به 7000نفر از علما، فضلا و سادات و مردم را کشتند. سپس به سمت نجف رفتند که موفق به غارت نشدند و شکست خورده برگشتند. ⟦680⟧"],["t",2,"جنگ حمرأ الاسد"],["p","⟦681⟧"],["p","در این روز در سال 3ه جنگ حمرأ الاسد اتفاق افتاد«. حمرأ الاسد»نام مکانى در اطراف مدینه است."],["p","بعد از جنگ احد ⟦682⟧ و آمدن مسلمانان به مدینه، پیامبر  براى آنکه مبادا قریش مراجعت کنند و به مدینه حمله نمایند امر نمود تا بلال ندا دهد. امر خداوند متعال است که باید آنان که در احد حاضر بوده اند و جراحت دیده اند به تعقیب دشمن بروند. اصحاب کار معالجه را رها کردند و لباس رزم پوشیدند. امیر المؤمنین  هم با اینکه بیشتر از 80جراحت برداشته بود و بعضى آنقدر عمیق بود که فتیله داخل آن قرار داده مى شد، لباس رزم پوشیدند و رسول خدا  در حالیکه به او نگاه مى کرد و مى گریست پرچم را به آن حضرت داد و مسلمین حرکت کردند."],["p","بعد از تعقیب و تاخت بر کفار، مسلمانان سه روز در حمرأ الاسد ماندند و آنگاه به مدینه مراجعت کردند. ⟦683⟧"]]},{"k":"day","key":14,"label":"","items":[["t",1,"مرگ عبد الملک بن مروان"],["p","در سال 86ه عبد الملک بن مروان سفاك بخیل، در دمشق به هلاکت رسید، ⟦684⟧ و بعضى 15شوال را ذکر کرده اند. ⟦685⟧ این در حالى بو که 21سال و 6ماه خلافت را غصب کرده بود. او پیش از سلطنت پیوسته ملازمت مسجد را داشت و تلاوت قرآن مى نمود و او را حمامه المسجد مى گفتند! وقتى خبر سلطنت به او رسید قرآن را بر نهاد و گفت: «سلام علیک هذا فراق بینى و بینک»: «خداحافظ، این آغاز جدایى بین من و توست»!!"],["p","بیمارى او که سخت شد طبیب گفت: اگر آب بخورد مى میرد. ولى تشنگى بر او غالب شد و از پسرش ولید آب طلبید. او گفت: اگر آب بیاشامى خواهى مرد! عبد الملک به دخترش التماس کرد که آب بدهد، اما ولید پسرش مانع شد. عبد الملک گفت: بگذار به من آب بدهند، و گرنه تو را از ولیعهدى خلع مى کنم، ولید اجازه داد و عبد الملک آب خورد و مرد."],["p","از بزرگترین جنایات او به شهادت رساندن امام زین العابدین  و مسلط کردن حجاج ثقفى بر شیعیان امیر المؤمنین  بود. ⟦686⟧"]]},{"k":"day","key":15,"label":"","items":[["t",1,"جنگ احد و شهادت حضرت حمزه "],["p","در سال 3ه در روز جنگ احد، حضرت حمزه سید الشهدأ و 69نفر از مسلمانان به شهادت رسیدند. ⟦687⟧"],["p","در این جنگ مسلمانان هزار نفر بودند که به نوشته عده اى سیصد نفر در بین راه برگشتند، و براى جنگ 700نفر باقى ماند. کفار 3000نفر بودند و 2000 نفر و 4000نفر و 5000نفر هم گفته اند. تعداد کشته هاى کفار 22یا 23یا 28نفر، و تعداد شهدا 70نفر بود ⟦688⟧ در این روز دندان و پیشانى پیامبر  را شکستند. ⟦689⟧"],["h","فداکارى هاى امیر المؤمنین عليهالس لا م در احد"],["p","در این روز بر اثر فداکاریها و شجاعتهایى که امیر المؤمنین  در دفاع از وجود شریف خاتم الانبیأ  و حفاظت از آن حضرت نشان داد جراحتهاى زیادى بر بدن مبارکش رسید. این در حالى بود که دیگران فرار کرده بودند، و پیامبر  فرمود: یا على، آیا مى شنوى که از آسمان تو را مدح مى کنند. یکى از ملائکه به نام رضوان مى گوید: لا سیف الا ذوالفقار و لافتى الا على. امیر المؤمنین  مى فرماید: از خوشحالى گریستم و خداوند سبحان را بر این نعمت حمد کردم. ⟦690⟧"],["p","در این جنگ پیروزى در ابتدأ از آن مسلمانان بود، ولى مقدارى که به تعقیب دشمن رفتند و میدان خالى شد، بازگشتند و مشغول جمع غنایم شدند و اکثر نگهبانان مخالفت دستور پیامبر  نمودند و محل نگهبانى خود را رها کردند و مانند بقیه مشغول جمع غنایم شدند."],["p","خالد بن ولید که از سر دسته هاى کفار در این جنگ بود از همان قسمت با کفار حمله کردند"],["p","تعداد اندکى از نگهبانان دره که نرفته بودند شهید شدند و کفار از پشت سر به مسلمانان حمله کردند. فراریان کفار هم تا این وضع را دیدند بازگشتند و حمله به مسلمین شدت گرفت. جراحتهاى فراوانى بر بدن مبارك پیامبر  رسید و شیطان فریاد بر آورد که محمد کشته شده است! مسلمانان با شنیدن این ندا فرار کردند، و فقط چند نفرى از وجود مبارك پیامبر  محافظت مى کردند که عبارت بودند از امیر المؤمنین  و ابودجانه که شهید شد و زنى به نام نسیبه و انس بن نضر که تازه از مدینه رسیده بود."],["h","ابوبکر و عمر در جنگ احد"],["p","عمر بن خطاب مى گوید: در احد با پیامبر  بیعت کرده بودیم بر اینکه کسى فرار نکند، و هر کس از ما که فرار کند ضال و گمراه است، و هر کس از ما کشته شود شهید است. ⟦691⟧"],["p","احمد بن حنبل مى گوید: ابوبکر و عمر در این جنگ فرار کردند. هنگامى که امیر المؤمنین  در تعقیب فرارى ها بود، عمر در حالى که اشک چشمانش را پاك مى کرد بر گشت و به امیر المؤمنین  عرض کرد: مرا ببخشید!! امیر المؤمنین  فرمود: «آیا تو نبودى که صدا زدى: محمد کشته شده است، به دین قبلى خود برگردید»؟!! عمر گفت: این کلام را ابوبکر گفته است! در اینجا بود که این آیه نازل شد: ان الذین تولوا منکم یوم التقى الجمعان انما استزلهم الشیطان. ⟦692⟧"],["p","امام صادق  مى فرماید: در جنگ احد امیر المؤمنین  در حال دفاع از پیامبر  بودند، و دیگر اصحاب فرار مى کردند. آن حضرت همچون شیر غضبناك از قفاى گریختگان رفت و اول به عمر بن خطاب رسید که به اتفاق عثمان و حارث بن حاطب و عده اى دیگر به سرعت فرار مى کردند. حضرت فریاد بر آورد: اى جماعت، بیعت شکستید و پیامبر  را تنها گذاشتید و به سوى جهنم مى گریزید؟"],["p","عمر بن خطاب مى گوید: على را دیدم با شمشیر پهنى که مرگ از آن مى چکید و چشمهایش از خشم مانند دو قدح خون بود، یا مانند دو کاسه روغنى که آتش در او افروخته باشند مى درخشید، و فهمیدم که اگر به ما برسد به یک حمله ما را خواهد کشت. این بود که جلو رفتم و عرض کردم: «یا ابا الحسن، تو را به خدا سوگند مى دهم که دست از ما بردارى، که عرب را عادت است که گاهى مى گریزد و گاهى حمله مى کندم زمانى که حمله مى کند تلافى گریختن را مى نماید». پس آن حضرت ما را رها کرد؛ و به خدا قسم چنان ترسى از آن حضرت در دل من افتاد که تاکنون از دلم خارج نشده است. ⟦693⟧"],["p","در این جنگ بر بدن مبارك امیر المؤمنین  هنگام حمایت از پیامبر  90جراحت بر صورت، سر، سینه، شکم، دست و پاى مبارك رسید. جبرئیل نازل شد و عرض کرد: «یا محمد، به خدا قسم این عمل على بن ابى طالب، مواسات است». پیامبر  فرمود: «این بدان جهت است که من از اویم و او از من است. جبرئیل عرض کرد: و من از شما دو بزرگوارم.» ⟦694⟧"],["h","بانویى به نام نسیبه در جنگ احد"],["p","در این روز یکى از کسانى که جانفشانى کرد و فرار نکرد، بلکه مانع از فرار دیگران نیز شد، بانویى به نام نسیبه دختر کعب بن مازنیه بود و به او ام عماره مى گفتند. او با شوهر و دو پسر خود در جنگ احد شرکت داشتند. نسیبه مسک آبى به دوش داشت و سقایت لشکر اسلام را مى نمود. هنگامى که موقعیت را چنان دید که مسلمین در حال فرار هستند، مشک را به کنارى انداخت و خود را پیش روى پیامبر  سپر کرد، به گونه اى که جراحات زیادى بر او وارد شد، که مداواى یکى از آنها تا یک سال بعد ادامه داشت."],["p","این زن فداکار دست به شمشیر برد، و چنان ضربه اى بر ابن حمیه که قصد کشتن پیامبر  را داشت زد که او فرار کرد. عبد االله فرزند نسیبه خواست فرار کند که مانع او شد و او را تشویق به جنگ و دفاع پیامبر  نمود و او قبول کرد. پیامبر  به نسیبه فرمود: بارك االله علیک یا نسیبه. در این حال پیامبر  دید یکى از مهاجرین فرار مى کند در حالیکه سپرش را به پشتش بسته است. آن حضرت فرمودند: «اى صاحب سپر، سپرت را بیانداز و خودت به جهنم برو». سپس آن حضرت به نسیبه فرمود: «سپر او را بردار». او آن را برداشت و مشغول جنگ با مشرکین شد. در این هنگام حضرت فرمود: «مقام نسیبه از مقام فلان و فلان افضل است، چه اینکه فرار کردند.» ⟦695⟧"],["h","شهادت حضرت حمزه "],["p","در این روز جناب حمزه بن عبد المطلب  به شهادت رسید."],["p","آن حضرت برادر رضاعى پیامبر  بود، چون هر دو بزرگوار از زنى به نام ثویبه شیر خورده بودند. ⟦696⟧"],["p","آن حضرت مردى شجاع و با هیبت بود و در این جنگ به دست وحشى و به دستور هند همسر ابوسفیان کشته شد. هند به خاطر کشته شدن پدر و برادر و عمویش در جنگ بدر، ابتدا قصد نبش قبر مادر پیامبر  را داشت، ولى کفار قریش از ترس نبش قبور امواتشان مانع شدند. این بود که او وحشى را با وعده هایى به کشتن پیامبر  یا على مرتضى  و یا حمزه تحریک کرد. وحشى گفت: «از کشتن پیامبر  و پسر عمویش على  عاجزم، ولى براى کشتن حمزه کمین مى کنم»."],["p","او در میدان جنگ با نیزه اى بر سینه و یا شکم مبارك آن حضرت زد و آن حضرت را شهید کرد. وقتى خبر به هند دادند، آن خبیث دستور داد سینه آن حضرت را بشکافد و جگر مبارك آن حضرت را بیرون آورد. وقتى خواست به جگر حمزه دندان بزند دندانهاى نحسش کارگر نشد. همچنین هند با خنجرى گوشها، بینى و... آن حضرت را جدا کرد و به گردن انداخت."],["p","پیامبر  هنگامى که حمزه را با آن وضع دیدند، گریستند و عباى مبارك را روى او کشیدند که خواهرش صفیه او را به آن حال نبیند و فرمودند: یا عم رسول االله و اسد االله و اسد رسوله... یا فاعل الخیرات، کاشف الکربات.... امیر المؤمنین و فاطمه زهرا  و صفیه و دیگران بر آن حضرت گریستند. ⟦697⟧ پیامبر  بر بدن مبارك او نماز خوانده و او را در احد دفن نمودند. بعد از چهل سال که معاویه خواست نهرى از احد عبود دهد با قبر حضرت حمزه برخورد نمود و سر بیلها به پاى حمزه رسید و فورا خون جارى شد!"],["p","حضرت رضا  به نقل از رسول خدا  فرمودند: «بهترین برادران من على  و بهترین عموهاى من حمزه است.» ⟦698⟧"],["t",2,"رد الشمس"],["p","در این روز بازگشت خورشید براى امیر المؤمنین  به وقوع پیوسته است. ⟦699⟧ به قولى این واقعه در 17شوال بوده است. ⟦700⟧"],["p","لازم به یادآورى است که رد شمس براى امیر المؤمنین  دو بار اتفاق افتاده است: یکى در زمان پیامبر  در نزدیکى مسجد قبا، و دیگرى پس از رحلت آن حضرت در سرزمین بابل در نزدیکى حله. ⟦701⟧"],["p","علامه امینى (رحمه االله) به تفصیل احادیث رد الشمس را به طرق مختلف و همچنین کسانى را که درباره رد الشمس کتاب تألیف کرده اند در الغدیر بیان فرموده است. ⟦702⟧"],["t",3,"جنگ بنى قینقاع"],["p","در این روز بعد از بیست ماه از هجرت نبوى غزوه بنى قینقاع واقع شد، ⟦703⟧ و بنابر قویل این جنگ در صفر به وقوع پیوسته است."],["t",4,"وفات حضرت عبد العظیم "],["p","در سال 252یا 255ه ⟦704⟧ حضرت ابوالقاسم عبد العظیم حسنى فرزند عبد االله بن على بن حسن بن زید بن حسن بن على بن ابى طالب  وفات یافته است. ⟦705⟧ ایشان از مشاهیر علما و از ثقات و فضلاى محدثین است که در زهد و ورع زبانزد خاص و عام بوده و از امام جواد و امام هادى  روایت نقل کرده است. ⟦706⟧ کتاب خطب امیر المؤمنین  و کتاب الیوم و اللیله از آثار آن بزرگوار است. ⟦707⟧ جلالت و عظمت شأن آن بزرگوار از عرضه عقایدش خدمت امام زمانش حضرت هادى  و تأیید آن حضرت درباره آنها به وضوح پیداست."],["p","ایشان به طور ناشناس وارد رى شد و از ترس بنى عباس در ساربانان در خانه یکى از شیعیان زندگى مى کرد. ⟦708⟧ تا هنگام وفات کسى متوجه نشد آن بزرگوار کیست، تا اینکه بعد از وفات خواستند آن بزرگوار را غسل دهند نوشته اى در لباس او یافتند که نسب شریف خود را در آن نوشته بود. مرقد مطهرش در شهر رى مشهور است."],["p","پدر آن حضرت عبد االله مشهور به «عبد االله قافه»است«. قافه»نام مکانى بود که جناب عبد االله از طرف پدر بزرگش جناب حسن بن زید حاکم آنجا بود. همسر حضرت عبد العظیم، خدیجه دختر قاسم بن حسن بن زید بن حسن بن على بن ابى طالب  است. ⟦709⟧ بعضى امامزاده قاسم شمال تهران را پدر خدیجه همسر حضرت عبد العظیم مى دانند. ⟦710⟧"],["p","دختر آن حضرت سلمى است که حضرت عبد العظیم  او را به عقد محمد بن ابراهیم بن ابراهیم بن حسن بن زید بن حسن بن على بن ابى طالب  در آورده و ثمره این ازدواج سه پسر به نامهاى عبد االله و حسن و احمد بود. ⟦711⟧"]]},{"k":"day","key":17,"label":"","items":[["t",1,"جنگ خندق"],["p","در این روز در سال 5ه غزوه خندق (احزاب) و کشته شدن عمرو بن عبدود به دست امیر المؤمنین  به وقوع پیوست، و این جنگ در زمستان به وقوع پیوست. ⟦712⟧ وقوع جنگ خندق را بعضى در 8ذى القعده ⟦713⟧ و بعضى در 15 شوال گفته اند، و استبعادى ندارد که شروع جنگ در 15شوال باشد. همچنین به قولى غزوه خندق در سال 4ه اتفاق افتاده است. ⟦714⟧"],["p","در این جنگ تعداد مسلمانان 3000نفر و تعداد شهداى مسلمانان 6نفر بود. تعداد کفار 10000نفر بود ولى تعداد مقتولین کفار ذکر نشده است."],["p","در این جنگ مسلمانان داخل مدینه در اطراف شهر خندقى کندند. در اثناى این کار منافقین جسارتها به پیامبر  نمودند و عمرو بن عبدود مبارز طلبید ولى کسى جرأت نکرد. عمر بن خطاب از شجاعتهاى عمرو سخن گفت، و در مردم ایجاد ترس کرد."],["p","عبد الرحمن بن عوف گفت: «اگر عمرو بر ما چیره شود همه ما را خواهد کشت. بهترین راه این است که محمد را دست بسته تحویل آنها دهیم»!! در چنین شرایطى پیامبر  فرمود: آیا دوستى هست که شر این دشمن را کفایت کند؟ آقا و مولایمان اسد االله الغالب على بن ابى طالب  فرمود: من به مبارزه او مى روم. پیامبر  سکوت کردند، و تا سه بار این کلام را فرمودند، و هر سه بار امیر المؤمنین  براى مبارزه اعلام آمادگى نمودند."],["p","آخر الأمر پیامبر  اجازه فرمودند و امیر المؤمنین  حرکت کردند. در این هنگام پیامبر  فرمود: برز الایمان کله الى الشرك کله."],["p","بعد از آن که عمرو بن عبدو اسلام اختیار نکرد و دست از جنگ بر نداشت، امیر المؤمنین  او را به یک ضربت از پا در آورد. در این حال صداى تکبیر مسلمین بلند شد و پیامبر  فرمود: مبارزه على بن ابى طالب  در روز خندق از اعمال امت من تا روز قیامت افضل است. ⟦715⟧"],["t",2,"وفات اباصلت هروى"],["p","در این روز در سال 207ه ثقه جلیل اباصلت عبد السلام بن صالح هروى که اهل هرات بود پس از آزادى از زندان مأمون از دنیا رفت. ⟦716⟧"],["p","اباصلت از اصحاب امام رضا  و از خواص شیعیان بود، و کتاب «وفاه الرضا )علیه السلام»( تألیف اوست. در ایران دو قبر منسوب به آن بزرگوار است: یکى در بیرون شهر مشهد، و دیگرى در دروازه رى قم. ⟦717⟧"]]},{"k":"day","key":20,"label":"","items":[["t",1,"دستگیرى امام کاظم "],["p","در این روز هارون ملعون به مسجد النبى  به ظاهر براى زیارت و در حقیقت براى دستگیر نمودن حضرت موسى بن جعفر  آمد و آن حضرت را از مدینه به بغداد فرستاد. ⟦718⟧"]]},{"k":"day","key":25,"label":"","items":[["t",1,"شهادت امام صادق "],["p","امام صادق  در سال 148ه در چنین روزى وفات یافت. ⟦719⟧ در شهادت حضرت نیمه رجب و نیمه شوال را هم گفته اند. ⟦720⟧"],["p","شهادت آن حضرت به سبب انگور زهر آلودى بود که منصور به آن حضرت خورانید. ⟦721⟧ مدت امامت آن حضرت 34سال و عمر شریفشان 65سال بود. دران امامت آن حضرت همزمان با هفت نفر از زمامداران غاصب بود که عبارتند از: هشام بن عبد الملک، ولید بن یزید بن عبد الملک، یزید بن ولید، ابراهیم بن ولید و مروان حمار از بنى امیه و سفاح و منصور دوانیقى از بنى عباس."],["p","فرزندان آن حضرت هفت پسر و سه دخترند: حضرت موسى بن جعفر ، اسماعیل، عبد االله، محمد دیباج، اسحاق، على عریضى (على بن جعفر مدفون در قم) عباس، ام فروه، اسمأ فاطمه. ⟦722⟧"]]}]},{"name":"ذو القعده الحرام","groups":[{"k":"intro","key":0,"label":null,"items":[["p","ماه ذى القعده از یک سو با چند ولادت یاد آورى ایام سرور است. و از سوى دیگر با وقوع چند شهادت و اتفاق دیگر یادآور ایام حسن است. روزهاى 1، 9، 11، 23، 25، 26، 30در بردارنده روزهاى مهم این ماه است."],["p","ولادت امام رضا ، ولادت حضرت معصومه  اخبار خوش این مه اند که با ضمیمه مرگ اشعث بن قیس این سرور دو چندان مى شود."],["p","شهادت امام رضا و امام و جواد  روزهاى اندوه در این ماه است."],["p","جنگ بدر صغرى، جنگ بنى قریظه، صلح حدیبیه، حرکت پیامبر  براى حجه الوداع صفحات مهمى از تاریخ اسلام است."]]},{"k":"day","key":1,"label":"","items":[["t",1,"ولادت حضرت معصومه "],["p","در این روز در سال 173ه دخت گرامى موسى بن جعفر ، حضرت فاطمه معصومه  به دنیا آمده است. ⟦723⟧"],["p","پدر بزگوار آن حضرت امام موسى بن جعفر ، و مادر مکرمه آن حضرت جناب نجمه  مادر امام رضا  است. نام مبارکش فاطمه، لقب آن حضرت معصومه و در خانواده امام هفتم  حضرت معصومه  را «فاطمه کبرى»مى خواندند. ⟦724⟧"],["t",2,"جنگ بدر صغرى"],["p","در این روز در سال 4ه جنگ بدر صغرى واقع شد، و به آن «بدر الموعد»و «بدر الثالثه»هم مى گویند. ⟦725⟧"],["t",3,"مرگ اشعث بن قیس"],["p","در شب اول ذى القعده سال 40ه اشعث بن قیس کندى به درکات جحیم شتافت. ⟦726⟧"],["p","امام صادق  مى فرمایند: «اشعث بن قیس در قتل امیر المؤمنین  شریک بود، و دخترش جعده امام مجتبى  را مسموم کرد، و محمد پسرش در قتل امام حسین  شریک بود.» ⟦727⟧"],["p","اشعث در سال دهم هجرت با جمعى از قبیله خود اسلام آورد، و بعد از پیامبر  مرتد شد. ابوبکر او را دستگیر کرد و خواهر کورش را به شرط همسرى به او داد. از این جعده و محمد به دنیا آمدند. که جعده قاتل امام حسن  و محمد جزء لشکر عمر سعد در کربلا شد، و در دستگیرى جناب مسلم بن عقیل  نیز نقش بسزایى داشت. ⟦728⟧"],["p","در روز عاشورا به سبب جسارتى که حضرت امام حسین  کرد هنگامى که براى قضاى حاجت به کنارى رفته بود، عقرب او را نیش زد و در حالى که عورتش پیدا بود به آتش جهنم وارد شد. ⟦729⟧"]]},{"k":"day","key":9,"label":"","items":[["t",1,"نامه حضرت مسلم به امام حسین "],["p","در این روز از سال 60هجرى حضرت مسلم  27روز قبل از شهادتش نامه اى براى امام حسین  نوشت و به آن حضرت خبر داد که 18000نفر با او بیعت کرده اند. ⟦730⟧"]]},{"k":"day","key":11,"label":"","items":[["t",1,"ولادت امام رضا "],["p","در روز پنجشنبه سال 148ه امام رضا  در مدینه طیبه به دنیا آمد. ⟦731⟧ در ولادت آن حضرت 11ذى الحجه و 11ربیع الاول نیز ذکر شده است. ⟦732⟧ پدر آن حضرت موسى بن جعفر ، و مادرشان ام البنین نجمه "],["p","⟦733⟧"],["p","است. نام مبارکشان على است، و کنیه آن حضرت ابوالحسن است، و کنیه خاصشان ابوعلى است. ⟦734⟧"],["p","القاب حضرت سراج االله، نور الهدى، قره عین المؤمنین، مکیده الملحدین، کفو الملک، کافى الخلق، رب السریر، رئاب التدبیر (به معناى مصلح)، فاضل، صابر، وفى، صدیق، رضى. ⟦735⟧"],["p","هنگامى که آن حضرت به دنیا آمد پدرشان حضرت موسى بن جعفر  دستور دادند فرزندشان را بیاورند."],["p","آن حضرت را در پارچه سفیدى پیچیده و به خدمت پدر بردند. آن حضرت در گوش راست حضرت رضا  اذان و در گوش چپ آن حضرت اقامه فرمود، و آب فرات به کام مبارك آن حضرت ریخت و سپس او را به مادر مکرمه اش نجمه  برگردانید. ⟦736⟧"]]},{"k":"day","key":23,"label":"","items":[["t",1,"شهادت امام رضا "],["p","بنابر قولى در این روز در سال 203ه حضرت رضا  به شهادت رسیدند. ⟦737⟧"],["t",2,"جنگ بنى قریظه"],["p","در این روز در سال 4هجرى غزوه بنى قریظه به وقوع پیوست. مسلمانان 3000نفز بودند و یک نفر به نام خلادبن سوید شهید شد. کفار 900نفر بودند که همه آنها کشته شدند. ⟦738⟧ بنابر قولى این جنگ در شوال به وقوع پیوسته است. ⟦739⟧"]]},{"k":"day","key":25,"label":"","items":[["t",1,"حرکت امام رضا  از مدینه به سوى مرو"],["p","در این روز در سال 200هجرى حضرت رضا  از مدینه به سوى مرو حرکت کردند. ⟦740⟧"]]},{"k":"day","key":26,"label":"","items":[["t",1,"حرکت پیامبر  از مدینه براى حجه الوداع"],["p","در این روز در سال 10ه پیامبر  با اصحاب از مدینه براى حجه الوداع و غدیر حرکت کردند. ⟦741⟧ بعضى اقوال 23و بعضى 25ذى القعده نقل کرده اند. ⟦742⟧"]]},{"k":"tail","key":"آخر ذوالقعده","label":null,"items":[["t",1,"شهادت امام جواد "],["p","در این روز در سال 220ه امام جواد  به زهر معتصم به شهادت رسیدند، و هنگام شهادت از سن مبارکشان 25سال و سه ماه و 12روز گذشته بود. ⟦743⟧ در شهادت آن حضرت 5ذى القعده 5، ⟦744⟧ ذى الحجه سال 219ه 6، ⟦745⟧ ذى الحجه 25 ⟦746⟧ ذى الحجه هم گفته شده است."],["p","بعد از شهادت حضرت رضا ، مأمون جواد الائمه ، مأمون جواد الائمه  را به بغداد طلبید و دخترش ام الفضل را به آن حضرت تزویج نمود. پس از مدتى که آن حضرت از سوء معاشرت مأمون بسیار ناراحت بودند براى حج به مکه تشریف بردند. سپس به مدینه رفتند و در آنجا بودند تا مأمون به درك واصل شد و معتصم برادر او خلیفه شد."],["p","معتصم حسادى خاصى نسبت به آن حضرت داشت، و آن امام معصوم  را! همراه ام الفضل به بغداد احضار کرد. آن حضرت در حضور اکابر شیعه و ثقات اصحاب خود در مدینه امام هادث  را امام بعد از خود معرفى کردند و ودایع امامت را تسلیم ایشان نمودند و در 28محرم سال 220ه وارد بغداد شدند. ام الفضل به تحریک عمویش معتصم و به قولى جعفر بن مأمون، امام  را در سن 25سالگى مسموم کرد. ⟦747⟧"]]},{"k":"tail","key":"تتمه ذوالقعده","label":null,"items":[["t",1,"صلح حدیبیه"],["p","در سال ششم هجرت در ماه ذى القعده پیامبر  براى اعمال عمره قصد مکه فرمودند. ⟦748⟧ تعداد مسلمانان همراه با آن حضرت 1220یا 400نفر بودند، و براى قربانى 70شتر به همراه خود بردند."],["p","آنان از مسجد شجره احرام بستند، و در یک منزلى مکه در محلى به نام حدیبیه بر سر چاهى توقف نمودند. آب چاه به اندك زمانى تمام شد و چون به آن حضرت خبر دادند، به معجزه نبوت آب چاه آن قدر زیاد شد که مثل چشمه مى جوشید."],["p","کفار از حرکت باخبر گشته مانع ورود حضرت به مکه شدند. آن حضرت بیعتى دیگر به نام «بیعه رضوان» از اصحاب گرفتند. قرار شد آن حضرت سال بعد حج و عمره را قضا کنند و قرار دادى بین مسلیمن و کفار منعقد شد، که طبق شروطى تا ده سال جنگ بین آنان نباشد. گروهى از صحابه از این صلح دلتنگ شدند، و عمر بن خطاب گفت: «در نبوت محمد شک نکردم مانند روز حدیبه،» ⟦749⟧ به پیامبر  مى گفت: ما چگونه به این خوارى گردن نهیم و به این مصالحه رضایت دهیم!!"],["p","حضرت فرمودند: من پیامبر خدایم و کارى جز! حکم خداوند نمى کنم. عمر گفت: تو به ما گفتى به زیارت کعبه مى رویم و عمره انجام مى دهیم، پس چه شد؟ پیامبر  فرمود: آیا گفتم امسال این کار انجام مى شود؟ عمر گفت: نه! فرمود: پس چرا مجادله مى کنى؟!!"],["p","در بازگشت از حدیبیه سوره فتح بر آن حضرت نازل شد. ⟦750⟧"]]}]},{"name":"ذو الحجه الحرام","groups":[{"k":"intro","key":0,"label":null,"items":[["p","ماه ذى الحجه بسیار پر حادثه و پر خاطره است. روزهاى ماندگارى از شیرین ترین روزهاى تاریخ اهل بیت ، در کار وقایعى جانسوز در این ماه جمع شده است."],["p","روزهاى 1، 6، 7، 8، 9، 10، 11، 13، 14، 15، 18، 20، 22، 24، 27، 29، 30حامل این اتفاقات هستند که آنها را مرور مى کنیم."],["p","عید غدیر، ولادت امام هادى ، عید قربان، خلافت ظاهرى امیر المؤمنین ، روز مباهله، روز خاتم بخشى امیر المؤمنین ، نزول سوره هل اتى ایام سرور شیعیان در این ماه است."],["p","شهادت امام باقر ، بردن امام کاظم  به زندان بصره، شهادت حضرت مسلم و هانى در کوفه، شهادت عبد االله محض و جمعى از آل حسن ، شهادت میثم تمار، وفات على بن جعفر  روزهاى حزن آل محمد  در این ماه به شمار مى آید."],["p","مرگ پدر ابوبکر، مرگ هند مادر معاویه، قتل عمر، قتل عثمان، انقراض دولت هزار ماهه بنى امیه، مرگ منصور دوانیقى روزهایى است که برائت از دشمنان اهل بیت  را در دلها تجدید مى کند."],["p","روز عرفه، شق القمر، ازدواج امیر المؤمنین و حضرت زهرا ، جنگ سویق، نامه پیامبر  به پادشاهان بزرگ، بیعت عقبه، بخشیدن فدك به حضرت زهرا ، عزل ابوبکر از تبلیغ سوره برائت، روز سد ابواب به مسجد پیامبر ، افشأ سر ولایت توسط عایشه، توطئه ترور امام حسین ، دعوت عمومى حضرت مسلم  در کوفه، حرکت امام حسین  از مکه به عراق، روز نوشتن دعاى صباح، اولین نماز جمعه امیر المؤمنین ، آغاز نامه ها براى جنگ صفین، واقعه حره، خروج ابراهیم بن مالک اشتر براى جنگ با ابن زیاد، هر یک فرازهاى مهم و بیاد ماندنى از تاریخ اسلامى است."]]},{"k":"day","key":1,"label":"","items":[["t",1,"عزل ابوبکر از تبلیغ سوره برائت"],["p","در این روز در سال نهم هجرت، ابوبکر از تبلیغ سوره برائت عزل شد. سپس پیامبر  امیر المؤمنین  را روانه فرمود که آیات برائت را از ابوبکر بگیرد و خود بر اهل مکه قرائت فرماید. ⟦751⟧"],["p","آغاز ماجرا این بود که در سال 9ه پیامبر  ابوبکر را به مکه فرستاد تا آیات اوایل سوره برائت را بر کفار بخواند. پس از رفتن او جبرئیل نازل شد: «یا رسول االله، اداى این امر باید به دست شما یا به دست مردى که از شما یا به دست مردى که از شماست انجام شود». به روایت دیگر: «باید على  از جانب تو تبلیغ کند»."],["p","پیامبر  امیر المؤمنین  را که به منزله جانش بود معین کردند و به او فرمودند: شتاب کن و آیات را از ابوبکر بگیر و در موسم حج بر مردمان قرائت کن."],["h","فرستادن امیر المؤمنین  و بازگشت ابوبکر"],["p","آن حضرت ناقه غضبأ را به امیر المؤمنین  داد و آن حضرت همراه جابر بن عبد االله حرکت فرمود، و در روز دوم به ابى بکر رسید و آیات برائت را از وى گرفت و اختیار آمدن یا برگشتن را به خود او واگذار کرد."],["p","ابوبکر به مدینه بازگشت و به پیامبر  عرض کرد: «مرا براى کارى لایق دانستى که دیگران مشتاق آن بودند، ولى مقدارى که رفتم مرا معزول نمودى»؟ حضرت فرمود: «من تو را معزول نساختم بلکه خدا تو را معزول ساخت»."],["h","تبلیغ سوره برائت توسط امیر المؤمنین "],["p","امیر المؤمنین  آیات را در سه روز ایام تشریق در منى که مجمع کفار و مشرکین بود و از بغض و عداوت على  آکنده بودند، هر صبح و شام همراه با فرمایشات پیامبر  بر مردم قرائت مى نمود و سپس به مدینه مراجعت فرمود."],["p","از هنگامى که على  به مکه رفته بود، از فراق او آثار حزن بر صورت مبارك پیامبر  ظاهر گشته بود. صحابه با خود مى گفتند: شاید خبر فوت آن حضرت از آسمان رسیده، یا از ما دلتنگ شده باشد."],["p","ابوذر (رحمه االله) نزد پیامبر  داراى مقام و منزلتى بود و لذا او را نزد آن حضرت فرستادند. ابوذر کلمات اصحاب را عرضه داشت، و آن حضرت فرمود: «حزن و اندوه من براى مفارقت على است»."],["h","بازگشت امیر المؤمنین  از تبلیغ برائت"],["p","ابوذر براى اطلاع اط حالى على  از مدین به استقبال آن حضرت حرکت کرد، و در اثناى راه به امیر المؤمنین  رسید و با آن حضرت دیدن کرد و عرض کرد: پدر و مادرم فداى شما باد، آهسته تشریف بیاورید تا من پیشتر بروم و بشارت آمدن شما را به پیامبر  بدهم."],["p","ابوذر به سرعت خود را به پیامبر  رسانید و آمدن على  را به پیامبر  بشارت داد. آن حضرت با اصحاب به استقبال على  آمدند و چون به آن جناب رسیدند، پیاده شده آن حضرت را در آغوش گرفتند و صورت مبارك خود را بر شانه على  گذاشتند و از شوق دیدار گریستند و امیر المؤمنین  نیز گریستند. پس پیامبر  به على  فرمود: «پدر و مادرم به قربانت، در مکه چه کردى»؟ امیر المؤمنین  از آنچه انجام شده بود به آن حضرت خبر داد. ⟦752⟧"],["t",2,"آغاز نامه ها براى جنگ صفین"],["p","چون دو روز از ورود امیر المؤمنین  به صفین گذشت، در اول ذى حجه حضرت براى معاویه نامه نوشتند و او را موعظه فرمودند، ولى آخر الامر قرار بر آن شد که روز اول صفر بعد از ماه حرام جنگ شروع شود و روز اول صفر جنگ شروع شد. ⟦753⟧ به نقلى ورود آن حضرت در 22محرم بوده است. ⟦754⟧"]]},{"k":"day","key":5,"label":"","items":[["t",1,"جنگ سویق"],["p","در این ماه در سال 2ه غزوه سوبق به وقوع پیوست. ⟦755⟧ ابوسفیان بعد از واقعه بدر نذر کرد که با زنى نزدیکى نکند و روغن به خود نمالد تا انتقام خویش را از پیامبر  بگیرد. به این منظور همراه دویست نفر به عریض از نواحى مدینه رفتند و دو خانه و چندین نخل را آتش زدند و دو نفر از بزرگان انصار را در آنجا کشتند تا او به نذر خود عمل کرده باشد."],["p","چون خبر به پیامبر  رسید ابولبابه را در مدینه گذاشته همراه با دویست نفر از مهاجرین و انصار و در رأس آنها امیر المؤمنین  به سوى عریض حرکت کردند ابوسفیان چون با خبر شد که پیامبر  با عجله به آنجا مى آید، به لشکر خود دستور داد تا انبانهاى سویق را که براى آذوقه با خود آورده بودند ریخته و سبکبار فرار کنند. مسلمانان وقتى رسیدند آنان گریخته بودند. لذا انبانهاى سویق را برداشته مراجعت نمودند. به همین دلیل این غزوه را «ذات السویق»گویند. ⟦756⟧"]]},{"k":"day","key":6,"label":"","items":[["t",1,"ازدواج امیر المؤمنین  و حضرت زهرا "],["p","در این رز در سال 2ه آقا و سرور ما خاتم الانبیا ، امیر المؤمنین  را به سیده نسأ عالمیان فاطمه زهرا بتول عذرأ  تزویج فرمود. ⟦757⟧ این ماجرا بعد از رجوع از جنگ بدر 16روز بعد از وفات رقیه دختر پیامبر  در روز سه شنبه 6ذى الحجه واقع شده است. ⟦758⟧"],["p","امام صادق  فرمود: «اگر خداوند متعال امیر المؤمنین  را خلق نمى کرد، در تمام زمین انسانى که کفو و شایسته همسرى با حضرت فاطمه  باشد یافت نمى شد.» ⟦759⟧"],["h","خواستگارى از فاطمه "],["p","هنگامى که سن مبارك بتول عذرأ حضرت صدیقه طاهره فاطمه زهرا  نه سال کامل شد، از اطراف و اکناف اهل مدینه و عظماى قبایل و رؤ ساى عشایر و صاحبان ثروت و مکنت به خواستگارى حضرت آمدند. عده اى از منافقین نیز این جرئت را به خود دادند که با کمال بى شرمى به خواستگارى آن حضر بیایند."],["p","هنگام خواستگارى بعضى از آنها رسول اکرم  بسیار ناراحت شدند، و به عده اى از منافقین که اعتراض کردند، فرمودند: «من شما را رد نکردم، بلکه خدا شما را رد کرده و امر فاطمه  از جانب خداوند متعال معین مى شود». آنان غافل از این بودند که این گوهر گرانبها را خداوند در سایه عزت و حراست خود حفظ فرموده و او را در خور استعداد ابنأ دنیا از ملوك و رعایا و ارباب فقر غنا قرار نداده است؛ بلکه او را براى وصى پیامبر  على بن ابى طالب امیر المؤمنین  ذخیره فرمود است. ⟦760⟧"],["p","از امام حسین  روایت شده که فرمود: روزى حضرت رسول  در خانه ام سلمه بود. فرشته اى با هیبت خاصى بر آن حضرت نازل شد که با لغات گوناگون که به یکدیگر شباهتى نداشت مشغول تسبیح و تقدیس خداوند بود. او عرض کرد: من صر صائیلم. خداوند مرا نزد شما فرستاده که به شما بگویم: «نور را به نور تزویج کن». حضرت فرمود: «چه کسى را با چه کسى»؟ گفت: «فاطمه را با على بن ابى طالب». لذا پیامبر  فاطمه  را در حضور جبرئیل و میکائیل و صر صائیل به عقد على  در آورد و این عقد در زمین بود."],["p","در این هنگام پیامبر  به میان شانه هاى صر صائیل نگریست و دید نوشته است: لا اله الا االله، محمد رسول االله، على بن ابى طالب مقیم الحجه. فرمود: اى صر صائیل، از کى این جمله بین شانه هاى تو نوشته شده؟ گفت: دوازده هزار سال پیش از آنکه خداوند متعال دنیا را بیافریند. ⟦761⟧"],["h","مراسم عروسى"],["p","هنگامى که حضرت فاطمه  را در شب ازدواج به خانه على  مى بردند، پیامبر  از جلو ایشان، جبرئیل در سمت راست و میکائیل در سمت چپ ایشان، و هفتاد هزار فرشته پشت سر حضرتش حرکت مى کردند و در آن حال خدا را تسبیح مى گفتند و تقدیس مى کردند، و این تقدیس و تسبیح آنها تا طلوع فجر ادامه داشت. ⟦762⟧"],["p","جبرئیل زمام ناقه اى که آن حضرت را مى بردند و اسرافیل رکاب و میکائیل دنبال آن را گرفته بود، و پیامبر  جامعه هاى فاطمه  را منظم مى کرد، و هفتاد هزر ملک با دیگر فرشتگان تکبیر مى گفتند؛ اما به حسب ظاهر سلمان زمام ناقه را گرفته بود و حمزه و عقیل و جعفر از اهل بیت از قفاى حضرت فاطمه  و بنى هاشم با شمشیرهاى کشیده مى آمدند، و همسران پیامبر  از پیش روى مى آمدند."],["p","پیامبر  آنها را به مسجد طلبید و دست فاطمه  را در دست على  نهاد و فرمود: بارك االله فى ابنه رسول االله؛ و نیز فرمود: هذه ودیعتى؛ و بعد از مراسمى مخصوص، پیامبر  در حق آنها و نسل ایشان دعا کرد. سپس فرمود: مرحبا ببحرین یلتقیان و نجمین یقترنان."],["p","سپس پیامبر  از نزد ایشان بیرون آمد و چهار چوب در را گرفت و فرمود: طهرکما االله و طهر نسلکما، انا سلم لمن سالمکما و حرب لمن حاربکما، استودعکما االله و استخلفه علیکما."],["p","آنگاه همه به منازل خود رفتند و از زنان جز اسمأ کسى نزد فاطمه  نماند، و این به خاطر وصیت حضرت خدیجه  بود که هنگام وفات گریست و از اسمأ عهد و پیمان گرفت که در شب عروسى حضرت فاطمه  آن حضرت را تنها نگذارد. اسمأ هم به عهد خود وفا کرد، و چون ماجرا را براى پیامبر  نقل کرد، آن حضرت یاد خدیجه  کرد و گریست و در حق اسمأ دعا فرمود. ⟦763⟧ مهریه حضرت زهرا  در مقدار و نوع مهریه آن حضرت روایات مختلفى وارد شده است:"],["p","یک لباس مشکى بلند و یک پوست گوسفند و مقدارى عطر. ⟦764⟧ یک لباس نرم و ملایم و یک زره خطى که ساخت بحرین است. ⟦765⟧ چهار صد و هشتاد درهم. ⟦766⟧ -چهار صد مثقال نقره. ⟦767⟧"],["p","پانصد درهم، که علامه مجلسى (رحمه االله) مى فرماید: اصح اقوال همینقول است. ⟦768⟧ زره حطمى که ارزش آن سى در هم بود ⟦769⟧ و پوست قوچ یا میش. ⟦770⟧ درع حطمى. ⟦771⟧ یک شتر. ⟦772⟧ یک پنجم زمین. پیامبر  فرمود: «در آسمان معین شده که مهریه زهرایک پنچم زمین است. پس هر که در زمین را برود در حالى که با او و فرزندانش دشمن باشد، قدم زدن او تا روز قیامت در زمین حرام است.» ⟦773⟧ امام باقر  فرمود: مهر فاطمه  یک پنجم دنیا و دو سوم بهشت است، و در زمین چهار نهر فرات، نیل، نهروان و بلغ براى حضرت فاطمه  است."],["p","خداوند به پیامبر  فرمود: «اى محمد، تو فاطمه را به مهریه پانصد درهم به ازدواج على در آور تا سنتى در بین امت تو باشد.» ⟦774⟧ در روایت دیگر: «یک چهارم دنیا و بهشت و جهنم است، که دوستان خود را داخل بهشت مى کند و دشمنان خود را به جهنم روانه مى نماید.» ⟦775⟧ در روایت دیگر مهریه آن حضرت نصف دنیا ذکر شده است. ⟦776⟧ ولیمه عروسى اثاث منزل و ولیمه عروسى حضرت زهرا  چنین بود که پیامبر  به امیر المؤمنین  فرمود: «زره خود را بفروش». آن حضرت زره را فروخت و پول آن را خدمت پیامبر  آورد. پیامبر  مقدارى را جهت تهیه غذاى عروسى به ام سلمه دادند. بنابر بعضى روایات نصف از لوازم غذا را پیامبر  و نصف دیگر را امیر المؤمنین  تهیه نمودند."],["h","جهازیه حضرت زهرا "],["p","مقدارى را هم به بلال و عمار دادند که از بازار لوازم خانه را خریدارى کنند. یک پیراهن، یک عدد روسرى، قطیفه سیاه خیبرى یا عباى سیاه، پرده نازك پشمى، یک عدد حصیر از بافته هاى قریه هجر، آسیاى دستى، یک عدد طشت مسى، مشک براى آب آوردن، کاسه اى سفالین، مشکى مخصوص خنک کردن آب، ابریقى که طرف بیرونش رنگ شده بود، کوزه سفالین، پوست گوسفند. ⟦777⟧ امیر المؤمنین  مى فرماید: در آن شب که دختر پیامبر  به خانه من آمد، بسترمان جز یک پوست گوسفند نبود. ⟦778⟧"],["p","در جاى دیگرى از آن حضرت نقل شده که فرمود من از فاطمه  در حالى ازدواج کردم که جز یک پوست گوسفند چیزى نداشتیم که شب بر روى آن مى خوابیدیم و روز علوفه شترمان را بر روى آن مى ریختیم و خدمتگزارى در خانه نداشتیم. ⟦779⟧"],["p","در روایتى دیگر مى فرماید: پیامبر  به خانه ما آمد در حالى که ما بر روى خود قطیفه اى انداخه بودیم که اگر از طول آن را به روى خود مى کشیدیم، پهلویمان خالى مى شد و اگر از عرض مى انداختیم سر و پاهایمان بدون روپوش مى ماند. ⟦780⟧"],["p","بعضى از اهل سنت نقل کرده اند: هنگامى که فاطمه  به خانه على  رفت، در خانه آن حضرت چیزى جز ریگ پهن شده، کوزه سفالین، بالش و ظرفى براى آب نیافت. ⟦781⟧"],["p","بنابر نقلى دیگر دو کوزه کوچک، ظرف مخصوص شیر که از چوب مى تراشیدند، سبویى سبز رنگ که روغن یا آرد در آن مى ریختند، چهار بالش یا متکا یا پشتى با رویه اى از پوست پر از گیاه خشک سبز رنگ، از اثاثیه منزل بود. ⟦782⟧"],["h","عروسى و شرکت کنندگان"],["p","در بعضى روایات آمده است که بعد از خرید 29، یا سى روز، امیر المؤمنین  صبر کرد تا اینکه جعفر و عقیل به آن حضرت گفتند: از پیامبر  خواهش مى کنیم که شما همسرت را بیاورى."],["p","پیامبر  فرمود: «ما انتظار داریم خود او بیاید و از ما در خواست کند». امیر المؤمنین  مى فرماید: عرض کردم: «حیا مانع من مى شود». پیامبر  اجازه مجلس عروسى و ولیمه را فرمودند، و به امیر المؤمنین  فرمودند: «هر کس را دوست دارى دعوت کن». زنان به کار زنها و امیر المؤمنین  و عمار و بلال و چند نفر دیگر به کار مجلس مردها که در مسجد بود، مى رسیدند."],["p","اصحاب با هدایاى خود در جشن عروسى آن دو نور الهى شرکت کردند، و از ولیمه عروسى که به دستور پیامبر  فراهم آمده بود، میل کردند. در آن مجلس 4000نفر از آن طعام خوردند و پیامبر  غذایى براى امیر المؤمنین و فاطمه  فرستاد، در حالیکه چیزى از آن غذا کم نشد و همچنان به جاى ماند، با وجود اینکه سه روز از آن تناول مى کردند."],["p","شب با مراسمى مخصوص، حسب الامبر پیامبر  آن دو بزرگوار را به حجره ام سلمه آوردند. ام سلمه مى گوید: هنگامى که خورشید غروب کرد، پیامبر  فرمود: «فاطمه را بیاور». من رفتم و دست فاطمه  را گرفته در حالى که لباسش بر زمین کشیده مى شد و از خجالت و شرم عرق از چهره اش جارى بود، آن حضرت را نزد پدر بزرگوارش آوردم. هنگامى که خدمت آن حضرت رسید، از شدت خجالت پایش لغزید. پیامبر  فرمود: «خداوند تو را از لغزشهاى دنیا و آخرت نگه دارد»."],["p","هنگامى که پیش روى آن حضرت قرار گرفت، چادر را از صورت فاطمه  کنار زد تا على  چهره او را ببیند. سپس دست او را در دست على  قرار داد و این گونه بود که این زندگى نورانى آغاز شد. ⟦783⟧"],["h","ثمره ازدواج نوارنى"],["p","ثمره این ازدواج مبارك و نورانى و الهى پنج فرزند بود. دو امام معصوم ، آقا و مولایمان حضرت مجتبى  و سرور شهیدان حضرت اباعبداالله ، دو دختر حضرت عقیله بنى هاشم زینب کبرى و جناب ام کلثوم ، که این فرزندان در زمان حیات پیامبر  در مدت نه سال به دنیا آمدند. آخرین فرزند ایشان حضرت محسن  بود که بعد از شهادت پیامبر  به مدت چند روز به وسیله ضربه هاى بین در و دیوار و کتک هاى منافقین و ظالمین به شهادت رسید. ⟦784⟧"],["p","حضرت فاطمه  نه سال و 75روز یا 95روز در منزل امیر المؤمنین  زندگى کرد تا آنکه بعد از شهادت حضرت محسن  به شهادت رسید."],["h","ازدواج آسمانى"],["p","بین ازواج آن حضرات در آسمان و تزویج آنها در زمین چهل روز فاصله بود. در اول یا ششم ذى الحجه ⟦785⟧ در حالى که طرف ایجاب عقد خداوند متعال و طرف قبول جبرئیل و خطبه خوان را حیل بود. شاهدان حاملان عرض و 70 هزار نفر از فرشتگان بود. نثار کننده نقل این عروسى رضوان خزانه دار بهشت، و آنچه نثار شد در و یاقوت و مرجان، و حجله دار این زفاف اسمأ بود. ⟦786⟧"],["h","اقوال در روز ازدواج حضرت"],["p","اقوال در ازدواج چنین است: عقد در صفر و ازدواج در ذى الحجه ⟦787⟧ عقد در ماه رمضان و ازدواج در ذى الحجه، ⟦788⟧ عقد در صفر و ازدواج در ربیع الاول، عقد در رجب و ازدواج بعد از بگشت امیر المؤمنین  از بدر، ⟦789⟧ عقد در ربیع الاول و ازدواج. در ربیع الاول، عقد در اول یا ششم ذى الحجه، ⟦790⟧ عقد در اول ذى الحجه و ازدواج در ششم ذى الحجه، ⟦791⟧ یک سال بعد از هجرت عقد و یک سال بعد از آن ازدواج، ⟦792⟧ عقد در 28سفر و چهار ماه بعد از آن ازدواج، ⟦793⟧ عقد در محرم و ازدواج در ذى الحجه، ⟦794⟧ عقد چند روز از شوال گذشته و ازدواج روز سه شنبه ششم ذى الحجه ⟦795⟧ یا نیمه رجب. ⟦796⟧"],["t",2,"مرگ منصور دوانیقى"],["p","در این روز در سال 158ه، منصور دوانیقى بخیل بى رحم، در سفر حج به هلاکت رسید و در حجون دفن شد. ⟦797⟧ منصور در بنى عباس شباهت تامى به هشام بن عبد الملک در بنى امیه داشت، و از او تقلید مى نمود. او مردى خونریز بود، و بر خلاف برادرش سفاح عداوت و ظلم تمام نسبت به آل ابوطالب داشت. از آن بزرگواران افراد زیادى را کشت و بزرگترین جنایت منصور به شهادت رساندن امام صادق  بود. عبداالله محض و حسن مثلث و بسیار از بنى الحسن را نیز او شهید کرد."]]},{"k":"day","key":7,"label":"","items":[["t",1,"شهادت امام باقر "],["p","در چنین روزى مصادف با دوشنبه، در سال 114ه امام باقر  توسط هشام بن عبد الملک مسموم و شهید شد. ⟦798⟧ در شب شهادت به امام صادق  فرمودند: «من امشب جهان را بدرود خواهم گفت. هم اکنون پدرم على بن الحسین را دیدم که شربتى گوارا نزد من آورد و نوشیدم و مرا به سراى جاوید و دیدار حق بشارت داد». در روایت دیگرى فرمودند: «اى فرزند گرامى، مرگ نشنیدى که حضرت على بن الحسین از پس دیوار مرا ندا کرد: «اى محمد بیا، زود باش که ما انتظار تو را مى کشیم»."],["p","آن حضرت چندین روز و به قولى سه روز در حالت درد از اثر سم به سر مى بردند تا به شهادت رسیدند. فرداى آن روز بدن مطهر و پاك آن دریاى بیکران دانش خدایى را در خاك بقیع کنار مزار امام مجتبى و امام سجاد  به خاك سپردند. ⟦799⟧"],["p","آن حضرت هشتصد درهم براى تعزیه و ماتم خود وصیت فرمود. حضرت صادق  فرمودند: پدرم فرمود: «اى جعفر، از مال من مقدارى وقف کن براى ندبه کنندگان که ده سال در منى در موسم حج بر من گریه کنند، و مراسم ماتم را تجدید نمایند.» ⟦800⟧"],["p","آقا و مولایمان حضرت باقر  در کربلا شرف حضور داشت. شب یازدهم، بازار کوفه کنار سرهاى مطهر، اسارت شام و مجلس یزید را دیده است و هر زمان که متذکر شهادت حسین بن على  و اسارت عمه هایش مى شد، اشک از چشم مبارکش مانند در جارى مى گشت."],["t",2,"بردن امام کاظم  به زندان بصره"],["p","در این روز امام کاظم  را در حالى که در غل و زنجیر بسته بودند، به بصره بردند و مدت یکسال نزد عیسى بن جعفر بن ابى جعفر منصور محبوس کردند و سپس حضرت را به بغداد بردند. ⟦801⟧"],["p","عیسى آن حضرت را در یکى از حجرات خانه خود که نزدیک به دیوانخانه بود محبوس کرد و مشغول فرح و سرور گردید. از یکى از کاتبان او که نصرانى بود نقل شده که مى گفت: «این عبد صالح و بنده شایسته خدا یعنى موسى بن جعفر  در ایامى که در این خانه محبوس بود چیزهایى از لهو و لعب شنید که گمان ندارم هرگز بر خاطر شریف آن حضرت خطور کرده باشد»."],["p","آقا و مولایمان حضرت کاظم  مدت یک سال در بصره محبوس بودند، و بعد از یکسال آن حضرت را به بغداد بردند و نزد فضل بن ربیع حبس کردند."]]},{"k":"day","key":8,"label":"","items":[["t",1,"توطئه ترور امام حسین "],["p","در این روز در سال 60هجرى به دستور یزید لعین سى نفر از شیاطین بنى امیه از شام براى دستگیرى و یا کشتن امام حسین  به بهانه حج وارد مکه شدند. ⟦802⟧"],["t",2,"دعوت عمومى حضرت مسلم  در کوفه"],["p","در این روز در سال 60ه روز سه شنبه حضرت مسلم  دعوت خود را براى امام حسین  در کوفه آشکار کرد و از طرفى کوفیان نفاق خود را نمودار کردند. ⟦803⟧"],["t",3,"حرکت امام حسین  از مکه به عراق"],["p","در این روز در سال 60ه امام حسین  از مکه متوجه عراق شدند، و این قول مشهور بین محدثین و ارباب مقاتل است. ⟦804⟧ بنابر قولى آن حضرت در روز نهم از مکه به طرف عراق حرکت فرمودند. ⟦805⟧"]]},{"k":"day","key":9,"label":"","items":[["t",1,"روز عرفه"],["p","در روز عرفه ⟦806⟧ زیارت امام حسین  مستحب است، چه اینکه خداوند ابتدا به زوار امام حسین  نظر مى کند زیرا همه حلال زاده اند، و بعد به زوار با معرفت خویش در عرفات نظر مى کند. ⟦807⟧"],["t",2,"شهادت حضرت مسلم و هانى"],["p","در این روز در سال 60ه محمد بن کثیر و پسرش در کوفه به جرم مهماندارى و طرفدارى از مسلم بن عقیل  به شهادت رسیدند. در شب عرفه جناب مسلم بن عقیل  به منزل طوعه رفتند. ⟦808⟧ در روز عرفه سال 60ه که چهارشنبه بود جناب مسلم بن عقیل و هانى بن عروه را در کوفه شهید کردند. ⟦809⟧"],["h","خاندان حضرت مسلم"],["p","نام مبارکش مسلم و پدرش عقیل، و مادرش علیه، و همسر آن حضرت رقیه دختر امیر المؤمنین  است. ⟦810⟧"],["p","پیامبر  فرمود: «چشم مؤمنان بر او گریان است، و ملائکه مقرب الهى بر او درود مى فرستند». امام حسین  هنگامى که آن حضرت را به سوى کوفه فرستادند، در قسمتى از نامه به اهل کوفه چنین فرمودند: «برادرم و پسر عمویم و فرد مورد اطمینان از اهل بیتم را نزد شما فرستادم». هنگامى که امام حسین  خبر شهادت آن حضرت و هانى را شنید، چند بار فرمود: «انا الله و انا الیه راجعون». سپس فرمود: «خبرى در زندگى بعد از آنها نیست». از جمله وصایاى آن حضرت به ابن سعد این بود که کسى را به نزد امام حسین  بفرستند که آن حضرت به سوى کوفه نیاید."],["h","شهادت و دفن بدن حضرت مسلم"],["p","در غربت و مظلومیت آن حضرت همین بس که از پشت بامها دسته هاى نى را آتش مى زدند و بر سر آن حضرت مى ریختند. همچنین زمانى که چشم ابن زیاد بر آن حضرت افتاد، زبان به جسارت امیر المؤمنین و امام حسین  و عقیل گشود. در بالاى دار الاماره بالب تشنه سر از بدن نازنینش جدا کردند و بدنش را از بالاى قصر به پایین انداختند. بعد از شهادت ریسمان به پاى مبارکش بسته و در میان بازار کوفه مى کشیدند. سپس بدن مارکش را به دار زده و سر مطهرش را به دمشق فرستادند."],["p","در دفن بدن مطهر دو نظر است: یکى اینکه جمعى از قبیله هانى آمدند و بدنهاى مطهر مسلم بن عقیل و هانى را دفن کردند. ⟦811⟧ دیگر اینکه نیمه شب زوجه میثم تمار به همراهى چند نفر از جمله همسر هانى بن عروه، بدنها را در کنار مسجد اعظم کوفه دفن کردند. ⟦812⟧"],["h","هانى بن عروه"],["p","اما جناب هانى که پدرش عروه است، از اصحاب پیامبر  و از بزرگان و خواص شیعه و مخلصین در محبت امیر المؤمنین  بود، و در جنگهاى صفین، جمل و نهروان در خدمت آن حضرت بود. ⟦813⟧"],["p","جناب هانى بزرگ طایفه مذحج بود و در قبیله خود داراى نفود فراوانى بود. هنگامى که اهل کوفه عهد و پیامان خود را شکستند و بى وفایى خود را نسبت به اهل بیت  و مسلم بن عقیل ثابت کردند، جناب هانى بن عروه آن حضرت را پناه داد. پس از آن محمد بن اشعث خیبث جناب هانى و عده اى از شیعیان را دستگیر کرد."],["p","بعد از شهادت مسلم بن عقیل و شکستن سر و بینى جناب هانى توسط ابن زیاد ملعون، آن خبیث دستور داد سر جناب هانى را در بازار گوسفند فروشان از بدنش جدا کردند و با طنابى که به پاى آن بزرگوار بسته بودند همراه با بدن جناب مسلم بن عقیل  در بازار کوفه روى زمین کشیدند و سپس به دار زدند، و سپس بدن هانى همراه با بدن مسلم دفن شد."],["t",3,"روز سد ابواب"],["p","در این روز به امر پیامبر  همه درهاى منازل اصحاب به طرف مسجد پیامبر  بسته شد، جز در خانه امیر المؤمنین  که به دستور خاص الهى آن را نبستند. ⟦814⟧"],["p","عده اى از اصحاب عرض کردند: یا رسول االله، چرا همه دربها را جز در خانه على  بستید؟ حضرت فرمودند: «من تابع وحى پروردگار هستم، »و در روایتى دیگر است که پیامبر  خطبه اى ایراد فرمود و در ضمن آن فرمود: «اى مردم، خداوند متعال به موسى و هارون امر فرمود خانه هایى بنا کنند، و امر فرمود که جنب در آن خانه ها بیتوته نکنند و زنها داخل آنها نشوند مگر هارون و ذریه هارون. على بن ابى طالب  براى من به منزله هارون است براى موسى. پس براى احدى از زنها و جنب حلال نیست که به مسجد من داخل شود»."],["p","پیامبر  ایستادند و فرمودند: «عده اى رضایت قلبى ندارند که على بن ابى طالب  پیامبر  ایستادند و فرمودند: «عده اى رضایت قلبى ندارند که على بن ابى طالب  در همه وقت و هر حالتى ساکن مسجد باشد در حالى که آنها بیرون شده اند. بخدا قسم که من آنها را بیرون نکرده ام و على  را من ساکن مسجد قرار نداده ام، بلکه خداوند آنها را بیرون نمود و على  را ساکن مسجد قرار داده است، و منزلت او نزد من مانند منزلت هارون نزد موسى  است. سپس در فضایل على  کلماتى بیان فرمودند، تا آنجا که فرمودند: «هر کس از این موضوع ناراحت است برود آنجا، »و اشاره به طرف شام کردند. ⟦815⟧"]]},{"k":"day","key":10,"label":"","items":[["t",1,"عید قربان"],["p","روز عید اضحى است، و در این روز حجاج بیت االله الحرام براى رمى جمرات و قربانى کردن در منى به سر مى برند. ⟦816⟧"],["t",2,"شهادت عبد االله محض و جمعى از آل حسن "],["p","در این روز در سال 145ه جناب عبد االله محض بن حسن مثنى بن امام حسن مجتبى  در سن 57سالگى همراه با جمعى از برادران و پسر عموهاى خود در زندان منصور دوانیقى لعنه االله علیه به شهادت رسیدند. زندان آنان به گونه اى بود که روز و شب در آن مشخص نبود."],["p","برادران عبد االله محض حسن و ابراهیم بودند، مادر این دو بزرگوار فاطمه بنت الحسین  بود. فرزندان عموى عبد االله محض، یعقوب، اسحاق ابو الحسن على العابد، عباس و عبد االله بودند."],["p","بعضى از این بزرگواران مثل ابراهیم بن حسن زنده دفن شدند. بعضى دیگر هنگامى که داخل خانه بودند سقف را روى آنها خراب کرد و شهید شدند. مرقد آل حسن  در هاشمیه نزدیک بغداد است، که مشهور به قبور سبعه است. ⟦817⟧ منصور به خاطر عدوات خاصى که با اهل بیت  داشت، مدتى قبل از شهادت آن بزرگواران، در سال 144ه دستور داد آل حسن  را با غل و زنجیر بر گردن و پا، بر مرکبهاى چموش و بدن روانداز سوار کرده و به ربذه ببرند. آنان را با این حال در مقابل آفتاب با بدن برهنه در مقابل منصور نگه داشتند. عبد االله محض خطاب به منصور فرمود: «آیا ما در روز بدر با اسراى شما چنین کردیم»؟ این کلام بر منصور گران آمد و برخاست و رفت."],["p","هنگامى که آن بزرگوار را با این حال از مدینه بیرون مى بردند امام صادق  از پس پرده اى به آنان نگاه کرد و آنقدر گریست که اشک بر محاسن شریفش جارى شد و فرمود: بخدا قسم بعد از این جماعت حرمتى براى خداوند حفظ نکرده اند. ⟦818⟧"],["t",3,"نماز عید امام رضا  در خراسان"],["p","در این روز آقا و مولایمان حضرت ثامن الحجج  به خواهش مأمون، در خراسان براى نماز عید تشریف فرما شدند. مأمون با دیدن ازدحام مردم براى شرکت در نماز به امامت حضرت، دستور داد از نیمه راه بازگردند، چرا که ترسید مردم بر او شورش کنند. ⟦819⟧ در مراجعت از این نماز بود که حضرت رضا  از خداوند تقاضاى مرگ فرمود."]]},{"k":"day","key":11,"label":"","items":[["t",1,"روز نوشتن دعاى صباح"],["p","در این روز امیر المؤمنین  به تعلیم پیامبر  دعاى شریف صباح را به دست مبارك خود نوشتند. ⟦820⟧"],["t",2,"افشأ سر ولایت توسط عایشه"],["p","در این روز در سال دهم هجرت در حجه الوداع پیامبر  به حفصه سرى را بیان فرمود و به او تذکر داد که اگر این سر را به کساى بازگو کنى، لعنت خدا و ملائکه و تمامى مردم بر تو باد."],["p","حفصه بلافاصله آن سر را به عایشه گفت. ⟦821⟧ عایشه هم آن را به ابوبکر بازگو کرد و ابوبکر هم عمر را در جریان قرار داد. کار به جایى رسید که آن چهار زن و مرد تصمیم گرفتند پیامبر  را مسموم کنند."],["p","جبرئیل پیامبر  را باخبر کرد و آن حضرت آنها را از توطئه و افشأ سر خبر داد. سپس حفصه را طلاق دادند، ولى بعدا به اصرار بعضى رجوع فرمودند و آیات سوره تحریم نازل شد. ⟦822⟧"],["p","این دو زن چه کرده بودند که خداوند در سوره تحریم آنها را به زن نوح و لوط  تشبیه نموده است؟! ⟦823⟧ در آخر آیه 4این سوره آمده است: اگر شما دو زن یاور هم شوید براى قتل آن حضرت، خداوند و جبرئیل و صالح المؤمنین یعنى امیر المؤمنین  و ملائکه یاور پیامبر  هستند ⟦824⟧"],["p","«تظاهرا»در آیه شریفه خطاب به عایشه و حفصه است، و معنایش این است که آنان تعاون بر اذیت پیامبر  نموده سر آن حضرت را فاش کردند و زنان آن حضرت را اذیت نمودند. ⟦825⟧ عمر مى گوید: مراد از این دو زن که در اذیت پیامبر  هم پیامبر  هم پیمان بودند عایشه و حفصه است. ⟦826⟧"]]},{"k":"day","key":13,"label":"","items":[["t",1,"شق القمر"],["p","در شب 14ذى الحجه واقعه شق القمر به اعجاز پیامبر  در مکه رخ داد. ⟦827⟧ بعضى این واقعه را در شب 18این ماه گفته اند."],["p","قریش از آن حضرت معجزه طلب کردند، و حضرت با انگشت اشاره به ماه کرد، و به قدرت الهى دو نیم شد و باز به هم پیوست؛ و آیه نازل شد: اقتربت الساعه و انشق القمر ⟦828⟧ ابو بجهل گفت: «این سحر است! بفرستید از شهرهاى دیگر هم بپرسند که آیا آنها هم دیدند که ماه دو نیم شد. چون از اهل شهرهاى دیگر پرسیدند. آنها نیز خبر دادند که نیمى از ماه پشت خانه کعبه و نیمى بر کوه ابو قبیس افتاد. ⟦829⟧"]]},{"k":"day","key":14,"label":"","items":[["t",1,"بخشیدن فدك به حضرت زهرا "],["p","⟦830⟧"],["p","در این روز یا شب آن در سال هفتم هجرت، فدك به حضرت زهرا  بخشیده شد، و حضرت رسول  بر این بخشش شاهد گرفتند. قول دیگر در این باره 15رجب است. ⟦831⟧"],["h","فتح فدك"],["p","پس از فتح خیبر در سال هفتم هجرت، حدود چهار سال قبل از شهادت پیامبر  جبرئیل نازل شد، و دستور فتح فدك توسط پیامبر و امیر المؤمنین  را آورد. آن دو بزرگوار در تاریکى شب با اسلحه لازم به سرزمین فدك آمدند، و حسب دستور پیامبر ، امیر المؤمنین  بر کتف پیامبر  قرار گرفت و آن حضرت بر خاست و امیر المؤمنین  را با خود بلند کرد. به معجزه الهى مولى الموحدین  در حالى که شمشیر رسول االله  همراهش بود، از دیوار قلعه فدك بالا رفت و بالاى دیوار صداى مبارکش را به اذان بلند کرد."],["p","یهودیان قلعه فدك گمان کردند که مسلمین حمله کرده اند و روى دیوارها هستند. خواستند از در قلعه فرار کنند، ولى بیرون قلعه مقابل در آن پیامبر  را در برابر خود دیدند و از طرفى امیر المؤمنین  پایین آمد و با آنان درگیر شد و 18نفر از بزرگان آنان را کشتند، و بقه تسلیم شدند."],["p","زنان و فرزندان آنان را اسیر کردند و غنایم را همراه خود آوردند. امر بر این قرار گرفت که هر کس از اهل فدك مسلمان شود، خمس اموال او را بگیرند و هر کس بر دین خود باقى ماند همه اموالش را بگیرند. این گونه بود که بدون لشکر کشى و کوچکترین دخالت مسلمین قلعه فدك فتح شد. و طبق آیه مبارکه سوره حشر ⟦832⟧ سرزمینهایى که بدون لشکر کشى مسلمین فتح شود، حتى اگر اهل آنجا خودشان به عنوان تسلیم نزد پیامبر  بیایند، این مناطق و غنایم و اسراى آن ملک خاص حضرت است و مانند اموال شخصى خود مى تواند هر تصمیمى درباره آنها بخواهد بگیرد، و مسلمین هیچ حقى در آنها ندارند."],["h","اعطاى فدك به فاطمه "],["p","بعد از این ماجرا جبرئیل نازل شد و این آیه را آورد: و آت ذا القربى حقه: «حق خویشان را به آنان بده » ⟦833⟧ پیامبر  پرسید: منظور چه کسانى هستند، و این حق کدام است؟ جبرئیل از طرف خداوند عرضه داشت: فدك را به فاطمه  عطا کن. پیامبر  به حضرت زهرا  فرمودند: «خداوند فدك را براى پدرت فتح کرد، و چون لشکر اسلام آن را فتح نکرده مخصوص من است. خداوند دستور داده آن را به تو بدهم. از سوى دیگر مهریه مادرت حضرت خدیجه  بر عهده پدرت مانده و پدرت در قبال مهریه مادرت و به دستور خداوند فدك را به تو عطا مى کند. آن را براى خود و فرزندانت بردار و مالک آن باش»."],["p","حضرت زهرا  عرض کرد: «تا شما زنده اید بر من و مال من صاحب اختیار هستید». پیامبر  فرمود: ترس آن دارم که نااهلان تصرف نکردن تو را در زمان حیاتم، بهانه اى قرار دهند و بعد از من آن را از تو منع کنند. حضرت صدیقه  عرض کرد: آن گونه که صلاح مى دانید عمل کنید. پیامبر  امیر المؤمنین  را فراخواند و فرمود: «سند فدك را به عنوان بخشوده و اعطایى پیامبر بنویس و ثبت کن». على  آن را نوشت و پیامبر  و ام ایمن شهادت دادند و پیامبر  فرمود: ام ایمن زنى از اهل بهشت است."],["h","در آمد فدك"],["p","رسول خدا  مردم را در منزل حضرت زهرا  جمع نمود و به آنان خبر داد که فدك از آن فاطمه  است و از درآمد فدك به عنوان اعطایى فاطمه  بین مردم تقسیم کرد."],["p","در آمد فدك را سالیانه از هفتاد هزار سکه طلا تا صد و بیست هزار سکه نوشته اند. هر سال چشمان بسیارى از نیازمندان منتظر سر رسیدن در آمد فدك بود."],["h","غصب فدك"],["p","بعد از رحلت پیامبر  مأموران ابوبکر به دستور او نماینده حضرت صدیقه  را از فدك اخراج کردند و ملک آن را غصب نمودند و در آمد آن را به طور کامل براى مخارج حکومت غاصبانه خود صرف کردند."],["p","حضرت صدیقه  همان نوشته و سند فدك را که پیامبر  به امیر المؤمنین  فرمودند و آن حضرت ثبت کرد، عینا نزد ابوبکر آورد، ولى ابوبکر نه سند را قبول کرد و نه شاهدان را. ⟦834⟧"],["p","بعد از 15روز که از شهادت پیامبر  گذشته بود، حضرت صدیقه شهیده  همراه با جمعى از زنان بنى هاشم به مسجد تشریف بردند و خطبه اى ایراد فرمودند که دریایى از معارف، حقایق بلاغت و فصاحت و شرایع اسلامى در آن است."],["p","ابوبکر نامه اى دال بر باز گرداندن آن به حضرت نوشت، ولى هنگامى که فاطمه زهرا  آن سند را در دست داشت و به منزل باز مى گشت با عمر روبرو شد و او نوشته ابوبکر را با جسارت به ساحت ملکوتى حضرت از او گرفت."]]},{"k":"day","key":15,"label":"","items":[["t",1,"ولادت امام هادى "],["p","امام هادى  بنابر مشهور در چنین روزى از سال 212یا 214ه، در قریه صریا نزدیکى مدینه به دنیا آمد. ⟦835⟧ ولادت آن بزرگوار در 27جمادى الاخر و 2و 3و 5و 13رجب هم نقل شده است. ⟦836⟧"],["p","نام مبارك آن حضرت «على، »نام پدرشان جواد الائمه ، و نام مادر آن حضرت سمانه مغربیه معروف به سیده به کنیه ام الفضل است. ⟦837⟧"],["p","کنیه شریفش ابوالحسن ثالث است ⟦838⟧ القاب حضرت: نجیب، مرتضى، هادى، نقى، عالم، فقیه، امین، مؤ تمن، الطیب، عسکرى، فقیه عسکرى و ابن الرضا بود. ⟦839⟧"]]},{"k":"day","key":18,"label":"","items":[["t",1,"عید غدیر"],["p","در این روز در سال دهم هجرت واقعه غدیر در بازگشت از حجه الوداع به وقوع پیوست، و طى سه روز که کاروان صد و بیست هزار نفرى حجاج در غدیر خم توقف داشتند پیامبر  در بلندترین خطبه خود على بن ابى طالب و یازده امام  بعد از او را به عنوان امامان مردم تا روز قیامت معرفى کردند و از همه آن جمعیت بیعت گرفتند."],["h","عید بزرگ آل محمد "],["p","این روز بزرگترین عید آل محمد  به شمار مى آید، چرا که واقعه اى مهم و عظیم بعد از زحمات انبیأ و اوصیأ و اولیأ است، و طى آن به دستور الهى اعلان عمومى به وصایت بلافصل امیر المؤمنین على بن ابى طالب  شده است. ⟦840⟧"],["p","این روز عید مبارك آسمانى است."],["p","روزى است که خداوند متعال حضرت ابراهیم  را از آتش نجات داد. ⟦841⟧"],["p","روزى است که توبه حضرت آدم  قبول شد. ⟦842⟧"],["p","روزى است که خداوند متعال حضرت موسى  را بر ساحران غلبه داد. ⟦843⟧"],["p","روزى است که حضرت موسى  در حضور امت خود یوشع بن نون را وصى خود گردانید. ⟦844⟧"],["p","روزى است که حضرت عیسى  شمعون الصفا را جانشین خود گردانید. ⟦845⟧"],["p","روزى که حضرت سلیمان  رعیت خود را بر جانشینى آصف بن برخیا گواه گرفت. ⟦846⟧"],["p","روز عقد اخوت بستن پیامبر  بین اصحابش است. ⟦847⟧"],["p","در این روز پیامبر جانشینان خود را معین مى نمودند، و زیارت امیر المؤمنین  در این روز وارد شده است. ⟦848⟧"],["h","شرکت کنندگان در مراسم غدیر"],["p","ماجراى غدیر چنین بود که در روز شنبه، چهار یا پنج روز مانده به آخر ذى القعده سال 10ه، پیامبر  غسل نمودند و همراه با 120هزار نفر از مسلمانان، از مدینه خارج شدند. ⟦849⟧"],["p","در این سفر حضرت علیا مخدره صدیقه طاهره فاطمه زهرا ، ام هانى خواهر امیر المؤمنین ، فاطمه بنت حمزه، ام سلمه و سایر همسران پیامبر  از جمله عایشه و حفصه حضور داشتند. ⟦850⟧ امیر المؤمنین  هم از یمن با عده اى وارد مکه شدند."],["h","دستور الهى براى مراسم غدیر"],["p","بعد از انجام اعمال حج دستور الهى رسید که علم و ودایع انبیأ را به امیر المؤمنین  تحویل دهند و امر ولایت آن حضرت را به مردم تبلیغ نمایند. پیامبر  بسیار گریست، به طورى که محاسن مبارکش از اشک تر شد. حضرت از خداوند خواستند که ایشان را از شر منافقین فرماید. ⟦851⟧ در منى پیامبر  دو بار خطبه ایراد فرمودند، و اشاره کلى به ولایت امیر المؤمنین  فرمودند در مسجد خیف جبرئیل نازل شد که خداوند مى فرماید: «ولایت على  را به مردم برسان ولى وعده محافظت از شر دشمنان را براى آن حضرت نیاورد. در کراع الغمیم، بار دیگر جبرئیل نازل شد و این آیه را آورد که فلعلک تارك بعض ما یوحى الیک و ضائق به صدرك: »شاید تو ترك کنى بعضى از امورى را که به تو وحى مى شود و سینه تو به خاطر آن گرفته باشد.» ⟦852⟧"],["p","باز این بار هم امر ولایت مورد تأکید قرار گرفت، ولى آیه اى دال بر محافظت آن حضرت از شر دشمنان نیامد. پیامبر  مطالب منافقین را به جبرئیل فرمود و کوچ کردند."],["p","اوایل روز 18ذى الحجه به غدیر هم رسیدند و بار دیگر جبرئیل نازل شد و آیه 67سوره مائده را آورد که شامل تبلیغ ولایت مولى الموالى امیر المؤمنین  و در امان بودن آن حضرت از شر منافقین بود: یا ایها الرسول بلغ ما انزل الیک من ربک و ان لم تفعل فما بلغت رسالته و االله یعصمک من الناس ان االله لایهدى القوم الکافرین: »اى پیامبر تبلیغ کن به مردم آن امرى را که درباره على  از جانب خدا بر تو فرستاده شد و اگر این کار را انجام ندهى رسالت الهى را تبلیغ نکرده اى، و خدا تو را از شر مردم حفظ مى نماید. خداوند کافران را هدایت نمى کند»."],["h","پیامبر  بر فراز منبر غدیر"],["p","هنگامى ظهر، پیامبر  بعد از نماز جماعت، بالاى منبرى که زیر دو درخت کهنسال بود و توسط سلمان و ابوذر و مقداد و عمار ساخته شده بود رفتند و امیر المؤمنین  را بر فراز منبر یک پله پایین تر قرار دادند، در حالى که عده اى از منافقین مقابل منبر بودند."],["p","بعد از بیان کلمات درربار خویش در توحید و صفات کمال حق تعالى و بیان قسمت عمده اى از احکام حلال و حرام دین خدا، گذشته عرب و زندگى و عقاید آنان و زحماتى که آن حضرت کشیده اند را بیان داشتند. سپس فرمودند: بین قرآن و اهل بیت  اتصال ناگسستنى است و از یکدیگر جدا نمى شوند تا روز قیامت کنار حوض کوثر بر من وارد شوند."],["p","سپس قسمتى از فضایل و مناقب امیر المؤمنین  را بیان فرمودند، و درباره امامت و ولایت آن حضرت و اولادشان تا حضرت مهدى  چند بار تأکید کردند. آنگاه فرمودند: بر من وحى شده است: بسم االله الرحمن الرحیم یا ایها الرسول بلغ ما انزل الیک من ربک...."],["p","سپس فرمودند: اى مردم، من در تبلیغ آنچه خدا بر من نازل کرده کوتاهى نکرده و من سبب نزول این آیه را بیان مى کنم. جبرئیل دوباره بر من نازل شده و از جانب خداوند متعال به من امر کرد که در این مکان به هر سفید و سیاهى از هر قبیله اى اعلام کنم که على بن ابى طالب وصى و جانشین و امام بعد از من است. او بعد از خدا و رسولش ولى و صاحب شما و اولى بر همه شما از خود شماست. در این باره خداوند بر من آیه اى نازل نموده است: انما ولیکم االله و رسوله والذین آمنوا الذین یقیمون الصلوه و یؤ تون الزکاه و هم راکعون. ⟦853⟧ سپس فرمودند: من از جبرئیل خواستم که از خداوند بخواهد مرا از تبلیغ این امر معذور بدارد، چون به کمى مؤمنین و زیادى منافقین و استهزأ کنندگان به اسلام آگاهم. آنگاه فرمودند: معاشر الناس هو الامام المبین، روى بر مگردانید از ولایت او. فهو الذى یهدى الى الحق و یعمل به. اوست که هدایت به حق مى کند و عمل به آن مى نماید. او را فضیلت دهید که خدا او را فضیلت داده و او را قبول کنید که خداوند او را منصوب نموده است. اى مردم، او امام از طرف خداست. منکر ولایت او آمرزیده نخواهد شد و توبه اش قبول نمى شود. بعد از من افضل از همه زنان و مردان على است. ملعون و مورد غضب الهى است کسى که قول مرا رد کند و موافق آن نباشد. بدانید جبرئیل خبر داد که خداوند متعال مى فرماید: هر کس با على دشمنى کند و او را دوست نداشت باشد لعنت و غضب من بر او باد."],["p","بعد فرمودند: خداوندا، تو شاهد باش. من رسالتم را ادا کردم. من رساندنم آنچه فرموده بودى. من بر همگان واضح نمودم. آگاه باشید، غیر از برادرم على بن ابى طالب  دیگرى امیر المؤمنین نیست. امارت مؤمنین بعد از من براى احدى جز على بن ابى طالب  حلال نیست."],["h","معرفى على بن ابى طالب "],["p","در اینجا بازوى على  را گرفتند و در همین حال على  دستان مبارکش را به طرف آن حضرت بلند کرد. پیامبر  آن حضرت را بالا برد به حدى که پاهاى مبارك حضرت تا سر زانوهاى پیامبر  رسید. سپس فرمود: الست اولى بکم من انفسکم؟ همه گفتند: «الهى بلى». فرمودند: هذا عل اخى و وصیى، من کنت مولاه فهذا على مولاه و هو على بن ابى طالب. هرکس که من مولى و صاحب اختیار اوست. مکان و منزلت او مثل مکان و منزلت من نزد شماست. بار الها، دوست بدار هر کس او را دوست بدارد، و دشمن بدار هر کس او را دشمن بدارد، و کلماتى دیگر براى تأکید فرمان الهى و اقرار مردم بیان نمودند. سپس فرمودند: خبر غدیر را حاضرین به غایبین و پدران به فرزندان به فرزندان تا روز قیامت برسانند."],["h","بیعت لسانى و عملى"],["p","همین که آن حضرت از منبر پایین آمدند، مردم با صداى بلند با زبان و دست بیعت کردند و پیامبر  مى فرمود: هنثونى هنثونى ⟦854⟧ به من تبریک بگویید. بعد دستور دادند تا چادرى جداگانه براى امیر المؤمنین  زدند و فرمود: همه بروند و به آن حضرت سلام کنند و بگویند: السلام علیک یا امیر المؤمنین. عمر آمد و سلام کرد و گفت: بخ بخ یابن ابى طالب، أصبحت مولاى و مولى کل مؤمن و مؤمنه. ⟦855⟧"],["p","ابوبکر نیز در این تهنیت با عمر شریک بود. ⟦856⟧ بیعت سه روز طول کشید و در این سه روز نماز ظهر و عصر را با هم مى خواندند. بعد از نماز بیعت تا غروب ادامه داشت، و نماز مغرب و عشأ را نیز با هم مى خواندند."],["h","بیعت زنان"],["p","براى بیعت زنان، ظرف آبى زیر پرده اى قرار دادند، به طورى که نصف ظرف در طرفى و نصف دیگر آن در طرف دیگر پرده قرار داشت. یک طرف امیر المؤمنین  دست مبارك خود را داخل ظرف آب قرار داده بودند، و طرف دیگر زنها دست خود را مى گذاشتند و ضمن تبریک مى گفتند: «السلام علیک یا امیر المؤمنین». حضور حضرت صدیقه طاهره  زینت بخش مراسم بود. از سوى دیگر بیعت عایشه این سابقه او را در اذهان ثبت کرد تا روزى که جنگ جمل را بر پاکرد، و در مقابل صاحب غدیر صف آرایى نمود و با خوارى و ذلت از لشکر ولایت شکست خورد. ⟦857⟧"],["p","بعد از اعلام ولایت در غدیر، جبرئیل نازل شد و این آیه را آورد: الیوم اکملت لکم دینکم و اتممت علیکم نعمتى و رضیت لکم الاسلام دینا «: ⟦858⟧ امروز براى شما دینتان را کامل نمودم و نعمتم را بر شما تمام نمودم و اسلام را بعنوان دین شما راضى شدم»."],["t",2,"قتل عثمان"],["p","در این روز در سال 34ه عثمان بن عفان بعد از محاصره خانه او توسط مسلمین در سن 81یا 90سالکى به دست مردى از اهل مصر کشته شد. ⟦859⟧ عثمان را بعد از کشتن از خانه اش بیرون آوردند و در یکى از مزبله هاى مدینه انداختند. از ترس مهاجرین و انصار کسى او را دفن نمى کرد، تا بعد از سه روز با نیرنگ او را به مقبره یهودیان مدینه به نام «حش کوکب»بردند و دفن کردند. معاویه در دوران خلافتش خانه هاى بین این قبرستان و بقیع را خراب کرد، و آن را به قبرستان مسلمین متصل کرد! ⟦860⟧"],["h","خلافت غاصبانه عثمان"],["p","عثمان بعد از عمر بن خطاب به جاى او نشست. عمر در زمان حیات خود بارها گفته بود که بعد از من خلافت آن عثمان است، ⟦861⟧ ولى به ظاهر امر خلافت را به شورى گذاشت، و آن را به گونه اى پیش بینى کرد که سرانجامش خلافت عثمان شود."],["h","بدعتهاى عثمان"],["p","عثمان در ایامى که حکومت را به دست داشت خلافهاى بزرگى انجام داد:"],["p",".1منازلى وسیع و زیبا از سنگ و آجر و ساروج و دربهایى از چوبهاى هندى و خوشبو و گران قیمت ساخت. باغها و زمینها و چشمه هاى زیادى را مالک شد، و اموال بسیارى را در خزانه خود جمع آورى کرد. هنگامى که کشته شد صد و پنجاه هزار دینار و یک میلیون در هم نزد خازن او بود. اضافه بر زمینهاى اطراف حنین که صد هزار دینار قیمت داشت، و گاو و گوسفند و شتر فراوانى که از او بر جاى مانده بود. ⟦862⟧"],["p",".2به گروهى چون عبدالرحمن بن عوف و زبیر بن عوام آن قدر مال و باغ و زمین داد که آنها هم خانه هاى سنگى و آجرى و گچ کارى شده بنا کردند. فقط زبیر بعد از مرگ پنجاه هزار دینار، هزار غلام و هزار اسب از خود بر جاى گذاشت. ⟦863⟧"],["p",".3عبید االله بن عمر را به خاطر قتل سه مسلمان قصاص نکرد بعد از دفن عمر بن خطاب، عبید االله پسر عمو چون دسترسى به ابولؤ لؤ پیدا نکرد، بر در خانه او دختر کوچکش را کشت. هرمز عجمى مسلمان و جفینه غلام سعد بن ابى وقاص را هم کشت، به جرم اینکه چند روز قبل از کشته شن عمر آن دو نفر را دیده بود با فیروز در حال گفتگو هستند."],["p","سعد و قاص عبید االله بن عمر را به زمین زد و شمشیرش را گرفت و به غلامانش دستور داد او را حبس کردند، تا امر شورى تمام شود. عثمان که خلیف شد، على بن ابى طالب  و دیگران گفتند: «او را قصاص کن». عثمان او را آزاد کرد و گفت: دیروز پدرش کشته شده، امروز پسرش را بکشم؟ من به عنوان خلیفه مسلمین، عبید االله را بخشیدم. ⟦864⟧"],["p",".4حکم بن ابى العاص پدر مروان که دشمن خدا و رسول بود با احترام به مدینه آورد. او عموى عثمان بود که به عداوت با پیامبر  و اهل بیت  مشهور بود. حکم به خاطر جسارتهایى که به پیامبر  نموده بود، از طرف آن حضرت به طائف تبعید شد. بعد از شهادت پیامبر  ابوبکر و عمر شفاعت عثمان را براى حکم قبول نکردند. همین که حکومت به دست عثمان رسید، عموى خود حکم و مروان را با اطرافیان آنها به مدینه آورد و مخالفت صریح با امر پیامبر  نمود."],["p","دیرى نگذشت که به جاى حکم، ابوذر را بعد از ضرب و شتم بسیار تبعید کرد. از سوى دیگر صد هزار درهم از اموال مسلمین را به حکم داد. همچنین خمس افریقیه را که صد هزار دینار بود و همه مسلمین در آن شریک بودند، با فدك به مروان داد! و نیز مروان را براى وزارت و کتابت اسرار خود انتخاب کرد و حال اینکه پیامبر  مروان و حکم را بارها لعنت فرموده بود. ⟦865⟧"],["p",".5ولید بن عقبه را که پیامبر صلىا الله عليه وآله فرمود: «اهل آتش است»، والى کوفه کرد. ولید مردى فاسق و شارب الخمر بود و شبى تا صبح باکنیزان و مغنیه ها مشروب خورد و صبح همان حال به مسجد رفت و نماز صبح را چهار رکعت خواند و گفت: دوست دارید بیشتر بخوانم! او در حالتى که سجده را طول داده بود مى گفت: «اشرب و اسقنى.» ⟦866⟧"],["h","قتل عثمان به دست مردم"],["p","آخر الامر تعداد زیادى از مردم کوفه و مصر و بصره به عنوان اعتراض نزد عثمان آمدند و چون او اوضاع را خطرناك دید با واسطه قرار دادن امیر المؤمنین ، وعده داد که به درخواست آنها عمل کند، و حکام را تعویض و حسن سیره و عدل را پیشه کند. اما هنگامى که معترضین به شهرهاى خود باز مى گشتند، پیک مخصوص عثمان را دیدند که از بیراهه مى رود. او را گرفتند و نامه اى از طرف عثمان دیدند که به والى مصر نوشته است: به محض آمدن اینها، یکى را بکش، و دست دیگرى را قطع کن.... آنان برگشتند و افراد زیادى در مسیر همراه آنها به مدینه آمدند و حدود پنجاه روز خانه او را محاصره کردند."],["p","عثمان در ایام محاصره، از امیر المؤمنین  آب طلبید. حضرت سه مشک آب سرد بردند، ولى آخر الأمر معترضین به منزل او ریختند و مردى مصرى عثمان را کشت. گرچه بنى هاشم مانع شدند، و بنابر نقلى امام حسن  جراحت مختصرى برداشت و سر قنبر زخمى شد. ⟦867⟧"],["t",3,"خلافت ظاهرى امیر المؤمنین "],["p","در روز قتل عثمان در سال 34ه مردم با امیر المؤمنین  بیعت کردند. ⟦868⟧"]]},{"k":"day","key":20,"label":"","items":[["t",1,"خروج ابراهیم بن مالک اشتر براى جنگ با ابن زیاد"],["p","هنگامى که کوفه را جناب مختار (رحمه االله) از قتله سید الشهدأ  پاك کرد، در این روز ابراهیم بن مالک اشتر با 12000یا به روایت ابن نما با کمتر از 20000نفر براى جنگ با ابن یاد از کوفه خارج شد و مختار به مشایعت او رفت."],["p","لشکر ابراهیم تا کنار نهر خازر در پنج فرسخى موصل رفت، و آن مکان را لشکرگاه کرد. عبیداالله به موصل آمد و آنجا را باسى هزار یا هشتاد هزار سواره تصرف کرد و آماده جنگ با لشکر ابراهیم شدند."],["p","شبى که فردایش جنگ شروع مى شد، خواب به چشمان ابراهیم بن مالک نیامد و این کلمات را بارها براى لشکرش تکرار کرد: «ایها الناس، شمایید انصار دین و شیعه امیر المؤمنین ، و این است عبید االله بن مرجانه قاتل حسین بن على . این است که پسر فاطمه زهرا  را از جرعه اى آب منع کرد در حالى که عیالات و اطفال او فریاد «العطش»مى زدند. او بود که مانع شد که پسر پیامبر  به جایى برود، و اطراف او را گرفتند تا با لب تشنه شهیدش کردند و عیالات او را مانند کنیزان بر شتران سوار کرده به شام بردند. بخدا قسم فرعونیان با بنى اسرائیل نکردند آنچه این ملاعین با ذریه پیامبر  کردند»."],["p","سپس ابراهیم دعا کرد که خداوند نصر و پیروزى را نصیبت ما فرماید، چون ما براى خونخواهى اهل بیت پیامبر  غضب کرده ایم."],["p","صبح قسمتهاى مختلف لشکر و پرچم ها را بازدید نمود و جنگ آغاز شد. سرانجام بعد از چند روز جنگ، و فرار لشکر عبید االله بن زیاد، در روز عاشوراى سال 67ه عبید االله به دست ابراهیم بن مالک اشتر نخعى به درکات جهنم شتافت و سر او را براى مختار فرستادند. ⟦869⟧"]]},{"k":"day","key":22,"label":"","items":[["t",1,"شهادت میثم تمار"],["p","در این روز در سال 60ه میثم تمار به دلیل وفادارى به امام حسین  به دست ابن زیاد به دار آویخته شد و به شهادت رسید. ⟦870⟧"],["p","تاریخ شهادت میثم 19ذى الحجه و روز عاشورا نیز نقل شده است. ⟦871⟧"]]},{"k":"day","key":24,"label":"","items":[["t",1,"روز مباهله"],["p","این روز از یک سو روز مباهله اهل بیت  با نصاراى نجران است و از سوى دیگر نزول آیه تطهیر در شأن اهل بیت  در این روز بوده است. ⟦872⟧ هنگامى که این آیه نازل شد پیامبر  على و فاطمه و حسن و حسین  را فراخواند و فرمود: اللهم هؤ لأ اهلى «: بارالها اینان اهل من هستند.» ⟦873⟧"],["h","نامه پیامبر  به نصارى نجران"],["p","در سال دهم هجرى پیامبر  نامه اى به نصارى نجران فرستادند، به این مضمون که خداوند یکتا را عبادت کنند و مسلمان شوند، یا به مسلمین جزیه بدهند و به مذهب خود باشند و گرنه آماده جنگ باشند."],["p","بنى نجران در کلیساى بزرگ خود به مشورت پرداختند، عده اى مانند سید که از بزرگان قوم بود و عاقب که اسقف نجران بود مخالفت خود را با تسلیم در برابر خواسته پیامبر  اعلام کردند. در مقابل عده اى مانند ابو حارثه اسقف اعظم نجران که 120سال عمر داشت و در باطن مسلمان بود با امر پیامبر  موافق بودند. بعد از دو روز مشورت قرار شد کتاب «جامعه»را که صفات پیامبر  بعد از حضرت عیسى  را ذکر کرده بود، و صحیفه حضرت شیث  را بخوانند. در حضور جمع مسیحیان و فرستادگان پیامبر  فصلهاى جامعه قرائت شد و با اذعان به آنچه در جامعه آمده بود تصمیم گرفتند هفتاد نفر از جمله سید و عاقب و ابو حارثه را براى تحقیق به مدینه بفرستند."],["h","نجرانیان در مدینه"],["p","آنان به مدینه آمدند و خدمت پیامبر  شرفیاب شدند. هر چه آن حضرت دلیل و برهان آورد آنان قبول نکردند و امر به مباهله واگذار شد. جبرئیل  نازل شد و این آیه را آورد: فمن حاجک فیه من بعد ما جأك من العلم فقل تعالوا ندع أبنائنا و أبنائکم و نسائنا و نسائکم و أنفسنا و أنفسکم ثم نبتهل فنجعل لعنه االله على الکاذبین «: ⟦874⟧ اگر کسى با تو مجادله کند بعد از علمى که نزد تو آمده، بگو بیایید تا فراخوانیم پسران خود و زنهاى خود و کسى که به منزله جان ماست. آنگاه نفرین کنیم و لعنت خدا را بر دروغگویان قرار دهیم»."],["p","لذا قرار بر مباهله شد و سید و عاقب به محل اردوى خود در خارج مدینه رفتند. آنان با یکدیگر مشورت کردند و بعضى از علماى آنها گفتند: «اگر فردا محمد با اصحاب و جمعى کثیر براى مباهله حاضر شود این روش پادشاهان است و ترسى به خود راه ندهید. ولى اگر خواص اهل بیت خود را آورده این کار انبیأ است»."],["h","مراسم مباهله"],["p","روز دیگر هنگام بالا آمدن آفتاب، پیامبر  دست على بن ابى طالب  را گرفت و از حجره بیرون آمد. امام حسن و امام حسین  را پیش رو روانه فرمود و حضرت صدیقه کبرى فاطمه زهرا  از پشت سر آمدند، تا بین دو درختى که قبلا تعیین شده بود رسیدند. قبلا به دستور حضرت زیر آن دو درخت را جارو زدند، و به عنوان سایه بان عباى سیاهى بالاى درخت قرار دادند. مسلمانان مدینه هم آمدند، بنى نجران هم با فرزندان خود آمدند. پیامبر  کسى را نزد سید و عاقب فرستاد که ما آماده ایم."],["p","اسقف با همراهان آمد و گفت: با چه کسانى با ما مباهله مى کنید؟ پیامبر  فرمود: «با بهترین اهل زمین و نیکوترین جهانیان نزد خداوند متعال زیرا که از طرف خداوند متعال امر شده ام که آنها را بیاورم، »و اشاره به آل عبا  فرمودند."],["p","سید و عاقب و اسقف همین که چشمشان به پیامبر  و آل عبا  افتاد، وحشت کردند به حدى که چهره هایشان زرد شد. ابوحارثکه میل به اسلام داشت فرصت را مغتنم شمرده، پا پیش گذاشت و دست سید و عاقب را گرفته پس کشید و آنها را نصیحت کرد و از عواقب این مباهله مطلع کرد و گفت: صفات او و اهل بیت او را در کتابها خوانده اید. این محمد همان پیامبر است، مگر نمى بینید ابرهاى سیاه را، و دگرگونى آفتاب را، و شاخه هاى درختان را که خم شده، و صداى مرغان، و دود سیاه اطراف و آثار زلزله را که در کوهها نمودار شده است. آن بزرگواران منتظرند که دست به دعا بردارند. به خدا قسم اگر سخنى گویند از ما نشانى نمى ماند. برویم و با او صلح کنیم."],["h","پرهیز نجرانیان از مباهله"],["p","او را فرستادند و ابو حارث مسلمان شد و عرض کرد: مردم نجران پشیمان شده اند. حضرت فرمود: اسلام بیاورند. گفت: قبول نمى کنند. فرمود: آماده جنگ باشند. گفت: قدرت این کار را ندارند، ولى حاضرند جزیه را قبول کنند. پیامبر  به امیر المؤمنین  فرمودند: «شرایط ذمه و مقدار آن را به آنها بگویید». بعد از معین نمودند جزیه و شرایط آن، امیر المؤمنین  آنها را نزد پیامبر  آوردند، و پیامبر  فرمودند: «اگر با من و این جماعت اهل بیت من مباهله مى نمودید، به صورت میمون و خوك مى شدید و این وادى بر شما آتش مى شد و یک سال نمى گذشت که تمامى نصارى نابود مى شدند.» ⟦875⟧"],["t",2,"روز خاتم بخشى"],["p","در این روز امیر المؤمنین  در مسجد پیامبر  انگشتر خود خود را در حالت رکوع به سائل بخشید، و آیه مبارکه انما ولیکم االله و رسوله و الذین آمنوا الذین یقیمون الصلاه و یؤ تون الزکاه و هم راکعون ⟦876⟧ در شأن آن حضرت نازل شد. ⟦877⟧ از امیر المؤمنین  معناى این آیه شریفه را سؤ ال کردند که مى فرماید: یعرفون نعمه االله ثم ینکرونها «: ⟦878⟧ نعمت خداوند را مى شناسند و سپس آن را انکار مى کنند». حضرت فرمودند: هنگامى که آیه مبارکه انما ولیکم االله نازل شد، عده اى اصحاب پیامبر  در مسجد مدینه جمع شدند. بعضى به بعض دیگر گفتند: درباره این آیه چه مى گویید؟ بعضى گفتند: اگر منکر این آیه بشویم سایر آیات را هم باید منکر شویم و اگر ایمان به این آیه بیاوریم و قبول کنیم براى ما ذلت است، زیرا على بن ابى طالب  بر ما مسلط مى شود. عده اى از منافقین گفتند: ما مى دانیم که محمد در آنچه مى گوید صادق است. او را به ظاهر دوست داریم، ولى از على در آنچه امر مى کند اطاعت نمى کنیم."],["p","حضرت فرمودند: در این هنگام این آیه نازل شد: یعرفون نعمه االله ثم ینکرونها،... یعنى: ولایت على بن ابى طالب  را مى شناسند و حال اینکه اکثر آنها که آن را مى شناسند نسبت به ولایت آن حضرت کافرند. ⟦879⟧"],["p","بعضى از مخالفین گفته اند: براى کسى اتفاق نیفتاده که در یک زمان جمع بین دو عبادت مالى و بدنى بنمایند مگر على بن ابى طالب ، و براى احدى نیامده از فضایل مثل آنچه براى على  آمده
