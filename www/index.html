<style>
:root{--bg:#F1F5F2;--card:#fff;--ink:#17261F;--mute:#66786F;--line:#D9E4DE;--em:#0E6B57;--emd:#08463A;--emt:#E1F1EB;--gold:#A87A1E;--goldt:#F6EBD0;--red:#BF3636;--redt:#FBE6E6;--on:#fff;--fs:16px;--sh:0 1px 2px rgba(10,40,30,.08),0 6px 20px rgba(10,40,30,.06)}
:root[data-theme=dark]{--bg:#0C1411;--card:#151F1B;--ink:#E3EEE8;--mute:#8CA196;--line:#26362F;--em:#3DB496;--emd:#0F3A30;--emt:#183128;--gold:#DDB35A;--goldt:#33290F;--red:#EE7676;--redt:#3A1D1D;--on:#06130F;--sh:0 1px 2px rgba(0,0,0,.4)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C1411;--card:#151F1B;--ink:#E3EEE8;--mute:#8CA196;--line:#26362F;--em:#3DB496;--emd:#0F3A30;--emt:#183128;--gold:#DDB35A;--goldt:#33290F;--red:#EE7676;--redt:#3A1D1D;--on:#06130F;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 Vazirmatn,"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--em);outline-offset:2px}
#app{max-width:720px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header.top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
header.top h1{margin:0;font-size:19px;flex:1;font-weight:700}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh)}
.ib svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow:auto;padding:0 14px 90px;-webkit-overflow-scrolling:touch}
nav.tabs{position:absolute;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--mute);padding:5px 0;border-radius:10px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected=true]{color:var(--em);font-weight:700}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:16px 18px;background:linear-gradient(150deg,var(--em),var(--emd));color:#fff;box-shadow:var(--sh)}
.hero svg.star{position:absolute;inset-inline-start:-34px;top:-34px;width:170px;height:170px;opacity:.13}
.hero .wd{font-size:13px;opacity:.85}
.hero .big{font-size:30px;font-weight:800;line-height:1.25;margin:2px 0}
.hero .sub{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;opacity:.95}
.hero .chips{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;background:var(--emt);color:var(--em)}
.hero .chip{background:rgba(255,255,255,.18);color:#fff}
.chip.gold{background:var(--goldt);color:var(--gold)}.chip.red{background:var(--redt);color:var(--red)}
.bar{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.bar .t{flex:1;text-align:center}.bar .t b{font-size:19px;display:block;line-height:1.3}.bar .t small{color:var(--mute);font-size:12.5px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;box-shadow:var(--sh);margin:0 0 10px}
.seg button{flex:1;padding:6px 0;border-radius:9px;font-size:14px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--em);color:var(--on);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--mute);padding:4px 0}.dow.f{color:var(--red)}
.cell{position:relative;aspect-ratio:1/1.12;border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:2px 0;box-shadow:var(--sh);min-width:0}
.cell.e{visibility:hidden}
.cell .m{font-size:18px;font-weight:700;line-height:1.2}
.cell .s{display:flex;justify-content:space-between;width:100%;padding:0 6px;font-size:10px;line-height:1.1;color:var(--mute)}
.cell .s i{font-style:normal}.cell .s i:first-child{color:var(--em)}
.cell.hol .m,.cell.fri .m{color:var(--red)}.cell.hol{background:var(--redt)}
.cell.today{outline:2px solid var(--em);outline-offset:-2px}
.cell.sel{background:var(--em);box-shadow:none}.cell.sel .m,.cell.sel .s,.cell.sel .s i{color:var(--on)}
.cell .dot{position:absolute;top:5px;inset-inline-end:6px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.cell.sel .dot{background:var(--on)}
.card{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--sh);margin:12px 0}
.card h3{margin:0 0 6px;font-size:16px}
.card .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.btn{background:var(--em);color:var(--on);padding:8px 16px;border-radius:12px;font-weight:700}
.btn.ghost{background:var(--emt);color:var(--em)}
.ev{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:start}
.ev:first-of-type{border-top:0}
.ev .n{min-width:24px;height:24px;border-radius:8px;background:var(--goldt);color:var(--gold);font-size:12.5px;font-weight:700;display:grid;place-items:center}
.muted{color:var(--mute);font-size:13.5px}
.list button.row{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:12px 14px;margin:6px 0;border-radius:14px;background:var(--card);box-shadow:var(--sh)}
.row .num{width:34px;height:34px;border-radius:11px;background:var(--emt);color:var(--em);display:grid;place-items:center;font-weight:800}
.row .tx{flex:1;min-width:0}.row .tx small{display:block;color:var(--mute);font-size:12.5px}
.days{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.days button{min-width:42px;padding:6px 10px;border-radius:11px;background:var(--emt);color:var(--em);font-weight:700}
.days button.t{background:var(--goldt);color:var(--gold)}
.search{display:flex;gap:8px;margin:6px 0 10px}
.search input,.fld{flex:1;min-width:0;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
mark{background:var(--goldt);color:var(--ink);border-radius:4px;padding:0 2px}
.res{display:block;width:100%;text-align:start;background:var(--card);border-radius:14px;padding:11px 14px;margin:7px 0;box-shadow:var(--sh)}
.res b{font-size:13px;color:var(--em)}.res p{margin:3px 0 0;font-size:14px}
.conv{display:grid;grid-template-columns:62px 1fr 1.3fr 1fr;gap:6px;align-items:center;margin:8px 0}
.conv label{font-weight:700;font-size:14px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
input[type=range]{accent-color:var(--em)}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;max-width:720px;margin:0 auto}

.sheet header h2{flex:1;margin:0;font-size:17px;line-height:1.35}
.sheet .body{flex:1;overflow:auto;padding:6px 18px 60px;-webkit-overflow-scrolling:touch}
.bk{font-family:"Noto Naskh Arabic","Traditional Arabic","Amiri","Scheherazade New",Vazirmatn,serif;font-size:calc(var(--fs) + 2px);line-height:2.15;text-align:justify}
.bk p{margin:.55em 0}

.bk h4{margin:1.1em 0 0;font-size:1em;color:var(--em);font-weight:700}

.sal{font-family:"Noto Naskh Arabic","Traditional Arabic",serif;font-size:.78em;color:var(--gold);white-space:nowrap}
.ref{color:var(--em);font-size:.7em;font-weight:700;cursor:pointer;padding:0 .3em;margin:0 .1em;border-radius:.5em;background:var(--emt);font-family:Vazirmatn,Tahoma,sans-serif;vertical-align:super;line-height:1}
.fnl p{margin:.5em 0;font-size:calc(var(--fs) - 1px);line-height:1.9}.fnl b{color:var(--em);margin-inline-end:.4em}
#pop{position:fixed;inset-inline:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;max-width:696px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:0 10px 40px rgba(0,0,0,.25);display:none;max-height:42vh;overflow:auto}
#pop.on{display:block}#pop b{color:var(--em)}
.fx{display:flex;gap:8px;justify-content:space-between;padding:8px 18px;border-top:1px solid var(--line);background:var(--card)}
.empty{text-align:center;color:var(--mute);padding:26px 10px}

.wid{display:block;width:100%;text-align:start;line-height:1.7}.wid b{color:var(--em)}
#az{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,var(--em),var(--emd));color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px}
#az.on{display:flex}#az>b{font-size:42px}#az .btn{background:#fff;color:var(--emd)}

.swg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sw{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;border:2px solid var(--line);font-size:12px;background:var(--card)}.sw i{width:26px;height:26px;border-radius:50%}.sw[aria-pressed=true]{border-color:var(--em)}
.npv{display:flex;gap:12px;align-items:center;background:var(--emt);border-radius:22px;padding:14px;margin-bottom:6px}.npv small{display:block;color:var(--mute);line-height:1.6}
.bfo{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px}.bfo.on{display:flex}.bfc{background:var(--card);color:var(--ink);border-radius:22px;padding:16px 18px;max-width:420px;width:100%;max-height:75vh;overflow:auto;box-shadow:var(--sh)}
.pz{font:15px/1.6 Vazirmatn,"Noto Sans Arabic",Tahoma,sans-serif;text-align:start}.pz h3{font-style:normal;margin:0 0 8px;font-size:16px;color:var(--ink)}.pz .seg{min-width:0}
button,select,input,[data-t],.cell{touch-action:manipulation}nav.tabs button{min-height:52px}
</style>

<script id="DATA" type="application/json">{"front":[["h","تقویم شیعه"],["p","نویسنده: عبد الحسین نیشابورى"],["p","این کتاب توسط مؤسسه فرهنگی -اسلامی شبکۀ الامامین الحسنین  بصورت الکترونیکی براي مخاطبین گرامی منتشر شده است."],["p","لازم به ذکر است تصحیح اشتباهات تایپی احتمالی، روي این کتاب انجام نگردیده است."],["h","پیشگفتار"],["p","آنچه حیات شیعه را با ارزش مى کند"],["p","شیعتنا جزء منا خلقوا من فضل طینتنا، یسوؤ هم ما یسوؤ نا و یسرهم ما یسرنا."],["p","امام صادق  مى فرماید: «شیعیان ما جزئى از ما هستند، که از اضافه طینت ما خلق شده اند. آنچه ما را ناراحت کند آنان را ناراحت مى کند و آنچه ما را مسرور کند آنان را مسرور مى نماید». ⟦1⟧"],["p","عمر ما شیعیان را با محاسبه ساعاتى که در یاد اهل بیت پیامبر  باشیم مى توان محاسبه کرد. براى به دست آوردن ارزش و بهاى حقیقى سال و ماه و روزمان، لحظاتى را باید محاسبه کنیم که نام مقدس محمد و على و فاطمه و یازده امام از فرزندانشان  در آنها درخشیده است، و باید ساعاتى را به شماره آوریم که نام حسین  به آنها جان داده است، و باید روزهایى را به حساب آوریم که با یاد مهدى صاحب الزمان  سپرى کرده ایم."],["p","سرور و غم در شادى و حزن اهل بیت "],["p","در اعتقاد ما دین جز حب و بغض نیست، و این محبت است که نمى گذارد روزهاى شیرین و تلخ در رابطه با ولایت و برائت از خاطره ها محو شود. در ولادت پیامبر  تبسمى روح انگیز بر لب مى نشانیم و در رحلت او مظلومیت على و فاطمه  را در دل تازه مى کنیم. در ولادت على  با جمع بهشتیان به استقبال او در کعبه مى رویم، و در شهادت او خون دل سى ساله على  از ظلم سقیفه را با تمام وجود احساس مى کنیم."],["p","در ولادت زهرا  با لبخند پیامبر و خدیجه  غنچه روحمان مى شکفند و بى اختیار متبسم مى شویم، و در شهادت او ضربه در را بر پهلوى خود احساس مى کنیم، و به یاد آن سیلى صورت خود را سرخ مى کنیم، بر جود حسن  مى بالیم و بر تنهایى مظلومانه او مى نالیم. در غدیر اوج سرور را در مى نوردیم و تابلوى بزرگترین عید الهى را بر بلندترین قله جهان نصب مى نماییم. در عاشورا از قله غم قصه عظیم ترین غصه را مرور مى کنیم و اشک مى ریزیم و از خود بى خود مى شویم."],["p","شیعه جنازه مقدس پیامبرش را رها نمى کند و به سقیفه نمى رود. شیعه فاطمه  را در پشت در و على  را طناب بر گردن تنها نمى گذارد. شیعه با خاموش شدن چراغ خیمه ها در شب عاشورا خود را در تاریکى شب گم نمى کند. شیعه با لبیک دائمى خود نداى هل من ناصرحسین  را پاسخ مثبت مى دهد. شیعه سم اسبها را بر سینه خود احساس مى کند. شیعه به یاد خیمه هاى سوخته در آتش مى دود و «یاحسین»مى گوید."],["p","شیعه کنار محمل زینب  سر مى شکند. شیعه به یاد کودکان در بیابان دویده کربلا در روز عاشورا پابرهنه مى گردد. شیعه چشمان اشکبار خاندان حسین  را کنار سر بریده تنها نمى گذارد. شیعه مانند زینب و رباب  با مشاهده چوب خیزران طاقت از کف مى دهد. شیعه هنوز براى رقیه سه ساله  در خرابه مرهم مى برد."],["p","شیعه همچنان اربعین را در کربلا حاضر است. شیعه با زینب بر حسین مى گرید، و با سکینه بر على اکبر اشک مى ریزد، و با رباب براى على اصغر سینه داغ مى کند، و با اطفال حرم «یااباالفضل» مى گوید. شیعه همراه کاروان اسیران حسینى و زینبى از کربلا تا کوفه و از کوفه تا شام و از شام تا کربلا و از کربلا تا مدینه مى رود. شیعه بر امامان مظلومى که به دست میراث خواران سقیفه محبوس و مسموم شدند مى سوزد."],["p","و این گونه اشک شیعه در سوگ اهل بیت  است و سرورش در شادى آنان!! شیعه از امامش این درس ابدى را گرفته است که ان سرك أن تکون معنا فى الدرجات العلى فى الجنان فاحزن لحزننا و افرح لفرحنا: «اگر دوست دارى در درجات عالى بهشت با ما باشى براى حزن ما محزون باش و براى شادى ما شاد باش»."],["p","⟦2⟧"],["p","دوازده ماه در قرآن"],["p","خداوند در قرآن مى فرماید: ان عده الشهور عند االله اثناعشر شهرا فى کتاب االله یوم خلق السماوات و الأرض، منها أربعه حرم ذلک الدین القیم فلاتظلموا فیهن أنفسکم... عدد ماهها نزد خدا در کتاب الهى -از روزى که آسمانها و زمین را آفریده -دوازده ماه است که چهار ماه از آنها حرام است. این است دین ثابت و پابرجا، پس در این چهار ماه به خود ستم نکنید. ⟦3⟧»..."],["p","از امام باقر  درباره معناى این کلام خداوند پرسیدند که مى فرماید: ان عده الشهور عنداالله انا عشر شهرا.... حضرت فرمود: منظور از سال جدم پیامبر  است، و ماههاى آن دوازده تاست که عبارتند از امیرالمؤمنین، امام حسن، امام حسین، امام على بن الحسین، خود من (یعنى امام باقر)، و بعد از من پسرم جعفر، و پسر او موسى، و پسر او على، و پسر او محمد، و پسر او على، و پسر او حسین، و پسر او مهدى، که دوازده امام اند، و حجتهاى خدا در خلق او و امینانش بر وحى و علم هستند."],["p","چهار ماه که خدا آنها را ماههاى حرام و محترم شمرده و دین محکم الهى هستند، چهار امام اند که نام آنها على است: على امیرالمؤمنین، پدرم على بن الحسین، على بن موسى و على بن محمد. اقرار به این امامان دین محکم است. به امامت همه آنان معتقد باشید تا هدایت یابید. ⟦4⟧"],["p","روش تنظیم کتاب حاضر"],["p","در تنظیم کتاب حاضر نکات زیر در نظر گرفته شده است:"],["p","1. تقسیم اصلى کتاب بر اساس ماه هاى دوازده گانه قمرى در 12بخش است. در هر بخش روزهاى هر ماه عنوان اصلى قرار داده شده، و وقایع هر روز با شماره گذارى و عنوان فرعى آورده شده است."],["p","2. در پایان روزهاى هر ماه به ذکر وقایعى مى پردازیم که در آن ماه رخ داده ولى روز آن تعیین نشده است."],["p","3. در اکثر ولادت ها و شهادتها قولهاى نادر و خلاف مشهور وجود دارد، که ما با انتخاب قول اقوى بقیه اقوال را در ذیل آنها یادآور شدیم. در مواردى مانند شهادت حضرت زهرا  که چند روز در سال رسما مطرح است همه آنها ذکر مى شود."],["p","4. وقایع مذکور در این تقویم از ولادت پیامبر  تا آغاز غیبت کبرى است."],["p","5. همچنین وقایع تاریخى بسیارى با سند و مدرك وجود دارد، که به خاطر ربط نداشتن به معصومین  ذکر نشده است."],["p","6. در برخى موارد با توجه به اهمیت آنها تفصیل بیشترى داده شده است."],["p","7. در آغاز هر بخش خلاصه اى از وقایع آن ماه و دورنمایى از آنها ذکر شده است."],["p","امید است این تقویم، به پیوند زندگى هایمان با اهل بیت عصمت و طهارت  تحکیم بیشترى ببخشد، و با تذکر روزهاى غم آنان اندوهناك و با یاد روزهاى خوش آنان شاد باشیم. در اعتقاد ما لذت بردن از زندگى این گونه است، و معنادار بودن زندگى جز این نیست."],["p","عبد الحسین نیشابورى"],["p","قم، محرم،1424فروردین 1382"]],"months":[{"name":"محرم الحرام","groups":[{"k":"intro","key":0,"label":null,"items":[["p","ماه محرم ماه پر حادثه اى است که اعظم آنها شهادت سید الشهدأ  است. در روزهاى 1، 2، 3، 4، 6، 7، 8، 9، 10، 11، 12، 13، 15، 19، 20، 23، 25، 26، 28 و 29 این ماه وقایع رخ داده که اکثر آنها مربوط به واقعه کربلاست."],["p","نزدیک شدن امام حسین  به کربلا، ورود حضرت به این سرزمین و نامه براى اهل کوفه، ورود عمربن سعد به کربلا، فتواى شریح قاضى به قتل امام حسین  و تراکم لشکر یزید، ملاقات امام حسین  با ابن سعد، منع آب از امام حسین ، محاصره خیمه ها در کربلا، آمدن امان نامه براى فرزندان ام البنین ، در خواست تأخیر جنگ، آمدن لشکر تازه نفس به کربلا، خطابه امام حسین  براى اصحابش، سخنان امام  با اهل بیتش، سخنان زینب کبرى  با امام حسین ، همه اینها مراحلى از واقعه کربلاست که قبل از شهادت امام حسین  در ماه محرم بوقوع پیوسته است."],["p","شهادت سید الشهدأ امام حسین ، شهادت قمر بنى هاشم حضرت عباس ، شهادت حضرت على اکبر ، شهادت قاسم بن حسن ، شهادت باب الحوائج على اصغر ، شهادت عبد االله بن حسن ، شهادت حبیب بن مظاهر اسدى و مسلم بن عوسجه، شهادت حر بن یزید ریاحى و جون غلام ابى ذر غفارى، و شهادت اصحاب باوفاى امام حسین ، شهادت زوجه وهب به دست غلام شمر، جلوه هاى بزرگترین پرونده شهادت است که در ماه محرم تحقق یافته است."],["p","آمدن ذوالجناح با یال خونین به خیمه فاطمیات، ماتم و ناله و گریه پردگیان حرم بر سید الشهدأ  و اولاد او، غارت اموال از خیام امام حسین ، غارت لباس و زره از بدن مطهر شهداى کربلا، به آتش کشیدن خیمه هاى آل االله، فرار فاطمیات و علویات در بیابانها، شهادت دختران کوچک در کنار خیمه ها، جدا شدن سرهاى مطهر امام حسین  و اهل بیت و اصحاب، وقایعى است که پس از شهادت امام حسین  بوقوع پیوسته، و همه در ماه محرم بوده است."],["p","رأس مطهر امام حسین  در تنور خولى در کوفه، حرکت کاروان اسرار از کربلا، حرکت اهل بیت امام حسین  به سوى کوفه، دفن شهداى کربلا، ورود اهل بیت  به کوفه، اسراى اهل بیت  در مجلس ابن زیاد، اسراى اهل بیت  در زندان کوفه، خبر شهادت امام حسین  در مدینه و شام، شهادت عبد االله بن عفیف، وقایعى است که در ماه محرم کوفه به خود دیده است و سپس اهل بیت  در شهرهاى عراق و شام گردانده شدند و در همین ماه بود که با شام رسیدند."],["p","وقایع دیگرى در ماه محرم اتفاق افتاده که برخى قبل و بعضى دیگر بعد از واقعه کربلا بوده است ماجراى شعب ابى طالب ، جنگ ذات الرقاع، اولین جمع آورى زکات، نوشتن صحیفه ملعونه، وفات حذیفه بن یمان قبل از ماجراى کربلا در ماه محرم بوقوع پیوسته است."],["p","قیام مردم مدینه بر علیه یزید پس از شهادت امام حسین ، قتل ابن زیاد، وفات ام سلمه و ماریه قبطیه دو همسر رسول خدا ، شهادت حضرت سجاد ، خروج زید بن على بن حسین ، کلام عاشورایى امام رضا ، تبعید امام جواد ، وقایعى است که پس از شهادت امام حسین  در ماه محرم اتفاق افتاده و ان شأ االله قیام حضرت مهدى  نیز در ماه محرم و در روز عاشورا خواهد بود."],["p","اینها خلاصه وقایعى بود که در ماه محرم الحرام رخ داده، که در این بخش به تفصیل آنها خواهیم پرداخت."]]},{"k":"day","key":1,"label":"","items":[["t",1,"آغاز ایام حسینى"],["p","اولین روز از ماه حزن و اندوه آل محمد  است، که همه انبیأ و ملائکه و شیعیان و دوستان اهل بیت  محزون اند. باید گفت: ماه حزن و اندوه تمام عالم است، چرا که همه ساله از اول محرم تا روز عاشورا پیراهن پاره پاره سید الشهدأ  را از عرش خدا رو به زمین مى آویزند و حزن و اندوه عالم را فرا مى گیرد. ⟦5⟧"],["p","همچنین آغاز مجالس عزادارى حضرت اباعبد االله  است، که مردم را به امور اعتقادى خویش آشنا مى کند، و دستورات دین خود را از حسینیه ها و تکایا و مساجد به خانه هاى فکر و دل خود به ارمغان مى برند. شرکت در مراسم عزادارى امام حسین  و اشک بر آن حضرت، از وظایف ما در زمان غیبت امام زمان  است."],["t",2,"ماجراى شعب ابى طالب "],["p","در پى بالاگرفتن قدرت اسلام پس از بعثت پیامبر ، قریش پیمان نامه اى نوشتند و طى آن قرار گذاشتند با بنى هاشم تکلم نکنند و با آنان هم سفره و همنشین نشوند و معامله ننمایند؛ و آنان را به گونه اى در فشار قرار دهند که پیامبر  را به قریش تحویل دهند تا آن حضرت را به قتل برسانند. حضرت ابوطالب  بنى هاشم را به دره اى که منتسب به آن حضرت بود برد، و اطراف آن را محکم کرده و براى حفظ جان پیامبر  شبانه روز کمر همت بست."],["p","آن حضرت شبها با شمشیر پروانه وار گرد شمع وجود پیامبر  مى گردید و مى فرمود: «تا زنده ام دست از یارى او بر نمى دارم. او در هر شب چند بار محل خواب پیامبر  را تغییر مى داد و عزیزترین فرزند خود یعنى امیر المؤمنین (علیه السلام ) را به جاى آن حضرت مى خوابانید، و روز فرزندان خود و فرزندان برادرانش را به حفاظت از آن حضرت مى گماشت. در مدتى که در شعب بودند بر آن حضرت و مسلمانان بسیار سخت گذشت، تا آنجا که شبها صداى گریه اطفال گرسنه اطفال گریه اطفال گرسنه بنى هاشم را ساکنین اطراف شعب مى شنیدند."],["p","پس از دو سال و چند ماه خداوند موریانه را مأمور کرد، و پیمان نامه آن را از بین برد بجز اسمأ اللهى که در آن بود. حضرت ابوطالب  این خبر را به کفار داد، و آنان با دیدن چنین معجزه اى دست از تصمیم خود برداشتند و بنى هاشم به خانه هاى خود بازگشتند. ⟦6⟧"],["t",3,"جنگ ذات الرقاع"],["p","در سال چهارم هجرت -به تحریک کفار قریش -بین مسلمانان و قبایلى که اطراف مدینه زندگى مى کردند و قصد محاصره مدینه را داشتند جنگى در گرفت. پیامبر  با 400یا 790نفر از مدینه بیرون رفتند. در این غزوه حضرت نماز خوف خواندند و جنگ تا سه روز طول کشید تا شر آنان دفع شد. این واقعه به قولى در 15جمادى الاولى بوده است. ⟦7⟧"],["t",4,"اولین جمع آورى زکات"],["p","در روز اول محرم پیامبر  براى اولین بار مأمورانى را براى جمع آورى زکات و صدقات به اطراف مدینه فرستاد. ⟦8⟧"],["t",5,"امام حسین  در راه کربلا"],["p","روز اول محرم، امام حسین  در قصر بنى مقاتل نزول اجلال فرمودند، و از عبید االله بن حر جعفى دعوت به یارى نمودند، ولى او اجابت نکرد و بعدا پشیمان شد. ⟦9⟧"],["t",6,"قیام مردم مدینه بر علیه یزید"],["p","در این روز در سال 63ه مردم مدینه براى قیام علیه یزید حرکت کردند. قضیه از آنجا آغاز شد که جمعى از اهالى مدینه به رهبرى عبد االله بن حنظله به شام رفتند و دستگاه یزید و شرابخوارى و قمار بازى و سگ بازى او را دیدند، و به مدینه بازگشته و مردم را از وضع فساد دربار اموى آگاه ساختند. با شنیدن این اخبار همگان بر خلع یزید اتفاق نمودند، و به سرپرستى عبد االله علیه یزید قیام نمودند و افراد اموى ساکن مدینه را بیرون کردند. لشکر شام پس از اطلاع از این قیام به طرف مدینه حرکت کرد و واقعه حر پیش آمد. ⟦10⟧"],["t",7,"کلام عاشورایى امام رضا "],["p","⟦11⟧"],["p","در روز اول محرم ریان بن شبیب خدمت امام رضا  رسید. حضرت به او فرمود: اى پسر شبیب، مردم عرب در زمان جاهلیت جنگ را در ایام محرم حرام مى دانستند؛ ولى این امت احترام این ماه را از بین بردند و حرمت پیامبر  را رعایت نکردند. در این ماه خون ما را حلال دانستند، و هتک حرمت ما کردند و فرزندان و زنان ما را اسیر نمودند، و سراپرده ما را آتش زدند و اموال ما را غارت کردند و رعایت احترام رسول خدا  را درباره ما ننمودند."],["p","همانا روز شهادت حسین  پلک چشمان ما را مجروح کرد و اشکهاى ما را روان ساخت و دل ما را سوزاند؛ و عزیزما را در زمین کربلا ذلیل کرد و نزد ما محنت و بلا را تا روز جزا به ارث گذارد. پس گریه کنندگان باید بر حسین  بگریند، زیرا که گریه بر او گناهان بزرگ را از بین مى برد."],["p","اى پسر شبیب، اگر خواستى بر چیزى گریه کنى بر حسین بن على  گریه کن، چه اینکه آن حضرت را کشتند چنانچه گوسفند را مى کشند، و با آن حضرت 18نفر از اهل بیت او کشته شدند که روى زمین شبیه و نظیرى نداشتند. آسمانهاى هفتگانه و زمینها در شهادت آن حضرت گریستند. چهار هزار ملک روز عاشورا براى نصرت آن حضرت آمده بودند و دیدند حضرت شهید شده است. لذا پریشان و غبار آلود به مجاورت آن قبر مطهر مأمور شدند، تا حضرت قائم  ظهور کندو از یاران او باشند و شعارشان «یا لثارات الحسین»است. اى پسر شبیب، اگر دوست دارى که با ما در درجات عالى بهشت باشى محزون باش براى حزن ما و شاد باش در شادى ما؛ و بر تو باد به ولایت ما که اگر کسى سنگى را دوست داشته باشد خداوند متعال او را با همان سنگ محشور مى کند...."]]},{"k":"day","key":2,"label":"","items":[["t",1,"ورود امام حسین  به کربلا"],["p","بنابر مشهور در این روز در سال 61ه آقا و مولایمان حضرت اباعبداالله الحسین سید الشهدأ  با اهل بیت و اصحابشان وارد کربلاى معلى شدند. ⟦12⟧ در آنجا اسب حضرت حرکت نکرد. امام  پرسیدند: نام این زمین چیست؟ گفتند: «غاضریه». نام دیگرش را پرسیدند، گفتند: «شاطئى الفرات». فرمودند: اسم دیگر هم دارد؟ گفتند: «کربلا»هم مى گویند. در این هنگام حضرت آهى از دل کشیدند و گریه شدیدى نمودند و فرمودند: اللهم انى أعوذ بک من الکرب و البلأ. به خدا قسم زمین کربلا همین است. بخدا اینجا مردان ما را مى کشند! بخدا قسم اینجا زنان و کودکان ما را به اسیرى مى برند! بخدا قسم اینجا پرده حرمت ما دریده مى شود. اى جوانمردان، فرود آید که محل قبرهاى ما اینجاست... ». ⟦13⟧"]]},{"k":"day","key":3,"label":"","items":[["t",1,"نامه امام حسین  براى اهل کوفه"],["p","در این روز امام حسین  براى بزرگان کوفه نامه اى نوشتند و آن را به قیس بن مسهر صیداوى دادند که به کوفه برساند. مأمورین در بین راه قیس را گرفتند، و پس از آنکه او بر ضد یزید و ابن زیاد سخن گفت، او را به شهادت رساندند. ⟦14⟧"],["t",2,"ورود عمر بن سعد به کربلا"],["p","در این روز عمر بن سعد با شش یا نه هزار سوار براى قتل پسر پیامبر  وارد کربلا شد و در مقابل آن حضرت لشکرگاه ساخت و خیمه برافراخت. ورود ابن سعد به کربلا در روز چهارم هم نقل شده است. ⟦15⟧"]]},{"k":"day","key":4,"label":"","items":[["t",1,"فتواى شریح قاضى به قتل امام حسین "],["p","در این روز از سال 61ه ابن زیاد با استناد به فتوایى که از شریح قاضى گرفته بود، در مسجد کوفه خطبه خواند و مردم را به کشتن امام حسین  تحریک کرد. ⟦16⟧"]]},{"k":"day","key":6,"label":"","items":[["t",1,"یارى طلبى حبیب بن مظاهر از بنى اسد"],["p","در شب ششم جناب حبیب بن مظاهر اسدى با اذن امام حسین  براى آوردن یاور و کمک، به قبیله بنى اسد رفت. اسدیان پذیرفتند و حرکت کردند، ولى جاسوسان به عمر سعد خبر دادند و او عده اى را فرستاد تا مانع آنها شوند. لذا درگیرى رخ داد که در این میان جمعى از بنى اسد شهید و زخمى و بقیه ناگزیر به فرار شدند و حبیب به خدمت حضرت آمد و جریان را عرض کرد. ⟦17⟧"],["t",2,"اولین محاصره فرات در کربلا"],["p","به نقلى در این روز عمر سعد، شبث بن ربعى خبیث را همراه سه هزار مرد سفاك با کوبیدن طبل و دهل کنار فرات فرستاد که اطراف آن را به محاصره در آوردند. ⟦18⟧"],["t",3,"تراکم لشکر یزید در کربلا"],["p","در این روز لشکر زیادى براى جنگ با حضرت اباعبداالله  جمع شدند. ⟦19⟧"]]},{"k":"day","key":7,"label":"","items":[["t",1,"ملاقات امام حسین  با ابن سعد"],["p","در شب هفتم امام حسین  با عمر سعد ملعون ملاقات و گفتگو کردند. خولى بن یزید اصبحى چون عداوت شدیدى با امام  داشت ماجرا را به ابن زیاد گزارش داد و آن ملعون نامه اى براى عمر سعد نوشت و او را از این ملاقاتها بر حذر داشت و دستور منع آب را صادر کرد. ⟦20⟧"],["t",2,"منع آب از امام حسین "],["p","در این روز آب را بر اهل بیت سید الشهدا  بستند، چه اینکه نامه ابن زیاد بدین مضمون رسید که نگذارید حتى یک قطره آب هم به آنها برسد. عمرو بن حجاج زبیدى با چهار هزار تیرانداز مأمور منع آب فرات شدند، که به هیچ وجه آبى به خیمه گاه پسر پیامبر  برده نشود. ⟦21⟧"]]},{"k":"day","key":8,"label":"","items":[["t",1,"قحط آب در خیمه هاى حسینى"],["p","در این روز آب در خیمه هاى سید الشهدأ  نایاب شد"],["p","⟦22⟧"]]},{"k":"day","key":9,"label":"(تاسوعا)","items":[["t",1,"محاصره خیمه هاى در کربلا"],["p","امام صادق  فرمودند: تاسوعا روزى بود که حسین  و اصحابش را در کربلا محاصره کردند و سپاه شام بر قتال آن حضرت اجتماع نمودند، و پسر مرجانه و عمر سعد به خاطر کثرت سپاه و لشکرى که براى آنها جمع شده بود خوشحال شدند، و آن حضرت و اصحابش را ضعیف شمردند و یقین کردند که یاورى از براى او نخواهد آمد و اهل عراق حضرتش را مدد نخواهند نمود. ⟦23⟧"],["t",2,"آمدن امام نامه براى فرزندان ام البنین "],["p","در این روز شمر ملعون براى حضرت عباس  و برادرانش امان نامه آورد. ⟦24⟧ آن لعین خود را نزدیک خیام با جلالت حضرت اباعبداالله  رسانید و بانگ بر آورد: أین بنو اختنا: پسران خواهر ما کجایند»؟ ولى آن بزرگواران جواب ندادند. امام حسین  فرمود: جواب او را بدهید اگر چه فاسق است. حضرت عباس  در جواب فرمودند: چى مى گویى؟ شمر گفتن نم از جانب امیر براى شما امان نامه آورده ام. شما خود را به خاطر حسین  به کشتن ندهید."],["p","حضرت عباس  با صداى بلند فرمود: «لعنت خدا بر تو و بر امیر تو (و بر امان تو) باد. ما را امان مى دهید در حالیکه پسر رسول خدا را امان نباشد»؟! ⟦25⟧"],["t",3,"در خواست تأخیر جنگ از سوى امام حسین "],["p","در عصر تاسوعا امام  براى به تعویق انداختن جنگ یک شب دیگر مهلت گرفتند. ⟦26⟧"],["p","چون عمر سعد لشکر را آماده جنگ با امام  نمود و معلوم شد که قصد جنگ دارند، حضرت به برادرش عباس  فرمود تا یک شب دیگر مهلت بگیرد. آنها در ابتدا قبول نکردند، ولى بعد قبول نمودند که شبى را صبر کنند. ⟦27⟧"],["t",4,"آمدن لشکر تازه نفس به کربلا"],["p","در این روز لشکر مجهزى به دستور ابن زیاد از کوفه وارد کربلا شد، و شمر نامه ابن زیاد را آورد. ⟦28⟧"],["t",5,"خطابه امام حسین  براى اصحابش"],["p","در عصر این روز امام حسین  در جمع یاران خطبه اى قرائت فرمودند، و اصحاب اعلام وفادارى نمودند"],["p","⟦29⟧"],["s","شب عاشورا"],["t",1,"سخنان اما  با اهل بیت و اصحابش"],["p","در این شب امام حسین  اصحاب و اهل بیت خود را جمع نمودند و کلماتى را به آنان فرمودند. خلاصه کلمات حضرت این بود که من بیعت خود را از شما برداشتم و شما را به اختیار خود گذاشتم تا به هر جا که مى خواهید کوچ کنید. پس از فرمایشات حضرت، اهل بیت  و اصحاب کلماتى در وفادارى و جان نثارى خود نسبت به آن حضرت ابراز داشتند. ⟦30⟧"],["t",2,"سخنان زینب کبرى  با امام حسین "],["p","در این شب بود که زینب کبرى  اشعار یا دهر اف لک من خلیل... را از زبان برادرش امام حسین  شنید، و هنگامى که متوجه شد فردا روز شهادت حضرت است فرمود: «اى کاش مرگ مرا نابود ساخته بود و این روز را ندیده بودم». سپس سیلى به صورت زد و بیهوش شد. امام  خواهر عزیز و مکرمه خود را به هوش آوردند و مطالبى فرمودند. ⟦31⟧"]]},{"k":"day","key":10,"label":"(عاشورا)","items":[["t",1,"شهادت امام حسین "],["p","در این روز در سال 61ه که روز شنبه یا دوشنبه بوده، آقا و مولایمان حضرت اباعبداالله الحسین  در سن 58سالگى )و یا 56و یا 57سالگى( بعد از نماز ظهر، مظلومانه و با حالت تشنگى و گرسنگى در زمین کربلا به شهادت رسیدند. ⟦32⟧ این روز، روز باریدن خون از آسمان است، و روزى است که شهادت اهل بیت و اصحاب امام حسین  در آن به وقوع پیوسته است. ⟦33⟧ چهار هزار ملک در این روز به زمین کربلا براى نصرت آن حضرت آمدند، و چون اجازه نیافتند تا ظهور حضرت مهدى  گریه کنان نزد قبر آن حضرت ماندگارند. در این روز ترك خوردن و آشامیدن بخصوص از غذاهاى لذیذ مناسب است. ⟦34⟧"],["t",2,"شهادت حبیب بن مظاهر اسدى کوفى."],["t",3,"شهادت مسلم بن عوسجه."],["t",4,"شهادت حربن یزید ریاحى."],["t",5,"شهادت جون مولى ابى ذر الغفارى."],["t",6,"شهادت همسر وهب، به دست رستم غلام شمر. ⟦35⟧"],["t",7,"شهادت شبیه ترین مردم به رسول خدا ، على اکبر  فرزند بزرگ سید الشهدأ  عموىوالامقام حضرت صاحب الامر ."],["t",8,"شهادت قاسم بن الحسن (علیهما السلام) 9شهادت عبد االله بن الحسن (علیهما السلام) 10شهادت قمر منیر بنى هاشم حضرت عباس بن على بن ابى طالب"],["p",""],["t",11,"شهادت مولانا الرضیع باب الحوائج على اصغر ."],["t",12,"آمدن ذوالجناح با یال و کاکل خونین به سوى خیمه فاطمیات براى آوردن خبر شهادت آن حضرت."],["t",13,"ماتم و ناله و گریه پردگیان حرم بر سید الشهدأ  و اولاد و بستگان و اصحاب آن حضرت."],["t",14,"غارت اموال از خیام امام حسین ."],["t",15,"فرار فاطمیات و علویات در بیابانها بعد از شهادت آقا و سرور شان اباعبداالله ."],["t",16,"غارت کردن لباس و زره و... از بدن مطهر شهداى کربلا."],["t",17,"جدا شدن سرهاى مطهر امام حسین  و اهل بیت و اصحاب آن حضرت."],["t",18,"به آتش کشیدن خیمه هاى آل االله، فرزندان رسول خدا و على مرتضى و فاطمه زهرا "],["t",19,"شهادت دختران کوچک در کنار خیمه ها."],["t",20,"گریه و ماتم بر سید الشهدا  و عزاى زمین و زمان، عرش و آسمان، جن و انس و ملک و وحوش بر آن حضرت."],["p","در این روز ملکى ندا کرد: اى امت ظالمى که عترت پیامبر خود را کشتید، خداوند شما را موفق به درك عید فطر و قربان نفرماید. ⟦36⟧"],["t",21,"رأس مطهر امام حسین  در کوفه"],["p","عصر عاشورا رأس مطهر و نورانى امام حسین  را توسط خولى بن یزید اصبحى ملعون حمید بن مسلم از دى به کوفه فرستادند. ⟦37⟧"],["t",22,"خونین شدن ریشه هر گیاهى که از زمین کشیدند، از مصیبت عظماى آن روز."],["t",23,"قتل ابن زیاد"],["p","ابن زیاد در روز عاشوراى سال 67ه به فرمان مختار به جزاى ظاهرى اعمالش رسید و کشته شد. ⟦38⟧ حصین بن نمیر و جمعى از قتله امام حسین  نیز همراه ابن زیاد به قتل رسیدند. ⟦39⟧"],["p","ابن زیاد ملعون به دست ابراهیم پسر مالک اشتر نخعى کشته شد، و سر نحسش را براى مختار فرستادند. مختار هم سر او را براى امام زین العابدین  فرستاد. هنگام وارد کردن سر ابن زیاد حرت مشغول غذا خوردن بودند. لذا سجده شکر به جاى آورده فرمودند: «روزى که ما را بر ابن زیاد وارد کردند غذا مى خورد. من از خدا خواستم که از دنیا نروم تا سر او را در مجلس غذاى خود مشاهده کنم، همچنان که سر پدر بزرگوارم مقابل او بود و غذا مى خورد. خداوند به مختار جزاى خیر دهد که خونخواهى ما را نمود». سپس حضرت به اصحاب خود فرمود: همه شکر کنید."],["t",24,"قیام حضرت مهدى "],["p","به روایتى حضرت بقیه االله الاعظم حجه بن الحسن العسکرى ارواحنا فداه در این روز قیام خواهند کرد. ⟦40⟧"],["t",25,"وفات ام سلمه"],["p","در این روز در سال 63 - 62ه ام سلمه همسر پیامبر  از دنیا رحلت فرمود. ⟦41⟧ نام او هند، پدرش ابى امیه، مادرش عاتکه دختر عبدالمطلب بود. شوهر اول او پسر خاله اش ابوسلمه بن عبدالاسد بن مغیره بود. چون به شرف اسلام مشرف شد با همسرش ام سلمه به حبشه هجرت کردند. پس از بازگشت از حبشه بر اثر زخمى که در جنگ احد بر او وارد شده بود، بعد از مدتى شهید شد."],["p","سلمه، عمر، زینب و دره، فرزندان او بودند؛ و عمر در جمیع جنگهاى امیرالمؤمنین  شرکت کرده و مدتى از طرف آن حضرت والى بحرین بود. بعد از اینکه عده ام سلمه در وفات شوهرش سد آمد، ابوبکر و عمر جداگانه به خواستگارى او رفتند، ولى ام سلمه اجابت نکرد. در سال چهارم هجرى پیامبر  از او خواستگارى کرد و ام سلمه قبول کرد، و به فرزند خود عمر بن ابى سلمه گفت: عقد را جارى کن."],["p","عایشه وقتى دید پیامبر  ام سلمه را به عقد خویش در آورده بسیار ناراحت شد، چه اینکه ام سلمه در جمال کم نظیر بود. عایشه به حفصه گفت: ام سلمه چقدر زیباست! او باور نکرد تا اینکه ام سلمه را دید. از همین جهت حسادت این دو با ام سلمه بسیار زیاد بود."],["p","ام سلمه فضایلى دارد که او را از دیگر همسران پیامبر صلىا الله عليهوآل ه - به جز خدیجه کبرى  -ممتاز کرده است:"],["p",".1بارها ام سلمه عایشه را نصیحت مى کرد و در پیروى از على بن ابى طالب ، ولى او نمى پذیرفت، فضایل و مناقب آن حضرت را براى عایشه مى گفت ولى او قبول نمى کرد، تا اینکه پسرش عمر بن ابى سلمه را با نامه اى خدمت امیر المؤمنین  فرستاد در آن خبر داد که عایشه به سوى بصره حرکت کرده است...."],["p",".2ام سلمه شهادت داد که عایشه دشمن امیر المؤمنین  است."],["p",".3ام سلمه شنید که یکى از آزاد شده هایش امیر المؤمنین  را ناسزا گفته است. آن شخص را فراخواند و آنقدر از فضایل و مناقب على  که از پیامبر  شنیده بود براى آن شخص بازگو کرد، تا او توبه نمود."],["p",".4ام سلمه حدیث نحن معاشر الانبیأ لانورث... را -که ابوبکر آن را به دروغ به رسول خدا  نسبت داد -تکذیب کرد."],["p",".5هنگامى که امیر المؤمنین  براى جنگ جمل حرکت کردند، ام سلمه پسرش عمر بن ابى سلمه را براى یارى آن حضرت فرستاد، و به آن حضرت پیغام داد: «اگر پیامبر  همسرانش را به ملازمت خانه ها امر نفرموده بود مى آمدم و در نصرت و یارى شما کوتاهى نمى کردم»."],["p",".6بعد از رحلت خدیجه کبرى  مراقبت حضرت زهرا  با فاطمه بنت اسد  بود. بعد از رحلت فاطمه بنت اسد این مهم از طرف پیامبر  به ام سلمه سپرده شد، و عایشه از این ماجرا بسیار خشمناك بود. ام سلمه مى گفت: «مردم گمان مى کنند من آموزگار فاطمه  هستم! خدا قسم که آن حضرت آموزگار من است»."],["p",".7روزى پیامبر  پوست گوسفندى را طلبیدند و مطالبى را فرمودند و امیرالمؤمنین  نوشتند. بعد آن پوست را به ام سلمه دادند و فرمودند: «هر کس بعد از من فلان و فلان نشانه را به تو داد، این پوست را به او تسلیم کن». آن سه نفر آن نشانه ها را نداشتند، و ام سلمه آن پوست را در خلافت ظاهرى امیر المؤمنین  به آن حضرت -که همه نشانه ها را دارا بود -تسلیم نمود..8هنگام حرکت امام حسین  از مدینه به مکه ام سلمه آمد و خبر شهادت آن حضرت را که از پیامبر  شنیده بود با اندوهى فراوان بازگو کرد. امام حسین  محل شهادت و موضع دفن خود و اصحابشان و... را به معجزه نشان دادند. سپس مقدارى از خاك آن بقعه طیبه را به ام سلمه دادند و در نزد آن حضرت بود تا روز عاشورا که ام سلمه پیامبر  را با حالتى گرد آلود و ژولیده مو در خواب دید، و عرض کرد: یا رسول االله، این چه حالت است که در شما مى نگرم؟ فرمودند: «اى ام سلمه، حسین مراکشتند و دیشب براى او و اصحاب او قبر مى کندم»."],["p","وقتى از خواب بیدار شد دید خاکى که پیامبر  و امام حسین  به او داده بودند به خون تازه تبدیل شده است"],["p","⟦42⟧"],["s","شب یازدهم محرم"],["t",1,"شام غریبانه کربلا"],["p","نخستین شب عزا و سوگ خاندان پیامبر  پس از شهادت سید الشهدأ  است. شبى تیره تر از سیاهى! شبى جانسوز که در آن تلخترین لحظات بر خاندان امام حسین  گذشته."],["p","آیا مى شود رنج و سوز و مصیبت بازماندگان حضرت را رد آن شب بیان کرد و یا حتى تصور نمود؟ آیا کسى درك مى کند که دیدگان خونفشان عمه امام زمان  و اهل بیت چقدر و چگونه بر آن حضرت گریستند؟ آیا مى تواند تصویر کند که آه و ناله سوزناك آن عزیزان چگونه بوده است؟"],["p","با چه زبانى و با چه لفظى مى توان دلهاى شکسته، قلبهاى جریحه دار، ناله و نواى بلبلان بال و پر سخوته گلستان نبوى و علوى، و سوز دل یتیمان و بانوان حسینى را بیان کرد؟"],["p","شام غریبان است! کودکان یتیم که دیشب پدر داشتند، و بانوان بى سرپرست که دیشب سرپرست و کاشانه داشتند؛ امشب با آشیانه سوخته و دلهاى داغدار، بدون سرورشان حضرت اباعبداالله  چه مى کنند؟"],["p","تفاوت بین این دو شب چقدر است: شب عاشورا و شب یازدهم؟ دیشب چه سالارى داشتند؟ دیشب چه کسى از خیمه ها محافظت مى کرد؟ دیشب چه کسانى در خیمه هاى بودند؟ امروز اما بدن مبارکشان بدون سر روى زمین است! آن شب چه کى سرپرست علویات و فاطمیات را بر عهده داشت؟ زینب کبرى  آن شب چه حالى داشت؟ از یک سو مراقبت از حجت خدا زین العابدین  و همسران و یتیمان برادر، و از سوى دیگر به دنبال دختران گمشده!! همه اینها در سرزمینى که بدن برادرش و عزیزانش با آن وضع روى زمین افتاده باشند!"],["p","آه چه شبى بود آن شب و چه حالى داشت دختر امیر المؤمنین . سلام على قلب زینب الصبور و لسانها الشکور. ⟦43⟧"],["t",2,"سر امام حسین  در تنور خولى"],["p","شب یازدهم شبى است که سر مطهر امام حسین  در تنور منزل خولى بود در حالیکه نورانیت آن سر فضا را روشن نموده بود. ⟦44⟧"]]},{"k":"day","key":11,"label":"","items":[["t",1,"حرکت کاروان اسرا از کربلا"],["p","عمر سعد ملعون روز یازدهم تا وقت ظهر در کربلا ماند، و بر کشتگان سپاه خود نماز گذارد و آنان را به خاك سپرد. وقتى روز از نیمه گذشت فرمان داد تا دختران پیامبر  را بر شتران بى جهاز سوار کردند و سید سجاد  را نیز با غل جامعه بر شتر سوار کردند. هنگامى که آنان را از قتلگاه عبور دادند و نظر بانوان بر جسم مبارك امام حسین  افتاد لطمه ها بر صورت زدند و صدا به صیحه و ندبه برداشتند ⟦45⟧؟"],["t",2,"تشکیل مجلس ابن زیاد"],["p","روز یازدهم عمر سعد به کوفه آمد. ابن زیاد اذن عمومى داد تا مردم در مجلس حاضر شوند. سپس رأس مطهر امام حسین  را نزد او گذاشتند و او نگاه مى کرد و تبسم مى نمود و با چوبى که در دست داشت جسارت مى نمود. ⟦46⟧"],["t",3,"حرکت اهل بیت امام حسین  به سوى کوفه"],["p","عصر روز یازدهم اهل بیت  را با حالت اسارت به طرف کوفه بردند. ⟦47⟧ نزدیک غروب حرکت کردند و شبانه به کوفه رسیدند. لذا آن بزرگواران داغدار و مصیبت زده را تا صبح پشت دروازه هاى کوفه نگه داشتند. هنگام صبح عمر سعد ملعون از کوفه خارج شد، و بسان فرماندهى که از فتوحات خویش خوشحال است همراه اسرأ وارد کوفه شد"],["p","⟦48⟧"]]},{"k":"day","key":12,"label":"","items":[["t",1,"دفن شهداى کربلا"],["p","روز دفن بدنهاى مطهر سید الشهدا  و اهل بیت و اصحاب آن حضرت، توسط امام سجاد  به یارى جمعى از بنى اسد است. ⟦49⟧"],["t",2,"ورود اهل بیت  به کوفه"],["p","روز دوازدهم روز ورود اهل بیت  با حالت اسارت به کوفه است. ⟦50⟧ در این روز ابن زیاد فرمان داد که احدى حق ندارد با اسلحه از خانه بیرون آید، و ده هزار سوار و پیاده بر تمام کوچه ها و بازار موکل گردانید، که احدى از شیعیان امیر المؤمنین  حرکتى نکند. سپس فرمان داد سرهایى را که در کوفه بود برگردانند و در پیش روى اهل بیت  حرکت دهند، و با هم وارد شهر کرده در کوى و بازار بگردانند."],["p","مردم با دیدن حالت زار ذریه پیامبر  و سرهاى بر نیزه و بانوان و مخدرات در هودجهاى بدون پوشش، صدا به گریه بلند نمودند. زینب کبرى، ام کلثوم، فاطمه بنت الحسین و امام زین العابدین  به ترتیب با جگرهاى سوزان و قلوب دردناك ایراد خطبه نمودند، که عده اى از لشکر با دیدن این اوضاع از کرده خود پشیمان شدند، اما هنگامى که خیلى دیر شده بود!!"],["p","25"],["p","⟦51⟧"],["t",3,"روز شهادت حضرت سجاد "],["p","شهادت امام زین العابدین  بنابر قولى در این روز در سال 94هجرى در سن 57سالگى واقع شده است، ⟦52⟧ و قول دیگر 25محرم است که خواهد آمد."]]},{"k":"day","key":13,"label":"","items":[["t",1,"اسراى اهل بیت  در مجلس ابن زیاد"],["p","پس از آنکه اسرا و سرهاى مقدس شهدا را در کوفه گردانیدند، ابن زیاد در کاخ خود نشست و دستور داد سر مطهر امام حسین  را در برابرش گذاشتند. آنگاه زنان و کودکان آن حضرت را به همراه امام سجاد  -در حالیکه به طناب بسته بودند -وارد مجلس نموده، در برابر تخت آن ملعون ایستاده نگاه داشتند. در این حال درباریان آن ملعون به تماشا ایستاده بودند. ⟦53⟧"],["t",2,"اسراى اهلى بهت  در زندان کوفه"],["p","پس از مجلس شوم ابن زیاد، اهل بیت  را با غل و زنجیر وارد زندان کوفه نمودند. ⟦54⟧"],["t",3,"خبر شهادت امام حسین  در مدینه و شام"],["p","ابن زیاد به مدینه و شام نامه نوشت و خبر شهادت امام حسین  را منتشر ساخت. ⟦55⟧"],["t",4,"شهادت عبد االله بن عفیف"],["p","عبد االله بن عفیف از دى بزرگوارى از اصحاب امیر المؤمنین  بود و در جنگهاى جمل و صفین دو چشم خویش را از دست داده بود. لذا مشغول عبادت بود."],["p","او هنگامى که شنید پسر زیاد ملعون به امیر المؤمنین و امام حسین عليهالس لا م نسبت کذب مى دهد، از میان جمعیت برخاست و گفت: ساکت باش اى پسر مرجانه، دروغگو توى و پدر تو که به تو این مقام را داد. اى دشمن خدا! فرزندان پیامبر  را مى کشى و در منابر مؤمنین اینچنین سخن مى گویى؟ مأموران خواستند متعرض او شوند که با کمک قبیله اش به خانه رفت، ولى بعد آمدند و خانه او را محاصره کردند. پس از رشادتهاى او و دخترش دستگیر شد و همانطور که از خدا خواسته بود به دست بدترین خلق یعنى ابن زیاد به شهادت رسید. ⟦56⟧"]]},{"k":"day","key":15,"label":"","items":[["t",1,"فرستادن سرهاى مطهر شهدا به سوى شام"],["p","بنابر بعضى اقواى، در این روز سرهاى مطهر اهل بیت عصمت و طهارت  را به سوى شام حرکت دادند. ⟦57⟧ البته بعد أهل بیت  سرهاى مطهر را به بدنها ملحق کردند."]]},{"k":"day","key":19,"label":"","items":[["t",1,"حرکت کاروان کربلا به سوى شام"],["p","در این روز اهل بیت سید الشهدأ  را از کوفه به سوى شام حرکت دادند ⟦58⟧ زنهاى غیر هاشمیه از انصار امام حسین  که در کربلا اسیر شدند با شفاعت اقواع و قبایلشان نزد ابن زیاد از قید اسیرى خلاص شدند، و فقط زنهاى هاشمیات براى اسارت به شام برده شدند. ⟦59⟧"]]},{"k":"day","key":20,"label":"","items":[["t",1,"دفن بدن جون در کربلا"],["p","بعد از ده روز از واقعه عاشورا جمعى از بنى اسد بدن شریف جون غلام ابى ذر غفارى را پیدا کردند در حالى که صورتش نورانى و بدنش معطر بود و سپس او را دفن کردند. ⟦60⟧"],["p","جون کسى بود که امیر المؤمنین  او را به 150دینار خرید و به ابوذر بخشید. هنگامى که ابوذر را به ربذه تبعید کردند این غلام براى کمک به او به ربذه رفت و بعد از رحلت جناب ابوذر به مدینه مراجعت کرد و در خدمت امیر المؤمنین  بود تا بعد از شهادت آن حضرت به خدمت امام مجتبى  و سپس به خدمت امام حسین  رسید و همراه آن حضرت از مدینه به مکه و از مکه به کربلا آمد."],["p","هنگامى که جنگ در روز عاشورا شدت گرفت او خدمت امام حسین  آمد و براى میدان رفتن و دفاع از حریم ولایت و امامت اجازه خواست. حضرت فرمودند: در این سفر به امید عافیت و سلامتى همراه ما بود! اکنون خویشتن را به خاطرما مبتلا مساز."],["p","جون خود را بر قدمهاى مبارك امام حسین  انداخت و بوسید و گفت: اى پس رسول خدا، هنگامى که شما در راحتى و آسایش بودید من کاسه لیس شما بودم، و حال که به بلا گرفتار هستید شما را رها کنیم؟"],["p","جون با خود فکر کرد: من کجا و این خاندان کجا؟! لذا عرضه داشت: آقاى من، بوى من بد است و شرافت خانوادگى هم ندارم و نیز رنگ من سیاه است. یا اباعبداالله، لطف فرموده مرابهشتى نمایید تا بویم خوش گردد و شرافت خانوادگى به دست آورم و رو سفید شوم. نه آقاى من، از شما جدا نمى شود تا خون سیاه من با خون شما خانواده مخلوط گردد. جون مى گفت و گریه مى کرد به حدى که امام حسین  گریستند و اجازه دادند."],["p","با آنکه جون پیر مردى 90ساله بود، ولى بچه ها در حرم با او انس فراوانى داشتند. او به کنار خیمه ها براى خداحافظى و طلب حلالیت آمد، که صداى گریه اطفال بلند شد و اطراف او را گرفتند. هر یک را به زبانى ساکت کرد و به خیمه ها فرستاد و مانند شیرى غضبناك روى به آن قوم ناپاك کرد. او جنگ نمایانى کرد، تا آنکه اطراف او را گرفتند و زخمهاى فراوانى به او وارد کردند. هنگامى که روى زمین افتاد، امام حسین  سر او را به دامن گرفت و بلند بلند گریست، و دست مبارك بر سر و صورت جون کشید و فرمود: اللهم بیض وجهه و طیب ریحه و احشره مع محمد و آل محمد : بارالها رویش را سفید و بویش را خوش فرما و با خاندان عصمت  محشورش نما."],["p","از برکت دعاى حضرت روى غلام مانند ماه تمام درخشیدن گرفت و بوى عطر از وى به مشام رسید. چنانکه وقتى بدن او را بعد از ده روز پیدا کردند صورتش منور و بویش معطر بود. ⟦61⟧"]]},{"k":"day","key":25,"label":"","items":[["t",1,"شهادت امام سجاد "],["p","در سال 94بنابر مشهور ⟦62⟧ یا 95ه، ⟦63⟧ امام زین العابدین  در سن 57 سالگى با زرهى که ولید بن عبد الملک یا هشام لعنهما االله به آن حضرت دادند به شهادت رسیدند. این در حالى بود که 34یا 35سال بعد از واقعه کربلا رد مصائب جان گداز شهادت پدر و برادران و عمو و بستگان و اسارت عمه ها و خواهرانش، گریان بودند."],["p","امام باقر  آن حضرت را تجهیز نمودند و در بقیع کنار قبر عموى مظلومش حضرت مجتبى  به خاك سپردند. سال شهادت آن حضرت را به خاطر کثرت فوت فقهأ و علمأ «سنه الفقهأ»گفتند."],["p","در شهادت آن حضرت اقوال دیگرى نیز وجود دارد 12: محرم 18، محرم، 19محرم 2، صفر."],["p","⟦64⟧"]]},{"k":"day","key":26,"label":"","items":[["t",1,"شهادت على بن الحسن المثلث"],["p","در سال 146ه على بن حسن بن حسن بن حسن بن على ، در سن 45 سالگى در زندان منصور -که شب و روز در آن تشخیص داده نمى شد -در حال سجده و در حالیکه غل و زنجیر بر دست و پایش بود، به شهادت رسید ⟦65⟧"]]},{"k":"day","key":28,"label":"","items":[["t",1,"وفات حذیفه بن یمان"],["p","حذیفه از بزرگان اصحاب پیامبر  و از خواص اصحاب امیر المؤمنین  بود. پدر حذیفه در جنگ احد اشتباها به وسیله یکى از مسلمانان کشته شد."],["p","حذیفه یکى از هفت نفرى بود که بر صدیقه طاهره  نماز خواندند. او صحابه منافق را مى شناخت. منافقینى که پس از غدیر خم توطئه قتل پیامبر  را چیدند و مى خواستند در بازگشت از غدیر خم در راهى که از کوه مى گذشت شتر حضرت را بترسانند تا برمد و حضرت به دره سقوط کند و به قتل برسد. اما جبرئیل این نقشه را به سمع مبارك نبوى رسانید."],["p","پیامبر  چون به محل مورد نظر رسیدند، منافقین با چهره هاى بسته هر کدام ظرفى که داخل آن سنگریزه بود از بالا رها نموده و شروع به داد و فریاد و نعره زدن کردند. اما عمار مهار ناقه را گرفته بود و حذیفه هم در کنار آن حضرت بود و سرانجام نقشه آن کوردلان نقش بر آب شد."],["p","پیامبر  آن منافقین را به حذیفه معرفى فرمودند که عبارت بودند از اولى و دومى و سومى و ابو عبیده و معاذبن جبل و سالم و معاویه و عمروعاص و طلحه و سعد بن ابى وقاص و عبد الرحمن بن عوف و ابوموسى اشعرى و مغیره بن شعبه و ابوهریره، حذیفه همه را به خاطر سپرد. به همین دلیل بود که غاصبین خلافت بعد از آن واقعه از حذیفه مى ترسیدند که مبادا آنان را به مردم معرفى کند."],["p","لذا حذیفه بر جنازه هر کس حاضر مى شد دیگران مى فهمیدند که میت از منافقین بوده است. نکته جالب آنجا بود که دومى براى سرپوش گذاشتن بر نفاق خویش و تبرئه خود، از حذیفه مى پرسید: «اگر این شخص از منافقین است بگو تا من بر او نماز نخوانم»!"],["p","⟦66⟧"],["p","این بزرگوار چهل روز پس از خلافت ظاهرى امیر المؤمنین  در مدائن از دنیا رحلت فرمود. ⟦67⟧ او قبل از رحلت به دوش فرزندش صفوان و سعید وصیت کرد که همیشه ملازم امیر المؤمنین  باشند و ایشان هم به وصیت پدر عمل نمودند تا در جنگ صفین به شهادت رسیدند."],["t",2,"تبعید امام جواد  به بغداد"],["p","در سال 220ه امام جواد  به دستور معتصم از مدینه به بغداد تبعید شدند. ⟦68⟧"],["t",3,"ورود اسراى اهل بیت  به بعلبک"],["p","بنابر نقلى ورود اسراى اهل بیت  به شهر بعلبک و استقبال مردم آن شهر نیزه داران با شکر و سویق و آذوقه و علف در این روز بوده است، که حضرت ام کلثوم  با دیدن این منظره در حق آنان نفرین کردند. ⟦69⟧"]]},{"k":"day","key":29,"label":"","items":[["t",1,"رسیدن کاروان اسرا به شام"],["p","در این روز اسراى اهل بیت  به حوالى شام رسیدند. ابراهیم بن طلحه بن عبداالله جلو آمد و به امام زین العابدین  نزدیک شد، و کینه هایى که از جراحت شمشیرهاى جنگ جمل در سینه ذخیره کرده بود ظاهر ساخت و به حضرت گفت: دیدى غلبه با کیست؟ حضرت فرمود: اگر مى خواهى بدانى غالب کیست صبر کن تا هنگام نماز اذان و اقامه بگو، آن وقت مى دانى آوازه چه کسى تا قیامت باقى است. ⟦70⟧"]]},{"k":"tail","key":"تتمه محرم","label":null,"items":[["t",1,"نوشتن صحیفه ملعونه"],["p","در این ماه در سال 11ه صحیفه ملعونه دوم نوشته شد و به امضأ منافقین رسید. ⟦71⟧"],["p","محتواى آن چنین بود که نگذارند خلافت و امامت مسلمین بعد از پیامبر  به على بن ابى طالب  برسد، و بر اساس آن مقدمات و زمینه هاى غصب خلافت و گرفتن بیعت از آن حضرت به هر صورت ممکن را فراهم نمودند. با نوشتن آن صحیفه اساس ظلم و ستم به اهل بیت  را بنا نهادند، که به فرموده امام صادق : اذا کتب الکتاب قتل الحسین  « ⟦72⟧ هنگامى که صحیفه ملعونه نوشته شد امام حسین  به شهادت رسید»."],["t",2,"وفات ماریه قبطیه"],["p","در ماه محرم سال 15ه )یا 16ه( ماریه قبطیه رحلت فرمود. ⟦73⟧"],["p","ماریه دختر شمعون قبطى بود که همراه با خواهرش شیرین و یک خواجه که برادر ماریه به نام ماپور بود و هزار مثقال طلا و بیست جامه حریر و درازگوشى به نام یعفور و قاطرى به نام دلدل، در سال هفتم از سوى پادشاه اسکندریه به رسم هدیه خدمت رسول خدا  فرستاده شد."],["p","پیامبر  ماریه را به همسرى خود برگزید، و در محله «عالیه» -که آن را «مشربه ام ابراهیم»مى گویند -منزلى براى آن حضرت تهیه کرد و خداوند جناب ابراهیم  را از این بانو به آن حضرت عنایت فرمود."],["p","حضرت امیر المؤمنین  به خاطر ولادت ابراهیم  بسیار اظهار سرور مى فرمود و به آنان خدمت مى نمود، و بدین جهت عایشه از حضرت امیر المؤمنین  بسیار ناراحت و ملول بود. ⟦74⟧ از عایشه نقل شده که گفت: «من به ماریه حسد مى بردم، چون زنى بسیار زیبا بود». ⟦75⟧ سرانجام این حسادت باعث شد؟ تهمتى به جناب ماریه زد و آیه اى در تقبیح این کار عایشه نازل شد، که در تفاسیر شیعه و سنى به تفصیل توضیح داده شده است. جناب ماریه بعد از پیامبر  در مدینه طیبه رحلت فرمود."]]}]},{"name":"صفر الخیر","groups":[{"k":"intro","key":0,"label":null,"items":[["p","در ماه صفر ثقل حوادث بر دوش سنگینى مى کند. ادامه عزاى امام حسین  از یک سو، شهادت پیامبر  و امام مجتبى و امام رضا  از سوى دیگر، آغاز غصب خلافت از جهت دیگر مصائب پشت سرهمى است که در این ماه باید سوگوار آن باشیم. در روزهاى 1، 2، 5، 7، 8، 9، 11، 12، 14، 15، 19، 20، 24، 26، 27، 28، 29، 30این ماه وقایعى رخ داده که در یک نگاه به این صورت قابل تقسیم است:"],["p","وقایع مربوط به کربلا، که از وارد کردن سر مطهر امام حسین  به شام آغاز مى شود. در پى آن ورود اهل بیت  به شام و سپس مجلس یزید است. شهادت حضرت رقیه  نیز پیرو آن اتفاق افتاده است. آزادى اهل بیت  از زندان شام و بازگشت اهل بیت  از شام به کربلا، و ورود جابر در اربعین براى زیارت سید الشهدأ  و ملحق شدن رأس مطهر امام حسین  به بدن مطهر در کربلا وقایع بعدى است."],["p","مصائب معصومین دیگر از بیمارى رسول خدا  آغاز مى شود. شهادت آن حضرت و آغاز مصائب حضرت زهرا  مرحله اول آن است. شهادت امام مجتبى  و امام رضا  نیز مصائب بعدى است."],["p","وفات حضرت سلمان، شهادت عمار یاسر، شهادت محمد بن ابى بکر و شهادت زید بن على بن الحسین  وقایع دیگرى است که در این ماه اتفاق افتاده است."],["p","در کنار این مصائب، ولادت موسى بن جعفر  خبر خوشى است که در این ماه باعث سرور دوستان اهل بیت  مى گردد."],["p","در خواست کتف توسط پیامبر  و تشکیل لشکر اسامه از وقایع آخرین سال عمر پیامبر  است. آغاز امامت امیر المؤمنین  که در واقع آغاز غصب خلافت آن حضرت است دنباله همان روزهاى تلخ است. شروع جنگ صفین، لیله الهریر در پایان جنگ صفین، مسئله حکمین، و سپس جنگ نهروان برگهایى از روزگار خلافت امیر المؤمنین  است."]]},{"k":"day","key":1,"label":"","items":[["t",1,"وارد کردن سر مطهر امام حسین  به شام"],["p","بنى امیه این روز را به خاطر ورود سر مطهر امام حسین  به شام عید قرار دادند. ⟦76⟧"],["t",2,"ورود اهل بیت  به شام"],["p","⟦77⟧"],["p","با رسیدن خبر نزدیک شدن اسراى اهل بیت  به دمشق، یزید دستوراتى صادر کرد:"],["p",".1تاجى جواهر نشان و تختى مرصع به سنگهاى قیمتى آماده کنند."],["p",".2بزرگان هر صنف با کمک یکدیگر شهر را در کمال زیبایى زینت نمایند."],["p",".3تمام اهل شهر لباسهاى زینتى بپوشند و خود را بیارایند."],["p",".4همگى در معابر رفت و آمد نموده، به یکدیگر تبریک بگویند."],["p",".5پس از آمادگى کامل با طبل و شیپور به استقبال اسرا بروند."],["p",".6جارچیان در شهر جار بزنند: سرهاى بریده و زنان و اطفال کسانى بر شهر وارد مى شوند که به قصد براندازى حکومت عازم عراق بوده اند، ولى عامل خلیفه یعنى ابن زیاد آنها را کشته است. هر کس خلیفه را دوست دارد امروز شادى نماید."],["p","شامیان پست نیز کوتاهى نکرده بر فراز بامها بیرقهاى رنگارنگ برافراشتند و در هر گذرى بساط شراب پهن کردند. نغمه آوازه خوانان بلند بود، و مردم دسته دسته به سوى دروازه کوفه در دمشق مى رفتند و عده اى از شهر خارج شده بودند. این در حالى بود که اهل بیت مصیبت زده و داغدار پیامبر  را -که جبرئیل امین پاسبان حریم محترمشان بود -همراه با نیزه داران تازیانه به دست و بى رحم وارد دروازه ساعات کردند. آن نابخردان پست همینکه جمع نورانى اسرار را دیدند زبان به جسارت گشودند. در آن شهر چه گذشت و با آن بزرگواران چه کردند قلم را یارى نوشتنش نیست. ⟦78⟧"],["t",3,"شروع جنگ صفین"],["p","⟦79⟧"],["p","پس از بى نتیجه ماندن نامه ها و موعظه هاى امیر المؤمنین  به معاویه در ماه محرم، در روز چهارشنبه اول صفر سال 38ه لشکر امیر المؤمنین  در مقابل لشکر شام صف کشیدند. لشکر حضرت 90هزار نفر و لشکر معاویه 85هزار نفر بودند. ⟦80⟧"],["p","لشکر کفر، آب را بر لشکر حضرت امیر المؤمنین  بستند، ولى پس از گرفتن و باز نمودن آب توسط امام حسین  لشکر حضرت مانع از رسیدن آب به لشکر معاویه نشدند."],["p","حضرت پس از شهادت تعدادى از اصحابشان یکباره با ده هزار نفر از طائفه ربیعه به لشکر معاویه حمله کردند و صفوف آنان را بر هم ریختند و تا قبه معاویه رسیدند و فرمودند: اى معاویه، براى چه مردم را به کشتن مى دهى؟ بیا با من مبارزه کن تا هر کدام از ما کشته شود خلافت از دیگرى باشد!"],["p","عمرو عاص به معاویه گفت: على با تو به انصاف سخن گفت. معاویه گفت: اما تو در این مشورت انصاف ندادى، چه اینکه هر کس به مصاف او بیرون رود به سلامت بازنگردد! از اینجا بود که معاویه عمرو عاص را به اجبار به جنگ حضرت فرستاد حضرت همینکه او را شناخت شمشیر را بلند کرد تا او را به درك بفرستد، ولى عمرو عاص حیله کرد و عورت خود را مکشوف ساخت. آن حضرت رو از آن بى حیا برگردانید و آن خبیث فرار کرد."],["p","سرانجام با حیله چند برگ از قرآن بر سر نیزه کردند، و ماجراى حکمین پیش آمد."]]},{"k":"day","key":2,"label":"","items":[["t",1,"مجلس یزید"],["p","در این روز بنابر نقلى اسراى آل رسول را وارد مجلس یزید کردند. ⟦81⟧ جا دارد فکر کنیم چه کسانى را با چه حالتى وارد بر چگونه مجلسى کردند؟"],["t",2,"شهادت زید بن على بن الحسین "],["p","در سال 121ه زید بن على بن الحسین  در کوفه ⟦82⟧ به شهادت رسید. خروج او در اول محرم بوده است. ⟦83⟧ پس از دفن در این روز یا 19ربیع الاول قبر او را شکافتند و بدن آن بزرگوار را از قبر خارج نمودند و به زمین کشیده به دار زدند. ⟦84⟧"]]},{"k":"day","key":5,"label":"","items":[["t",1,"شهادت حضرت رقیه "],["p","⟦85⟧"],["p","در روز پنجم ماه صفر سال 61ه حضرت رقیه مظلومانه به شهادت رسید. نام شریفش «رقیه»، »فاطمه»و «زینب»است. پدرشان مولانا الشهید اباعبداالله الحسین  و مادرشان ام اسحاق است."],["p","ولادت آن حضرت در مدینه بود و در سن سه سالگى یا بیشتر در محرم 61 هجرى با پدر بزرگوارش به کربلا آمد. قبل و بعد از روز عاشورا بارها مورد تفقد و دلجویى اباعبداالله  قرار گرفت تا آنجا که به خواهرش حضرت زینب  در مورد او سفارش فرمود. بعد از شهادت امام حسین  و اهل بیت و اصحاب، همراه با اسرا به کوفه و شام برده شد و در مسیر چهل منزل راه شام رنجهاى فراوانى دید."],["p","در شام بعد از دیدن سر نورانى پدر با پیشانى شکسته در خرابه، آنقدر ناله زد و گریست تا به ملکوت اعلا پیوست، و بدن شریف آن حضرت را شبانه دفن کردند."],["p","از کهن ترین منابعى که نام آن حضرت بالفظ رقیه یاد شده قصیده سیف بن عمیره نخعى کوفى از اصحاب امام جعفر صادق و امام موسى کاظم (علیهما السلام) است:"],["p","و عبدکم سیف فتى ابن عمیره"],["p","عبد لعبد عبید حیدر قنبر"],["p","و سکینه عنها السکینه فارقت"],["p","لما ابتدیت بفرقه و تغیر"],["p","و رقیه رق الحسود لضعفها"],["p","و غدا لیعذرها الذى لم یعذر"],["p","و لام کلثوم یجد جدیدها"],["p","لثم عقیب دموعها لم یکرر"],["p","لم أنسها و سکینه و رقیه"],["p","یبکینه بتحسر و تزفر"],["p","⟦86⟧"],["p","شواهد و مدارك درباره وجود شریف آن حضرت، و بودن قبر آن حضرت در مکان فعلى حرم مطهر، همراه با معجزات و کراماتى از آن مخدره مظلومه بسیار است که در پاورقى به قسمتى از آنها اشاره مى شود. ⟦87⟧"]]},{"k":"day","key":7,"label":"","items":[["t",1,"شهدت امام مجتبى "],["p","بنابر نقلى در این روز در سال 49ه امام مجتبى  در سن 47سالگى در مدینه به شهادت رسید. ⟦88⟧ ولى اشهر بین علماى امامیه شهادت حضرت در آخر ماه صفر است. ⟦89⟧"],["t",2,"ولادت امام موسى بن جعفر "],["p","بنابر مشهور در این روز (یکشنبه) به سال 128ه در «ابوأ»بین مکه و مدینه حضرت موسى بن جعفر  به دنیا آمدند. ⟦90⟧ پدر والا مقام آن حضرت امام صادق  و مادر ایشان حمیده المصفاة  مى باشند. ⟦91⟧"],["p","مشهورترین لقبهاى آن حضرت صالح، صابر، امین و کاظم، و مشهورترین کنیه آن حضرت ابوالحسن است. اگر چه امیر المؤمنین  و امام زین العابدین  هم مکنى به این کنیه اند، ولى در کتب اخبار از امام کاظم  به ابوالحسن اول، واز امام رضا  به ابوالحسن ثانى و از حضرت عادى  به ابوالحسن ثالث تعبیر مى کنند. البته گاهى به خاصر تقیه، از آن حضرت به عنوان عبد صالح، فقیه و عالم نیز تعبیر کرده اند. ⟦92⟧"]]},{"k":"day","key":8,"label":"","items":[["t",1,"وفات حضرت سلمان (رحمه االله)"],["p","حضرت سلمان (رحمه االله)در سال 36ه در سن 250سالگى -و بنابر نقلى 350سالگى - ⟦93⟧ در مدائن از دنیا رفت. ⟦94⟧ او را سلمان بن الاسلام و سلمان پاك و سلمان محمدى لقب داده اند، ⟦95⟧ و در خطاب به او گفته اند: السلام علیک یا من خلط ایمانه بأهل البیت الطاهرین. ⟦96⟧"],["p","امیر المؤمنین  فرمودند: «سلمان از کسانى بود که بر حضرت زهرا  نماز خواند.» ⟦97⟧"],["p","همچنین امام صادق  فرمودند: «سلمان علم اول و آخر را درك کرد، و او دریایى است که هر کسى را بهره اى از آن نیست، و او از مال اهل بیت است.» ⟦98⟧"],["p","شرح حال آن بزرگوار در کتابهاى مختلف بیان شده، و در بزرگى مقام و قدر او همین اندازه بس که مولانا امیر المؤمنین  وسایل غسل و کفن او را آوردند و او را غسل داده کفن نمودند و بر او نماز خوانده دفن نمودند. ⟦99⟧"],["p","جبرئیل به پیامبر  عرضه داشت: «اشتیاق بهشت به سلمان بیشتر از اشتیاق او به بهشت است.» ⟦100⟧"]]},{"k":"day","key":9,"label":"","items":[["t",1,"شهادت عمار و خزیمۀ"],["p","در این روز در سال 37ه عمار یاسر به سن 93سالگى و خزیمۀ بن ثابت در جنگ صفین به شهادت رسیدند. ⟦101⟧"],["p","پدر عمار جناب یاسر بن عامر است، و او اول مردى در اسلام بود که در مکه به دست مشرکین به شهادت رسید. مادر عمار جناب سمیه بود که بر اذیت کفار مکه صبر فراوان کرد، و اولین زن شهیده در اسلام بود که به دست ابوجهل به شهادت رسید."],["p","اما عمار را ابوالعادیه و ابوحوأ سکسکى شهید کردند. زمانى که خبر به امیر المؤمنین  رسید بسیار محزون شد و بر بالین عمار آمد و سر او را بر زانو نهاد و با حزن و اندوه فراوان اشعارى در بى وفایى دنیا و دورى از دوستان قرائت فرمود. سپس فرمود: «انا الله و انا الیه راجعون. هر کس بر قتل عمار غمگین نباشد او را از مسلمانى بهره اى نیست. بهشت نه یک بار بلکه بارها بر عمار واجب شده است.» ⟦102⟧"],["t",2,"جنگ نهروان"],["p","در نهم صفر سال 39ه فتح نهروان واقع شد؛ و ذوالثدیه رئیس خوارج به درك واصل شد. ⟦103⟧"]]},{"k":"day","key":11,"label":"","items":[["t",1,"لیله الهریر در جنگ صفین"],["p","خاتمه جنگ صفین نبرد «لیله الهریر»در شب جمعه یازدهم ماه صفر سال 38 ه بود. در آن شب سپاه معاویه از شدت سرما مانند سگ صدا مى کردند، چون «هریر»به صداى سگ مى گویند."],["p","امیر المؤمنین  ذوالفقار به دست و سوار بر اسب پیامبر  شمشیر مى زد و به هر شمشیرى که مى زد تکبیر مى گفت و شجاعى را به خاك مى افکند. مقتولین به دست آن حضرت در آن شب بیش از 500نفر نقل شده است، و تا صبح مشغول جنگ بودند به گونه اى که ذوالفقار چند مرتبه خمیده شد و آن بزرگوار با زانوى مبارك آن را راست نمودند."],["p","در این جنگ جمعى از لشکر امیر المؤمنین  به شهادت رسیدند، که از جمله آنها عمار یاسر، اویس قرنى، هاشم مرقال، پسر هاشم خزیمه بن ثابت، صفوان بن حذیفه و عبداالله بن بدیل با برادرش عبدالرحمن بن بدیل، عبداالله بن حارث برادر مالک اشتر، که از خواص امیر المؤمنین  بودند."],["p","از لشکر معاویه جمع کثیرى به درك واصل شدند، و این جنگ 14ماه به طول انجامید. ⟦104⟧ سرانجام با حیله عمرو عاص و نفاق عده اى مثل اشعث بن قیس کندى کار به حکمیت کشید."]]},{"k":"day","key":12,"label":"","items":[["t",1,"حکمین در صفین"],["p","⟦105⟧"],["p","صبح دوازدهم یا سیزدهم ⟦106⟧ ماه صفر سال 38ه لشکر امیر المؤمنین  مهیاى جنگ شدند، اما عمرو عاص حیله نمود و دستور داد تا قرآنها را بر سر نیزه کنند. صفوف جلو لشکر کفر و رقهایى از قرآن و در دیگر صفوف هر کس هر چه داشت بر سر نیزه کرد!! و فریاد مى زدند: لا حکم الا الله! منافقین مانند اشعث بن قیس، با تضعیف روحیه لشکر حضرت آنان را به اخیار حکمین ترغیب کردند. هر چه امیر المؤمنین  فرمودند که این نیرنگ است، و من کلام االله ناطق هستم نتیجه نداد. سرانجام قرار بر این شد که هر لشکر حکمى از جانب خود معین کند تا حکم ایشان را هر دو طرف بپذیرند."],["p","معاویه عمرو عاص را معرفى کرد و امیر المؤمنین  فرمود: «اگر ناچار هستیم، عبداالله بن عباس، و الا مالک اشتر نخعى حکم باشد»."],["p","اشعث و جماعت قرأ و حافظین که بعدا جزء خوارج شدند راضى به هیچکدام از این دو نشدند و گفتند: «فقط عبد االله بن قیس یعنى ابوموسى اشعرى». نفاق منافقین نتیجه داد و ابوموسى و عمرو عاص در «دومه الجندل»- که قلعه اى است بین مدینه و شام -جمع شدند، و با توجه به عداوتى که هر دو نسبت به بنى هاشم خصوصا حضرت امیر المؤمنین  داشتند و با مکر و حیله عمرو عاص حضرت را به ظاهر عزل نمودند. ابوموس از جمله منافقینى بود که در شب عقبه (بعد از غدیر) قصد قتل پیامبر  را داشتند. ⟦107⟧"],["p","بدین ترتیب فرداى آن روز در بین جمعیت ابوموسى به عمرو گفت: تو بایست و معاویه را از امارت خلع کن، تا من -على بن ابى طالب  را خلع نمایم. عمرو عاص گفت: من هرگز بر تو که عامل ابوبکر و عمر بوده اى و در ایمان و هجرت بر من تقدم داشته اى، سبقت نمى گیرم! ابن عباس گفت: ابوموسى! پسر نابغه تو را فریب ندهد، ولى او به گفته ابن عباس گوش نداد و ایستاد و انگشتر از دست بیرون کرد و گفت: من على و معاویه را از خلافت عزل نمودم و ساکت شد."],["p","عمرو عاص ملعون ایستاد و گفت: «مردم شنیدید که ابوموسى، على از خلافت عزل کرد. من هم او را از خلافت عزل نموده، و آن را براى معاویه بن ابى سفیان ثابت مى نمایم که او سزاوارتر است، و من بعنوان منصوب کردن معاویه انگشتر به دست مى کنم»!"],["p","حکمین براى عوامفریبى فحش و دشنام بسیارى به یکدیگر دادند و دست به گریبان یکدیگر شدند و شریح قاضى تازیانه اى بر سر عمرو عاص زد. ابوموسى از ترس اصحاب حضرت امیر المؤمنین  به مکه پناهنده شد. همه این مطالب در حالى بود که پیامبر  در غزوه دومه الجندل ابوموسى را از این کار خبر دادند و فرمودند: «حکمین در دومه الجندل گمراهند و گمراه مى کنند کسانى را که از آنها تبعیت کنند.» ⟦108⟧"],["p","امیر المؤمنین  پس از این واقعه در قنوت نوافل ابوموسى و سه نفر دیگر را این گونه لعن مى فرمود: االله العن معاویه و عمرا واباالاعور السلمى و اباموسى الاشعرى. ⟦109⟧"]]},{"k":"day","key":14,"label":"","items":[["t",1,"شهادت محمد بن ابى بکر"],["p","در این روز در سال 38ه محمد بن ابى بکر در سن 28سالگى به دستور معاویه و عمرو عاص به وسیله زهر به شهادت رید، و به قولى در نیمه جمادى الثانى بوده است. ⟦110⟧"],["p","بعد از شهادت، او را در شکم حمار مرده اى گذاشتند و سوزاندند. ⟦111⟧ قبر منصور به او از مابقى بدن سوخته آن بزرگوار است. دشمنان اهل بیت  هنگامى که کنار قبر آن بزرگوار مى روند پشت به قبر مى کنند و براى ابوبکر فاتحه مى خوانند!؟"]]},{"k":"day","key":15,"label":"","items":[["t",1,"ابتداى بیمارى پیامبر "],["p","⟦112⟧"],["p","بیمارى پیامبر  که منجر به رحلت آن حضرت شد از نیمه ماه صفر آغاز شد."]]},{"k":"day","key":20,"label":"(اربعین)","items":[["t",1,"اربعین سید الشهدأ "],["p","در چنین روزى چهل روز از فاجعه مولمه شهادت امام حسین  و اهل بیت و اصحاب باوفایش مى گذرد. بر دوستان و شیعیان اهل بیت  لازم است که با پوشیدن لباس مشکى، تعطیل کار و برپایى مجلس عزا و شرکت در مجالس سینه زنى و ذکر مصیبت این روز را تعظیم نمایند."],["t",2,"زیارت جابر از کربلا"],["p","در این روز در سال 61ه جناب جابر بن عبد االله انصارى و همراهانش قریب به چهل روز بعد از شهادت امام حسین  از مدینه به کربلا وارد شدند. ⟦113⟧ او به همراه عطیه قبر حبیبش سید الشهدأ  را زیارت کرد."],["t",3,"بازگشت اهل بیت  به کربلا"],["p","بنابر مشهور در چنین روزى اهل بیت  از شام به کربلا بازگشتند. ⟦114⟧"],["t",4,"ملح شدن رأس مطهر امام حسین  به بدن مطهر"],["p","در این روز -بنا بر قول ید مرتضى -رأس شریف امام حسین  توسط امام زین العابدین  از شام به کربلا آورده شد و به بدن مطهر آن حضرت ملحق گردید. ⟦115⟧"]]},{"k":"day","key":25,"label":"","items":[["t",1,"طلب کتف توسط پیامبر "],["p","در این روز پیامبر  دوات و کتف طلبیدند تا بنویسند که خلافت بلافصل براى امیر المؤمنین  است، ولى عمر مانع از این کار شد و به ساحت اقدس نبوى  جسارت کرد و گفت: ان الرجل لیهجر «: این مرد هذیان مى گوید»! همچنین پیامبر  در این روز بر منبر رفتند و خطبه خواندن و مردم را موعظه نمودند و به پیروى از قرآن و عترت فراخواندند. ⟦116⟧"]]},{"k":"day","key":26,"label":"","items":[["t",1,"تجهیز لشکر اسامه"],["p","در این روز در سال 11ه پیامبر  به عده اى خاص از صحابه و به خصوص ابوبکر و عمر و عثمان امر فرمودند براى سفر به روم و جنگ با رومیان به امیرى اسامه بن زید آماده شوند. آنان از این امر کراهت داشتند و نسبت به فرماندهى اسامه بر سپاه اسلام به خاتم الانبیأ  اعتراض کردند. حضرت فرمودند: «خدا لعن کند کسى را که از لشکر اسامه تخلف کند، »ولى با این همه ابوبکر و عمر و عثمان تخلف کردند و بازگشتند! ⟦117⟧"]]},{"k":"day","key":28,"label":"","items":[["t",1,"شهادت رسول خدا "],["p","شهادت جانگداز و مظلومانه اشرف مخلوقات خاتم الانبیأ محمد بن عبد االله  در سال 11ه در سن 63سالگى به وسیله سم ⟦118⟧ بوده است؛ و طبق روایاتى عایشه و حفصه آن حضرت را مسموم کرده اند! ⟦119⟧"],["p","در 24سفر بیمارى پیامبر  شدت یافت. ⟦120⟧ پیامبر  هنگام بیمارى فرمودند: حبیبم را نزد من حاضر کنید. عایشه و حفصه پدران خود را نزد آن حضرت حاضر نمودند. پیامبر  روى مبارك خویش را از آنان برگردانید و فرمود: «حبیبم را نزد نم حاضر کنید». سپس دنبال على بن ابى طالب  فرستادند. چون نظر مبارك به آن حضرت افتاد او را نزد خود خواند و کلماتى به حضرت فرمود. هنگامى که على بن ابى طالب  از نزد آن حضرت خارج شد، عمر و ابوبکر به او گفتند: «خلیلت به تو چه گفت»؟ فرمود: «هزار باب علم به من حدیث کرد که از هر باب هزار باب دیگر باز مى شود.» ⟦121⟧"],["h","وصایاى پیامبر "],["p","پیامبر  در لحظات آخر عمر خود وصیتهایى به امیر المؤمنین  فرمودند و جبرئیل و میکائیل و ملائکه مقربین را بر آن وصیت شاهد گرفتند. از جمله آن کلمات که جبرئیل به پیامبر  مى فرمود و امیر المؤمنین  مى شنید این بود «خمست را غصب مى کنند و پرده احترامت (حرمتت ) را مى درند و محاسنت به خون سرت رنگین مى شود»."],["p","امیر المؤمنین  مى فرمایند: هه هنگامى که آن کلام را فهمیدم، فریاد زدم و بر روى زمین افتادم». بعد فرمایشاتى به حضرت زهرا  و حسنین (علیهما السلام) فرمودند. سپس آن وصیت با چند مهر از طلا که آتش به آن نرسیده بود (و ساخته دست بشر نبود) مهر شد و به امیر المؤمنین  تحویل داده شد. ⟦122⟧"],["h","غسل و نماز بر بدن پیامبر "],["p","امیر المؤمنین  پس از غسل دادن آن حضر به تنهایى بر ایشان نماز خواندند. ⟦123⟧"],["p","مردم به جز اصحاب سقیفه در مسجد جمع شده بودند و در فکر نماز بر پیامبر  و دفن حضرت بودند. امیر المؤمنین  آمدند و فرمودند: «رسول خدا  امام ما است در زمان حیات و پس از وفاتش، »کنایه از اینکه براى نماز بر بدن آن بزرگوار نماز به صورت جماعت نمى خوانیم. در این هنگام مردم دسته دسته داخل مى شدند و بدون امام آیه ان االله و ملائکته یصلون على النبى، یا ایها الذین آمنوا صلوا علیه و سلموا تسلیما ⟦124⟧ را سه بار مى گفتند و بیرون مى آمدند."],["h","دفن بدن مبارك پیامبر "],["p","بعد حضرت مولى الموحدین  فرمودند: خداوند در هر مکانى که روح پیامبرش را قبض مى کند راضى است که در همان مکان دفن شود، و من آن حضرت را در حجره اى که از دنیا رفته دفن مى کنم."],["p","امیر المؤمنین  با کمک دیگران قبرى حفر کردند و بدن حضرت را داخل قبر قرار دادند. سپس آن حضرت داخل قبر رفت و صورت پیامبر  را باز کرد و گونه راست را بر زمین گذاشته در لحد را بستند و خاك روى آن ریختند. ⟦125⟧"],["h","خلاصه اى از زندگى پیامبر "],["p","آن حضرت دو ماهه -و بنابر نقلى در حمل بودند -که پدر بزرگوارشان جناب عبداالله بن عبد المطلب  از دنیا رحلت فرمود 4. یا 7و یا 8ساله بودند که مادرشان آمنه بنت وهب در ابوأ رحلت فرمود 8. سال و دو ماه و ده روز از سن شریفش گذشته بود که جد بزرگوارش جناب عبد المطلب  از دنیا رحلت فرمود."],["p","25ساله بودند که با جناب خدیجه کبرى  ازدواج کردند و حضرت خدیجه  40ساله بودند."],["p","30سال از سن مبارك آن حضرت گذشته بود که حضرت امیر المؤمنین  متولد شدند. در 40سالگى خداوند آن حضرت را به نبوت مبعوث فرمود. در 45سالگى به معراج تشریف بردند و در سال پنجم از بعثت، حضرت فاطمه زهرا  متولد شدند."],["p","50سال از عمر مبارکشان گذشته بود که جناب ابوطالب و خدیجه کبرى (علیهما السلام) از دنیا رحلت نمودند."],["p","در 45سالگى به معراج تشریف بردند 52. سال و یازده ماه و سیزده روز از سن مبارکشان گذشته بود که به مدینه منوره هجرت فرمودند. بعد از هجرت تقریبا ده سال در مدینه شرف حضور داشتند، تا آنکه در 28سفر سال 11ه مسموما از دنیا رحلت فرمودند. ⟦126⟧"],["p","هنگام رحلت پیامبر ، حضرت زهرا  بسیار مى گریست. حضرت او را نزد خود فراخواند و مطلبى فرمود که حزن و اندوه فاطمه  فرو نشست. وقتى علت را سؤ ال کردند آن حضرت فرمود: «پدرم به من خبر داد که اولین نفر از اهل بیتش که به او ملحق مى شود منم و مدت این فراق طولانى نیست.» ⟦127⟧"],["t",2,"آغاز امامت امیر المؤمنین "],["p","اولین روز امامت حضرت امیر المؤمنین على بن ابى طالب  است، و زیارت آن حضرت در این روز مستحب است. ⟦128⟧"],["t",3,"آغاز غصب خلافت"],["p","اولین روز غصب ظالمانه خلافت و خانه نشین کردند امیر المؤمنین  و شکستن بیعت روز غدیر توسط اهل سقیفه بنى ساعده است. ⟦129⟧"],["t",4,"شهادت امام حسن مجتبى "],["p","در این روز در سال 50ه امام حسن مجتبى  به شهادت رسید. ⟦130⟧ بنابر قولى شهادت آن حضرت در 7صفر و بنابر قولى در 5ربیع الاول واقع شده است. ⟦131⟧"],["p","جعده دختر اشعث بن قیس با زهرى که معاویه براى او فرستاده بود آن حضرت را مسموم کرد. معاویه همراه با زهر صد هزار درهم فرستاد و وعده کرد که او را به عقد یزید در آورد: ولى به وعده خود وفا نکرد. ⟦132⟧"],["h","مسمومیت حضرت"],["p","مسمومیت امام حسن  چهل روز طول کشید. ⟦133⟧ پس از ظهور اثرات سم بر بدن مبارك و فرا رسیدن وقت شهادت به سید الشهدا  فرمودند: «مرا مسموم کرده اند و پاره هاى جگرم داخل طشت است. من از شما جدا مى شوم و به خداوند ملحق مى گردم، و مى دانم چه کسى مرا مسموم کرده است؛ ولى به حقى که بر شما دارم در این باره حرفى نزنید. وقتى من از دنیا رفتم چشمانم را ببند و غسلم بده و کفنم نما و مرا کنار قبر جدم پیامبر  ببر تا با او تجدید عهد کنم. سپس مرا در بقیع کنار جده ام فاطمه بنت اسد (صلى االله علیه و آله ) دفن کنید. مى دانم مخالفین و معاندین گمان مى کنند شما مى خواهید مرا کنار پیامبر  دفن کنید و مانع شما مى شوند. شما را به خدا قسم مى دهم که مبادا به خاطر من حتى به اندازه خون حجامت ریخته شود». سپس آن حضرت مثل آنچه امیر المؤمنین  وصیت فرموده بود به اولاد و اهل خود وصیت نمود و از دنیا رفت."],["h","تشییع جنازه حضرت"],["p","امام حسین  بعد از غسل و کفن و نماز، آن حضرت را به طرف مرقد شریف پیامبر  حمل کردند. با دیدن این منظره براى مروان و بقیه بنى امیه که با سلاح و به همراهى عایشه آمده بودند شکى باقى نماند که مى خواهند آن حضرت را در کنار پیامبر  دفن نمایند."],["p","لذا آمدند و مانع شدند، و عایشه در حالى که سوار درازگوشى بود گفت: «مرا با شما چه کار است که مى خواهید کسى را که من او را دوست ندارم در خانه من دفن کنید». مروان ملعون هم نظیر این مطالب را گفت، و ابن عباس به او و عایشه جواب داد. فرزندان عثمان هم مانع شدند و گفتند: «هرگز نمى شود که عثمان در بدترین مکانها دفن شود و حسن با رسول خدا به خاك سپرده شود»."],["p","امام حسین  فرمود: به خداوندى که مکه و حرم را محترم گردانیده، حسن  فرزند على و فاطمه (علیهما السلام) سزاوارتر است بر پیامبر  از کسانى که بدون اجازه داخل خانه او شده اند. بخدا قسم او سزاوارتر است از حمال خطاها عثمان، که ابوذر را از مدینه بیرون کرد و..."],["p","عایشه جلو قبر پیامبر  رفت و گفت: «تا یک مو در سر من هست نخواهم گذاشت او را در این جا دفن کنید»! در اینجا بنى مروان جنازه آن حضرت را تیر باران کردند. بنى هاشم دست به شمشیر بردند. ولى امام حسین  مانع شده فرمودند: «وصیت برادرم نباید ضایع شود»و سپس ) 7تیر از جنازه آن حضرت بیرون کشیدند! ⟦134⟧ و این در حالى بود که امام مجتبى  به امام حسین  خبر داده بودن که عایشه بعد از شهادت ایشان چه جنایتى را مرتکب مى شود. ⟦135⟧"],["p","پس از آن حضرت سید الشهدأ  کلماتى فرمودند که اگر وصیت برادرم نبود مى دانستید که شمشیرهاى الى در کجا و چگونه بر شما فرود مى آمد. سپس بدن مطهر آن حضرت را به بقیع آوردند و در کنار جده اش فاطمه بنت اسد  دفن نمودند. ⟦136⟧"],["p","آقا حضرت مجتبى  داراى 15فرزند دختر و پسر بودند، ولى از جعده هیچ فرزندى نداشتند. ⟦137⟧"]]},{"k":"tail","key":"آخر صفر","label":null,"items":[["t",1,"شهادت امام رضا "],["p","حضرت ثامن الحجج مولانا على بن موسى الرضا  در سال 203ه بنابر اصح ⟦138⟧ دو سال پس از وفات حضرت معصومه  به شهادت رسیدند. سن مبارك حضرت 49یا 55سال بوده است. ⟦139⟧ بنابر نقلى در 27حضرت امام رضا  به شهادت رسیده اند، ⟦140⟧ ولى مشهور آخر ماه صفر است. در 28سفر مأمون انگور مسموم یا آب نار زهر آلود را به اجبار به حضرت امام رضا  خورانید. ⟦141⟧"],["h","آزارهاى مأمون نسبت به حضرت"],["p","مأمون از آزار و جسارت نسبت به حضرت کوتاهى نکرد، و حتى حضرت را سه ماه در سرخس مقیدا زندانى کرد. ⟦142⟧"],["p","پس از ولایتعهدى، ابتداى گرفتارى آن حضرت به خاطر معاشرت بامأمون منافق ملعون بود. او به حسب ظاهر در تعظیم و احترام حضرت مى کوشید، اما در باطن با آزار و اذیت حجت خدا را به مرگ خویش راضى نموده بود."],["h","مسمومیت حضرت"],["p","یاسر خادم مى گوید: هر جمعه که آن حضرت از مسجد جامع مراجعت مى کرد، با بدنى عرق دار و غبار آلود دستها را به درگاه الهى بر مى داشت و مى فرمود: «بارالها اگر فرج و گشایش کار من در مرگ من است، مرگ مرا برسان». آن حضرت پیوسته در غم و حزن بود تا در غربت رحلت فرمود. ⟦143⟧ مأمون پس از آنکه یک شبانه رز امر شهادت آن حضرت راکتمان کرد سراغ محمد پسر امام صادق  و جماعتى از آل ابوطالب فرستاد تا سلامت بدن امام را ببینند، و پس از آن شروع به گریه و زارى نمود!! ⟦144⟧"],["h","دفن بدن مبارك حضرت"],["p","پس از غسل و کفن و نماز بر بدن شریف حضرت که توسط امام جواد  انجام شد آن حضرت را جلو قبر هارون در خانه حمید بن قحطبه، مکان فعلى دفن کردند. ⟦145⟧ بنابر بعضى روایات مأمون از ترس فتنه مردم دستور به دفن شبانه حضرت داد. ⟦146⟧"],["p","مدت امامت آن حضرت 20سال بود ⟦147⟧ سن شریف امام جواد  هنگام شهادت امام رضا  7سال و چند ماه بود. ⟦148⟧"],["p","اقوال شهادت آن حضرت عبارتند از 23: ماه رمضان 17، ⟦149⟧ صفر 27، ⟦150⟧ صفر 14، ⟦151⟧ صفر 21، ⟦152⟧ ماه رمضان، ⟦153⟧ و 23ذى القعده، ⟦154⟧ بزرگان شیعه در کتب مختلف ماه شهادت را صفر و روز آن را اکثرا آخر صفر ذکر کرده اند، ولى 29یا 30روز بودن ماه صفر در سال شهادت را ذکر ننموده اند."]]}]},{"name":"ربیع الاول","groups":[{"k":"intro","key":0,"label":null,"items":[["p","ماه ربیع الاول سرور و حزن را با هم در خود جاى داده است. روزهاى،1 3، 4، 5، 8، 9، 10، 12، 14، 16، 17، 19، 22، 23، 25این ماه ایام پرخاطره اى از شادى و اندوه اهل بیت  است، که ذیلا به تفصیل آنها مى پردازیم. خبرهاى خوشى همچون ولادت پیامبر ، لیله المبیت و هجرت پیامبر ، ورود حضرت به مدینه، آغاز امامت امیر المؤمنین  پس از شهادت پیامبر ، ولادت امام صادق ، آغاز امامت امیر المؤمنین  پس از شهادت امام عسکرى ، روزهاى بیادماندنى این ماه است. ازدواج پیامبر  با حضرت خدیجه (علیها السلام )، و ورود حضرت معصومه  به قم روزهاى دیگرى است که خاطره هاى خوشى را بر جاى گذاشته است. مرگ عمر بن خطاب و یزید بن معاویه و عمر بن سعد برگهاى دیگرى از دفتر شادى اهل بیت  در این ماه است."],["p","آغاز وجوب نماز، عمود دین اسلام روز دیگر است که هیچگاه فراموش نخواهد شد."],["p","از سوى دیگر واقعه وحشتناکى در این ماه رخ داده که سر آغاز همه مصائب اهل بیت  است، و آن هجوم به خانه وحى پس از دفن بدن مطهر پیامبر  است. اولین روز خلافت غاصبانه معاویه، ورود اهل بت امام حسین  به شام، تخریب کعبه توسط یزید، نیز از آثار شوم سقیفه است که در این ماه رخ داد است. شهادت امام عسکرى ، وفات حضرت سکینه (علیهما السلام) نیز از حوادث این ماه است."],["p","از جنگهاى پیامبر  جنگ بنى النضیر و جنگ دومه الجندل در این ماه بوده است. همچنین صلح امام حسن  در این ماه اتفاق افتاده است."],["p","مرگ موسى خلیفه عباسى، معتصم عباسى، داود بن على حاکم ظالم مدینه، مالک بن انس و احمد بن حنبل نیز در این ماه به وقوع پیوسته است."]]},{"k":"day","key":1,"label":"","items":[["t",1,"دفن بدن مطهر پیامبر "],["p","در نیمه شب اول ربیع بدن مطهر خاتم الانبیأ و المرسلین  را امیر المؤمنین على بن ابى طالب  دفن فرمودند"],["p","⟦155⟧"],["p","مصیبت و فاجعه رحلت پیامبر  از یک طرف و بى احترامى به آن حضرت و توجه نداشتن مردم به غسل و کفن و دفن حضرت از طرف دیگر، داغهایى بود که بر دل مبارك امیر المؤمنین  ⟦156⟧ سنگینى مى کرد. چنانکه با یاد تلخ آن روزها فرموده اند: «آیا بدن شریف پیامبر  را رها مى کردم و او را دفن ننموده براى خلافت و سلطنت بعد از او نزاع مى کردم » ⟦157⟧؟"],["p","شیخ مفید مى فرماید: «اکثر مردم در دفن پیامبر  حاضر نشدند، و نماز بر آن حضرت نخواندند، چه اینکه بین انصار و مهاجرین مشاجره در امر خلافت بود. ⟦158⟧ اعمش مى گوید: پیامبرشان از دنیا رفت و مردم هم و غمى نداشتند جز آنکه عده اى بگویند: «امیر از ماست »و طایفه دیگرى بگویند: «امیر از ماست». ⟦159⟧"],["p","هنگام رحلت پیامبر  مغیره خطاب به ابوبکر و عمر گفت: اگر بعدا با مردم کارى دارید آنها را دریابید. لذا ابوبکر و عمر هنگام دفن پیامبر  حاضر نبودند، بلکه میان دیگران بودند که در سقیفه براى خود امیر انتخاب مى کردند، و قبل از آنکه کنار بدن حضرت حاضر شوند، بدن مطهر دفن شد. ⟦160⟧ عبد االله بن حسن مى گوید: به خدا قسم ابوبکر و عمر بر پیامبر  نماز نخواندند، و سه روز بدن مبارك آن حضرت دفن نشد، ولى با این همه اهل سقیفه مشغول کار خود بودند. ⟦161⟧"],["p","حضرت باقر  مى فرمایند: مردم روز دوشنبه و شب سه شنبه را بر بدن آن حضرت نماز مى خواندند، و عموم مردم حتى خواص و نزدیکان حضرت بر بدن مبارك نماز خواندند، اما هیچیک از اهل سقیفه بر غسل و کفن و دفن حضرت حاضر نشدند. امیر المؤمنین  بریده اسلمى را براى خبر دادن نزد آنان فرستاد، ولى اعتنایى نکردند و بعد از دفن آن حضرت بیعت آنان هم تمام شد. ⟦162⟧"],["p","عایشه در این باره اقرارى دارد که جالب توجه است. او گفته است: «بخدا قسم ما از دفن پیامبر صلىا الله عليه وآله با خبر نشدیم تا اینکه صداى بیل و کلنگ را در شب چهارشنبه از حجره آن حضرت شنیدیم، »یعنى بعد از دفن متوجه شدیم. ⟦163⟧"],["p","باید از اینان که بر سر غصب خلافت همه چیز را فراموش کرده بودند پرسید: آیا سقیفه در حضور پیامبر  و به سفارش حضرت بود یا غدیر؟"],["p","آیا براى تشکیل شوراى سقیفه دستورى از طرف خداوند آمده بود یا درباره غدیر؟"],["p","آیا در سقیفه از اکثر بلاد مسلمین حضور داشتند یا در غدیر؟"],["p","آیا در سقیفه همه مردم حاضر بودند یا در غدیر که حتى زنها هم بیت کردند؟"],["t",2,"لیلۀ المبیت"],["p","شب اول این ماه پیامبر  از شر کفار از مکه به مدینه هجرت کردند. در آن شب آقا و مولایمان امیر المؤمنین  جان نثارى فرموده به جاى رسول گرامى اسلام  در بستر ایشان خوابیدند، ⟦164⟧ چه اینکه کفار قریش قصد کشتن حضرتش را داشتند. به این مناسبت آیه و من الناس من یشرى نفسه ابتغأ مرضات االله: »... از مردم کسى هست که جان خویش را در راه رضایت خداوند مى فروشد و خدا بر بندگان مهربان است» در شأن على بن ابى طالب  نازل شد. ⟦165⟧"],["p","در شبى که امیر المؤمنین  به جاى پیامبر  خوابید به جبرئیل و میکائیل خطاب رسید که من بین شما دو نفر برادرى قرار دادم. کدامیک از شما ایثار مى کند که عمر طولانى از آن دیگرى باشد؟ هر دو عمر طولانى را اختیار کردند."],["p","خطاب آمد: «به زمین نگاه کنید و ببینید که چگونه على  حیات خود را به برادرش پیامبر  ایثار نموده و به جاى او خوابیده و جان خود را فداى جان او نموده است. به زمین بروید و او را از دشمنان حفظ کنید». آنان آمدند و جبرئیل بالاى سر امیر المؤمنین  و میکائیل سمت پاهاى آن حضرت نشست و ندارد: بخ بخ من مثلک یابن ابى طالب، خداوند در جمع ملائکه به تو مباهات فرمود». اینجا بود که آیه شریفه و من الناس من یشرى نفسه ابتغأ مرضات االله... نازل شد. ⟦166⟧"],["t",3,"هجرت پیامبر "],["p","پیامبر  13سال پس از بعثت به مدینه طیبه هجرت فرمود. ⟦167⟧"],["t",4,"هجوم به خانه وحى"],["p","در این روز اولین هجوم به خانه امیر المؤمنین  صورت گرفت. هنگامى که امیر المؤمنین ، متوجه غسل و کفن و دفن پیامبر شد و غاصبین خلافت در سقیفه بودند، در شب چهارشنبه که اول ربیع بود بدن مبارك آن حضرت را دفن فرمود و طبق وصیت پیامبر  متوجه جمع آورى قرآن شد. آن حضرت فرموده بودن: «على جان تا سه روز از خانه خارج مشو و قرآن را جمع آورى کن. » ⟦168⟧..."],["p","در این ایام سه بار به منزل آن حضرت هجوم آورده اند: بار اول در روز اول ربیع بود که براى بیعت آمدند و آن حضرت فرمود که قسم یاد کرده ام که تا جمع قرآن تمام نشود از خانه بیرون نیایم و آنان بازگشتند. پس از آن امیر المؤمنین  شبها صدیقه طاهره و حسنین  را بر در منازل اصحاب مى بردند و طلب یارى مى نمودند"],["p","⟦169⟧"],["p","بار دوم هفت روز بعد از دفن پیامبر  بود که زبیر و عده اى دیگر در منزل امیر المؤمنین  جمع شده بودند. آن روز زبیر شمشیر کشید تا عمر را بکشد. ⟦170⟧"],["p","بار سوم به منزل حضرت هجوم آوردند، و پس از آتش زدن در منزل و ضرب و جرح صدیقه طاهره  و کشتن حضرت محسن (علیه السلام )، امیر المؤمنین  را با دست بسته بیرون بردند. ⟦171⟧"],["t",5,"مسمومیت امام عسکرى "],["p","امام حسن عسکرى  در اثر زهر مسموم شد و بیمارى حضرت آغازم گردید. ⟦172⟧"],["p","بنابر قولى شهادت امام حسن عسکرى  در سال 260ه در چنین روزى بوده است. ⟦173⟧"],["p","و به قولى دیگر در چهارم ربیع الاول و به قولى دیگر در هشتم ربیع الاول بوده است. ⟦174⟧"]]},{"k":"day","key":3,"label":"","items":[["t",1,"تخریب کعبه وسط یزید"],["p","در سال 64ه به دستور یزید خانه کعبه را منجنیق خراب کردند. ⟦175⟧ این فاجعه یازده روز قبل از هلاکت یزید به وقوع پیوست."]]},{"k":"day","key":5,"label":"","items":[["t",1,"وفات حضرت سکینه "],["p","حضرت سکینه  دختر امام حسین  56سال پس از واقعه کربلا، در شب پنجم ربیع الاول سال 117ه در مدینه وفات کرد. ⟦176⟧"],["p","مادر ایشان حضرت رباب  است که با هم در واقعه کربلا حضور داشتند، و همواره با اسرا به کوفه و شام رفتند."],["p","در صبح روز رحلتش محمد بن عبد االله (نفس زکیه) چهارصد دینار عطر و عود خرید و پیرامون تابوت آن حضرت در مجمره ها سوزانید. خالد بن عبد الملک حاکم مدینه که در نظر داشت با به تعویق افتادن تشییع جنازه بر اثر گرمى هوا به بدن مطهر جسارت شود، گفت: «صبر کنید من براى نماز خواندن بر جنازه مى آیم». ولى نیامد. لذا جنازه مبارك آن حضرت تا شب دفن نشد. پس از آن حضرت سجاد  -و به قولى یحیى بن حسن  و به قولى محمد بن عبد الله نفس زکیه -بر جنازه آن حضرت نماز خواندند و آن حضرت را با احترام به خاك سپردند. ⟦177⟧"]]},{"k":"day","key":8,"label":"","items":[["t",1,"شهادت اما عسکرى "],["p","امام حسن عسکرى  در سال 260ه در سن 28سالگى به دست معتمد عباسى به شهادت رسید. ⟦178⟧ معتمد به عباسیین سفارش مى کرد که بر آن حضرت تنگ بگیرند. ⟦179⟧ صدوق (رحمه االله) مى فرماید: معتمد چندین مرتبه امام عسکرى  را حبس کرد."],["p","22ساله بودند که امام هادى  به شهادت رسیدند، و مدت امامت آن حضرت شش سال بود. در شبى که فرداى آن روز به شهادت رسیدند نامه هاى زیادى به مردم مدینه نوشته بودند. ⟦180⟧"],["p","هنگام نماز صبح، بعد از آنکه امام عصر  آن حضرت را وضو دادند و جوشانده اى به حضرتش دادند، به شهادت رسیدند. ⟦181⟧"],["p","وقتى مردم سامرا با خبر شدند، همه بازارها بسته شد و مردم کنار منزل آن حضرت جمع شدند. وزرأ و اتباع خلیفه و بنى هاشم و علویات داخل منزل بودند. در سامرا صداى شیون و گریه از هر سو به گوش مى رسید و قیامتى بر پا شده بود."],["p","امام زمان  آن حضرت را غسل داده بعد از کفن آن حضرت بدن مطهر را جهت نماز آوردند. جعفر برادر حضرت جلو آمد که بر بدن مبارك نماز بخواند. همین که خواست تکبیر بگوید امام زمان  در حالى که طفلى گندمگون، پیچیده موى، گشاده دندان مانند پاره ماه بود از حجره بیرون آمد و رداى جعفر را کشید و او را از آن مکان دور کرد و بر پدر بزرگوارش نماز خواند، و آن حضرت را نزد قبر پدر بزرگوارش حضرت هادى  دفن نمودند. ⟦182⟧"],["p","جعفر این واقعه را براى معتمد نقل کرد. همه جار را در جستجوى حضرت گشتند، ولى اثرى از آن حضرت ندیدند."],["p","در سال شهادت امام عسکرى  -سال 260ه محدث جلیل جناب فضل بن شاذان نیشابورى از دنیا رحلت فرمود: او صاحب 180تألیف است و امام عسکرى  سه بار بر او رحمت فرستاده اند. ⟦183⟧"]]},{"k":"day","key":9,"label":"","items":[["t",1,"آغاز امامت حضرت ولى عصر "],["p","آغاز امامت حضرت صاحب الامر  و غیبت صغراى آن حضرت پس از شهادت امام عسکرى  است، که تنها فرزند آن حضرت بودند. ⟦184⟧"],["p","این روز عید شیعه و اولین روز امامت خلافت آخرین خلیفه و حجت بر حق و منجى عالم بشریت حضرت بقیه االله الاعظم  در سال 260ه است. ⟦185⟧"],["t",2,"قتل عمر بن خطاب"],["p","در آخر شب نهم ربیع الاول سال 23ه عمر بن الخطاب از دنیا رفته است، ⟦186⟧ و قول اهل سنت روز چهارشنبه 26ذى الحجه است."],["p","این روز روز شادى اهل بیت  و انبیأ و ملائکه و ساکنان اعلى علیین و دوستان امیر المؤمنین  و اولاد طاهرین ایشان است چرا که در این روز نفرین حضرت صدیقه کبرى فاطمه زهرا  به اجابت رسید. ⟦187⟧ روزى
