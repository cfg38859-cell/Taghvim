name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Copy Keystore
      run: |
        mkdir -p ~/.android
        cp debug.keystore ~/.android/debug.keystore

    # این بخش حذف شده است چون فایل از قبل در پوشه www قرار دارد

    - name: Install Dependencies
      run: npm install

    - name: Capacitor Add Android
      run: npx cap add android

    - name: Patch Android Files
      run: python3 scripts/patch_android.py

    - name: Capacitor Sync
      run: npx cap sync android

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: tshia-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
